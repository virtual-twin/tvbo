name: Feature request
description: Something TVBO should be able to express or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to model or run
      description: The science or workflow, not the API you have in mind for it. It is usually the faster route to the right design.
    validations: {required: true}
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A driver script, a fork, a manual step — or "cannot".
    validations: {required: true}
  - type: textarea
    id: shape
    attributes:
      label: What it might look like declaratively
      description: Optional. TVBO's surface is the schema, so a sketch of the YAML is more useful than a sketch of the Python.
      render: yaml
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [schema / datamodel, code generation, a specific backend, CLI, workflow / cluster, analysis or plotting, ontology, docs, other]
    validations: {required: true}
