# Container-based CI that waits for the Docker image build to finish.
# On push to main: triggers via workflow_run after Docker workflow completes.
# On PRs to main: triggers directly (uses existing 'dev' image).
name: CI (Container)

on:
    # Wait for Docker image build before running container tests
    workflow_run:
        workflows: ["Docker"]
        types: [completed]
        branches: [main]
    # PRs to main use existing dev image (Docker doesn't rebuild on PRs)
    pull_request:
        branches: ["main"]
    workflow_dispatch:

concurrency:
    group: ci-container-${{ github.event.workflow_run.head_sha || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    JAX_PLATFORMS: cpu
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_WARN_SCRIPT_LOCATION: "1"

jobs:
    # ─── Container tests ──────────────────────────────────────
    test-container:
        name: Container tests
        # Skip if Docker workflow failed (workflow_run fires for any conclusion)
        if: >-
            github.event_name != 'workflow_run'
            || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ github.event_name == 'pull_request' && 'dev' || 'latest' }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || '' }}
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Install dev code + test deps
              run: pip install -e ".[all]" pytest-xdist
            - name: Generate reference data
              run: julia tests/reference_data/generate_nd_references.jl
            - name: Run tests (no doc tests)
              run: pytest -x -q --ignore=tests/test_docs.py --override-ini="addopts="

    # ─── Doc tests ─────────────────────────────────────────────
    test-docs:
        name: Doc tests
        if: >-
            github.event_name != 'workflow_run'
            || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ github.event_name == 'pull_request' && 'dev' || 'latest' }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || '' }}
            - name: Ensure Quarto is available
              run: |
                  if ! command -v quarto &>/dev/null; then
                    apt-get update && apt-get install -y --no-install-recommends curl jq wget sudo
                    QUARTO_VERSION=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
                    ARCH=$(dpkg --print-architecture)
                    wget -qO quarto.deb "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-${ARCH}.deb"
                    dpkg -i quarto.deb && rm quarto.deb
                  fi
                  quarto --version
            - name: Ensure system libs
              run: |
                  if ! ldconfig -p | grep -q libcairo.so.2; then
                    apt-get update && apt-get install -y --no-install-recommends libcairo2-dev
                  fi
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Install doc dependencies
              run: pip install -e ".[all]" pytest-xdist
            - name: Run doc tests
              run: pytest tests/test_docs.py -x -v --tb=long -m docs --override-ini="addopts="

    # ─── Release-ready check ───────────────────────────────────
    release-ready:
        name: Release-ready check
        needs: [test-container, test-docs]
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'workflow_run'
                && github.event.workflow_run.conclusion == 'success')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || '' }}
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

            - name: Install build tools
              run: pip install build twine check-wheel-contents

            - name: Build sdist and wheel
              run: python -m build

            - name: Verify package metadata (twine --strict)
              run: python -m twine check --strict dist/*

            - name: Verify wheel contents
              run: check-wheel-contents dist/*.whl

            - name: Verify version consistency
              run: |
                  PKG_VERSION=$(python -c "import tvbo; print(tvbo.__version__)")
                  WHL_NAME=$(ls dist/*.whl | head -1)
                  echo "Package version: $PKG_VERSION"
                  echo "Wheel: $WHL_NAME"
                  if ! echo "$WHL_NAME" | grep -q "$PKG_VERSION"; then
                    echo "::error::Version mismatch between tvbo/__init__.py ($PKG_VERSION) and wheel ($WHL_NAME)"
                    exit 1
                  fi
                  echo "Version $PKG_VERSION is consistent."

            - name: Verify package installs cleanly from wheel
              run: |
                  pip install dist/*.whl
                  python -c "from tvbo import Dynamics, SimulationExperiment; print('Import OK')"

            - name: Upload release-ready artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: tvbo-dist
                  path: dist/*
                  retention-days: 30
