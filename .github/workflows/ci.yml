name: CI

on:
    push:
        branches: ["main", "dev"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - run: pip install flake8
            - name: Syntax errors (blocking)
              run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            - name: Style warnings (non-blocking)
              run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    compat:
        name: Python ${{ matrix.python-version }}
        needs: lint
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"
            - run: pip install -e . && pip install pytest
            - name: Core tests
              env:
                  JAX_PLATFORMS: cpu
              run: pytest -q tests/test_model_loading.py tests/test_graph.py tests/functional/test_dynamics_basic.py

    test:
        name: Full tests
        needs: lint
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ (github.head_ref || github.ref_name) == 'main' && 'latest' || (github.head_ref || github.ref_name) }}
        steps:
            - uses: actions/checkout@v6
            - name: Run tests
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest -q --ignore=tests/test_docs.py

    test-docs:
        name: Doc tests
        needs: lint
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ (github.head_ref || github.ref_name) == 'main' && 'latest' || (github.head_ref || github.ref_name) }}
        steps:
            - uses: actions/checkout@v6
            - name: Install Quarto
              uses: quarto-dev/quarto-actions/setup@v2
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Install doc dependencies
              run: pip install ".[docs]"
            - name: Run doc tests
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest tests/test_docs.py -v -m docs

    package:
        name: Build package
        needs: [compat, test]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Build sdist and wheel
              run: |
                  pip install build
                  python -m build

            - uses: actions/upload-artifact@v6
              with:
                  name: tvbo-dist
                  path: dist/*
