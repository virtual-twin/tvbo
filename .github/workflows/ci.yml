name: Lint & Test

on:
    push:
        branches: ["main", "dev"]
    # No branch filter: a PR stacked on another PR's branch must be tested too.
    pull_request:
    workflow_dispatch:

# Cancel redundant runs: same branch/PR triggers supersede previous runs
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Least-privilege: read-only by default; jobs opt-in to more
permissions:
    contents: read
    packages: read

# Shared environment variables for all jobs
env:
    JAX_PLATFORMS: cpu
    # Headless backend, so plotting tests render to an in-memory canvas rather than an interactive window.
    MPLBACKEND: Agg
    # uv: bytecode-compile installed wheels for faster cold starts
    UV_COMPILE_BYTECODE: "1"
    # uv: copy from the cache instead of hardlinking (CI runner safe)
    UV_LINK_MODE: copy

jobs:
    # ─── Always: lint, format & type-check ────────────────────
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            # Full history: the diff-mode prose check needs a merge-base with the target branch.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # `version` tracks the `lint` extra in pyproject.toml.
            - name: Ruff — lint
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.16.1"
                  args: "check --output-format=github ."

            - name: Ruff — format
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.16.1"
                  args: "format --check --diff ."

            - name: Setup Python for the prose check
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Prose — comments and docstrings
              run: python scripts/check_prose.py

            # `HEAD^1` is the base side of the merge ref CI checks out — the base as it is NOW, so the diff stays this PR's own work however far the base has moved. A branch ref would blame the PR for whatever the base gained meanwhile.
            - name: Prose — no stacked '#' blocks added
              run: python scripts/check_prose.py --diff "$(git rev-parse HEAD^1 2>/dev/null || echo origin/${{ github.base_ref || 'dev' }})"

            # Every hand-authored page is clean, so both checks run whole-file; the generated api/ and datamodel/ trees are excluded because their prose comes from docstrings and the schema.
            - name: Docs — page style
              run: python docs/scripts/check_pages.py --quiet $(find docs -name '*.qmd' -o -name '*.md' | grep -vE '/(_site|_freeze|_build|[.]quarto|_archive|[.]jupyter_cache|_output|api|datamodel)/')

            # The steps below all need the package importable: the CLI check resolves real commands, render coverage reads YAML, and mypy needs the datamodel that `-e .` regenerates through the hatch build hook.
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install (editable → generates datamodel)
              run: uv pip install -e . && uv pip install mypy

            - name: Docs — documented CLI commands resolve
              run: python docs/scripts/check_cli_examples.py --quiet $(find docs -name '*.qmd' -o -name '*.md' | grep -vE '/(_site|_freeze|_build|[.]quarto|_archive|[.]jupyter_cache|_output)/')

            # A sidebar entry and a `project.render` glob live in different files with nothing tying them together, so a page can be linked, exist, and still be built by nothing — which only shows as a 404 on the deployed site.
            - name: Docs — every sidebar link is in the render set
              run: cd docs && python scripts/check_render_coverage.py

            # Citeproc renders an unresolved key as literal **[@Key]** and exits 0, so a broken reference reaches the published site unannounced.
            - name: Docs — every citation resolves
              run: cd docs && python scripts/check_citations.py

            - name: "Docs — pages declaring `native: true` draw nothing by hand"
              run: cd docs && python scripts/check_native_pages.py

            - name: Mypy — type check (non-blocking)
              run: mypy tvbo || true

    # Fails on drift, orphans, leaks and bad extras — see "CI notes" in CONTRIBUTING.md.
    skills-sync:
        name: Skills sync guard
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install (core, editable)
              run: uv pip install -e .
            - name: Check rendered skills match canonical sources
              run: tvbo skills sync --check

    # A scaffolded study must validate against the layout record, and every generated block must match what it renders now.
    study-layout:
        name: Study layout guard
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install (core, editable)
              run: uv pip install -e .
            - name: Scaffolded studies validate against the record
              run: |
                  tvbo study init CiGeneral --in /tmp/layout-check
                  tvbo validate study /tmp/layout-check/CiGeneral
                  tvbo study init CiReplication --in /tmp/layout-check -t replication
                  tvbo validate study /tmp/layout-check/CiReplication
            - name: Generated layout blocks are current
              # --sync rewrites in place, so a dirty tree afterwards means a document restates a layout the record no longer has.
              run: |
                  tvbo study layout --sync docs/Interoperability/BIDS/index.qmd
                  tvbo study layout --sync tvbo/skills/canonical/replicating-studies/SKILL.md -t replication
                  git diff --exit-code -- docs tvbo/skills
            - name: Layout record tests
              run: |
                  uv pip install pytest pytest-xdist
                  pytest -v --tb=short tests/test_study_layout.py tests/test_workflow_kit_paths.py

    # Every tvbo/database/ YAML against the LinkML schema — see "CI notes" in CONTRIBUTING.md.
    schema-validate:
        name: Schema validation
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install validation deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml pytest pytest-xdist
            - name: Validate every database YAML against the LinkML schema
              run: pytest -v --tb=short tests/test_database_validation.py

    # Builds tvb-o-struct.owl + tvb-o.shacl.ttl and uploads them for the reasoner job and external consumers.
    schema-artifacts:
        name: Schema artifacts (OWL + SHACL)
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install schema-gen deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml rdflib
            - name: Generate OWL
              run: make gen-owl
            - name: Generate SHACL
              run: make gen-shacl
            - name: Regeneration is reproducible
              run: |
                  cp ontology/tvb-o-struct.owl "${RUNNER_TEMP}/struct.first"
                  cp ontology/tvb-o.shacl.ttl "${RUNNER_TEMP}/shacl.first"
                  make gen-owl gen-shacl
                  diff -u "${RUNNER_TEMP}/struct.first" ontology/tvb-o-struct.owl
                  diff -u "${RUNNER_TEMP}/shacl.first" ontology/tvb-o.shacl.ttl
            - name: Upload schema artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: tvbo-ontology-artifacts
                  path: |
                      ontology/tvb-o-struct.owl
                      ontology/tvb-o.shacl.ttl
                  retention-days: 30

    # ELK + HermiT over the generated ontology; non-blocking while cleanup is pending — see "CI notes" in CONTRIBUTING.md.
    reasoner:
        name: Ontology reasoner (ELK + HermiT)
        needs: schema-artifacts
        runs-on: ubuntu-latest
        timeout-minutes: 15
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install schema-gen deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml rdflib
            - name: Generate OWL
              run: make gen-owl
            - name: Set up Java (for ROBOT)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            - name: Install ROBOT
              run: |
                  mkdir -p $HOME/.local/bin
                  curl -L -o $HOME/.local/bin/robot.jar \
                      https://github.com/ontodev/robot/releases/download/v1.9.6/robot.jar
                  curl -L -o $HOME/.local/bin/robot \
                      https://raw.githubusercontent.com/ontodev/robot/v1.9.6/bin/robot
                  chmod +x $HOME/.local/bin/robot
                  echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Reason with ELK (OWL-EL profile, fast)
              run: |
                  robot reason \
                      --reasoner ELK \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-reasoned-elk.owl
            - name: Reason with HermiT (OWL-DL, full coverage)
              run: |
                  robot reason \
                      --reasoner HermiT \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-reasoned-hermit.owl
            - name: Report unsatisfiable classes
              run: |
                  robot report \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-report.tsv \
                      --fail-on ERROR \
                      --print 20 || true
            - name: Upload reasoner artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: tvbo-reasoner-artifacts
                  path: |
                      ontology/tvb-o-reasoned-elk.owl
                      ontology/tvb-o-reasoned-hermit.owl
                      ontology/tvb-o-report.tsv
                  retention-days: 30
                  if-no-files-found: warn

    # ─── Always: compatibility across Python versions ──────────
    compat:
        name: Python ${{ matrix.python-version }}
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-compat-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              # linkml/linkml-runtime pinned to v1.11.0-rc1; remove once on PyPI.
              run: |
                  uv pip install -e . pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Core tests
              run: |
                  pytest -v --tb=short -n auto --dist=loadscope \
                      --timeout=600 --timeout-method=thread \
                      tests/test_model_loading.py tests/test_graph.py \
                      tests/functional/test_dynamics_basic.py

    # Sharded so one heavy backend cannot OOM or outlive the runner watchdog; pytest-timeout turns hangs into tracebacks.
    test-native:
        name: Native (${{ matrix.shard }})
        needs: lint
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
            || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout || 45 }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: core
                      paths: >-
                          tests/test_model_loading.py
                          tests/test_graph.py
                          tests/test_package_structure.py
                          tests/test_network_io.py
                          tests/functional/test_dynamics_basic.py
                          tests/functional/test_metadata_import.py
                          tests/functional/test_simulation_experiment_basic.py
                          tests/functional/test_timeseries_utils.py
                          tests/functional/test_simulation_backends_core.py
                          tests/test_citation_formatting.py
                          tests/test_numerical_golden_corpus.py
                          tests/test_codegen_golden_corpus.py
                          tests/test_symbol_context.py
                          tests/test_symbolic_layer.py
                          tests/test_piecewise_lowering.py
                          tests/test_branches_only_equations.py
                    - shard: tvboptim
                      paths: >-
                          tests/test_tvboptim_experiments.py
                          tests/functional/test_simulation_backends_tvboptim.py
                          tests/test_full_workflow_comparison.py
                          tests/test_tvboptim_byte_identity.py
                          tests/functional/test_observation_backend_consistency.py
                    - shard: tvb
                      paths: >-
                          tests/test_tvb_comparison.py
                          tests/test_tvb_interop.py
                          tests/test_stimulus_rendering.py
                          tests/functional/test_simulation_backends_tvb.py
                    - shard: pyrates
                      paths: >-
                          tests/functional/test_pyrates_integration.py
                          tests/functional/test_simulation_backends_pyrates.py
                    - shard: neuroml
                      paths: >-
                          tests/functional/test_simulation_backends_neuroml.py
                          tests/functional/test_brian2_backend.py
                    - shard: extras
                      paths: >-
                          tests/test_units.py
                          tests/test_database_golden_dump.py
                          tests/test_yaml_loader.py
                          tests/test_pydantic_loader.py
                          tests/test_linkml_compatibility.py
                          tests/test_experiment_api.py
                          tests/test_cli.py
                          tests/test_cli_workflow.py
                          tests/test_run_models.py
                          tests/test_tvboptim_observation_codegen.py
                          tests/test_weight_transform_codegen.py
                          tests/test_exploration_result_labelling.py
                          tests/functional/test_plot_layouts.py
                          tests/test_panel_group_axis.py
                          tests/test_exploration_result_labelling.py
                    # The complement of the shards above: a file they name is ignored here, so it runs once, under its own shard's concurrency.
                    - shard: rest
                      paths: >-
                          tests/
                          --ignore=tests/test_docs.py
                          --ignore=tests/test_database_validation.py
                          --ignore=tests/test_model_loading.py
                          --ignore=tests/test_graph.py
                          --ignore=tests/test_package_structure.py
                          --ignore=tests/test_network_io.py
                          --ignore=tests/functional/test_dynamics_basic.py
                          --ignore=tests/functional/test_metadata_import.py
                          --ignore=tests/functional/test_simulation_experiment_basic.py
                          --ignore=tests/functional/test_timeseries_utils.py
                          --ignore=tests/functional/test_simulation_backends_core.py
                          --ignore=tests/test_citation_formatting.py
                          --ignore=tests/test_numerical_golden_corpus.py
                          --ignore=tests/test_codegen_golden_corpus.py
                          --ignore=tests/test_symbol_context.py
                          --ignore=tests/test_symbolic_layer.py
                          --ignore=tests/test_piecewise_lowering.py
                          --ignore=tests/test_branches_only_equations.py
                          --ignore=tests/test_tvboptim_experiments.py
                          --ignore=tests/functional/test_simulation_backends_tvboptim.py
                          --ignore=tests/test_full_workflow_comparison.py
                          --ignore=tests/test_tvboptim_byte_identity.py
                          --ignore=tests/functional/test_observation_backend_consistency.py
                          --ignore=tests/test_tvb_comparison.py
                          --ignore=tests/test_tvb_interop.py
                          --ignore=tests/test_stimulus_rendering.py
                          --ignore=tests/functional/test_simulation_backends_tvb.py
                          --ignore=tests/functional/test_pyrates_integration.py
                          --ignore=tests/functional/test_simulation_backends_pyrates.py
                          --ignore=tests/functional/test_simulation_backends_neuroml.py
                          --ignore=tests/functional/test_brian2_backend.py
                          --ignore=tests/test_units.py
                          --ignore=tests/test_database_golden_dump.py
                          --ignore=tests/test_yaml_loader.py
                          --ignore=tests/test_pydantic_loader.py
                          --ignore=tests/test_linkml_compatibility.py
                          --ignore=tests/test_experiment_api.py
                          --ignore=tests/test_cli.py
                          --ignore=tests/test_cli_workflow.py
                          --ignore=tests/test_run_models.py
                          --ignore=tests/test_tvboptim_observation_codegen.py
                          --ignore=tests/test_weight_transform_codegen.py
                          --ignore=tests/test_exploration_result_labelling.py
                          --ignore=tests/functional/test_plot_layouts.py
                          --ignore=tests/test_panel_group_axis.py
                      pytest_args: -n auto -m "not julia"
                      timeout: 60
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Configure git for private repos
              env:
                  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
              run: git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$PRIVATE_REPO_TOKEN"; }; f'
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-native-${{ matrix.shard }}-3.12-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install with all extras (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              # linkml/linkml-runtime pinned to v1.11.0-rc1; remove once on PyPI.
              run: |
                  uv pip install -e ".[all]" pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Run shard "${{ matrix.shard }}"
              run: |
                  pytest -x -v --tb=short \
                      --timeout=600 --timeout-method=thread \
                      --override-ini="addopts=" \
                      ${{ matrix.pytest_args }} ${{ matrix.paths }}

    # Own job, not a shard, because it needs the depot cache and pre-warm — see "CI notes" in CONTRIBUTING.md.
    test-julia:
        name: Native (julia)
        needs: lint
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
            || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            # Depot inside the workspace so actions/cache can persist it.
            JULIA_DEPOT_PATH: ${{ github.workspace }}/.julia-depot
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Configure git for private repos
              env:
                  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
              run: git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$PRIVATE_REPO_TOKEN"; }; f'
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-julia-3.12-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install with all extras (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: |
                  uv pip install -e ".[all]" pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Restore Julia depot (Julia + precompiled packages)
              id: cache-julia-depot
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.JULIA_DEPOT_PATH }}
                  # -v2 escapes the poisoned depots saved under the pre-rule key, which were immutable and served forever.
                  key: julia-depot-v2-1.10-${{ hashFiles('tvbo/juliapkg.json') }}
                  restore-keys: |
                      julia-depot-v2-1.10-
            - name: Pre-warm Julia (resolve + precompile declared packages)
              run: |
                  # Reconciles a Manifest restored against an older depot — see "CI notes" in CONTRIBUTING.md.
                  python -c "import juliapkg; juliapkg.resolve(force=True)"
                  python -c "import tvbo, juliacall; juliacall.Main.seval('using NetworkDynamics, OrdinaryDiffEq'); print('Julia depot ready')"
            # Selects by the same marker the `rest` shard deselects, so neither list drifts.
            - name: Run Julia backend tests
              run: |
                  pytest -x -v --tb=short \
                      --timeout=1200 --timeout-method=thread \
                      --override-ini="addopts=" \
                      -m julia tests/ \
                      --ignore=tests/test_docs.py \
                      --ignore=tests/test_database_validation.py
            - name: Save Julia depot (Julia + precompiled packages)
              # Only on success and only on an exact-key miss, so a half-built depot can never be written back.
              if: success() && steps.cache-julia-depot.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: ${{ env.JULIA_DEPOT_PATH }}
                  key: julia-depot-v2-1.10-${{ hashFiles('tvbo/juliapkg.json') }}
