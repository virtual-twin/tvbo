name: Lint & Test

on:
    push:
        branches: ["main"]
    # No branch filter: a PR stacked on another PR's branch must be tested too.
    pull_request:
    workflow_dispatch:

# Cancel redundant runs: same branch/PR triggers supersede previous runs
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Least-privilege: read-only by default; jobs opt-in to more
permissions:
    contents: read
    packages: read

# Shared environment variables for all jobs
env:
    JAX_PLATFORMS: cpu
    # Headless matplotlib backend so plotting tests (test_plot_layouts) render
    # to an in-memory canvas instead of trying to open an interactive window.
    MPLBACKEND: Agg
    # uv: bytecode-compile installed wheels for faster cold starts
    UV_COMPILE_BYTECODE: "1"
    # uv: copy from the cache instead of hardlinking (CI runner safe)
    UV_LINK_MODE: copy

jobs:
    # ─── Always: lint, format & type-check ────────────────────
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            # ruff: blocking syntax-error subset; `version` tracks the `lint` extra.
            - name: Ruff — syntax errors (blocking)
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.16.1"
                  args: "check --select=E9,F63,F7,F82 --output-format=github ."

            # ruff: full lint summary, non-blocking until codebase is clean.
            - name: Ruff — full lint (non-blocking)
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.16.1"
                  args: "check --exit-zero ."

            # ruff format: report files needing reformatting, non-blocking.
            - name: Ruff format — check (non-blocking)
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.16.1"
                  args: "format --check --diff ."
              continue-on-error: true

            # mypy: type-check the source tree, non-blocking.
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install (editable, no-deps → generates datamodel) + mypy
              # `-e .` fires the hatch build hook, which regenerates the untracked
              # tvbo/datamodel/{schema,pydantic}.py that mypy needs to see.
              run: uv pip install -e . --no-deps && uv pip install mypy
            - name: Mypy — type check (non-blocking)
              run: mypy tvbo || true

    # ─── Always: skills sync guard ────────────────────────────
    # Canonical skills live in skills/ (maintainer, repo-only) and
    # tvbo/skills/canonical/ (user, shipped in the wheel). The rendered copies
    # (.claude/skills/, .github/instructions/, AGENTS.md) are GENERATED by
    # `tvbo skills sync`. This guard fails on:
    #   - drift: a rendered copy no longer matches its canonical source —
    #     run `tvbo skills sync` and commit the result to fix;
    #   - an orphan: a rendered copy with no canonical source, i.e. a personal
    #     skill committed by accident (those belong in ~/.claude/skills/);
    #   - a leak: a shipped user skill referencing a maintainer skill, which
    #     `install` never ships — a dead pointer for external users;
    #   - a bad extra: requires_extras naming no real optional-dependency group.
    # The last three are content problems; sync reports but never repairs them.
    skills-sync:
        name: Skills sync guard
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install (core, editable)
              run: uv pip install -e .
            - name: Check rendered skills match canonical sources
              run: tvbo skills sync --check

    # ─── Always: schema validation gate ───────────────────────
    # Validates every YAML in tvbo/database/ against the LinkML schema.
    # Fast (~20s) and depends only on linkml + pyyaml, so runs on every PR
    # without the full install matrix. Catches schema/database drift early.
    schema-validate:
        name: Schema validation
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install validation deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml pytest pytest-xdist
            - name: Validate every database YAML against the LinkML schema
              run: pytest -v --tb=short tests/test_database_validation.py

    # ─── Always: schema artifact build (OWL + SHACL) ───────────
    # Builds tvb-o-struct.owl and tvb-o.shacl.ttl from the LinkML schema on
    # every PR. Gated/non-blocking initially: surfaces gen-owl / gen-shacl
    # failures early without breaking the merge. Artifacts uploaded for
    # downstream reasoner CI (PR-I) and external consumers.
    schema-artifacts:
        name: Schema artifacts (OWL + SHACL)
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install schema-gen deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml rdflib
            - name: Generate OWL
              run: make gen-owl
            - name: Generate SHACL
              run: make gen-shacl
            - name: Upload schema artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: tvbo-ontology-artifacts
                  path: |
                      ontology/tvb-o-struct.owl
                      ontology/tvb-o.shacl.ttl
                  retention-days: 30

    # ─── Always: ontology reasoner (ELK + HermiT via ROBOT) ────
    # Runs OWL reasoning on the generated tvb-o-struct.owl to detect
    # unsatisfiable classes, inconsistent ontologies, and inverse /
    # functional / cardinality regressions. Uses ROBOT (the OBO standard
    # CLI) with ELK (fast OWL-EL profile) by default and HermiT for full
    # OWL-DL coverage. Non-blocking initially (continue-on-error) because
    # the freshly-generated ontology has known cleanup pending in §2.4.
    # Closes §2.6 first checkbox once flipped to required.
    reasoner:
        name: Ontology reasoner (ELK + HermiT)
        needs: schema-artifacts
        runs-on: ubuntu-latest
        timeout-minutes: 15
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Install schema-gen deps
              run: |
                  uv pip install \
                      "linkml>=1.11.0" "linkml-runtime>=1.11.0" \
                      pyyaml rdflib
            - name: Generate OWL
              run: make gen-owl
            - name: Set up Java (for ROBOT)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            - name: Install ROBOT
              run: |
                  mkdir -p $HOME/.local/bin
                  curl -L -o $HOME/.local/bin/robot.jar \
                      https://github.com/ontodev/robot/releases/download/v1.9.6/robot.jar
                  curl -L -o $HOME/.local/bin/robot \
                      https://raw.githubusercontent.com/ontodev/robot/v1.9.6/bin/robot
                  chmod +x $HOME/.local/bin/robot
                  echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Reason with ELK (OWL-EL profile, fast)
              run: |
                  robot reason \
                      --reasoner ELK \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-reasoned-elk.owl
            - name: Reason with HermiT (OWL-DL, full coverage)
              run: |
                  robot reason \
                      --reasoner HermiT \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-reasoned-hermit.owl
            - name: Report unsatisfiable classes
              run: |
                  robot report \
                      --input ontology/tvb-o-struct.owl \
                      --output ontology/tvb-o-report.tsv \
                      --fail-on ERROR \
                      --print 20 || true
            - name: Upload reasoner artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: tvbo-reasoner-artifacts
                  path: |
                      ontology/tvb-o-reasoned-elk.owl
                      ontology/tvb-o-reasoned-hermit.owl
                      ontology/tvb-o-report.tsv
                  retention-days: 30
                  if-no-files-found: warn

    # ─── Always: compatibility across Python versions ──────────
    compat:
        name: Python ${{ matrix.python-version }}
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-compat-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              # linkml/linkml-runtime pinned to v1.11.0-rc1; remove once on PyPI.
              run: |
                  uv pip install -e . pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Core tests
              run: |
                  pytest -v --tb=short -n auto --dist=loadscope \
                      --timeout=600 --timeout-method=thread \
                      tests/test_model_loading.py tests/test_graph.py \
                      tests/functional/test_dynamics_basic.py

    # ─── All PRs + push to main: native tests (no container) ──
    # Sharded into parallel jobs so one slow/heavy backend doesn't OOM or
    # exceed the runner watchdog. Each shard has its own timeout, and
    # pytest-timeout surfaces hangs as tracebacks instead of silent kills.
    test-native:
        name: Native (${{ matrix.shard }})
        needs: lint
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        timeout-minutes: ${{ matrix.timeout || 45 }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: core
                      paths: >-
                          tests/test_model_loading.py
                          tests/test_graph.py
                          tests/test_package_structure.py
                          tests/test_network_io.py
                          tests/functional/test_dynamics_basic.py
                          tests/functional/test_metadata_import.py
                          tests/functional/test_simulation_experiment_basic.py
                          tests/functional/test_timeseries_utils.py
                          tests/functional/test_simulation_backends_core.py
                          tests/test_citation_formatting.py
                          tests/test_numerical_golden_corpus.py
                          tests/test_codegen_golden_corpus.py
                          tests/test_symbol_context.py
                          tests/test_symbolic_layer.py
                          tests/test_piecewise_lowering.py
                          tests/test_branches_only_equations.py
                    - shard: tvboptim
                      paths: >-
                          tests/test_tvboptim_experiments.py
                          tests/functional/test_simulation_backends_tvboptim.py
                          tests/test_full_workflow_comparison.py
                          tests/test_tvboptim_byte_identity.py
                          tests/functional/test_observation_backend_consistency.py
                    - shard: tvb
                      paths: >-
                          tests/test_tvb_comparison.py
                          tests/test_tvb_interop.py
                          tests/test_stimulus_rendering.py
                          tests/functional/test_simulation_backends_tvb.py
                    - shard: pyrates
                      paths: >-
                          tests/functional/test_pyrates_integration.py
                          tests/functional/test_simulation_backends_pyrates.py
                    - shard: neuroml
                      paths: >-
                          tests/functional/test_simulation_backends_neuroml.py
                          tests/functional/test_brian2_backend.py
                    - shard: extras
                      paths: >-
                          tests/test_units.py
                          tests/test_database_golden_dump.py
                          tests/test_yaml_loader.py
                          tests/test_pydantic_loader.py
                          tests/test_pydantic_base.py
                          tests/test_linkml_compatibility.py
                          tests/test_experiment_api.py
                          tests/test_cli.py
                          tests/test_cli_workflow.py
                          tests/test_run_models.py
                          tests/test_tvboptim_observation_codegen.py
                          tests/functional/test_plot_layouts.py
                    # The shards above name paths, so a new test file joins none of them
                    # and is never run; this one takes the directory itself. Julia is
                    # excluded (not unrun): it has its own `test-julia` job, and rerunning
                    # it under this shard's `-n auto` fan-out crashes the xdist worker.
                    - shard: rest
                      paths: >-
                          tests/
                          --ignore=tests/test_docs.py
                          --ignore=tests/test_database_validation.py
                          --ignore=tests/functional/test_simulation_backends_julia.py
                      pytest_args: -n auto
                      timeout: 60
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-native-${{ matrix.shard }}-3.12-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install with all extras (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              # linkml/linkml-runtime pinned to v1.11.0-rc1; remove once on PyPI.
              run: |
                  uv pip install -e ".[all]" pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Run shard "${{ matrix.shard }}"
              run: |
                  pytest -x -v --tb=short \
                      --timeout=600 --timeout-method=thread \
                      --override-ini="addopts=" \
                      ${{ matrix.pytest_args }} ${{ matrix.paths }}

    # ─── Julia backends: cached depot keeps precompilation off the hot path ──
    # juliacall/juliapkg install Julia 1.10 + the DifferentialEquations /
    # ModelingToolkit / NetworkDynamics / BifurcationKit stack declared in
    # tvbo/juliapkg.json. A cold precompile of that stack is ~10-15 min, which
    # is why Julia was excluded before. We cache the Julia depot keyed on
    # juliapkg.json: the first run pays the cost once, every later run restores
    # the precompiled depot and finishes in a few minutes. Kept as its own job
    # (not a test-native shard) because it needs the depot cache + pre-warm.
    test-julia:
        name: Native (julia)
        needs: lint
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            # Depot inside the workspace so actions/cache can persist it.
            JULIA_DEPOT_PATH: ${{ github.workspace }}/.julia-depot
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8.1.0
              with:
                  python-version: "3.12"
                  enable-cache: true
                  activate-environment: true
                  cache-dependency-glob: |
                      pyproject.toml
                      .github/workflows/ci.yml
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Cache .venv
              id: venv-cache
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-julia-3.12-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
            - name: Install with all extras (cache miss)
              if: steps.venv-cache.outputs.cache-hit != 'true'
              run: |
                  uv pip install -e ".[all]" pytest pytest-xdist pytest-timeout
            - name: Refresh editable link (cache hit)
              if: steps.venv-cache.outputs.cache-hit == 'true'
              run: uv pip install -e . --no-deps
            - name: Restore Julia depot (Julia + precompiled packages)
              id: cache-julia-depot
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.JULIA_DEPOT_PATH }}
                  # -v2: escape depot caches an earlier run left in a partial /
                  # poisoned state. GitHub caches are immutable per key, so an
                  # incomplete depot saved under the old key could never be
                  # overwritten and was served on every run — the recurring failure.
                  key: julia-depot-v2-1.10-${{ hashFiles('tvbo/juliapkg.json') }}
                  restore-keys: |
                      julia-depot-v2-1.10-
            - name: Pre-warm Julia (resolve + precompile declared packages)
              run: |
                  # The Julia *project* (Project.toml/Manifest.toml under
                  # .venv/julia_env) and the Julia *depot* (package sources +
                  # precompiled artifacts under .julia-depot) are cached under two
                  # independent keys — the .venv cache (pyproject/ci.yml hash) and
                  # this depot cache (juliapkg.json hash). A restore can therefore
                  # pair a Manifest with a depot that predates it, leaving the
                  # Manifest referencing a transitive source (e.g. Moshi) the depot
                  # lacks; precompile then dies with "Package X is required but does
                  # not seem to be installed / Run Pkg.instantiate()". A forced
                  # juliapkg resolve is the one operation guaranteed to reconcile
                  # them: it rewrites Project.toml, drops the stale Manifest, then
                  # runs Pkg.add + Pkg.resolve + Pkg.precompile, pulling any missing
                  # sources. It runs as a plain Julia subprocess without loading
                  # PythonCall.jl, so it can't trip over the inconsistency it
                  # repairs, and the restored depot still supplies precompiled
                  # artifacts for unchanged packages — keeping this off the
                  # cold-compile hot path on a warm cache.
                  python -c "import juliapkg; juliapkg.resolve(force=True)"
                  python -c "import tvbo, juliacall; juliacall.Main.seval('using NetworkDynamics, OrdinaryDiffEq'); print('Julia depot ready')"
            - name: Run Julia backend tests
              run: |
                  pytest -x -v --tb=short \
                      --timeout=1200 --timeout-method=thread \
                      --override-ini="addopts=" \
                      tests/functional/test_simulation_backends_julia.py \
                      tests/test_networkdynamics_comparison.py
            - name: Save Julia depot (Julia + precompiled packages)
              # Persist the depot only when the job succeeded (never cache a
              # half-built depot) and only when the exact key was absent (an exact
              # hit is already saved, and GitHub caches are immutable). This is what
              # stops a poisoned depot from ever being written back.
              if: success() && steps.cache-julia-depot.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: ${{ env.JULIA_DEPOT_PATH }}
                  key: julia-depot-v2-1.10-${{ hashFiles('tvbo/juliapkg.json') }}
