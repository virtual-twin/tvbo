name: Lint & Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main", "dev"]
    workflow_dispatch:

# Cancel redundant runs: same branch/PR triggers supersede previous runs
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Least-privilege: read-only by default; jobs opt-in to more
permissions:
    contents: read
    packages: read

# Shared environment variables for all jobs
env:
    JAX_PLATFORMS: cpu
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_WARN_SCRIPT_LOCATION: "1"

jobs:
    # ─── Always: lint ──────────────────────────────────────────
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - run: pip install flake8
            - name: Syntax errors (blocking)
              run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            - name: Style warnings (non-blocking)
              run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # ─── Always: compatibility across Python versions ──────────
    compat:
        name: Python ${{ matrix.python-version }}
        needs: lint
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"
            - run: pip install -e . pytest pytest-xdist
            - name: Core tests
              run: pytest -q -n auto --dist=loadscope tests/test_model_loading.py tests/test_graph.py tests/functional/test_dynamics_basic.py

    # ─── All PRs + push to main: native tests (no container) ──
    test-native:
        name: Native tests
        needs: lint
        if: >-
            github.event_name == 'pull_request'
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Install with all extras
              run: pip install -e ".[all]" pytest pytest-xdist
            - name: Run tests (no doc tests)
              run: pytest -x -q --ignore=tests/test_docs.py --override-ini="addopts="
