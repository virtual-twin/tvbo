name: CI

on:
    push:
        branches: ["main", "dev"]
    pull_request:
        branches: ["main", "dev"]
    workflow_dispatch:

# Reusable condition: true when the target (or push ref) is main
# Use: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}

jobs:
    # ─── Always: lint ──────────────────────────────────────────
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - run: pip install flake8
            - name: Syntax errors (blocking)
              run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            - name: Style warnings (non-blocking)
              run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # ─── Always: compatibility across Python versions ──────────
    compat:
        name: Python ${{ matrix.python-version }}
        needs: lint
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"
            - run: pip install -e . && pip install pytest pytest-xdist
            - name: Core tests
              env:
                  JAX_PLATFORMS: cpu
              run: pytest -q -n auto --dist=loadscope tests/test_model_loading.py tests/test_graph.py tests/functional/test_dynamics_basic.py

    # ─── Dev only: native test (no container) ──────────────────
    test-native:
        name: Native tests
        needs: lint
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'dev')
            || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"
            - name: Install with all extras
              run: pip install -e ".[all]" && pip install pytest pytest-xdist
            - name: Run tests (no doc tests)
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest -q --ignore=tests/test_docs.py

    # ─── Main only: container tests ────────────────────────────
    # PRs use :dev image (built from latest dev push); pushes to main use :latest
    test-container:
        name: Container tests
        needs: lint
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'main')
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ github.event_name == 'pull_request' && 'dev' || 'latest' }}
        steps:
            - uses: actions/checkout@v6
            - name: Install pytest-xdist
              run: pip install pytest-xdist
            - name: Run tests (no doc tests)
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest -q --ignore=tests/test_docs.py

    # ─── Main only: doc tests ──────────────────────────────────
    test-docs:
        name: Doc tests
        needs: lint
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'main')
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ github.event_name == 'pull_request' && 'dev' || 'latest' }}
        steps:
            - uses: actions/checkout@v6
            - name: Install system deps for Quarto setup
              run: apt-get update && apt-get install -y --no-install-recommends curl jq
            - name: Install Quarto
              uses: quarto-dev/quarto-actions/setup@v2
            - name: Configure git for private repos
              run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
            - name: Install doc dependencies
              run: pip install ".[docs,pyrates]"
            - name: Run doc tests
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest tests/test_docs.py -v -m docs

    # ─── Main only: strict gate — zero skips before release ────
    strict-gate:
        name: Strict gate (no skips)
        needs: lint
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'main')
            || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/virtual-twin/tvbo:${{ github.event_name == 'pull_request' && 'dev' || 'latest' }}
        steps:
            - uses: actions/checkout@v6
            - name: Install pytest-xdist
              run: pip install pytest-xdist
            - name: Run all tests strictly (fail on skip)
              env:
                  JAX_PLATFORMS: cpu
                  XLA_FLAGS: "--xla_force_host_platform_device_count=8"
              run: pytest --ignore=tests/test_docs.py --no-header -p no:randomly -rN --override-ini="addopts=" -n auto --dist=loadscope 2>&1 | tee pytest_output.txt
            - name: Verify no tests were skipped
              run: |
                  # Extract the summary line, e.g. "42 passed, 3 skipped"
                  SUMMARY=$(tail -1 pytest_output.txt)
                  echo "Test summary: $SUMMARY"
                  if echo "$SUMMARY" | grep -qiE 'skip|xfail|error|no tests ran'; then
                    echo "::error::Strict gate FAILED — tests were skipped, xfailed, or errored. All tests must pass before merging to main."
                    echo "$SUMMARY"
                    exit 1
                  fi
                  echo "All tests passed with no skips."

    # ─── Main only: build package ──────────────────────────────
    package:
        name: Build package
        needs: [compat, test-container]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Build sdist and wheel
              run: |
                  pip install build
                  python -m build

            - uses: actions/upload-artifact@v6
              with:
                  name: tvbo-dist
                  path: dist/*
