# Build and publish the TVB-O documentation: called by docker.yml once the release image is pushed so the pull cannot race the build, or dispatched manually against any tag. It renders inside that exact released container — every backend present at the locked dependency set — with no _freeze, no .quarto and no Actions cache, so the site is a faithful cold re-execution rather than a replay, and then publishes via `quarto publish gh-pages`.

name: Deploy Docs

on:
    # A true job dependency on docker.yml, so the render targets that exact fresh image with no pull race.
    workflow_call:
        inputs:
            tag:
                description: "Release ref / image tag to render against (e.g. 'v1.2.3' or '1.2.3'). A leading 'v' is stripped."
                required: false
                type: string
                default: ""
            publish:
                description: "Publish the rendered site to gh-pages. A release publishes; a manual dispatch defaults to a dry run."
                required: false
                type: boolean
                default: true
    workflow_dispatch:
        inputs:
            tag:
                description: "Container tag to render against (e.g. '1.2.3' or 'latest'). Empty → 'latest'."
                required: false
                default: ""
            publish:
                description: "Publish to gh-pages on success. Off by default so a cold render can be verified without touching the live site."
                required: false
                type: boolean
                default: false

# Only ever one in-flight docs publish; never abort a publish mid-push.
concurrency:
    group: docs-publish
    cancel-in-progress: false

permissions:
    contents: write       # quarto publish gh-pages pushes to the gh-pages branch
    packages: read

jobs:
    publish:
        name: Render & publish (cold build)
        runs-on: ubuntu-latest
        timeout-minutes: 180

        steps:
            # A release ref "v1.2.3" maps to the image tag "1.2.3"; a manual dispatch supplies the tag directly.
            - name: Resolve container tag
              id: tag
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  # Strip the leading 'v' to reach the image's semver tag; empty input falls back to 'latest'.
                  raw="${INPUT_TAG:-}"
                  tag="${raw#v}"
                  tag="${tag:-latest}"
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"
                  echo "Container tag: ${tag}"

            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0  # full history; gh-pages publish needs the repo

            - name: Configure git identity
              run: |
                  git config --global user.name  "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # `docker run`, not `jobs.<id>.container:`, so the tag resolved at runtime is honoured rather than needing to be known at parse time.
            - name: Render docs inside tvbo container (cold)
              env:
                  TAG: ${{ steps.tag.outputs.tag }}
                  PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
              run: |
                  set -euo pipefail
                  docker pull "ghcr.io/virtual-twin/tvbo:${TAG}"
                  # Override ENTRYPOINT with bash, so the render runs whatever entrypoint the pulled tag happens to ship.
                  docker run --rm \
                      --entrypoint bash \
                      -v "${PWD}:/work" \
                      -w /work \
                      -e PRIVATE_REPO_TOKEN \
                      -e JAX_PLATFORMS=cpu \
                      -e HOST_UID="$(id -u)" \
                      -e HOST_GID="$(id -g)" \
                      "ghcr.io/virtual-twin/tvbo:${TAG}" \
                      -euxc '
                          git config --global url."https://${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
                          git config --global --add safe.directory /work
                          UV_BIN="$(command -v uv || true)"
                          if [ -z "${UV_BIN}" ]; then
                              if ! command -v curl >/dev/null 2>&1; then
                                  apt-get update
                                  apt-get install -y --no-install-recommends curl ca-certificates
                              fi
                              curl -LsSf https://astral.sh/uv/install.sh | sh
                              export PATH="$HOME/.local/bin:${PATH}"
                              UV_BIN="$(command -v uv || true)"
                          fi
                          if [ -z "${UV_BIN}" ]; then
                              echo "FATAL: uv is required but was not found in PATH."
                              exit 1
                          fi
                          "${UV_BIN}" pip install --system -e . --no-deps
                          # Fail loudly if the install did not regenerate the untracked datamodel; without it every `import tvbo` dies opaquely.
                          if ! python -c "import tvbo.datamodel.schema"; then
                              echo "FATAL: tvbo.datamodel.schema did not import after the editable install."
                              echo "The hatch build hook (hatch_build.py) should have regenerated it under /work/tvbo/datamodel/. Contents:"
                              ls -la /work/tvbo/datamodel/ || true
                              echo "Verify build isolation installed linkml (see [build-system].requires in pyproject.toml) so the generator can run."
                              exit 1
                          fi
                          if ! command -v quarto >/dev/null 2>&1; then
                              apt-get update
                              apt-get install -y --no-install-recommends curl jq wget libcairo2-dev
                              QV=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep -oP "\"tag_name\": \"v\K[^\"]+")
                              ARCH=$(dpkg --print-architecture)
                              wget -qO /tmp/quarto.deb "https://github.com/quarto-dev/quarto-cli/releases/download/v${QV}/quarto-${QV}-linux-${ARCH}.deb"
                              dpkg -i /tmp/quarto.deb && rm /tmp/quarto.deb
                          fi
                          quarto --version
                          # Regenerate the ontology artefacts; ROBOT ships in the image, with apt as the fallback.
                          if ! command -v robot >/dev/null 2>&1; then
                              apt-get update
                              apt-get install -y --no-install-recommends default-jre-headless
                              curl -sSL -o /usr/local/bin/robot https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
                              curl -sSL -o /usr/local/bin/robot.jar https://github.com/ontodev/robot/releases/latest/download/robot.jar
                              chmod +x /usr/local/bin/robot
                          fi
                          # An isolated venv, because the image ships runtime deps only and the schema-gen toolchain must not perturb the runtime the Quarto cells import. The list is exactly what `make gen-merged` imports — linkml, yaml, rdflib and pybtex — rather than an extra from pyproject, since the one declaring pybtex is `docs`, which would drag quarto, jupyter and mne in here and defeat the isolation.
                          "${UV_BIN}" venv /tmp/genenv
                          "${UV_BIN}" pip install --python /tmp/genenv/bin/python \
                              "linkml==1.11.1" pyyaml rdflib pybtex
                          PATH="/tmp/genenv/bin:${PATH}" make gen-merged gen-shacl
                          cd docs
                          # Cold build: drop every cache so all code cells re-execute.
                          rm -rf _freeze .quarto _site .jupyter_cache
                          quarto render --cache-refresh
                          # Hand ownership back to the host runner user.
                          chown -R "${HOST_UID}:${HOST_GID}" _site _freeze .quarto 2>/dev/null || true
                          chown -R "${HOST_UID}:${HOST_GID}" /work/ontology /work/docs/ontology 2>/dev/null || true
                      '

            # Widoco runs on the host — inside the container it would need Docker-in-Docker — and overlays spec/ onto the already-built _site.
            - name: Generate Widoco specification (W3C-style HTML + WebVOWL)
              env:
                  WIDOCO_IMAGE: ghcr.io/dgarijo/widoco:v1.4.25
              run: |
                  set -euxo pipefail
                  mkdir -p docs/_site/ontology/spec
                  docker pull --platform linux/amd64 "${WIDOCO_IMAGE}"
                  docker run --rm --platform linux/amd64 \
                      -v "${PWD}/ontology:/usr/local/widoco/in:ro" \
                      -v "${PWD}/docs/_site/ontology/spec:/usr/local/widoco/out" \
                      "${WIDOCO_IMAGE}" \
                      -ontFile in/tvbo.owl \
                      -outFolder out \
                      -rewriteAll \
                      -webVowl \
                      -licensius \
                      -includeAnnotationProperties \
                      -getOntologyMetadata \
                      -uniteSections \
                      -lang en
                  # Bundle downloadable artefacts alongside the spec.
                  cp ontology/tvbo.owl            docs/_site/ontology/spec/tvbo.owl
                  cp ontology/tvb-o-axioms.ttl    docs/_site/ontology/spec/tvb-o-axioms.ttl
                  cp ontology/tvb-o.shacl.ttl    docs/_site/ontology/spec/tvb-o.shacl.ttl

            # `quarto publish gh-pages` owns the branch (orphan, force-push, .nojekyll); `--no-render` reuses the _site just built in the container.
            - uses: quarto-dev/quarto-actions/setup@v2

            # A dispatch defaults to not publishing, so the cold build can be exercised on its own. Until this existed the workflow could only be tested by publishing, which is why four failed runs were never diagnosed.
            - name: Publish to gh-pages
              if: ${{ inputs.publish }}
              working-directory: docs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config --global --add safe.directory "${GITHUB_WORKSPACE}"
                  quarto publish gh-pages --no-prompt --no-browser --no-render
