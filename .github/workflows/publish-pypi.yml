name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]  # >3.11 versions
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          activate-environment: true
          cache-dependency-glob: |
              pyproject.toml
              .github/workflows/publish-pypi.yml

      - name: Install project (minimal) + test deps
        run: uv pip install . pytest pytest-cov pytest-xdist

      - name: Core tests (minimal install)
        run: pytest -q --override-ini="addopts=" tests/test_model_loading.py tests/test_graph.py tests/functional/test_dynamics_basic.py

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install build backend
        run: uv pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata (twine check)
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Trusted Publishing OIDC
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
