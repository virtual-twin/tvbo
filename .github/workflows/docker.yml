# Build and push TVBO container, then run tests inside the fresh image.
#
# Pipeline: build → test-container + test-docs (parallel) → release-ready (main only)
name: Build & Test Container

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAX_PLATFORMS: cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "1"

jobs:
  # amd64 and arm64 build on NATIVE runners in parallel, each cached independently; a final job stitches them into the multi-arch tag.
  build:
    name: Build (${{ matrix.platform.tag }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,    arch: amd64, tag: linux-amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, tag: linux-arm64 }
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            leonmartin2/tvbo
            ghcr.io/${{ github.repository }}
          # Per-arch tag suffix, so both arches push without colliding before the manifest job merges them.
          flavor: |
            suffix=-${{ matrix.platform.arch }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.arch }}

      - name: Export digest
        id: export
        run: |
          echo "digest-${{ matrix.platform.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # ─── Stitch per-arch images into multi-arch manifests ───────────────────
  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            leonmartin2/tvbo
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest for $tag"
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

  # Sharded for parallelism, with a per-test timeout so hangs surface as tracebacks instead of silent runner kills.
  test-container:
    name: Container (${{ matrix.shard }})
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/virtual-twin/tvbo:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            paths: >-
              tests/test_model_loading.py
              tests/test_graph.py
              tests/test_package_structure.py
              tests/test_network_io.py
              tests/functional/test_dynamics_basic.py
              tests/functional/test_metadata_import.py
              tests/functional/test_simulation_experiment_basic.py
              tests/functional/test_timeseries_utils.py
              tests/functional/test_simulation_backends_core.py
              tests/test_citation_formatting.py
              tests/test_numerical_golden_corpus.py
              tests/test_codegen_golden_corpus.py
            needs_julia_refdata: false
          - shard: tvboptim
            paths: >-
              tests/test_numerical_golden_corpus.py
              tests/test_tvboptim_experiments.py
              tests/functional/test_simulation_backends_tvboptim.py
            needs_julia_refdata: false
          - shard: tvb
            paths: >-
              tests/test_tvb_comparison.py
              tests/test_tvb_interop.py
              tests/functional/test_simulation_backends_tvb.py
            needs_julia_refdata: false
          - shard: pyrates-neuroml
            paths: >-
              tests/functional/test_pyrates_integration.py
              tests/functional/test_simulation_backends_pyrates.py
              tests/functional/test_simulation_backends_neuroml.py
              tests/test_full_workflow_comparison.py
            needs_julia_refdata: false
          - shard: julia
            paths: >-
              tests/functional/test_simulation_backends_julia.py
              tests/test_networkdynamics_comparison.py
            needs_julia_refdata: true
    steps:
      - uses: actions/checkout@v6
      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Link checkout as editable (deps already in image)
        run: |
          UV_BIN="$(command -v uv || true)"
          if [ -z "${UV_BIN}" ]; then
            if ! command -v curl >/dev/null 2>&1; then
              apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
            fi
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:${PATH}"
            UV_BIN="$(command -v uv || true)"
          fi
          if [ -z "${UV_BIN}" ]; then
            echo "FATAL: uv is required but was not found in PATH."
            exit 1
          fi
          "${UV_BIN}" pip install --system -e . --no-deps
          "${UV_BIN}" pip install --system pytest-xdist pytest-timeout
      - name: Generate Julia reference data
        if: matrix.needs_julia_refdata
        run: python -c "from juliacall import Main; Main.seval('include(\"tests/reference_data/generate_nd_references.jl\")')"
      - name: Run shard "${{ matrix.shard }}"
        run: |
          pytest -x -v --tb=short \
            --timeout=600 --timeout-method=thread \
            --override-ini="addopts=" \
            ${{ matrix.paths }}

  # Doc tests — one shard per backend, all in parallel.
  test-docs:
    name: Docs (${{ matrix.shard }})
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/virtual-twin/tvbo:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NeuroML/LEMS examples (40 docs, jNeuroML + NEURON backend)
          - shard: neuroml
            doc_pattern: "NeuroML"
            extra_args: ""
            xla_device_count: "8"
            test_timeout: "900"
          # Julia backends; the long timeout covers cold precompilation, which can exceed 15 min in Docker.
          - shard: julia
            doc_pattern: "BifurcationKit or ModelingToolkit or NetworkDynamics"
            extra_args: ""
            xla_device_count: "8"
            test_timeout: "1800"
          # PyRates dynamical systems
          - shard: pyrates
            doc_pattern: "Pyrates"
            extra_args: ""
            xla_device_count: "8"
            test_timeout: "900"
          # TVB interoperability
          - shard: tvb
            doc_pattern: "Interoperability/TVB"
            extra_args: ""
            xla_device_count: "8"
            test_timeout: "900"
          # Stable RWW only (EI/JR too heavy). device_count=1: forced host CPU devices add cores=0, memory=8x → OOM.
          - shard: tvboptim-rww
            doc_pattern: "RWW_tvboptim"
            extra_args: "--run-slow"
            xla_device_count: "1"
            test_timeout: "900"
          # The heaviest renders: nvmap_auto_cap lets the 2GB memory budget rather than a fixed count set the batch size, and one device keeps each grid on a single vmap.
          - shard: replication
            doc_pattern: "Replication"
            extra_args: ""
            xla_device_count: "1"
            nvmap_auto_cap: "4096"
            test_timeout: "3600"
            # Idle while the replication studies live in tvbo-manuscript: the pages left here carry no executable cells, so the shard stays wired up and revives on its own when one lands.
            allow_empty: "true"
          # Core: everything the specialised shards above do not match.
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_ALLOCATOR: platform
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      TVBO_XLA_DEVICE_COUNT: ${{ matrix.xla_device_count }}
      TVBO_NVMAP_AUTO_CAP: ${{ matrix.nvmap_auto_cap }}
      # The shard's declared ceiling governs the notebook subprocess too, not only pytest -- the inner one is the lower of the two and so decides when a slow backend is called wedged.
      TVBO_DOC_EXECUTE_TIMEOUT_S: ${{ matrix.test_timeout }}
    steps:
      - uses: actions/checkout@v6
      - name: Ensure Quarto is available
        run: |
          if ! command -v quarto &>/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends curl jq wget sudo
            QUARTO_VERSION=$(curl -s https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
            ARCH=$(dpkg --print-architecture)
            wget -qO quarto.deb "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-${ARCH}.deb"
            dpkg -i quarto.deb && rm quarto.deb
          fi
          quarto --version
      - name: Ensure system libs
        run: |
          if ! ldconfig -p | grep -q libcairo.so.2; then
            apt-get update && apt-get install -y --no-install-recommends libcairo2-dev
          fi
      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Link checkout as editable (deps already in image)
        run: |
          UV_BIN="$(command -v uv || true)"
          if [ -z "${UV_BIN}" ]; then
            if ! command -v curl >/dev/null 2>&1; then
              apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
            fi
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:${PATH}"
            UV_BIN="$(command -v uv || true)"
          fi
          if [ -z "${UV_BIN}" ]; then
            echo "FATAL: uv is required but was not found in PATH."
            exit 1
          fi
          "${UV_BIN}" pip install --system -e . --no-deps
          "${UV_BIN}" pip install --system pytest-xdist pytest-timeout
      - name: Run doc tests (${{ matrix.shard }})
        run: |
          set +e
          pytest tests/test_docs.py -v --tb=long -m docs \
            -k "${{ matrix.doc_pattern }}" \
            ${{ matrix.extra_args }} \
            --timeout=${{ matrix.test_timeout }} --timeout-method=thread \
            --override-ini="addopts="
          rc=$?
          set -e
          # Exit 5 is "nothing collected", which only a shard declaring allow_empty is permitted to report -- anywhere else it means the pattern stopped matching what it was written for.
          if [ "$rc" -eq 5 ] && [ "${{ matrix.allow_empty }}" = "true" ]; then
            echo "No docs matched '${{ matrix.doc_pattern }}'; shard idle."
            exit 0
          fi
          exit $rc

  # ─── Release-ready check (main only) ────────────────────────
  release-ready:
    name: Release-ready check
    needs: [test-container, test-docs]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - name: Configure git for private repos
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install build tools
        run: uv pip install build twine check-wheel-contents

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata (twine --strict)
        run: python -m twine check --strict dist/*

      - name: Verify wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(grep -m1 '__version__' tvbo/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          WHL_NAME=$(ls dist/*.whl | head -1)
          echo "Package version: $PKG_VERSION"
          echo "Wheel: $WHL_NAME"
          if ! echo "$WHL_NAME" | grep -q "$PKG_VERSION"; then
            echo "::error::Version mismatch between tvbo/__init__.py ($PKG_VERSION) and wheel ($WHL_NAME)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent."

      - name: Verify package installs cleanly from wheel
        # linkml/linkml-runtime pinned to v1.11.0-rc1 until 1.11 is on PyPI.
        run: |
          uv pip install dist/*.whl
          python -c "from tvbo import Dynamics, SimulationExperiment; print('Import OK')"

      - name: Upload release-ready artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tvbo-dist
          path: dist/*
          retention-days: 30

  # `needs: manifest` guarantees the version image is pushed before docs-deploy pulls it — ordered, no race, no retry.
  publish-docs:
    name: Publish docs
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # docs-deploy's `quarto publish gh-pages` pushes to gh-pages
      packages: read
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
