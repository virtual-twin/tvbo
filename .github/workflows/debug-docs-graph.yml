name: Debug docs graph verification

# Throwaway: reports why tvboptim rejects the landing page's graph on GitHub's amd64 runners; delete once the Docs (core) failure is fixed.
on:
    push:
        branches: [dev]
        paths: [.github/workflows/debug-docs-graph.yml]
    workflow_dispatch:

jobs:
    graph:
        name: graph (attempt ${{ matrix.attempt }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        container:
            image: ghcr.io/virtual-twin/tvbo:dev
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        strategy:
            fail-fast: false
            matrix:
                attempt: [1, 2, 3, 4]
        env:
            JAX_PLATFORMS: cpu
            MPLBACKEND: Agg
            XLA_PYTHON_CLIENT_ALLOCATOR: platform
            XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        steps:
            - uses: actions/checkout@v6
            - name: Link checkout as editable
              run: |
                  UV_BIN="$(command -v uv || true)"
                  if [ -n "${UV_BIN}" ]; then "${UV_BIN}" pip install --system -q -e . --no-deps; else pip install -q -e . --no-deps; fi
            - name: Machine
              run: |
                  grep -m1 "model name" /proc/cpuinfo; nproc
                  grep -m1 flags /proc/cpuinfo | tr " " "\n" | grep -E "^(avx2|fma|avx512f|avx512bw|avx512vl|avx512_bf16)$" | tr "\n" " "; echo
                  python -c "import numpy, jax, tvboptim; print('numpy', numpy.__version__, 'jax', jax.__version__, 'tvboptim', tvboptim.__version__); numpy.show_runtime()"
            - name: Write the instrumented run
              run: |
                  cat > /tmp/graph_probe.py <<'EOF'
                  """Run the landing page's study with every dense graph's verify() wrapped to report what it rejected."""
                  import numpy as np
                  import jax.numpy as jnp
                  from tvboptim.experimental.network_dynamics.graph import base


                  def report(graph):
                      w = np.asarray(graph._weights)
                      print("weights", w.shape, w.dtype, "nan", int(np.isnan(w).sum()), "inf", int(np.isinf(w).sum()), "max|W-W.T|", float(np.nanmax(np.abs(w - w.T))), "stored symmetric", graph._symmetric, "allclose now", bool(jnp.allclose(graph._weights, graph._weights.T)), flush=True)
                      for name in ("_lengths", "_delays", "_speed"):
                          if name in vars(graph):
                              a = np.asarray(vars(graph)[name])
                              print(name, a.shape, a.dtype, "nan", int(np.isnan(a).sum()), "inf", int(np.isinf(a).sum()), "min", float(np.nanmin(a)), flush=True)


                  def instrument(cls):
                      original = cls.verify

                      def verify(self, verbose=True):
                          ok = original(self, verbose)
                          if not ok and not verbose:
                              print(f"VERIFY FAILED: {cls.__name__}.verify on a {type(self).__name__}", flush=True)
                              report(self)
                              original(self, True)
                          return ok

                      cls.verify = verify


                  for cls in (base.DenseGraph, base.DenseDelayGraph, base.DenseLengthGraph):
                      instrument(cls)

                  from tvbo import SimulationStudy

                  SimulationStudy.from_file("examples/first-simulation/study.yaml").run(root="/tmp/first-simulation", figures=False)
                  print("STUDY RAN", flush=True)
                  EOF
            - name: As the Docs job ran it before the conftest change (4 host devices)
              working-directory: docs
              continue-on-error: true
              env:
                  XLA_FLAGS: --xla_force_host_platform_device_count=4
              run: python /tmp/graph_probe.py
            - name: With the conftest flags (4 host devices, single-threaded Eigen)
              working-directory: docs
              continue-on-error: true
              env:
                  XLA_FLAGS: --xla_force_host_platform_device_count=4 --xla_cpu_multi_thread_eigen=false
              run: python /tmp/graph_probe.py
            - name: One device
              working-directory: docs
              continue-on-error: true
              run: python /tmp/graph_probe.py
