[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tvbo"
dynamic = ["version"]
description = "The Virtual Brain Ontology"
readme = "README.md"
license = { text = "EUPL-1.2" }
authors = [{ name = "Leon Martin", email = "leon.martin@bih-charite.de" }]
requires-python = ">=3.10"
dependencies = [
    # Core scientific
    "scipy>=1.15.0",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "xarray>=2025.0",

    # Data models & schema (pydantic, pyyaml, rdflib are transitive via linkml-runtime)
    "linkml-runtime>=1.8.5",
    "h5py>=3.12.1",

    # Ontologies
    "owlready2>=0.47",

    # ML
    "jax >=0.4.28",
    "equinox >=0.11.12",

    # Symbolic
    "sympy>=1.13.0",

    # Visualization
    "bsplot>=0.0.4",
    "networkx>=3.4.2",
    "pydot>=3.0.3",

    # Templating
    "mako>=1.3.10",
    "black",

    # BIDS dataset support
    "pybids>=0.16.0",
]

[project.optional-dependencies]
# NeuroML/LEMS support
neuroml = ["PyLEMS>=0.6.7"]

# Data formats (tractograms, HDF5)
data = ["dipy>=1.10.0"]

# Knowledge base features
knowledge = [
    "goatools>=1.4.12",
    "pybel>=0.14.10",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.26.1",
    "simple_colors>=0.1",
    "wget>=3.2",
]

# Audio/signal processing
audio = ["librosa>=0.10.2"]

# Documentation & reports
docs = [
    "quarto",
    "jupyter",
    "pypandoc>=1.15",
    "pybtex>=0.24.0",
    "pypdf>=5.1.0",
    "black>=25.9.0",
    "jupyter",
    "nbclient>=0.10.0",
]

# PyRates dynamical systems modeling + continuation
pyrates = ["pyrates>=1.0.0", "pycobi>=0.8.0"]

# Julia integration
julia = ["juliacall>=0.9.20"]

# API server
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "docker>=7.1.0"]

# TVB integration
tvb = ["tvb-library", "tvb-framework", "tvb-data"]

# TVB optimization (JAX-based simulation & optimization)
tvboptim = ["tvboptim"]

# Full install (all features)
all = ["tvbo[neuroml,data,knowledge,audio,api,tvb,tvboptim,docs,pyrates,julia]"]

[project.urls]
homepage = "https://virtual-twin.github.io/tvbo/"
documentation = "https://virtual-twin.github.io/tvbo/"
repository = "https://github.com/virtual-twin/tvbo"
bug-tracker = "https://github.com/virtual-twin/tvbo/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["tvbo/**", "README.md"]
exclude = [
    "tvbo/database/networks/*.h5",
    "tvbo/data/tvbo_data/atlas/**/*.nii.gz",
    "tvbo/data/go-basic.obo",
    "tvbo/data/ontology/_tvb-o.owl",
    "tvbo/data/NeuroMMSig_abeta_subgraph.dill",
    "tvbo/data/tvb-go/**/*.png",
    "tvbo/**/__pycache__",
]

[tool.hatch.build.force-include]
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_desc-surf_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-Lobar8_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-Lobar8_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_rec-dTOR_atlas-Lobar8_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_rec-dTOR_atlas-Lobar8_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-DesikanKilliany_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-DesikanKilliany_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-HCPYA_rec-dTOR_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-HCPYA_rec-dTOR_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-MghUscHcp32_rec-MghUscHcp32_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-MghUscHcp32_rec-MghUscHcp32_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-PPMI85_rec-PPMI85_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-PPMI85_rec-PPMI85_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-L_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-L_desc-surf_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-R_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-R_desc-surf_relmat.h5"

[tool.hatch.version]
path = "tvbo/__init__.py"

[tool.hatch.envs.dev]
dependencies = [
    "flake8",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "mypy",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[tool.pytest.ini_options]
addopts = "-n 1 --dist=loadscope"
markers = [
    "backend_core: core backend-agnostic simulation tests",
    "backend_jax: JAX backend tests",
    "backend_tvb: TVB backend tests",
    "backend_pyrates: PyRates backend tests",
    "backend_tvboptim: tvboptim backend tests",
    "backend_julia: Julia-backed simulation tests (class-level)",
    "backend_julia_diffeq: DifferentialEquations.jl backend tests",
    "backend_networkdynamics: NetworkDynamics.jl backend tests",
    "backend_mtk: ModelingToolkit.jl backend tests",
    "backend_neuroml: NeuroML/LEMS backend tests",
    "docs: mark test as documentation test (tests that execute .qmd notebooks)",
    "julia: mark test as requiring a Julia runtime via juliacall",
    "slow: long-running tests excluded by default (use --run-slow to include)",
]
