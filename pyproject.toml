[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tvbo"
dynamic = ["version"]
description = "The Virtual Brain Ontology"
readme = "README.md"
license = { text = "EUPL-1.2" }
authors = [{ name = "Leon Martin", email = "leon.martin@bih-charite.de" }]
requires-python = ">=3.10"
dependencies = [
    # Core scientific
    "scipy>=1.15.0",
    "numpy>=2.0.0",
    "pandas>=2.2.3",

    # Data models & schema
    "pydantic>=2.6.0",
    "linkml-runtime>=1.8.5",
    "PyYAML>=6.0.0",

    # Ontologies
    "owlready2>=0.47",
    "rdflib>=7.1.1",

    # ML
    "jax>=0.6.0",
    "equinox>=0.11.12",

    # Symbolic
    "sympy>=1.13.0",

    # Visualization
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "pydot>=3.0.3",

    # Templating
    "mako>=1.3.10",
    "black",

    # BIDS dataset support
    "pybids>=0.16.0",
]

[project.optional-dependencies]
# NeuroML/LEMS support
neuroml = ["PyLEMS>=0.6.7"]

# Data formats (tractograms, HDF5)
data = ["dipy>=1.10.0", "h5py>=3.12.1"]

# Knowledge base features
knowledge = [
    "goatools>=1.4.12",
    "pybel>=0.14.10",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.26.1",
    "simple_colors>=0.1",
    "wget>=3.2",
]

# Audio/signal processing
audio = ["librosa>=0.10.2"]

# Documentation & reports
docs = ["pypandoc>=1.15", "pybtex>=0.24.0", "pypdf>=5.1.0", "black>=25.9.0"]

# Julia integration
julia = ["julia>=0.5.7"]

# API server
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "docker>=7.1.0"]

# TVB integration
tvb = ["tvb-library", "tvb-framework", "tvb-data"]

# TVB optimization (JAX-based simulation & optimization)
tvboptim = ["tvboptim @ git+https://github.com/virtual-twin/tvboptim.git"]

# Full install (all features)
all = ["tvbo[neuroml,data,knowledge,audio,docs,api,tvb,tvboptim]"]

[project.urls]
homepage = "https://virtual-twin.github.io/tvbo/"
documentation = "https://virtual-twin.github.io/tvbo/"
repository = "https://github.com/virtual-twin/tvbo"
bug-tracker = "https://github.com/virtual-twin/tvbo/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["tvbo/**", "README.md"]

[tool.hatch.version]
path = "tvbo/__init__.py"

[tool.hatch.envs.dev]
dependencies = [
    "flake8",
    "pytest",
    "pytest-cov",
    "mypy",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[tool.pytest.ini_options]
markers = [
    "docs: mark test as documentation test (tests that execute .qmd notebooks)",
]
