[build-system]
# Build-time only, and pinned so `hatch_build.py` regenerates the datamodel deterministically; importing the generated classes needs only `linkml-runtime`.
requires = ["hatchling", "linkml==1.11.1"]
build-backend = "hatchling.build"

[project]
name = "tvbo"
dynamic = ["version"]
description = "The Virtual Brain Ontology"
readme = "README.md"
license = { text = "EUPL-1.2" }
authors = [{ name = "Leon Martin", email = "leon.martin@bih-charite.de" }]
requires-python = ">=3.11"
dependencies = [
    # Core scientific
    "scipy>=1.15.0",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "xarray>=2025.0",
    # Needed to *use* the generated datamodel; the heavy `linkml` generator is build-time only (see [build-system].requires).
    "linkml-runtime>=1.11.0",
    # Backs `tvbo validate schema` against the shipped JSON Schema; declared explicitly because we import it directly.
    "jsonschema>=4.0.0",
    "h5py>=3.12.1",
    "h5netcdf>=1.3",

    # Ontologies
    "owlready2>=0.47",

    # ML
    "jax >=0.4.28",
    # jaxlib ships no macOS x86_64 wheel past 0.4.x; cap Intel Macs there (no-op elsewhere).
    "jax <0.5.0 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "equinox >=0.11.12",

    # Symbolic
    "sympy>=1.13.0",

    # Visualization — floor tracks the declarative Figure renderer in tvbo/adapters/bsplot.py.
    "bsplot>=0.0.10",
    "networkx>=3.4.2",
    "pydot>=3.0.3",

    "mako>=1.3.12",
    # Major pinned: its annual style bump would re-baseline every emitted-code reference.
    "black>=26.5,<27",

    # BIDS dataset support
    "pybids>=0.16.0",

    # CLI (typer pulls in click; rich is optional but useful for tables)
    "typer>=0.12",
]

[project.scripts]
tvbo = "tvbo.cli:app"

[project.optional-dependencies]
# NeuroML/LEMS support (pyNeuroML + LEMS engine)
neuroml = ["PyLEMS>=0.6.7", "pyNeuroML>=0.7.0"]

# Brian2 native small-scale spiking backend
brian2 = ["Brian2>=2.5.0"]

# NEURON simulator (required for multi-compartment NeuroML export backend)
neuron = ["neuron"]

# Data formats (tractograms, HDF5)
data = ["dipy>=1.10.0"]

# Surface/volume PDE backend: skfem is the FEM engine, meshio the mesh IO, nibabel the GIFTI/FreeSurfer loader — all three imported unconditionally by tvbo-pde-fem.py.mako.
pde = ["scikit-fem>=8.0.0", "meshio>=5.3.0", "nibabel>=5.0.0"]

# Knowledge base features
knowledge = [
    "goatools>=1.4.12",
    "pybel>=0.14.10",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.26.1",
    "simple_colors>=0.1",
    "wget>=3.2",
]

# Audio/signal processing. The floors stop the resolver backtracking to numba 0.53.1 (no py3.12+ wheels); Intel Mac is capped because llvmlite>=0.44 ships none either — issue #7.
audio = [
    "librosa>=0.10.2",
    "numba>=0.59;    sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numba<0.60;     sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite>=0.42; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "llvmlite<0.44;  sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# Documentation & reports
docs = [
    "quarto",
    "jupyter",
    "pypandoc>=1.15",
    "pybtex>=0.24.0",
    "pypdf>=5.1.0",
    "jupyter",
    "nbclient>=0.10.0",
    # Specification/Network.qmd calls mne.datasets.fetch_fsaverage with an unguarded import, so the page needs mne to execute.
    "mne>=1.6.0",
    # Networks/PDESimulation.qmd runs the FEM PDE backend end-to-end, so the doc build needs the pde extra.
    "tvbo[pde]",
]

# Bifurcation continuation: the pip-installable half only — the AUTO-07p Fortran engine is built system-side, see docs/installation.md. meson/ninja back pyrates' f2py call, since numpy>=1.26 dropped distutils.
auto7p = ["pycobi>=0.8.0", "meson>=1.4.0", "ninja>=1.11.0"]

# PyRates (continuation needs auto7p). networkx is capped because >=3.6 makes graph constructors backend-dispatchable and steals pyrates' backend='fortran' kwarg.
pyrates = ["pyrates>=1.0.0", "networkx<=3.5", "tvbo[auto7p]"]

# Julia integration
julia = ["juliacall>=0.9.20"]

# API server
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "docker>=7.1.0"]

# TVB integration — same Intel-Mac cap and floor as [audio], since tvb-library pulls numba transitively.
tvb = [
    "tvb-library",
    "tvb-framework",
    "tvb-data",
    "numba>=0.59;    sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numba<0.60;     sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite>=0.42; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "llvmlite<0.44;  sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# TVB optimization (JAX). pymoo backs the NSGA-II strategy (Exploration.strategy: nsga2).
tvboptim = ["tvboptim", "pymoo>=0.6.0"]

# The ORCHESTRATOR for `tvbo workflow submit`, needed wherever submit runs; a study's own runtime deps travel via `environment.requirements`.
workflow = ["snakemake>=8.0.0", "snakemake-executor-plugin-slurm>=0.11.0"]

# Minor pinned so a local run and the CI ruff-action agree on the rule set.
lint = ["ruff>=0.16.1,<0.17"]

# Full install (all features)
all = ["tvbo[neuroml,neuron,data,pde,knowledge,audio,api,tvb,tvboptim,docs,pyrates,julia,auto7p,brian2,workflow,lint]"]

[project.urls]
homepage = "https://tvbo.charite.de"
documentation = "https://virtual-twin.github.io/tvbo/"
repository = "https://github.com/virtual-twin/tvbo"
bug-tracker = "https://github.com/virtual-twin/tvbo/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tvbo"]

[tool.hatch.build.targets.sdist]
# schema/** and hatch_build.py ship so a wheel built *from the sdist* can regenerate the untracked datamodel.
include = ["tvbo/**", "schema/**", "hatch_build.py", "README.md", "pyproject.toml", "LICENSE"]

# Generates tvbo/datamodel/{schema,pydantic}.py from the LinkML schema before every build. See hatch_build.py.
[tool.hatch.build.hooks.custom]

[tool.hatch.build]
include = ["tvbo/**"]
# The generated datamodel is gitignored, so VCS-based file selection would drop it; `artifacts` force-includes the hook's output.
artifacts = [
    "tvbo/datamodel/schema.py",
    "tvbo/datamodel/pydantic.py",
    "tvbo/datamodel/tvbo_datamodel.schema.json",
    "tvbo/rules/study_layout.yaml",
]
exclude = [
    "tvbo/database/networks/*.h5",
    # Volumes only: the parcellation yamls beside them ship, carrying the terminology every node-label crosswalk resolves against.
    "tvbo/database/atlases/**/*.nii.gz",
    "tvbo/data/go-basic.obo",
    "tvbo/data/ontology/_tvb-o.owl",
    "tvbo/data/NeuroMMSig_abeta_subgraph.dill",
    "tvbo/data/tvb-go/**/*.png",
    "tvbo/**/__pycache__",
]

[tool.hatch.build.force-include]
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_desc-surf_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-Lobar8_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-Lobar8_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_rec-dTOR_atlas-Lobar8_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_rec-dTOR_atlas-Lobar8_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-DesikanKilliany_desc-SCFC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_rec-avgMatrix_atlas-DesikanKilliany_desc-SCFC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-HCPYA_rec-dTOR_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-HCPYA_rec-dTOR_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-MghUscHcp32_rec-MghUscHcp32_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-MghUscHcp32_rec-MghUscHcp32_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-PPMI85_rec-PPMI85_atlas-HCPMMP1_desc-SC_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009bAsym_cohort-PPMI85_rec-PPMI85_atlas-HCPMMP1_desc-SC_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-L_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-L_desc-surf_relmat.h5"
"tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-R_desc-surf_relmat.h5" = "tvbo/database/networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_atlas-Lobar8_hemi-R_desc-surf_relmat.h5"

[tool.hatch.version]
path = "tvbo/__init__.py"

[tool.hatch.envs.dev]
dependencies = [
    "ruff>=0.15.12",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",
    "mypy",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "pre-commit",
]

[tool.ruff]
line-length = 127
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "docs/.quarto",
    "docs/_site",
    "docs/**/.vdoc.*.py",
    "tvbo/datamodel/schema.py",
    "tvbo/datamodel/pydantic.py",
    "tvbo/datamodel/dialect_tables.py",
]

[tool.ruff.lint]
# C90 (mccabe complexity) is advisory and tracked separately; not gated.
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only the build-time artefacts are generated; the rest of the dir is hand-written.
exclude = [
    "tvbo/datamodel/schema.py",
    "tvbo/datamodel/pydantic.py",
    "tvbo/datamodel/dialect_tables.py",
]
# Idiomatic patterns that we accept across the codebase.
ignore = [
    "E501", # line-too-long: many docstrings narrate; black/format handles code.
    "E402", # module-import-not-at-top: needed by ontology bootstrap & similar.
    "D105", # magic methods: the contract is the protocol's, stated in the class docstring.
    "D107", # __init__: documented in the class docstring, so the rule is stated once.
    "B008", # call-in-default: `Field(...)`/`Parameter(...)` defaults are the datamodel idiom.
]

[tool.ruff.lint.per-file-ignores]
# Star imports are the documented owlready2 usage pattern.
"tvbo/ontology/owl.py" = ["F403", "F405"]
# Package re-exports via `from . import x` are intentional.
"**/__init__.py" = ["F401", "F405"]
# A test's name is its documentation; the same goes for build and dev scripts.
"tests/**" = ["D1"]
"scripts/**" = ["D1"]
"benchmarks/**" = ["D1"]
"docs/scripts/**" = ["D1"]
"schema/**" = ["D1"]

[tool.ruff.lint.isort]
# Declared, not inferred: ruff resolves first-party by path, and `tvbo/datamodel/` is generated, so on a checkout that has not been built `tvbo.datamodel.*` sorts as third-party while the rest of tvbo does not.
known-first-party = ["tvbo"]

[tool.ruff.lint.pydocstyle]
# Google style, so the NumPy-only D4xx rules do not fire.
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Black-compatible defaults.
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Non-blocking mode: report issues but don't fail builds yet.
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "tvbo/datamodel/schema.py",
    "tvbo/datamodel/pydantic.py",
    "tvbo/datamodel/dialect_tables.py",
    "tests/",
    ".venv/",
    "build/",
    "dist/",
    "docs/",
]
files = ["tvbo"]

[tool.pytest.ini_options]
addopts = "-n 1 --dist=loadscope"
filterwarnings = [
    # jax's welch clamps nperseg to the shrunk test signal and warns; module-scoped to survive a rewording.
    "ignore::UserWarning:jax._src.third_party.scipy.signal_helper",
    # tvbo's own multi-mode EXPERIMENTAL notice; anchors must match tvbo-tvboptim-experiment.py.mako (n_modes>1).
    "ignore:number_of_modes=.*EXPERIMENTAL:UserWarning",
]
markers = [
    "backend_core: core backend-agnostic simulation tests",
    "backend_jax: JAX backend tests",
    "backend_tvb: TVB backend tests",
    "backend_pyrates: PyRates backend tests",
    "backend_tvboptim: tvboptim backend tests",
    "backend_julia: Julia-backed simulation tests (class-level)",
    "backend_julia_diffeq: DifferentialEquations.jl backend tests",
    "backend_networkdynamics: NetworkDynamics.jl backend tests",
    "backend_mtk: ModelingToolkit.jl backend tests",
    "backend_neuroml: NeuroML/LEMS backend tests",
    "backend_brian2: Brian2 backend tests",
    "docs: mark test as documentation test (tests that execute .qmd notebooks)",
    "julia: mark test as requiring a Julia runtime via juliacall",
    "slow: long-running tests excluded by default (use --run-slow to include)",
]
