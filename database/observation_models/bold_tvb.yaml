# BOLD Observation Model (TVB Implementation)

name: BOLD_TVB
description: >-
    BOLD fMRI observation model using the Balloon-Windkessel hemodynamic
    model as implemented in The Virtual Brain (TVB). Transforms neural
    activity into simulated BOLD signal via hemodynamic convolution.

imaging_modality: BOLD

# Parameters (can be overridden per study)
parameters:
    TR:
        value: 720.0
        unit: ms
        description: Repetition time

pipeline:
    # Step 1: Temporal average at interim stock rate (mimics TVB's interim_stock averaging)
    # TVB averages over _interim_istep before storing in stock
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "jnp.mean(X.reshape(-1, stepsize, *X.shape[1:]), axis=1)"
      arguments:
          - name: stepsize
            value: 1
            description: "Interim averaging window (1 = no averaging, use raw dt=4ms)"
      apply_on_dimension: time

    # Step 2: Hemodynamic Response Function kernel at stock sample rate
    # TVB computes HRF at _stock_sample_rate = 0.25 Hz = 4ms period
    - name: HemodynamicResponseFunctionTVB
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          # TVB's Volterra kernel
          rhs: "1/3 * exp(-0.5*(t / tau_s)) * sin(sqrt(1/tau_f - 1/(4*tau_s**2)) * t) / sqrt(1/tau_f - 1/(4*tau_s**2))"
          parameters:
              tau_f:
                  value: 0.4
                  unit: s
              tau_s:
                  value: 0.8
                  unit: s
      arguments:
          - name: duration
            value: 20
            unit: s
            description: "HRF kernel duration (TVB default hrf_length=20s)"
          - name: stock_dt
            value: 0.004
            unit: s
            description: "Stock sample period = 4ms (1/_stock_sample_rate)"

    # Step 3: Convolve averaged signal with HRF (mimics TVB's matrix multiply)
    # TVB does: bold = dot(hrf, stock) where stock contains temporally averaged samples
    - name: fftconvolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          - name: in2
            value: hrf_kernel
            description: "HRF kernel reversed for convolution"
          - name: mode
            value: same

    # Step 4: Subsample to BOLD TR
    # TVB only returns samples at monitor period (TR)
    - name: subsample_to_TR
      input: fftconvolve
      output: bold_subsampled
      equation:
          rhs: "X[::stepsize]"
      arguments:
          - name: stepsize
            value: 180
            description: "TR / dt = 720ms / 4ms = 180"
      apply_on_dimension: time

    # Step 5: Apply Volterra nonlinear transformation
    # TVB: bold = (dot(hrf, stock) - 1.0) * k1_V0
    # where k1_V0 = k_1 * V_0 = 5.6 * 0.02 = 0.112
    - name: volterra_transform
      input: subsample_to_TR
      output: Bold
      equation:
          rhs: "(X - 1.0) * k_1 * V_0"
          parameters:
              k_1:
                  value: 5.6
                  description: "Intravascular signal contribution"
              V_0:
                  value: 0.02
                  description: "Resting blood volume fraction"
