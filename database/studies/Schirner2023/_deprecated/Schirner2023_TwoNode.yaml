# Two-Node Multiscale Model from Schirner et al. (Fast-Slow Dynamics)
# Based on: brain-network-models/2-node-model-Python/2-node-model.py
#
# Full multiscale model structure:
#   - Large-scale: 2 RWW nodes (PFC, PPC) with S_E, S_I each (6 state vars total)
#   - Small-scale: 4 MW populations (A1, B1, A2, B2) (4 state vars)
#   - Total: 6 state variables (S_E, S_I, S_A1, S_B1, S_A2, S_B2)
#   - Coupling: Normalized large-scale currents drive small-scale populations
#   - Task: Decision-making with sensory contrast inputs
#
# References:
#   - Deco et al., 2014, Journal of Neuroscience (RWW model)
#   - Murray et al., 2017, Journal of Neuroscience (MW functional circuit)
#   - Schirner et al., 2023, Nature Communications (EIB tuning)

id: 2
label: "two node multiscale model"
description: >-
    Full Schirner et al. two-node multiscale model with E/I balance.
    Combines large-scale RWW dynamics (PFC, PPC) with small-scale
    Murray-Wang functional circuit for decision-making.
    Implements LRE/FFI coupling modes for E/I ratio modulation.

# ============================================================================
# Local Dynamics: Modified ReducedWongWang with E/I Balance
# ============================================================================
dynamics:
    name: EIB_ReducedWongWang_TwoNode
    system_type: continuous
    description: >-
        Modified ReducedWongWang model (Deco et al., 2014) with separate
        long-range excitation (LRE) and feedforward inhibition (FFI) channels.

    parameters:
        # Excitatory population (Eq. 5 Deco2014)
        a_e:
            value: 310.0
            unit: "Hz/nA"
            description: "Excitatory gain parameter"
        b_e:
            value: 125.0
            unit: "Hz"
            description: "Excitatory input shift"
        d_e:
            value: 0.16
            unit: "s"
            description: "Excitatory rectification parameter"

        # Inhibitory population (Eq. 6 Deco2014)
        a_i:
            value: 615.0
            unit: "Hz/nA"
            description: "Inhibitory gain parameter"
        b_i:
            value: 177.0
            unit: "Hz"
            description: "Inhibitory input shift"
        d_i:
            value: 0.087
            unit: "s"
            description: "Inhibitory rectification parameter"

        # Time constants (Eq. 7-8 Deco2014)
        tau_e:
            value: 100.0
            unit: "ms"
            description: "Excitatory NMDA time constant"
        tau_i:
            value: 10.0
            unit: "ms"
            description: "Inhibitory time constant"

        # Synaptic gains
        gamma_e:
            value: 0.000641
            description: "Excitatory gamma (converted from 0.641/1000)"
        gamma_i:
            value: 0.001
            description: "Inhibitory gamma (converted from 1.0/1000)"

        # Local synaptic weights
        w_p:
            value: 1.4
            description: "Recurrent excitation weight"
        J_NMDA:
            value: 0.15
            unit: "nA"
            description: "NMDA synaptic gain"

        # FIC (Feedback Inhibition Control) parameters
        # Implements Inhibitory Synaptic Plasticity (Vogels et al.)
        eta:
            value: 0.5
            description: "FIC learning rate (matching EI_Tuning.qmd)"
        r0:
            value: 0.25
            description: "FIC target S_E activity level"
        t_fic_cutoff:
            value: 20000.0
            unit: "ms"
            description: "FIC tuning cutoff (matching standalone FIC_ts)"

        # External input
        W_E:
            value: 1.0
            description: "Excitatory external weight"
        W_I:
            value: 0.7
            description: "Inhibitory external weight"
        I_0:
            value: 0.382
            unit: "nA"
            description: "Background input current"

        # E/I Balance parameter (for splitting coupling into LRE/FFI)
        EI_ratio:
            value: 2.33
            description: "E/I ratio = LRE / FFI"
            reported_optimum: 2.33

        # Murray-Wang parameters (from Murray et al., 2017)
        # Module 1 (M1) synaptic weights
        J_same_M1:
            value: 0.3169
            unit: "nA"
            description: "Same-pool recurrent weight in Module 1"
        J_diff_M1:
            value: -0.0330
            unit: "nA"
            description: "Diff-pool inhibitory weight in Module 1"

        # Module 2 (M2) synaptic weights
        J_same_M2:
            value: 0.351
            unit: "nA"
            description: "Same-pool recurrent weight in Module 2"
        J_diff_M2:
            value: -0.0671
            unit: "nA"
            description: "Diff-pool inhibitory weight in Module 2"

        # Inter-module synaptic weights
        J_same_M2_to_M1:
            value: 0.02
            unit: "nA"
            description: "Same-pool weight from M2 to M1"
        J_diff_M2_to_M1:
            value: -0.02
            unit: "nA"
            description: "Diff-pool weight from M2 to M1"
        J_same_M1_to_M2:
            value: 0.075
            unit: "nA"
            description: "Same-pool weight from M1 to M2"
        J_diff_M1_to_M2:
            value: -0.075
            unit: "nA"
            description: "Diff-pool weight from M1 to M2"

        # Murray-Wang dynamics parameters (Eq. 1-4 Murray2017)
        tau_MW:
            value: 60.0
            unit: "ms"
            description: "NMDA time constant for MW populations"
        gamma_MW:
            value: 0.641
            description: "Rate of saturation of S for MW"
        a_MW:
            value: 270.0
            unit: "Hz/nA"
            description: "MW firing rate gain parameter"
        b_MW:
            value: 108.0
            unit: "Hz"
            description: "MW firing rate offset parameter"
        c_MW:
            value: 0.154
            unit: "s"
            description: "MW firing rate rectification parameter"
        I_0_MW:
            value: 0.334
            unit: "nA"
            description: "Background input for MW populations"

        # Noise parameters for MW
        tau_AMPA:
            value: 2.0
            unit: "ms"
            description: "AMPA noise time constant"
        sigma_noise:
            value: 0.009
            unit: "nA"
            description: "MW noise strength"
        MW_noise_SD:
            value: 0.007347
            unit: "nA"
            description: "Standard deviation of MW noise"

        # Normalization parameters for large-scale to small-scale coupling
        mean_norm:
            value: 0.3807
            unit: "nA"
            description: "Mean normalization (mean at E/I=2.33)"
        std_norm:
            value: 0.310494
            description: "Std normalization (MW_noise_SD / 0.02367)"

        # Decision-making task inputs
        contrast:
            value: 6.4
            unit: "%"
            description: "Stimulus contrast for decision task"
        I_app_base:
            value: 0.0118
            unit: "nA"
            description: "Base sensory input current"

    coupling_terms:
        cpop_0:
            description: "Coupling population 0 (for LRE computation)"
        cpop_1:
            description: "Coupling population 1 (for FFI computation)"

    derived_variables:
        # Split coupling into LRE and FFI based on EI_ratio
        c_lre:
            equation:
                rhs: "J_NMDA * cpop_0 * (EI_ratio / (EI_ratio + 1))"
            description: "Long-range excitation"

        c_ffi:
            equation:
                rhs: "J_NMDA * cpop_1 * (1 / (EI_ratio + 1))"
            description: "Feedforward inhibition"

        # Excitatory current (Eq. 3 Deco2014 modified)
        I_E:
            equation:
                rhs: "W_E * I_0 + w_p * J_NMDA * S_E + c_lre - J_i * S_I"
            description: "Total excitatory input current"

        # Inhibitory current (Eq. 4 Deco2014 modified)
        I_I:
            equation:
                rhs: "W_I * I_0 + J_NMDA * S_E - S_I + c_ffi"
            description: "Total inhibitory input current"

        # Firing rates
        r_E:
            equation:
                rhs: "(a_e * I_E - b_e) / (1.0 - exp(-d_e * (a_e * I_E - b_e)))"
            description: "Excitatory firing rate (Hz)"

        r_I:
            equation:
                rhs: "(a_i * I_I - b_i) / (1.0 - exp(-d_i * (a_i * I_I - b_i)))"
            description: "Inhibitory firing rate (Hz)"

        # Large-scale to small-scale coupling (normalized inputs)
        # TODO: These need to index specific nodes - currently simplified
        LSI_PFC:
            equation:
                rhs: "(I_E - mean_norm) * std_norm"
            description: "Normalized large-scale input from PFC (node 0)"

        LSI_PPC:
            equation:
                rhs: "(I_E - mean_norm) * std_norm"
            description: "Normalized large-scale input from PPC (node 1)"

        # Task inputs (Eq. 3 Murray2017)
        I_appA:
            equation:
                rhs: "I_app_base * (1 + contrast / 100)"
            description: "Sensory input to population A"

        I_appB:
            equation:
                rhs: "I_app_base * (1 - contrast / 100)"
            description: "Sensory input to population B"

        # TODO: Add noise terms for LSI_A1, LSI_B1, LSI_A2, LSI_B2
        # These combine LSI_PFC/PPC with MW_noise_SD

        # Murray-Wang input currents (Eq. 3 Murray2017)
        I_A1:
            equation:
                rhs: "J_same_M1 * S_A1 + J_diff_M1 * S_B1 + J_same_M2_to_M1 * S_A2 + J_diff_M2_to_M1 * S_B2 + I_0_MW + LSI_PFC + I_appA"
            description: "Total input current to A1"

        I_B1:
            equation:
                rhs: "J_diff_M1 * S_A1 + J_same_M1 * S_B1 + J_diff_M2_to_M1 * S_A2 + J_same_M2_to_M1 * S_B2 + I_0_MW + LSI_PFC + I_appB"
            description: "Total input current to B1"

        I_A2:
            equation:
                rhs: "J_same_M1_to_M2 * S_A1 + J_diff_M1_to_M2 * S_B1 + J_same_M2 * S_A2 + J_diff_M2 * S_B2 + I_0_MW + LSI_PPC"
            description: "Total input current to A2"

        I_B2:
            equation:
                rhs: "J_diff_M1_to_M2 * S_A1 + J_same_M1_to_M2 * S_B1 + J_diff_M2 * S_A2 + J_same_M2 * S_B2 + I_0_MW + LSI_PPC"
            description: "Total input current to B2"

        # Murray-Wang firing rates (Eq. 2 Murray2017)
        r_A1:
            equation:
                rhs: "(a_MW * I_A1 - b_MW) / (1.0 - exp(-c_MW * (a_MW * I_A1 - b_MW)))"
            description: "Firing rate of population A1"

        r_B1:
            equation:
                rhs: "(a_MW * I_B1 - b_MW) / (1.0 - exp(-c_MW * (a_MW * I_B1 - b_MW)))"
            description: "Firing rate of population B1"

        r_A2:
            equation:
                rhs: "(a_MW * I_A2 - b_MW) / (1.0 - exp(-c_MW * (a_MW * I_A2 - b_MW)))"
            description: "Firing rate of population A2"

        r_B2:
            equation:
                rhs: "(a_MW * I_B2 - b_MW) / (1.0 - exp(-c_MW * (a_MW * I_B2 - b_MW)))"
            description: "Firing rate of population B2"

        fic_on:
            conditional: true
            equation:
                rhs: Piecewise((1, t < t_fic_cutoff), (0, True))
            cases:
                - condition: t < t_fic_cutoff
                  equation:
                      rhs: 1
                - condition: "True"
                  equation:
                      rhs: 0

    state_variables:
        S_E:
            description: "Excitatory synaptic gating variable"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.001
            coupling_variable: true
            equation:
                rhs: "-S_E / tau_e + (1.0 - S_E) * gamma_e * r_E"
            noise:
                noise_type: "gaussian"
                parameters:
                    sigma:
                        value: 0.01
                        description: "Noise strength (sigma_e)"

        S_I:
            description: "Inhibitory synaptic gating variable"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.001
            equation:
                rhs: "-S_I / tau_i + gamma_i * r_I"
            noise:
                noise_type: "gaussian"
                parameters:
                    sigma:
                        value: 0.01
                        description: "Noise strength (sigma_i)"

        # Murray-Wang state variables (Eq. 1 Murray2017)
        S_A1:
            description: "Synaptic gating variable for population A1 (Module 1)"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.0
            equation:
                rhs: "(1 - fic_on) * (-S_A1 / tau_MW + gamma_MW * (1.0 - S_A1) * r_A1 / 1000.0)"

        S_B1:
            description: "Synaptic gating variable for population B1 (Module 1)"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.0
            equation:
                rhs: "(1 - fic_on) * (-S_B1 / tau_MW + gamma_MW * (1.0 - S_B1) * r_B1 / 1000.0)"

        S_A2:
            description: "Synaptic gating variable for population A2 (Module 2)"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.0
            equation:
                rhs: "(1 - fic_on) * (-S_A2 / tau_MW + gamma_MW * (1.0 - S_A2) * r_A2 / 1000.0)"

        S_B2:
            description: "Synaptic gating variable for population B2 (Module 2)"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.0
            equation:
                rhs: "(1 - fic_on) * (-S_B2 / tau_MW + gamma_MW * (1.0 - S_B2) * r_B2 / 1000.0)"

        # FIC: J_i as state variable (Inhibitory Synaptic Plasticity)
        J_i:
            description: "Inhibitory synaptic gain (tuned via FIC/ISP)"
            domain: { lo: 0.0, hi: 10.0 }
            boundaries: { lo: 0.0, hi: 10.0 }
            initial_value: 0.685
            equation:
                rhs: "fic_on * eta * (S_I * S_E - r0 * S_I)"

    output:
        # - S_E
        # - S_I
        - J_i
        - S_A1
        - r_A1
        - r_B1
        - r_A2
        - r_B2

# ============================================================================
# Coupling: Dual-Mode (LRE + FFI)
# ============================================================================
coupling:
    name: EIB_DualCoupling
    description: >-
        Dual coupling modes: Long-Range Excitation (LRE) and
        Feedforward Inhibition (FFI). This produces two coupling outputs
        (cpop_0 and cpop_1) that are used to compute LRE and FFI in the
        local dynamics. The splitting by EI_ratio is applied in derived_variables.

        NOTE: The full EIB implementation (as in EI_Tuning.qmd) uses separate
        wLRE and wFFI weight matrices that are tuned independently. This YAML
        represents a simplified version where both coupling terms receive the
        same structural connectivity-weighted input, which is then split by
        EI_ratio in the local dynamics.

    parameters:
        J_NMDA:
            value: 0.15
            unit: "nA"
            description: "NMDA synaptic gain for coupling"

        # Independent weight matrices for LRE and FFI pathways
        # These enable separate tuning of excitatory and inhibitory coupling
        wLRE:
            value: 1.0
            shape: "(N,N)"
            description: "Long-range excitation weight matrix (tunable)"
        wFFI:
            value: 1.0
            shape: "(N,N)"
            description: "Feedforward inhibition weight matrix (tunable)"

    incoming_states:
        - S_E

    # Pre-expression: extract S_E from incoming nodes (x_j)
    pre_expression:
        rhs: "S_E"
        label: "Extract S_E from connected nodes"

    # Post-expression: structural connectivity weights @ S_E
    # With 2 coupling_terms defined, template returns: jnp.stack([gx, gx], axis=0)
    # This creates cpop_0 and cpop_1, both receiving the same connectivity-weighted input
    post_expression:
        rhs: "gx"
        label: "Weighted coupling (stacked for cpop_0 and cpop_1)"

    delayed: false

# ============================================================================
# Network: Two Nodes with Bidirectional Connectivity
# ============================================================================
network:
    number_of_nodes: 2
    number_of_nodes: 2
    description: "Two-node network with symmetric coupling"

    # Node definitions
    nodes:
        - id: 0
          label: "Node_A"
          region: "PFC"
          description: "First node (e.g., Prefrontal Cortex)"

        - id: 1
          label: "Node_B"
          region: "PPC"
          description: "Second node (e.g., Posterior Parietal Cortex)"

    # Edge definitions (symmetric SC = [[0, 1], [1, 0]])
    edges:
        - source: 0
          target: 1
          label: "A->B"
          parameters:
              weight:
                  value: 1.0
                  description: "Connection strength from A to B"
              delay:
                  value: 0.0
                  unit: "ms"
                  description: "Transmission delay"

        - source: 1
          target: 0
          label: "B->A"
          parameters:
              weight:
                  value: 1.0
                  description: "Connection strength from B to A"
              delay:
                  value: 0.0
                  unit: "ms"
                  description: "Transmission delay"

    # Global parameters
    global_coupling_strength:
        name: "G"
        value: 1.0
        description: "Global coupling scaling (implicit in LRE/FFI)"

# ============================================================================
# Integration
# ============================================================================
integration:
    method: Euler
    step_size: 1.0
    duration: 25000
    unit: "ms"
    description: "FIC tuning: 20s, then 5s simulation (25s total)"
