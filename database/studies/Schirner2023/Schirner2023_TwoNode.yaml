# Two-Node Model from Schirner et al. (Fast-Slow Dynamics)
# Based on: brain-network-models/2-node-model-Python/2-node-model.py
# Implements EIB (Excitation-Inhibition Balance) modification of ReducedWongWang
# with long-range excitation (LRE) vs feedforward inhibition (FFI)

id: 2
label: "two node model"
description: >-
    Two-node EIB model demonstrating the effect of varying E/I ratios on
    functional connectivity and decision-making performance. Uses modified
    ReducedWongWang dynamics with LRE and FFI coupling modes.

# ============================================================================
# Local Dynamics: Modified ReducedWongWang with E/I Balance
# ============================================================================
local_dynamics:
    name: EIB_ReducedWongWang_TwoNode
    system_type: continuous
    description: >-
        Modified ReducedWongWang model (Deco et al., 2014) with separate
        long-range excitation (LRE) and feedforward inhibition (FFI) channels.

    parameters:
        # Excitatory population (Eq. 5 Deco2014)
        a_e:
            value: 310.0
            unit: "Hz/nA"
            description: "Excitatory gain parameter"
        b_e:
            value: 125.0
            unit: "Hz"
            description: "Excitatory input shift"
        d_e:
            value: 0.16
            unit: "s"
            description: "Excitatory rectification parameter"

        # Inhibitory population (Eq. 6 Deco2014)
        a_i:
            value: 615.0
            unit: "Hz/nA"
            description: "Inhibitory gain parameter"
        b_i:
            value: 177.0
            unit: "Hz"
            description: "Inhibitory input shift"
        d_i:
            value: 0.087
            unit: "s"
            description: "Inhibitory rectification parameter"

        # Time constants (Eq. 7-8 Deco2014)
        tau_e:
            value: 100.0
            unit: "ms"
            description: "Excitatory NMDA time constant"
        tau_i:
            value: 10.0
            unit: "ms"
            description: "Inhibitory time constant"

        # Synaptic gains
        gamma_e:
            value: 0.000641
            description: "Excitatory gamma (converted from 0.641/1000)"
        gamma_i:
            value: 0.001
            description: "Inhibitory gamma (converted from 1.0/1000)"

        # Local synaptic weights
        w_p:
            value: 1.4
            description: "Recurrent excitation weight"
        J_NMDA:
            value: 0.15
            unit: "nA"
            description: "NMDA synaptic gain"
        J_i:
            value: 0.685
            unit: "nA"
            description: "Inhibitory synaptic gain (tuned via FIC)"

        # External input
        W_E:
            value: 1.0
            description: "Excitatory external weight"
        W_I:
            value: 0.7
            description: "Inhibitory external weight"
        I_0:
            value: 0.382
            unit: "nA"
            description: "Background input current"

        # E/I Balance parameter (for splitting coupling into LRE/FFI)
        EI_ratio:
            value: 2.33
            description: "E/I ratio = LRE / FFI"
            reported_optimum: 2.33

    coupling_inputs:
        c_global:
            dimension: 1
            description: "Global coupling input (split into LRE/FFI based on EI_ratio)"

    derived_variables:
        # Split global coupling into LRE and FFI based on EI_ratio
        # LRE = EI_ratio / (EI_ratio + 1), FFI = 1 / (EI_ratio + 1)
        c_lre:
            equation:
                rhs: "c_global * (EI_ratio / (EI_ratio + 1))"
            description: "Long-range excitation component"

        c_ffi:
            equation:
                rhs: "c_global * (1 / (EI_ratio + 1))"
            description: "Feedforward inhibition component"

        # Excitatory current (Eq. 3 Deco2014 modified)
        I_E:
            equation:
                rhs: "W_E * I_0 + w_p * J_NMDA * S_E + c_lre - J_i * S_I"
            description: "Total excitatory input current"

        # Inhibitory current (Eq. 4 Deco2014 modified)
        I_I:
            equation:
                rhs: "W_I * I_0 + J_NMDA * S_E - S_I + c_ffi"
            description: "Total inhibitory input current"

        # Firing rates
        r_E:
            equation:
                rhs: "(a_e * I_E - b_e) / (1.0 - exp(-d_e * (a_e * I_E - b_e)))"
            description: "Excitatory firing rate (Hz)"

        r_I:
            equation:
                rhs: "(a_i * I_I - b_i) / (1.0 - exp(-d_i * (a_i * I_I - b_i)))"
            description: "Inhibitory firing rate (Hz)"

    # Dynamics (Eq. 7-8 Deco2014)
    state_variables:
        S_E:
            description: "Excitatory synaptic gating variable"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.001
            coupling_variable: true
            equation:
                rhs: "-S_E / tau_e + (1.0 - S_E) * gamma_e * r_E"
            noise:
                noise_type: "gaussian"
                parameters:
                    sigma:
                        value: 0.01
                        description: "Noise strength (sigma_e)"

        S_I:
            description: "Inhibitory synaptic gating variable"
            domain: { lo: 0.0, hi: 1.0 }
            boundaries: { lo: 0.0, hi: 1.0 }
            initial_value: 0.001
            equation:
                rhs: "-S_I / tau_i + gamma_i * r_I"
            noise:
                noise_type: "gaussian"
                parameters:
                    sigma:
                        value: 0.01
                        description: "Noise strength (sigma_i)"


# ============================================================================
# Coupling: Dual-Mode (LRE + FFI)
# ============================================================================
coupling:
    name: EIB_DualCoupling
    description: >-
        Dual coupling modes: Long-Range Excitation (LRE) and
        Feedforward Inhibition (FFI). Ratio LRE/FFI determines E/I balance.
        LRE and FFI are computed from EI_ratio such that LRE + FFI = 1.

    parameters:
        J_NMDA:
            value: 0.15
            unit: "nA"
            description: "NMDA synaptic gain for coupling"

    incoming_states:
        - S_E

    # Pre-expression: extract S_E from incoming nodes (x_j)
    pre_expression:
        rhs: "S_E"
        label: "Extract S_E from connected nodes"

    # Post-expression: J_NMDA * (weights @ S_E)
    # This replicates: J_NMDA * np.dot(SC, S_E) from 2-node-model.py lines 169, 181
    # gx is already the result of weights @ pre, so we just scale by J_NMDA
    # LRE/FFI split happens in local_dynamics derived_variables using EI_ratio
    post_expression:
        rhs: "J_NMDA * gx"
        label: "Global coupling scaled by J_NMDA"

    delayed: false

# ============================================================================
# Network: Two Nodes with Bidirectional Connectivity
# ============================================================================
network:
    number_of_nodes: 2
    number_of_regions: 2
    description: "Two-node network with symmetric coupling"

    # Node definitions
    nodes:
        - id: 0
          label: "Node_A"
          region: "PFC"
          description: "First node (e.g., Prefrontal Cortex)"

        - id: 1
          label: "Node_B"
          region: "PPC"
          description: "Second node (e.g., Posterior Parietal Cortex)"

    # Edge definitions (symmetric SC = [[0, 1], [1, 0]])
    edges:
        - source: 0
          target: 1
          label: "A->B"
          parameters:
              weight:
                  value: 1.0
                  description: "Connection strength from A to B"
              delay:
                  value: 0.0
                  unit: "ms"
                  description: "Transmission delay"

        - source: 1
          target: 0
          label: "B->A"
          parameters:
              weight:
                  value: 1.0
                  description: "Connection strength from B to A"
              delay:
                  value: 0.0
                  unit: "ms"
                  description: "Transmission delay"

    # Global parameters
    global_coupling_strength:
        name: "G"
        value: 1.0
        description: "Global coupling scaling (implicit in LRE/FFI)"

# ============================================================================
# Integration
# ============================================================================
integration:
    method: Euler
    step_size: 1.0
    duration: 25000
    unit: "ms"
    description: "FIC tuning: 20s, then 5s simulation (25s total)"

# ============================================================================
# Observations
# ============================================================================
observations:
    # BOLD signal using simplified HRF convolution
    Bold:
        name: Bold
        label: BOLD_Simplified
        description: >-
            BOLD observation via HRF convolution. Simplified from bold_tvb.yaml
            for two-node model. Uses downsample → convolve → subsample pipeline.
        source: S_E
        imaging_modality: BOLD
        period: 1000.0  # 1 Hz sampling (1s TR)

        parameters:
            TR:
                value: 1000.0
                unit: ms
                description: "Repetition time (1 Hz sampling)"

        pipeline:
            # Step 1: Downsample from 1ms (dt) to 5ms (200 Hz)
            - name: downsample_to_200Hz
              output: downsampled
              callable:
                  module: scipy.signal
                  name: decimate
              arguments:
                  - name: q
                    value: 5
                    description: "Decimation factor (1000Hz → 200Hz)"
              apply_on_dimension: time

            # Step 2: HRF kernel (simplified exponential-sinusoidal)
            - name: HRF_kernel
              output: hrf
              equation:
                  rhs: "(1/3) * exp(-0.5 * t / tau_s) * sin(sqrt(1/tau_f - 1/(4*tau_s**2)) * t) / sqrt(1/tau_f - 1/(4*tau_s**2))"
                  parameters:
                      tau_f:
                          value: 0.4
                          unit: s
                      tau_s:
                          value: 0.8
                          unit: s
              time_range:
                  lo: 0
                  hi: 20
                  step: 0.005
              description: "Hemodynamic response function (20s duration at 200Hz)"

            # Step 3: Convolve with HRF (mode='valid' to avoid edge artifacts)
            - name: convolve_hrf
              input: downsampled
              output: convolved
              callable:
                  module: scipy.signal
                  name: fftconvolve
              arguments:
                  - name: in2
                    value: hrf
                  - name: mode
                    value: valid

            # Step 4: Subsample to 1 Hz (TR = 1s = 200 samples at 200Hz)
            - name: subsample_to_1Hz
              input: convolved
              output: Bold
              equation:
                  rhs: "X[::200]"
              arguments:
                  - name: stepsize
                    value: 200
                    description: "Subsample every 200 samples (200Hz → 1Hz)"
              apply_on_dimension: time

    # Functional Connectivity from BOLD
    FC:
        name: FC
        label: FunctionalConnectivity
        description: "Pearson correlation of BOLD signals"
        source_observation: Bold
        aggregation: mean

        pipeline:
            - name: pearson_correlation
              input: Bold
              output: FC
              callable:
                  module: numpy
                  name: corrcoef
              apply_on_dimension: region

# ============================================================================
# Model Fitting / Tuning
# ============================================================================
tuning_algorithms:
    # Feedback Inhibition Control (FIC)
    FIC:
        type: fic
        description: >-
            Feedback Inhibition Control: adjusts J_i to maintain target
            excitatory firing rate (local E-I balance).

        objective:
            type: activity_target
            target_variable: r_E
            target_value: 4.0
            description: "Maintain 4 Hz excitatory firing rate"

        update_rules:
            - name: FIC_update
              target_parameter:
                  name: J_i
              equation:
                  rhs: "J_i + eta * (r_E - r_target)"
              description: "Hebbian-like plasticity rule for inhibition"

        hyperparameters:
            - name: eta
              value: 0.0001
              description: "FIC learning rate"
            - name: r_target
              value: 4.0
              unit: "Hz"
              description: "Target firing rate"

        learning_rate: 0.0001
        n_iterations: 20
        simulation_period: 1000.0

    # E/I Balance (EIB) Tuning
    EIB:
        type: eib
        description: >-
            Tunes EI_ratio (LRE/FFI balance) to match empirical FC.

        objective:
            type: fc_matching
            target_data: FC
            metric:
                rhs: "correlation(simulated_FC, empirical_FC)"
            description: "Match functional connectivity"

        update_rules:
            - name: EIB_grid_search
              target_parameter:
                  name: EI_ratio
              equation:
                  rhs: "grid_search(EI_ratio_values)"
              description: "Grid search over E/I ratios"

        hyperparameters:
            - name: EI_ratio_values
              value: [0.01, 0.12, 0.25, 0.5, 1.0, 2.33, 5.0, 10.0, 100.0]
              description: "Grid of E/I ratios to test"

        n_iterations: 10
        simulation_period: 5000.0

# ============================================================================
# Environment
# ============================================================================
environment:
    name: tvbo-jax-env
    environment_type: conda
    description: "JAX-based environment for TVB-O simulations"
    requirements:
        - name: numpy
          role: runtime
        - name: scipy
          role: runtime
        - name: jax
          role: engine
