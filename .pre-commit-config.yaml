# Install once with `pre-commit install`; run manually with `pre-commit run --all-files`.

repos:
  - repo: local
    hooks:
      - id: database-validation
        name: Validate tvbo/database/*.yaml against LinkML schema
        entry: pytest tests/test_database_validation.py -q --no-header
        language: system
        pass_filenames: false
        files: '^(tvbo/database/.*\.ya?ml|schema/tvbo_datamodel\.yaml|tests/test_database_validation\.py)$'
        stages: [pre-commit]

      - id: no-stacked-comments
        name: No stacked '#' comment blocks in added lines
        entry: python3 scripts/check_comment_blocks.py
        language: system
        pass_filenames: false
        files: '\.(py|mako|ya?ml|toml|jl|sh)$'
        stages: [pre-commit]
