# Install once with `pre-commit install`; run over everything with `pre-commit run --all-files`.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --force-exclude
        language: system
        types: [python]
        require_serial: false

      - id: ruff-format
        name: ruff (format)
        entry: ruff format --force-exclude
        language: system
        types: [python]

      - id: check-prose
        name: Comment and docstring prose (no formatter fixes these)
        entry: python scripts/check_prose.py
        language: system
        types: [python]

      - id: database-validation
        name: Validate tvbo/database/*.yaml against LinkML schema
        entry: pytest tests/test_database_validation.py -q --no-header
        language: system
        pass_filenames: false
        files: '^(tvbo/database/.*\.ya?ml|schema/tvbo_datamodel\.yaml|tests/test_database_validation\.py)$'
        stages: [pre-commit]
