# Pre-commit hooks for TVBO.
#
# Closes plan.md row 1 / §11.1 item 2: every commit that touches a YAML file in
# `tvbo/database/` (or the LinkML schema) re-runs `tests/test_database_validation.py`
# to catch schema-violating database entries before they land. Mirrors the
# `database-validation` job in `.github/workflows/ci.yml` so local commits and
# CI agree.
#
# Install once with: `pre-commit install`
# Run manually with: `pre-commit run --all-files`

repos:
  - repo: local
    hooks:
      - id: database-validation
        name: Validate tvbo/database/*.yaml against LinkML schema
        entry: pytest tests/test_database_validation.py -q --no-header
        language: system
        pass_filenames: false
        files: '^(tvbo/database/.*\.ya?ml|schema/tvbo_datamodel\.yaml|tests/test_database_validation\.py)$'
        stages: [pre-commit]
