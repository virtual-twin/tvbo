# Install both stages once:
#     pre-commit install --hook-type pre-commit --hook-type pre-push
# Run manually with `pre-commit run --all-files` or `--hook-stage pre-push`.
# Sub-second checks run at pre-commit, test-shaped ones at pre-push; ruff format and its full lint are absent because both still fail on the tree.

repos:
  - repo: local
    hooks:
      - id: ruff-syntax
        name: Ruff — syntax errors (the subset CI blocks on)
        entry: ruff check --select=E9,F63,F7,F82 --force-exclude
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: no-stacked-comments
        name: No stacked '#' comment blocks in added lines
        entry: python3 scripts/check_comment_blocks.py
        language: system
        pass_filenames: false
        files: '\.(py|mako|ya?ml|toml|jl|sh)$'
        stages: [pre-commit]

      - id: database-validation
        name: Validate tvbo/database/*.yaml against LinkML schema
        entry: pytest tests/test_database_validation.py -q --no-header
        language: system
        pass_filenames: false
        files: '^(tvbo/database/.*\.ya?ml|schema/tvbo_datamodel\.yaml|tests/test_database_validation\.py)$'
        stages: [pre-commit]

      - id: style-contracts
        name: Style contracts — generated code, and the comment convention
        entry: pytest tests/test_codegen_style_contract.py tests/test_comment_style.py -q --no-header -p no:randomly
        language: system
        pass_filenames: false
        stages: [pre-push]

      # A folded alias read as an attribute returns its default forever, and silently.
      - id: no-folded-alias-reads
        name: No source reads a slot alias the dialect folds away
        entry: pytest tests/test_no_folded_alias_reads.py -q --no-header -p no:randomly
        language: system
        pass_filenames: false
        stages: [pre-push]
