# Idioms that are not slots: a regular expression over the raw recipe text.
idioms:
  "!include":                    Specification/YAML.qmd
  "^\\s*<<:\\s*\\*":             Specification/YAML.qmd
  "reduce:\\s*streaming":        Simulation/ObservationModels.qmd
  "reconcile:\\s*by_label":      Specification/FanOut.qmd
  "interpolate_delays:\\s*true": Models/Integrators.qmd
