# The documentation spine, declared once. `part` must match the PART header in `_toc.yml`, and `dirs` the directories that part's pages live in — `scripts/build_phase_map.py` reports any page filed outside them. A `color` names a slot in the palette TVB-O ships (`tvbo/database/themes/default.yaml`) — `palette.N` for a categorical hue, counting from zero, or a role such as `base` — never a hex, so the docs and the figures beside them cannot drift apart. See docs/Developer/DocsMachinery.qmd.

# The six numbered phases share one sidebar heading, so the spine reads as a single chapter beside the unnumbered ones rather than as a continuation of the one above it.
spine:
  part: "SIMULATION EXPERIMENTS WITH TVB-O"

# Each phase is one stage of the Simulation Study Lifecycle, keyed by stage: its number, name, colour and icon come from `tvbo/plot/lifecycle.yaml`, the table the lifecycle wheel is drawn from, so the sidebar and the wheel cannot disagree.
phases:
  explore:  {part: "EXPLORE",  dirs: [1-explore]}
  specify:  {part: "SPECIFY",  dirs: [2-specify, Interoperability]}
  generate: {part: "GENERATE", dirs: [3-generate, Interoperability]}
  run:      {part: "RUN",      dirs: [4-run]}
  report:   {part: "REPORT",   dirs: [5-report]}
  share:    {part: "SHARE",    dirs: [6-share, Interoperability]}
# Chapters are the unnumbered half of the sidebar: places you go when you need them rather than steps you walk. Their headings are plain labels, while each phase wears its stage's colour and icon in the sidebar, which is what keeps the spine visually distinct.
chapters:
  - {key: start,    name: "Get Started",          part: "GET STARTED",          icon: "fa-solid fa-rocket",       color: base, dirs: ["", 0-SimulationStudyLifecycle]}
  - {key: examples, name: "Examples & Use-Cases", part: "EXAMPLES & USE-CASES", icon: "fa-solid fa-flask-vial",   color: base, dirs: [examples, Replication]}
  - {key: agents,   name: "Agentic Coding",       part: "AGENTIC CODING",       icon: "fa-solid fa-robot",        color: base, dirs: [agents]}
  - {key: interop,  name: "Interoperability",     part: "INTEROPERABILITY",     icon: "fa-solid fa-plug",         color: base, dirs: [Interoperability]}
  - {key: reference,name: "Reference",            part: "REFERENCE",            icon: "fa-solid fa-book",         color: base, dirs: ["", CLI, api, datamodel]}
  - {key: developer,name: "Developer",            part: "DEVELOPER",            icon: "fa-solid fa-code-branch",  color: base, dirs: [Developer, agents]}
