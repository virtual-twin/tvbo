project:
  type: website
  pre-render:
    - bash scripts/prerender.sh
  render:
    - index.qmd
    - GettingStarted.qmd
    - installation.md
    - reference.qmd
    - 1-explore/**/*.qmd
    - 2-specify/**/*.qmd
    - 3-generate/**/*.qmd
    - 4-run/*.qmd
    - 5-share/*.qmd
    - api/**/*.qmd
    - datamodel/*.qmd
    - datamodel/**/*.qmd
    - CLI/*.qmd
    - examples/**/*.qmd
    - Interoperability/**/*.qmd
    - Interoperability/**/*.md
    - Interoperability/*.qmd
    - Replication/*.qmd
    - Replication/**/*.qmd
    - Developer/*.md
    - Developer/*.qmd
    - agents/*.qmd
    - "!_archive/**"
    - "!1-explore/ontology/spec/**"
  resources:
    - 1-explore/ontology/spec/**
  output-dir: _site

# Sidebar configuration lives in _toc.yml (single unified sidebar).
metadata-files:
    - _toc.yml

# phase-badge stamps the spine phase; usecase-tags lists the published studies whose recipes exercise the page. Both read generated maps under _static/.
filters:
    - filters/phase-badge.lua
    - filters/cards.lua
    - filters/running-example.lua
    - filters/usecase-tags.lua

website:
    title: "TVB-O Documentation"
    favicon: "_static/tvbo_python_square.svg"
    image: "_static/tvbo_python_square.svg"

    repo-url: https://github.com/virtual-twin/tvbo
    issue-url: https://github.com/virtual-twin/tvbo/issues/new/choose
    repo-actions: [edit, issue]
    page-navigation: true

    navbar:
        logo: _static/tvbo_favicon.png
        logo-alt: "TVB-O logo"

        # Destinations you jump to, not the reading order. The five numbered phases are the sidebar's job and the per-page badge's; repeating them here would say the same thing three times.
        left:
            - href: index.qmd
              text: Home
            - text: "Get Started"
              href: GettingStarted.qmd
            - text: "Examples"
              href: examples/index.qmd
            - text: "Reference"
              href: reference.qmd
            - text: "Platform"
              href: 1-explore/platform.qmd

        tools:
            - icon: github
              href: https://github.com/virtual-twin/tvbo
              text: tvbo GitHub

    sidebar: []  # merged from _toc.yml and api/_sidebar.yml

    page-footer:
        center: |
            © Charité - Universitätsmedizin Berlin
        right:
            - icon: twitter
              href: https://twitter.com/quarto_pub
              aria-label: Quarto Twitter
            - icon: github
              href: https://github.com/quarto-dev/quarto-cli
              aria-label: Quarto GitHub

format:
    html:
        theme: cosmo
        css:
            - _static/palette.css
            - _static/phases.css
            - styles.css
        toc: true
        code-copy: true
        code-overflow: wrap
        code-fold: false
        # include-after-body: js.html
        include-in-header:
            - text: |
                  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
                  <script src="//unpkg.com/3d-force-graph"></script>
                  <script src="/_static/tvbo-icons.js"></script>
        grid:
          sidebar-width: 250px
          body-width: 900px
          margin-width: 300px
        out-width: "100%"

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/ieee.csl

fig-align: center

# Kernel name only; its argv is a bare `python`, so PATH decides which interpreter runs the cells.
jupyter: python3

# `freeze: auto` re-executes only on source change; commit _freeze/ to share the cache.
execute:
    enabled: true
    cache: true
    freeze: auto

markdown:
    extensions: [myst]
    myst:
        enable_extensions:
            [
                "dollarmath",
                "amsmath",
                "deflist",
                "html_admonition",
                "html_image",
                "colon_fence",
            ]
