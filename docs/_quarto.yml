project:
  type: website
  pre-render:
    - bash scripts/prerender.sh
  render:
    - index.qmd
    - installation.md
    - reference.qmd
    - platform.qmd
    - api/**/*.qmd
    - datamodel/**/*.qmd
    - Usage/*.qmd
    - Specification/*.qmd
    - Interoperability/**/*.qmd
    - Developer/*.md
    - "!_archive/*"
  output-dir: _site

# Sidebar configuration lives in _toc.yml (single unified sidebar).
metadata-files:
    - _toc.yml

website:
    title: "TVB-O Documentation"
    favicon: "_static/tvbo_python_square.svg"
    image: "_static/tvbo_python_square.svg"

    repo-url: https://github.com/TVB-Ontology/tvbo-python
    issue-url: https://github.com/TVB-Ontology/tvbo-python/new/choose
    repo-actions: [edit, issue]
    page-navigation: true

    navbar:
        logo: _static/tvbo_favicon.png
        logo-alt: "TVB-O logo"

        left:
            - href: index.qmd
              text: Home
            - text: "Usage"
              menu:
                - text: "Overview"
                  href: Usage/index.qmd
                - text: "---"
                - text: "Defining Dynamical Systems"
                  href: Usage/DefineDynamicalSystem.qmd
                - text: "Simulation Experiments"
                  href: Usage/SimulationExperiments.qmd
                - text: "Code Generation"
                  href: Usage/CodeGeneration.qmd
                - text: "---"
                - text: "Observation & Analysis"
                - text: "Observation Models"
                  href: Usage/ObservationModels.qmd
                - text: "Parameter Exploration"
                  href: Usage/ParameterExploration.qmd
                - text: "Model Fitting"
                  href: Usage/ModelFitting.qmd
                - text: "Bifurcation Analysis"
                  href: Usage/BifurcationAnalysis.qmd
                - text: "---"
                - text: "Simulation Features"
                - text: "Events & Stimulation"
                  href: Usage/Events.qmd
                - text: "Noise & Stochastic Integration"
                  href: Usage/Noise.qmd
                - text: "---"
                - text: "Advanced"
                - text: "PDE Simulation"
                  href: Usage/PDESimulation.qmd
                - text: "Heterogeneous Nodes"
                  href: Usage/HeterogeneousNodes.qmd
                - text: "Heterogeneous Edges"
                  href: Usage/HeterogeneousEdges.qmd
                - text: "Unit-Aware Computations"
                  href: Usage/UnitValidation.qmd
                - text: "---"
                - text: "Specification"
                - text: "Networks"
                  href: Specification/Network.qmd
                - text: "Algorithms"
                  href: Specification/Algorithms.qmd
                - text: "Loss Functions"
                  href: Specification/LossFunction.qmd
                - text: "Output"
                  href: Specification/Output.qmd
                - text: "---"
                - text: "Interoperability"
                  href: Interoperability/index.qmd
            - text: "Data Model"
              href: datamodel/index.qmd
            - text: "Platform"
              href: platform.qmd

        tools:
            - icon: github
              href: https://github.com/leon-k-martin/tvbo
              text: tvbo GitHub

    sidebar: []  # merged from _toc.yml and api/_sidebar.yml

    page-footer:
        center: |
            © 2025 Charité - Universitätsmedizin Berlin
        right:
            - icon: twitter
              href: https://twitter.com/quarto_pub
              aria-label: Quarto Twitter
            - icon: github
              href: https://github.com/quarto-dev/quarto-cli
              aria-label: Quarto GitHub

format:
    html:
        theme: cosmo
        css: styles.css
        toc: true
        code-copy: true
        code-overflow: wrap
        code-fold: false
        # include-after-body: js.html
        include-in-header:
            - text: |
                  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
                  <script src="//unpkg.com/3d-force-graph"></script>
                  <script src="/_static/tvbo-icons.js"></script>
        grid:
          sidebar-width: 250px
          body-width: 900px
          margin-width: 300px
        out-width: "100%"

fig-align: center

# Cache notebook execution results. 'auto' only re-executes when source changes.
# Cached results stored in _freeze/ — commit this directory to share across machines.
execute:
    enabled: true
    cache: true
    freeze: auto

markdown:
    extensions: [myst]
    myst:
        enable_extensions:
            [
                "dollarmath",
                "amsmath",
                "deflist",
                "html_admonition",
                "html_image",
                "colon_fence",
            ]
