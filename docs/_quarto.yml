project:
  type: website
  pre-render:
    - bash scripts/prerender.sh
  render:
    - index.qmd
    - installation.md
    - reference.qmd
    - platform.qmd
    - api/**/*.qmd
    - datamodel/*.qmd
    - datamodel/**/*.qmd
    - Models/*.qmd
    - Simulation/*.qmd
    # index.qmd dissolved into SPECIFY/RUN IT; Simulation/SimulationExperiments.qmd owns its old URL via `aliases:`, so the stub is excluded here.
    - "!Simulation/index.qmd"
    - ScaleOut/*.qmd
    - Bifurcation/*.qmd
    - Networks/*.qmd
    - BeyondMeanField/*.qmd
    - Fitting/*.qmd
    - CLI/*.qmd
    # backends.qmd moved to Simulation/Backends.qmd, whose `aliases:` owns its old URL, so the stub is excluded here to avoid a duplicate path.
    - "!CLI/backends.qmd"
    - examples/**/*.qmd
    - Specification/*.qmd
    - Interoperability/**/*.qmd
    - Interoperability/*.qmd
    - Replication/*.qmd
    - Replication/**/*.qmd
    - Developer/*.md
    - ontology/*.qmd
    - agents/*.qmd
    - "!_archive/*"
    - "!ontology/spec/**"
  resources:
    - ontology/spec/**
  output-dir: _site

# Sidebar configuration lives in _toc.yml (single unified sidebar).
metadata-files:
    - _toc.yml

website:
    title: "TVB-O Documentation"
    favicon: "_static/tvbo_python_square.svg"
    image: "_static/tvbo_python_square.svg"

    repo-url: https://github.com/TVB-Ontology/tvbo-python
    issue-url: https://github.com/TVB-Ontology/tvbo-python/new/choose
    repo-actions: [edit, issue]
    page-navigation: true

    navbar:
        logo: _static/tvbo_favicon.png
        logo-alt: "TVB-O logo"

        # Mirrors the sidebar PARTS in _toc.yml: each item is the representative landing for one part, so navbar and sidebar tell the same story.
        left:
            - href: index.qmd
              text: Home
            - text: "Get Started"
              href: GettingStarted.qmd
            - text: "Specify an Experiment"
              href: Simulation/SimulationExperiments.qmd
            - text: "Run on a Backend"
              href: Simulation/Backends.qmd
            - text: "Analyze"
              href: Bifurcation/index.qmd
            - text: "Extend"
              href: Interoperability/index.qmd
            - text: "Reference"
              href: reference.qmd
            - text: "Platform"
              href: platform.qmd

        tools:
            - icon: github
              href: https://github.com/leon-k-martin/tvbo
              text: tvbo GitHub

    sidebar: []  # merged from _toc.yml and api/_sidebar.yml

    page-footer:
        center: |
            © Charité - Universitätsmedizin Berlin
        right:
            - icon: twitter
              href: https://twitter.com/quarto_pub
              aria-label: Quarto Twitter
            - icon: github
              href: https://github.com/quarto-dev/quarto-cli
              aria-label: Quarto GitHub

format:
    html:
        theme: cosmo
        css: styles.css
        toc: true
        code-copy: true
        code-overflow: wrap
        code-fold: false
        # include-after-body: js.html
        include-in-header:
            - text: |
                  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
                  <script src="//unpkg.com/3d-force-graph"></script>
                  <script src="/_static/tvbo-icons.js"></script>
        grid:
          sidebar-width: 250px
          body-width: 900px
          margin-width: 300px
        out-width: "100%"

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/ieee.csl

fig-align: center

# Kernel name only; its argv is a bare `python`, so PATH decides which interpreter runs the cells.
jupyter: python3

# `freeze: auto` re-executes only on source change; commit _freeze/ to share the cache.
execute:
    enabled: true
    cache: true
    freeze: auto

markdown:
    extensions: [myst]
    myst:
        enable_extensions:
            [
                "dollarmath",
                "amsmath",
                "deflist",
                "html_admonition",
                "html_image",
                "colon_fence",
            ]
