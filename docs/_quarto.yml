project:
  type: website
  pre-render:
    - python scripts/tvbo_package_struct.py
    - python -m quartodoc build --config api/_quartodoc_config.yml
    - python scripts/generate_datamodel_docs.py
    # - python scripts/generate_yaml_examples.py
    - python scripts/fix_mermaid_blocks.py
    - python scripts/tvbo_package_struct.py --post
  post-render:
    - python scripts/generate_browser.py
  render:
    - index.qmd
    - installation.md
    - browser.qmd
    - api/**/*.qmd
    - datamodel/**/*.qmd
    - Usage/*.qmd
    - Specification/*.qmd
    - Interoperability/**/*.qmd
    - Developer/*.md
    - "!_archive/*"
  output-dir: _site

# Sidebar configuration is split into separate files for maintainability.
# _toc.yml: all sidebar/TOC definitions
# api/_sidebar.yml: auto-generated by quartodoc
metadata-files:
    - _toc.yml
    - api/_sidebar.yml

website:
    title: "TVB-O Documentation"
    favicon: "_static/tvbo_python_square.svg"
    image: "_static/tvbo_python_square.svg"

    repo-url: https://github.com/TVB-Ontology/tvbo-python
    issue-url: https://github.com/TVB-Ontology/tvbo-python/new/choose
    repo-actions: [edit, issue]
    page-navigation: true

    navbar:
        logo: _static/tvbo_python_square.svg
        logo-altg: "tvbo-python logo"

        left:
            - href: index.qmd
              text: Home
            - href: installation.md
              text: Installation
            - text: "Usage"
              href: Usage/index.qmd

            - text: "API Documentation"
              href: api/index.qmd
            - text: "Data Model"
              href: datamodel/index.qmd
            - text: "Knowledge Browser"
              href: browser.qmd
            - text: "Interoperability"
              href: Interoperability/index.qmd
            - text: "Developer"
              href: Developer/contributing.md

        tools:
            - icon: github
              href: https://github.com/leon-k-martin/tvbo
              text: tvbo GitHub

    sidebar: []  # defined in _toc.yml

    page-footer:
        center: |
            © 2025 Charité - Universitätsmedizin Berlin
        right:
            - icon: twitter
              href: https://twitter.com/quarto_pub
              aria-label: Quarto Twitter
            - icon: github
              href: https://github.com/quarto-dev/quarto-cli
              aria-label: Quarto GitHub

format:
    html:
        theme: cosmo
        css: styles.css
        toc: true
        code-copy: true
        code-overflow: wrap
        code-fold: false
        # include-after-body: js.html
        include-in-header:
            - text: |
                  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
                  <script src="//unpkg.com/3d-force-graph"></script>
                  <script src="/_static/tvbo-icons.js"></script>
        grid:
          sidebar-width: 250px
          body-width: 900px
          margin-width: 300px
        out-width: "100%"

fig-align: center

# Cache notebook execution results. 'auto' only re-executes when source changes.
# Cached results stored in _freeze/ — commit this directory to share across machines.
execute:
    enabled: true
    cache: true
    freeze: auto

markdown:
    extensions: [myst]
    myst:
        enable_extensions:
            [
                "dollarmath",
                "amsmath",
                "deflist",
                "html_admonition",
                "html_image",
                "colon_fence",
            ]
