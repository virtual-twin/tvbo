%YAML 1.2
---
# PyRates Experiment Template
# Generated from TVBO Dynamics
# This file is self-contained and ready for PyRates simulation.

# OPERATORS (Model Dynamics)

QIF_op:
  base: OperatorTemplate
  description: "TVBO model: QIF"
  equations:
    - "r' = Delta/(pi*tau) + 2*r*v"
    - "v' = J*r*tau + eta - pi**2*r**2*tau**2 + v**2"
  variables:
    r: variable(0.1)
    v: variable(-2.0)
    tau: 1.0
    eta: -5.0
    J: 15.0
    Delta: 1.0

# NODES (Network Topology)


QIF:
  base: NodeTemplate
  operators:
    - QIF_op

# CIRCUIT (Complete Network)

QIF_circuit:
  base: CircuitTemplate
  nodes:
    p: QIF
