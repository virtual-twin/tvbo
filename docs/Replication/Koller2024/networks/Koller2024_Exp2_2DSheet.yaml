label: 30x30 mock 2D sheet (Koller2024 exp 2)
description: 30x30 mock cortical sheet on a 140x140 mm grid. Edges follow Koller2024
  distance-dependent kernel exp(-d/sigma)/(2*sigma), sigma=10 mm, with weight modulated
  by the node in-strength gradient (sink minus source Gaussian). Topology stored as
  dense weight + length matrices in companion HDF5.
