# =============================================================================
# Koller2024 - SimulationStudy specification (hand-written, self-contained)
# =============================================================================
# Source : Koller, Schirner, Ritter (2024)
#          "Human connectome topology directs cortical traveling waves and
#           shapes frequency gradients", Nat. Commun. 15, 3392.
#          DOI: 10.1038/s41467-024-47860-x
# Original code: https://github.com/BrainModes/cortical-traveling-waves
# Configs:       dev/Replication/Koller2024/configuration/<id>_configuration.yaml
#
# Conventions (paper -> here):
#   coupling_strength K        -> coupling.parameters.a.value
#   conduction_speed v [mm/ms] -> network.parameters.conduction_speed.value
#   intrinsic_frequency f [Hz] -> dynamics.parameters.omega.value [rad/ms]
#                                 (omega = 2*pi*f/1000)
#   simulation_duration  [ms]  -> integration.duration
#   integration_step_size [ms] -> integration.step_size
#   initial_transient    [ms]  -> integration.transient_time
#   simulation_id range        -> exploration over `random_seed`
#
# YAML anchors (LinkML loader supports `&`/`*` only, NOT merge keys `<<:`):
#   *kuramoto         - default Kuramoto Dynamics (omega for f=10 Hz)
#   *uniform_phase    - Uniform[0, 2*pi] initial-condition Distribution
#   *integ_11s        - 11 s deterministic Heun, dt=1 ms, transient=1 s
#   *trials_100       - 100 random_seed zip exploration
#   *grid_IF_K_v      - 4 IF x 39 K x 10 v product exploration (Exp 40, 48)
#   *cortical_v3      - Schaefer-1000 HCP SC, conduction_speed=3 mm/ms
# =============================================================================

key: Koller2024
title: "Human connectome topology directs cortical traveling waves and shapes frequency gradients"
year: 2024
doi: "10.1038/s41467-024-47860-x"
derived_from: Cabral2011
label: "Koller, Schirner, Ritter (2024): Cortical traveling waves on the human connectome"
description: >-
  Replication of all 17 simulation experiments. Two model classes: Kuramoto
  phase oscillators (default) and a Jansen-Rit cortical column (Exp 33).
  Two network families: 30x30 mock 2D sheet (inline HDF5 sidecar) and
  the empirical Schaefer-1000 HCP group-average SC. Parameter axes
  explored: global coupling K, conduction speed v, intrinsic frequency f.
sample:
model: Kuramoto

experiments:

  # ---------------------------------------------------------------------------
  # Exp 1 - 2D sheet, IF gradient (Fig. 2). First use of all major anchors.
  # ---------------------------------------------------------------------------
  - id: 1
    label: "2D sheet, intrinsic-frequency gradient (Fig. 2)"
    description: >-
      30x30 oscillator sheet with posterior-to-anterior in-strength gradient
      and matching intrinsic-frequency gradient. K=0.01.
    references: ["Fig. 2", "01_configuration.yaml"]

    dynamics: &kuramoto
      name: Kuramoto
      label: "Kuramoto phase oscillator"
      description: "dtheta/dt = omega + c_pop0; c_pop0 = K/N * sum_j a_ij * sin(theta_j(t-tau_ij) - theta_i(t))"
      parameters:
        omega:
          name: omega
          value: 0.0628318530718    # 2*pi*10 Hz / 1000 ms
          unit: rad_per_ms
          description: "Intrinsic angular frequency (per-node values via Node.parameters)"
      coupling_inputs:
        c_pop0:
          name: c_pop0
          description: "Long-range Kuramoto coupling input"
      state_variables:
        theta:
          name: theta
          unit: rad
          equation: {lhs: "Derivative(theta, t)", rhs: "omega + c_pop0"}
          variable_of_interest: true
          coupling_variable: true
          distribution: &uniform_phase
            name: Uniform
            domain: {lo: 0.0, hi: 6.283185307179586}
            axis: space
      output: [theta]
      number_of_modes: 1

    network:
      data_file: networks/Koller2024_Exp1_2DSheet.h5

    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      description: "pre = sin(theta_j - theta_i); post = a * gx / N"
      parameters:
        a: {name: a, value: 0.01, description: "Global coupling strength K"}
        N: {name: N, value: 1.0,  description: "Normalisation (n_nodes)"}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]

    integration: &integ_11s
      method: Heun
      duration: 11000.0
      step_size: 1.0
      transient_time: 1000.0

    explorations: &trials_100
      trials:
        name: trials
        label: "100 independent random initial conditions (IC sampling driven by theta.distribution)"
        mode: zip
        n_trials: 100

  # ---------------------------------------------------------------------------
  # Exp 2 - 2D sheet, uniform IF control (Fig. 2), K=0.0003
  # ---------------------------------------------------------------------------
  - id: 2
    label: "2D sheet, uniform IF control (Fig. 2)"
    description: "Same SC as Exp 1, uniform intrinsic frequency, K=0.0003."
    references: ["Fig. 2", "02_configuration.yaml"]
    dynamics: *kuramoto
    network:
      data_file: networks/Koller2024_Exp2_2DSheet.h5
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 0.0003, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # ---------------------------------------------------------------------------
  # Exp 3 - 2D sheet, IF-gradient sweep (Fig. 3), K=0.01
  # ---------------------------------------------------------------------------
  - id: 3
    label: "2D sheet, IF-gradient scaling sweep (Fig. 3)"
    description: "K=0.01, IF gradient scaling swept across 31 values 0..1.5."
    references: ["Fig. 3", "03_configuration.yaml"]
    dynamics: *kuramoto
    network:
      data_file: networks/Koller2024_Exp3_2DSheet.h5
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 0.01, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations:
      IF_gradient_sweep:
        name: IF_gradient_sweep
        label: "Intrinsic-frequency gradient scaling sweep"
        mode: product
        n_trials: 100
        space:
          - parameter: Kuramoto.omega_gradient_scaling
            domain: {lo: 0.0, hi: 1.5, n: 31}

  # ---------------------------------------------------------------------------
  # Exp 6 - 2D sheet, no boundary k-ring, K=0.1 (suppl)
  # ---------------------------------------------------------------------------
  - id: 6
    label: "2D sheet, no boundary, K=0.1 (suppl.)"
    description: "30x30 sheet with no boundary k-ring; K=0.1, IF-gradient scaling=1."
    references: ["Suppl.", "06_configuration.yaml"]
    dynamics: *kuramoto
    network:
      data_file: networks/Koller2024_Exp6_2DSheet.h5
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 0.1, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # ===========================================================================
  # CORTICAL EXPERIMENTS (Schaefer-1000, HCP group-average SC)
  # ===========================================================================

  # Exp 30 - first use of *cortical_v3 anchor
  - id: 30
    label: "Cortical Kuramoto, group-average SC (Fig. 5a)"
    description: "Schaefer-1000 HCP SC, K=1e-5, v=3 mm/ms."
    references: ["Fig. 5a", "30_configuration.yaml"]
    dynamics: *kuramoto
    network: &cortical_v3
      label: "Schaefer 2018 1000 ROI (7-Networks), HCP group-average SC"
      descriptor: SC
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 3.0
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 31 - K=3e-6
  - id: 31
    label: "Cortical Kuramoto, weaker K (Fig. 5a variant)"
    description: "Same as Exp 30 with K=3e-6."
    references: ["Fig. 5a", "31_configuration.yaml"]
    dynamics: *kuramoto
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 3.0e-6, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 32 - exponential-distance-modulated SC (Fig. 5b), K=1e-5
  - id: 32
    label: "Cortical Kuramoto, distance-modulated SC (Fig. 5b)"
    description: "SC weighted by exp(-decay_rate*length); decay_rate=0.08 mm^-1, normalisation_constant=839."
    references: ["Fig. 5b", "32_configuration.yaml"]
    dynamics: *kuramoto
    network:
      label: "Schaefer 2018 1000 ROI (7-Networks), HCP SC, exp-distance reweighted"
      descriptor: SC_exp_decay
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 3.0
          unit: mm_per_ms
        decay_rate:
          name: decay_rate
          value: 0.08
          description: "Distance decay rate (mm^-1); no per_mm in UnitEnum, dimension noted here"
        normalization_constant:
          name: normalization_constant
          value: 839.0
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 33 - Jansen-Rit on the same SC (Fig. 5e), K=0.0025
  - id: 33
    label: "Cortical Jansen-Rit on empirical SC (Fig. 5e)"
    description: >-
      Same SC as Exp 30 with Jansen-Rit per-node dynamics, K=0.0025.
      Output band-passed 5-15 Hz before wave detection (analysis stage).
    references: ["Fig. 5e", "33_configuration.yaml"]
    dynamics:
      name: JansenRit
      label: "Jansen-Rit cortical column (Jansen & Rit 1995, defaults)"
      description: "6-state Jansen-Rit. Output is the pyramidal PSP y1-y2."
      parameters:
        A:    {name: A,    value: 3.25, unit: mV}
        B:    {name: B,    value: 22.0, unit: mV}
        a:    {name: a,    value: 0.1,  unit: per_ms}
        b:    {name: b,    value: 0.05, unit: per_ms}
        v0:   {name: v0,   value: 6.0,  unit: mV}
        nu_max: {name: nu_max, value: 0.0025, unit: per_ms}
        r:    {name: r,    value: 0.56, unit: per_mV}
        J:    {name: J,    value: 125.0}
        a_1:  {name: a_1,  value: 1.0}
        a_2:  {name: a_2,  value: 0.8}
        a_3:  {name: a_3,  value: 0.25}
        a_4:  {name: a_4,  value: 0.25}
        mu:   {name: mu,   value: 0.22, unit: per_ms}
      derived_parameters:
        C1: {name: C1, equation: {rhs: "a_1*J"}}
        C2: {name: C2, equation: {rhs: "a_2*J"}}
        C3: {name: C3, equation: {rhs: "a_3*J"}}
        C4: {name: C4, equation: {rhs: "a_4*J"}}
      functions:
        Sigm:
          name: Sigm
          arguments: [v]
          equation: {rhs: "2*nu_max / (1 + exp(r*(v0 - v)))"}
      coupling_inputs:
        c_pop0:
          name: c_pop0
          description: "Long-range coupling input to excitatory population"
      state_variables:
        y0: {name: y0, equation: {lhs: "Derivative(y0, t)", rhs: "y3"}}
        y1: {name: y1, equation: {lhs: "Derivative(y1, t)", rhs: "y4"}, coupling_variable: true}
        y2: {name: y2, equation: {lhs: "Derivative(y2, t)", rhs: "y5"}}
        y3: {name: y3, equation: {lhs: "Derivative(y3, t)", rhs: "A*a*Sigm(y1 - y2) - 2*a*y3 - a*a*y0"}}
        y4: {name: y4, equation: {lhs: "Derivative(y4, t)", rhs: "A*a*(mu + C2*Sigm(C1*y0) + c_pop0) - 2*a*y4 - a*a*y1"}}
        y5: {name: y5, equation: {lhs: "Derivative(y5, t)", rhs: "B*b*C4*Sigm(C3*y0) - 2*b*y5 - b*b*y2"}}
      derived_variables:
        v_pyr:
          name: v_pyr
          equation: {rhs: "y1 - y2"}
          unit: mV
          description: "Pyramidal PSP (EEG-like)"
      output: [v_pyr]
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 0.0025, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration:
      method: Heun
      duration: 12000.0
      step_size: 1.0
      transient_time: 1000.0
    explorations: *trials_100

  # Exp 34 - in-strength normalised SC (Fig. 5d), K=1e-6
  - id: 34
    label: "Cortical Kuramoto, in-strength normalised SC (Fig. 5d)"
    description: "Each row of SC divided by node in-strength (unit total input). K=1e-6."
    references: ["Fig. 5d", "34_configuration.yaml"]
    dynamics: *kuramoto
    network:
      label: "Schaefer 2018 1000 ROI (7-Networks), HCP SC, in-strength normalised"
      descriptor: SC_instrength_normalised
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 3.0
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-6, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 38 - infinite conduction speed (Fig. 5c), K=1e-7
  - id: 38
    label: "Cortical Kuramoto, infinite conduction speed (Fig. 5c)"
    description: "Same SC as Exp 30 with v=inf (no delays), K=1e-7."
    references: ["Fig. 5c", "38_configuration.yaml"]
    dynamics: *kuramoto
    network:
      label: "Schaefer 2018 1000 ROI (7-Networks), HCP SC, instantaneous (v=inf)"
      descriptor: SC
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: .inf
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-7, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 39 - replicate of 30 (independent realisation for ensemble stats)
  - id: 39
    label: "Cortical Kuramoto, group-average SC (replicate of Exp 30)"
    description: "Independent realisation of Exp 30."
    references: ["39_configuration.yaml"]
    dynamics: *kuramoto
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # ===========================================================================
  # PARAMETER-SWEEP EXPERIMENTS (10 trials, full f x K x v grid)
  # ===========================================================================

  # Exp 40 - first use of *grid_IF_K_v
  - id: 40
    label: "Full IF x K x v grid, group-average SC (Figs 6-8)"
    description: "4 IF (1, 10, 20, 40 Hz) x 39 log-spaced K (1e-8..1e-2) x 10 v (1..10 mm/ms), 10 trials."
    references: ["Fig. 6", "Fig. 7", "Fig. 8", "40_configuration.yaml"]
    dynamics: *kuramoto
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K (swept)"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: &grid_IF_K_v
      grid_IF_K_v:
        name: grid_IF_K_v
        label: "IF x K x v full grid"
        mode: product
        n_trials: 10
        space:
          - parameter: Kuramoto.omega_mean_hz
            unit: Hz
            explored_values: [1.0, 10.0, 20.0, 40.0]
          - parameter: Kuramoto.a
            label: "Global coupling K (log10 spaced)"
            domain: {lo: -8.0, hi: -2.0, n: 39}
          - parameter: conduction_speed
            unit: mm_per_ms
            domain: {lo: 1.0, hi: 10.0, n: 10}

  # Exp 48 - rank-5 NMF reweighted SC (Fig. 9)
  - id: 48
    label: "Rank-5 NMF subnetwork sweep (Fig. 9)"
    description: "Same grid as Exp 40 with SC replaced by rank-5 NMF components from band-limited HCP MEG FC."
    references: ["Fig. 9", "48_configuration.yaml"]
    dynamics: *kuramoto
    network:
      label: "Schaefer 1000, rank-5 NMF reweighted SC"
      descriptor: SC_NMF_rank5
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 3.0
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K (swept)"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *grid_IF_K_v

  # Exp 481 - alpha-band NMF subnetwork (single point), K=1.4384e-5, v=10
  - id: 481
    label: "Alpha-band NMF subnetwork, single point"
    description: "Alpha-band NMF SC, K=1.4384e-5, v=10 mm/ms, f=10 Hz."
    references: ["Fig. 9", "48_alpha_configuration.yaml"]
    dynamics: *kuramoto
    network:
      label: "Schaefer 1000, alpha-band NMF SC"
      descriptor: SC_NMF_alpha
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 10.0
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.438449888287663e-05, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # Exp 482 - beta-band NMF subnetwork (single point), f=20 Hz, K=1e-5, v=9
  - id: 482
    label: "Beta-band NMF subnetwork, single point"
    description: "Beta-band NMF SC, K=1e-5, v=9 mm/ms, f=20 Hz."
    references: ["Fig. 9", "48_beta_configuration.yaml"]
    dynamics:
      name: Kuramoto
      label: "Kuramoto phase oscillator (f=20 Hz)"
      parameters:
        omega:
          name: omega
          value: 0.1256637061436     # 2*pi*20 Hz / 1000 ms
          unit: rad_per_ms
      coupling_inputs:
        c_pop0: {name: c_pop0}
      state_variables:
        theta:
          name: theta
          unit: rad
          equation: {lhs: "Derivative(theta, t)", rhs: "omega + c_pop0"}
          variable_of_interest: true
          coupling_variable: true
          distribution: *uniform_phase
      output: [theta]
      number_of_modes: 1
    network:
      label: "Schaefer 1000, beta-band NMF SC"
      descriptor: SC_NMF_beta
      bids:
        template: FSLMNI152
        cohort: HCPYA
        reconstruction: dTOR
        atlas: Schaefer2018
        segmentation: 7Networks
        scale: "1000"
      parameters:
        conduction_speed:
          name: conduction_speed
          value: 9.0
          unit: mm_per_ms
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100

  # ===========================================================================
  # SUPPLEMENTARY: noise + IF dispersion
  # ===========================================================================

  # Exp 50 - additive noise (Suppl. Fig S4), sigma=0.01
  - id: 50
    label: "Cortical Kuramoto with additive noise (Suppl.)"
    description: "Same as Exp 30 with stochastic Heun, sigma=0.01, duration=12 s, final transient=1 s."
    references: ["Suppl. Fig. S4", "50_configuration.yaml"]
    dynamics: *kuramoto
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration:
      method: Heun
      duration: 12000.0
      step_size: 1.0
      transient_time: 1000.0
      noise:
        noise_type: gaussian
        additive: true
        intensity: {name: sigma, value: 0.01}
    explorations: *trials_100

  # Exp 51 - IF dispersion (Suppl. Fig S4), sigma_f=1 Hz
  - id: 51
    label: "Cortical Kuramoto with IF dispersion (Suppl.)"
    description: "Same as Exp 30 with intrinsic-frequency dispersion sigma_f=1 Hz."
    references: ["Suppl. Fig. S4", "51_configuration.yaml"]
    dynamics:
      name: Kuramoto
      label: "Kuramoto with per-node IF dispersion"
      parameters:
        omega:
          name: omega
          value: 0.0628318530718
          unit: rad_per_ms
          description: "2*pi*10 Hz / 1000 ms; per-node draws via distribution"
          shape: "(n_nodes,)"
          distribution:
            name: Normal
            parameters:
              mean: {name: mean, value: 0.0628318530718}
              std:  {name: std,  value: 0.00628318530718}    # 2*pi*1 Hz / 1000 ms
            axis: space
      coupling_inputs:
        c_pop0: {name: c_pop0}
      state_variables:
        theta:
          name: theta
          unit: rad
          equation: {lhs: "Derivative(theta, t)", rhs: "omega + c_pop0"}
          variable_of_interest: true
          coupling_variable: true
          distribution: *uniform_phase
      output: [theta]
      number_of_modes: 1
    network: *cortical_v3
    coupling:
      name: KuramotoCoupling
      label: "Kuramoto sinusoidal coupling"
      delayed: true
      parameters:
        a: {name: a, value: 1.0e-5, description: "Global coupling strength K"}
        N: {name: N, value: 1.0}
      pre_expression:  {rhs: "sin(theta_j - theta_i)"}
      post_expression: {rhs: "a * gx / N"}
      incoming_states: [theta]
      local_states:    [theta]
    integration: *integ_11s
    explorations: *trials_100
