id: https://w3id.org/tvbo/study
name: tvbo_study
title: TVB-O Study Schema
description: >-
  General-purpose classes for multi-subject, multi-session study metadata.
  Defines Subject, Session, and Dataset for workflow orchestration, and
  StudyLayout for the directory structure of a BIDS study dataset.
  Domain-specific schemas (e.g., tvb_dbs) extend these with specialized
  attributes.

prefixes:
  linkml: https://w3id.org/linkml/
  tvbo_study: https://w3id.org/tvbo/study/
  bids: https://bids-specification.readthedocs.io/en/stable/
  obo: http://purl.obolibrary.org/obo/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#

default_prefix: tvbo_study

imports:
  - linkml:types

slots:
  subject_id:
    identifier: true
    range: string
    required: true
    slot_uri: dcterms:identifier
    description: >-
      BIDS-compatible subject identifier (without 'sub-' prefix).
      Examples: '01', 'ctrl03', 'patient17'.
    exact_mappings:
      - schema:identifier

  session_id:
    identifier: true
    range: string
    required: true
    slot_uri: dcterms:identifier
    description: >-
      BIDS session identifier (without 'ses-' prefix).
      Examples: 'baseline', '6month', 'pre', 'post'.

  dataset_id:
    identifier: true
    range: string
    required: true
    slot_uri: dcterms:identifier
    description: >-
      Unique identifier for the dataset.

  cohort_id:
    identifier: true
    range: string
    required: true
    slot_uri: dcterms:identifier
    description: >-
      Identifier of a cohort, unique within the study: the name a reference addresses it by (``used: {cohort: <id>}``). Corresponds to the BIDS ``cohort-`` entity.

  subjects:
    multivalued: true
    range: Subject
    inlined: true
    description: "Subjects in a dataset."

classes:

  Subject:
    description: >-
      A participant in a study. Each subject typically has their own
      brain network (connectome) and empirical recordings. Corresponds
      to a BIDS 'sub-' entity.
    slots:
      - subject_id
    attributes:
      label:
        range: string
        slot_uri: rdfs:label
        description: "Human-readable label for the subject."
      group:
        range: string
        description: >-
          Group assignment (e.g., 'control', 'patient', 'healthy').
          Maps to participants.tsv 'group' column in BIDS.
      age:
        range: float
        description: "Age at time of study (years)."
      sex:
        range: SexEnum
        description: "Biological sex."
      sessions:
        multivalued: true
        range: Session
        inlined: true
        description: >-
          Data collection sessions for this subject. Each session
          can have its own network, empirical data, and conditions.
      network:
        range: string
        description: >-
          Path to subject-specific connectome (when not session-dependent).
          Relative to dataset root or BIDS derivatives.
          For session-specific networks, use Session.network instead.
      metadata:
        range: string
        description: >-
          Additional subject metadata as key-value pairs or path
          to a sidecar JSON file.

  Session:
    description: >-
      A data collection session for a subject. Corresponds to a BIDS
      'ses-' entity. Sessions capture longitudinal timepoints (baseline,
      follow-up), different experimental conditions, or repeated measures.
    slots:
      - session_id
    attributes:
      label:
        range: string
        slot_uri: rdfs:label
        description: "Human-readable session label."
      network:
        range: string
        description: >-
          Path to session-specific connectome. Overrides Subject.network
          when set. Relative to dataset root or BIDS derivatives.
      empirical_data:
        multivalued: true
        range: string
        description: >-
          Paths to empirical recordings for this session (e.g., BOLD
          time series, MEG/EEG). Relative to dataset root.
      condition:
        range: string
        description: >-
          Experimental condition label (e.g., 'rest', 'task-nback').
          Maps to BIDS 'task-' entity.

  Cohort:
    description: >-
      A named subset of a dataset's subjects: the unit a group-level quantity is defined over, such as a mean connectome, a per-edge presence count or a normalisation constant. A dataset may hold several, and they may overlap: the sites of a multi-centre study, a patient and a control group, the subjects a processing pipeline has finished so far. Naming the subset is what pins an aggregate. A quantity computed over ``hcpy93`` states which subjects went into it, and moving to a larger cohort is a change to one identifier rather than to every consumer.
    slots:
      - cohort_id
    attributes:
      members:
        multivalued: true
        range: string
        description: >-
          The subject identifiers this cohort holds, without the ``sub-`` prefix, in the order a stacked read returns them. When the enclosing dataset lists its ``subjects``, every member must be one of them. A cohort states its members in exactly one way: typed here, read from ``members_file``, or admitted by ``rule``.
      members_file:
        range: string
        description: >-
          Path of a file that lists the members, read each time the cohort is used, so a list its producer keeps (the subjects a pipeline has finished) is never copied into the recipe. A ``.yaml`` or ``.json`` file holds what ``members`` would hold; a ``.tsv`` or ``.csv`` file is a participants table (the BIDS ``participants.tsv`` layout, tab- or comma-separated), read by its ``participant_id`` column, and a row with a value but no participant is an error; any other file holds one identifier per line, blank lines and lines starting with ``#`` skipped. Members come in the file's order and a ``sub-`` prefix is dropped. A relative path is read from the directory of the experiment or network file the dataset is part of, also when the dataset comes into that file by ``!include`` from another directory, and, when the file is not there, from the root of the study that file belongs to; a missing file is an error naming the places tried. Messages about a list read from a file give counts and positions, never an identifier.
      rule:
        range: CohortRule
        inlined: true
        description: >-
          A rule on a phenotype measure that admits the members (``CohortRule``): one group of a split of the subjects by a score. The members are computed from the phenotype table each time the cohort is used, so no list is typed or stored.
      label:
        range: string
        slot_uri: rdfs:label
        description: "Human-readable cohort name."
      description:
        range: string
        slot_uri: dcterms:description
        description: "What admits a subject to this cohort, in words: the selection rule, the site, the diagnostic group."

  CohortRule:
    description: >-
      Admits a cohort's members by a measure of a phenotype table: the candidates are cut into ``n_groups`` groups along ``measure`` and the cohort holds the group ``group``. The candidates are the members of the cohort ``of`` names, else the subjects the dataset lists, else every subject of the table. Each candidate needs one row in the table. A candidate without a row, or whose value is missing or not finite, is treated as ``missing`` says, before any group is formed. The members come in the candidates' order, not in the order of the measure. A group no candidate falls in is an error, as a cohort without members is.
    attributes:
      measure:
        range: string
        required: true
        description: "Name of the measure the candidates are split by: a measure of a ``Phenotype`` sidecar or a column of a tabular file."
      phenotype_file:
        range: string
        description: >-
          Path of the phenotype table this rule reads, where it is not the dataset's own (``Dataset.phenotype_file``). Resolved as ``Cohort.members_file`` is.
      grouping:
        range: CohortGrouping
        required: true
        description: "How the candidates are cut into groups."
      n_groups:
        range: integer
        required: true
        minimum_value: 1
        description: "Number of groups the candidates are cut into."
      group:
        range: integer
        required: true
        minimum_value: 1
        description: >-
          Which group this cohort holds, counted from 1 for the lowest values of the measure to ``n_groups`` for the highest.
      of:
        range: string
        description: >-
          ``cohort_id`` of another cohort of the same dataset whose members are the candidates, so a split is taken inside a cohort. That cohort may itself be typed, read from a file or admitted by a rule; a chain that leads back to this cohort is an error.
      missing:
        range: MissingValuePolicy
        ifabsent: string(refuse)
        description: "What happens to a candidate without a finite value of the measure."

  Dataset:
    description: >-
      A collection of subjects for a multi-subject study. Provides the
      subject/session structure needed for workflow rendering. Optionally
      backed by a BIDS directory layout.
    slots:
      - dataset_id
      - subjects
    attributes:
      subjects_file:
        range: string
        description: >-
          Path of a file that lists this dataset's subjects, in place of ``subjects``; a dataset states one of the two. A ``.yaml`` or ``.json`` file holds what ``subjects`` would hold (identifiers, ``Subject`` records or a mapping keyed by identifier), a ``.tsv`` or ``.csv`` file is a participants table read by its ``participant_id`` column, and any other file holds one identifier per line. Read each time the subjects are asked for and resolved as ``Cohort.members_file`` is, with the same rule for what a message may say.
      phenotype_file:
        range: string
        description: >-
          Path of this dataset's phenotype table, which a cohort ``rule`` reads its measure from: a ``Phenotype`` sidecar (``.yaml``, values in its companion) or a tabular file (``.tsv`` or ``.csv``, one row per subject under ``participant_id``, one column per measure, ``n/a`` for a missing value); a file of another suffix is an error. Resolved as ``Cohort.members_file`` is.
      cohorts:
        multivalued: true
        range: Cohort
        inlined: true
        description: >-
          Named subsets of this dataset's subjects (``Cohort``). A reference reads a cohort by its identifier (``used: {cohort: <id>}``): each member's file is found under this dataset's ``bids_root``.
      label:
        range: string
        slot_uri: rdfs:label
        description: "Human-readable dataset name."
      description:
        range: string
        slot_uri: dcterms:description
      bids_root:
        range: string
        description: >-
          Path to BIDS dataset root directory. When set, subject networks and empirical data paths are resolved relative to this root. A workflow kit copies the files its experiments read from here into its own ``data/<dataset_id>/`` and freezes this path to that copy.
      batch_mode:
        range: SubjectBatchMode
        ifabsent: string(fan_out)
        description: >-
          How the per-subject fits are executed. ``fan_out`` (default) runs one
          per-subject job, each binding its own targets at run time. ``on_device``
          evaluates the whole cohort together as one vectorised batch on a single
          device — the subject axis mapped in parallel while the shared network is
          reused across subjects. Backend-independent intent: the scientific spec
          is identical either way; only the execution strategy differs (a backend
          realises the batch with its own vectorised-map primitive).
      batch_size:
        range: integer
        description: >-
          On-device chunk width — how many subjects form one vectorised batch.
          Absent = the whole cohort in one batch, bounded by the working-memory
          budget (as for exploration ``n_parallel``). Ignored when ``batch_mode``
          is ``fan_out``.
      conditions:
        multivalued: true
        range: string
        description: >-
          Global condition labels applied across all subjects
          (e.g., ['rest', 'task-nback', 'task-motor']).
      reference:
        range: string
        slot_uri: dcterms:references
        description: "DOI or citation for this dataset."


  StudyLayout:
    description: >-
      Directory layout of a study dataset, and the single ground truth for it. Everything
      that creates, resolves, ignores, validates or documents a study's directories reads
      this record instead of restating the tree, so the layout cannot drift between the
      scaffolder, the path resolvers, the ignore files, the validator and the docs. The
      vocabulary deliberately mirrors the BIDS ``rules/directories.yaml`` (``name``,
      ``level``, ``opaque``, ``subdirs``) so a layout can be diffed against the standard.
    slots:
      - name
      - description
    attributes:
      dataset_type:
        range: BidsDatasetType
        ifabsent: string(study)
        description: >-
          BIDS ``DatasetType`` this layout realises, written into the dataset's
          ``dataset_description.json``.
      bids_version:
        range: string
        description: "BIDS version the layout was written against."
      subdirs:
        multivalued: true
        range: StudyDirectory
        inlined: true
        inlined_as_list: true
        description: "Directories under the dataset root, in the order a reader should meet them."
      files:
        multivalued: true
        range: StudyFile
        inlined: true
        inlined_as_list: true
        description: "Files at the dataset root."
      templates:
        multivalued: true
        inlined: true
        range: StudyTemplate
        description: >-
          The kinds of study this record covers, keyed by the name ``tvbo study init --template`` takes. An entry's ``in_templates`` names one of these, so a template that nothing declares is a typo rather than a silently empty variant.

  StudyTemplate:
    description: >-
      One kind of study the layout accounts for. A template is a *specialisation*: it names the entries a kind adds to the study every kind already shares, and nothing else. The general study is therefore not a template and names none — a kind earns an entry here only once some directory or file genuinely belongs to it and not to the rest.
    slots:
      - name
      - description

  StudyDirectory:
    description: >-
      One directory in a study layout. ``role`` is the stable key code resolves by: a
      resolver asks the layout where the ``results`` go and never for a literal path, so
      moving a directory is a one-line edit to this record. ``bids`` states the directory's
      standing with the standard, which is what decides whether it needs a ``.bidsignore``
      entry, and ``tracked`` states what version control keeps.
    slots:
      - name
      - description
    attributes:
      role:
        range: StudyDirectoryRole
        description: >-
          Semantic key this directory is resolved by. Absent for a directory that only
          groups others, whose own path no code needs.
      level:
        range: RequirementLevel
        ifabsent: string(optional)
        description: >-
          Whether a study MUST, SHOULD or MAY have this directory. Enforced by
          ``tvbo validate study``; a BIDS-sanctioned directory is optional to BIDS
          regardless of what a study requires of itself.
      opaque:
        range: boolean
        ifabsent: "false"
        description: >-
          BIDS: the standard does not specify the contents, so a validator does not read
          inside. A sanctioned opaque directory therefore needs no ``.bidsignore`` entry
          however its files are named.
      bids:
        range: BidsDirectoryStatus
        ifabsent: string(sanctioned)
        description: "Standing with the BIDS standard."
      tracked:
        range: TrackedContent
        ifabsent: string(all)
        description: "What version control keeps, which is what the ``.gitignore`` writer emits."
      expires_with:
        range: string
        description: >-
          For an unsanctioned or proposed directory, what would retire its ``.bidsignore``
          entry (a BEP identifier, or a change we would have to propose). Naming the exit
          keeps the ignore surface from becoming permanent by default.
      in_templates:
        multivalued: true
        range: string
        description: >-
          Init templates that include this directory. Absent means every study gets it, so
          one record covers the general layout and its specialisations without a second copy
          of the tree to keep in step.
      not_in_templates:
        multivalued: true
        range: string
        description: >-
          Init templates that do *not* get this directory, though every other kind does. The
          complement of ``in_templates``, for a directory one kind replaces rather than adds to.
      files:
        multivalued: true
        range: StudyFile
        inlined: true
        inlined_as_list: true
        description: "Files this directory is expected to carry."
      subdirs:
        multivalued: true
        range: StudyDirectory
        inlined: true
        inlined_as_list: true
        description: "Nested directories."

  StudyFile:
    description: >-
      One file a study layout accounts for. ``name`` may interpolate ``{study}``, the
      dataset's own name, which is how the entry recipe is named without the layout
      knowing any particular study.
    slots:
      - name
      - description
    attributes:
      role:
        range: StudyFileRole
        description: "Semantic key this file is resolved by."
      level:
        range: RequirementLevel
        ifabsent: string(optional)
      bids:
        range: BidsDirectoryStatus
        ifabsent: string(sanctioned)
        description: "Standing with the BIDS standard; an unsanctioned file needs a ``.bidsignore`` entry."
      expires_with:
        range: string
        description: >-
          For an unsanctioned or proposed file, what would retire its ``.bidsignore`` entry.
      tracked:
        range: TrackedContent
        ifabsent: string(all)
      template:
        range: string
        description: >-
          Asset that seeds the file at ``tvbo study init``, resolved against the
          scaffolder's template directory. Absent means the file is written from the
          layout record itself, or left to the author.
      generated:
        range: boolean
        ifabsent: "false"
        description: >-
          Written by tooling and overwritten on the next run, so it is never hand-edited.
      in_templates:
        multivalued: true
        range: string
        description: >-
          Init templates that include this file. Absent means every study gets it.
      not_in_templates:
        multivalued: true
        range: string
        description: >-
          Init templates that do *not* get this file, though every other kind does. The complement of ``in_templates``, for a file the general study has and one kind replaces rather than adds to: a collection's document stands in for a single study's report, so naming the kinds that keep the report would leave every kind added later to be edited in here as well.
      template_variants:
        multivalued: true
        inlined: true
        range: LayoutTemplateVariant
        description: >-
          Seeds that supersede ``template`` for one init variant, keyed by variant name. A file every study gets may still need different starting text once the variant says what kind of study this is — a replication's provenance note names a paper, and a general study has no paper to name — so stating only the difference keeps one entry per file rather than two that drift apart. The first selected variant naming a seed wins; absent means every variant starts from ``template``.

  LayoutTemplateVariant:
    description: >-
      One variant's seed for a file the record already accounts for.
    attributes:
      variant:
        key: true
        range: string
        description: "The ``tvbo study init --template`` name this seed belongs to."
      template:
        range: string
        description: "Asset seeding the file when that variant is selected."

enums:
  CohortGrouping:
    description: >-
      How a cohort rule cuts its candidates into groups along a measure. The values and their meaning are those of ``tvbo.analysis.statistics.group_index``, which a grouped statistic uses too.
    permissible_values:
      equal_width:
        description: >-
          Bins of equal width. The range from the smallest to the largest finite value among the candidates is cut into ``n_groups`` intervals of the same width; each is closed below and open above, and the last is closed on both sides, so the largest value belongs to it. Group sizes follow the distribution of the measure and a bin may hold nobody. Refused when all values are equal and more than one group is asked for, since the range then has no width.
      equal_count:
        description: >-
          Groups of equal size by rank. The candidates are ordered by ascending value, equal values in the candidates' own order, and that order is cut into ``n_groups`` consecutive runs whose sizes differ by at most one, the longer runs first. Equal values can therefore fall into neighbouring groups.
  MissingValuePolicy:
    description: "How a rule treats a candidate that has no finite value of its measure."
    permissible_values:
      refuse:
        description: "An error that states how many candidates have none."
      exclude:
        description: "The candidate belongs to no group; ranks and bin edges are taken over the candidates that have a value."
  SubjectBatchMode:
    description: >-
      How a multi-subject dataset's per-subject fits are executed.
    permissible_values:
      fan_out:
        description: "One per-subject job; each binds its own targets at run time."
      on_device:
        description: "The whole cohort evaluated together as one vectorised on-device batch."
  SexEnum:
    permissible_values:
      male:
        description: "Male"
      female:
        description: "Female"
      other:
        description: "Other or not reported"

  BidsDatasetType:
    description: >-
      BIDS ``DatasetType``: how a dataset is to be interpreted. ``study`` has been in the
      released standard since BIDS 1.10.1 and is the type a simulation study takes.
    permissible_values:
      raw:
        description: "Unprocessed acquired data."
      derivative:
        description: "Data computed from another dataset."
      study:
        description: >-
          A dataset that organises the material of one study: its inputs under
          ``sourcedata/``, its outputs under ``derivatives/``, its prose under ``docs/``.

  RequirementLevel:
    description: "BIDS requirement level: whether something MUST, SHOULD or MAY be present."
    permissible_values:
      required:
        description: "MUST be present."
      recommended:
        description: "SHOULD be present."
      optional:
        description: "MAY be present."

  BidsDirectoryStatus:
    description: >-
      A directory's standing with the BIDS standard, which is what decides whether it
      needs a ``.bidsignore`` entry.
    permissible_values:
      sanctioned:
        description: >-
          Named in the released BIDS ``rules/directories.yaml`` for this ``DatasetType``.
          Needs no ``.bidsignore`` entry.
      proposed:
        description: >-
          Named only by a BEP still under review, so a released validator does not know it.
          Ignored until the BEP merges, which ``expires_with`` records.
      nested_dataset:
        description: >-
          A BIDS dataset in its own right, carrying its own ``dataset_description.json``
          and validated as that type.
      unsanctioned:
        description: >-
          Outside the BIDS vocabulary. Must be listed in ``.bidsignore``, and
          ``expires_with`` must say what would retire the entry.
      hidden:
        description: >-
          Dot-prefixed, so validators skip it by convention and no ``.bidsignore`` entry
          is needed.

  TrackedContent:
    description: "What version control keeps of a directory."
    permissible_values:
      all:
        description: "Everything in it is tracked."
      declared_files:
        description: >-
          Only the files the record declares under it are tracked, at whatever depth they
          sit; everything else it accumulates is not. A source directory keeps its README,
          so third-party material is documented without being redistributed, and a
          derivative dataset keeps the description that declares what it is, so a checkout
          validates before anything has been run.
      none:
        description: "Nothing in it is tracked; the directory is reproduced by running the study."

  StudyDirectoryRole:
    description: >-
      What a directory is for, as a key code resolves paths by. Roles are properties of a
      study dataset in general, so a layout that renames or moves a directory keeps working
      without touching the code that reads it.
    permissible_values:
      spec:
        description: "Recipe fragments the entry recipe includes."
      code_source:
        description: "Callables the recipe references by bare module name: the directory a recipe's `code_source` defaults to."
      sourcedata:
        description: "Inputs the study did not compute: connectomes, atlases, empirical data."
      original_study:
        description: >-
          Material published by the work being reproduced, kept apart from the study's own
          inputs so it is never mistaken for an output.
      raw_bids:
        description: "An input that is itself a BIDS raw dataset, mounted rather than copied."
      docs:
        description: "Report sources: the prose, its bibliography and its render config."
      analysis:
        description: "Analysis definitions the report and figures read."
      manuscript_sections:
        description: "The document's sections, one file each, included by the document in the order it names them."
      figures:
        description: "Rendered figures cleared for publication."
      figure_scripts:
        description: >-
          The self-contained plotting script each declarative figure generates: the editable
          escape hatch from the spec, kept beside what it renders rather than beside the
          authored code, which it is not.
      figures_restricted:
        description: >-
          Rendered figures that reproduce copyrighted material and are never tracked or
          published, so an internal comparison stays possible without redistributing it.
      derivatives:
        description: "Grouping directory for the nested derivative datasets."
      results:
        description: "Result containers a run and its analyses write, and figures read."
      logs:
        description: "Run logs."
      build:
        description: "Build root for artifacts that are pure products and reproduce from the spec."
      kits:
        description: "Self-contained runnable kits packaged from the spec."
      cache:
        description: "Cached intermediate results, keyed on their inputs."
      notes:
        description: >-
          Working notes kept beside the study and never published: the gap register a
          reproduction accumulates, the open threads. Untracked, so a note can be blunt.

  StudyFileRole:
    description: "What a file at a known place in the layout is."
    permissible_values:
      dataset_description:
        description: "The BIDS ``dataset_description.json``."
      readme:
        description: "The dataset or directory README."
      citation:
        description: "``CITATION.cff``."
      license:
        description: "The dataset license."
      changelog:
        description: "``CHANGES``."
      recipe:
        description: "The entry recipe: the one specification a run is given."
      gitignore:
        description: "``.gitignore``, generated from the layout's ``tracked`` fields."
      bidsignore:
        description: "``.bidsignore``, generated from the layout's ``bids`` fields."
      results_manifest:
        description: "The resolved ``results:`` bindings, emitted for the document to read."
