---
id: https://w3id.org/tvbo
name: tvb-datamodel
version: 0.4.0
description: Metadata schema for simulation studies using The Virtual Brain neuroinformatics platform or other dynamic network models of large-scale brain activity.
title: The Virtual Brain Data Model
license: https://spdx.org/licenses/EUPL-1.2
created_on: '2024-01-01'
prefixes:
    tvbo: https://w3id.org/tvbo/
    linkml: https://w3id.org/linkml/
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    prov: http://www.w3.org/ns/prov#
    qudt: http://qudt.org/vocab/unit/
    UO: http://purl.obolibrary.org/obo/UO_
    sio: http://semanticscience.org/resource/
    nidm: http://purl.org/nidash/nidm#
    biotools: https://bio.tools/ontology/
    wd: http://www.wikidata.org/entity/
    dcterms: http://purl.org/dc/terms/
    schema: http://schema.org/
    skos: http://www.w3.org/2004/02/skos/core#
    bibo: http://purl.org/ontology/bibo/
    oboInOwl: http://www.geneontology.org/formats/oboInOwl#
    GO: http://purl.obolibrary.org/obo/GO_
    CL: http://purl.obolibrary.org/obo/CL_
    UBERON: http://purl.obolibrary.org/obo/UBERON_
    CHEBI: http://purl.obolibrary.org/obo/CHEBI_
    MESH: http://purl.bioontology.org/ontology/MESH/
imports:
    - linkml:types
    - common
    - units
    - SANDS
    - tvbo_study
    - tvb_dbs
    - software

default_prefix: tvbo
default_range: string

slots:
    time_scale:
        range: UnitEnum
        ifabsent: "ms"
        description: >-
            Time unit for the integration / simulation. Determines the
            physical time meaning of one model time-step.
    environment:
        range: SoftwareEnvironment
    requirements:
        multivalued: true
        range: SoftwareRequirement
    duration:
        range: float
        ifabsent: float(1000)
    model:
        range: Dynamics
    has_reference:
        slot_uri: dcterms:references
        range: string
    references:
        slot_uri: dcterms:references
        multivalued: true
        range: string
    label:
        slot_uri: rdfs:label
        range: string
    acronym:
        slot_uri: skos:notation
        range: string
    symbol:
        range: string
    domain:
        range: Range
        aliases:
            - range
            - boundaries
    iri:
        slot_uri: dcterms:identifier
        range: uriorcurie
        description: >-
            Optional stable IRI (or compact URI) for this entity in an
            external ontology or knowledge base. Used to load metadata
            from an external source; not required when the entity is
            fully self-contained (equations, parameters, etc. defined
            in the file itself).
    grounding:
        slot_uri: tvbo:surrogate_of
        range: uriorcurie
        multivalued: true
        description: >-
            External ontology IRIs (typically GO, ChEBI, UBERON, CL, MeSH)
            that this entity is a surrogate / abstraction / model of. Realized
            as the `tvbo:surrogate_of` object property, carried inline with the
            YAML data instance. Multiple IRIs allowed: a single parameter may
            abstract several biological processes (e.g. a synaptic conductance
            grounding both GO:0060079 (excitatory PSP) and GO:0007268 (chemical
            synaptic transmission)).
    value:
        slot_uri: schema:value
        range: ScalarValue
        any_of:
          - range: ScalarValue
          - array: {}
        description: >-
            Numeric, string, or boolean value, OR an array (nested list) for
            array-valued constants such as mode-coupling coefficient matrices.
            ScalarValue accepts any literal primitive type, allowing parameters
            to carry control flags (e.g., booleans) or symbolic placeholders
            alongside numeric defaults.
    file:
        range: string
    reported_optimum:
        range: float
    default:
        slot_uri: schema:defaultValue
        range: string
    description:
        slot_uri: dcterms:description
        range: string
    definition:
        slot_uri: skos:definition
        range: string
    parameters:
        range: Parameter
        multivalued: true
        inlined: true
    equation:
        slot_uri: tvbo:Equation
        range: Equation
        inlined: true
    unit:
        slot_uri: qudt:unit
        range: UnitEnum
        description: >-
            Physical unit of measurement. Values are drawn from the QUDT
            ontology (http://qudt.org/vocab/unit/) with UO cross-references
            where available.
    derived_from:
        slot_uri: prov:wasDerivedFrom
    source:
        slot_uri: dcterms:source
        range: string
    dataset_path:
        range: string
        description: >-
            Dataset path for array-valued parameters. When set,
            the parameter value is stored in the binary companion file
            (HDF5 or Zarr) at this path. The value slot is omitted.
    record:
        range: boolean
        description: >-
            Whether to include this element in simulation output files.
            Applicable to state variables (default true), derived
            variables (default false), and network nodes (default true).
            Set false to suppress recording.

enums:
    AlgorithmCompositionMode:
        description: >-
            How an included algorithm is composed with the outer algorithm.
            Determines whether the inner algorithm's update rules are merged
            into the same loop (combined) or run as a converging inner loop on
            each outer iteration (nested).
        permissible_values:
            combined:
                description: >-
                    The included algorithm's update rules are merged into the outer
                    loop and applied ONCE per outer iteration (1:1). Use when both
                    algorithms update at the same cadence on the same observations.
                    This is the default.
            nested:
                description: >-
                    The included algorithm runs as a full inner loop on EACH outer
                    iteration, re-converging before the outer update rules are applied.
                    Use when the inner algorithm maintains an invariant the outer one
                    would otherwise perturb — e.g. FIC holding the E-I working point
                    (mean S_e = 0.25) while EIB retunes per-edge coupling. The outer
                    update's validity depends on that invariant, so the inner loop must
                    re-settle it between every outer step.

    ParallelMode:
        description: >-
            How a trial / grid-point axis is realised at JAX codegen time. The
            choice trades peak memory against throughput: vmap batches in
            parallel (fast, n_trials × working-set memory), lax_map runs
            sequentially via ``jax.lax.map`` (memory bounded by one trial),
            pmap shards across devices, auto picks vmap when the estimated
            batched memory fits and lax_map otherwise.
        permissible_values:
            auto:
                description: "Pick vmap when memory permits, lax_map otherwise."
            vmap:
                description: "Parallel batched execution (jax.vmap). Fast; high peak memory."
            lax_map:
                description: "Sequential execution via jax.lax.map. Slower; bounded memory."
            pmap:
                description: "Cross-device parallel execution (jax.pmap). For multi-GPU/TPU."

    CouplingStageEvaluation:
        description: >-
            How the network coupling term is evaluated within one step of a
            multi-stage integrator (Heun, RK4, ...). A backend-neutral numerical
            contract: whether the coupling is part of the vector field, re-evaluated
            at each solver stage, or computed once per step and held constant across
            the stages. Matters because the two choices integrate a different
            effective system — for stiff / chaotic / multistable dynamics they can
            converge to different trajectories or attractors.
        permissible_values:
            per_stage:
                description: >-
                    Re-evaluate the coupling at every integrator stage — the coupling
                    is a full part of the vector field (standard ODE integration).
                    Accurate; required to reproduce reference integrators for stiff /
                    chaotic / multistable systems. (tvboptim maps this to
                    recompute_coupling_per_stage=True; diffrax already recomputes the
                    whole RHS per stage.)
            per_step:
                description: >-
                    Evaluate the coupling once per integration step and hold it
                    constant across the stages — a TVB-style efficiency shortcut
                    (the coupling reduction runs once per step). Faster but lower-
                    order in the coupling; can change the trajectory for sensitive
                    systems. (tvboptim: recompute_coupling_per_stage=False, the
                    current backend default.)
                    
    WorkflowDistributeBy:
        description: >-
            Default tier a sweep axis is placed on when it is not named explicitly
            in a DistributionConfig. Vectorized axes are packed into one batched
            backend call; workflow axes are fanned out into independent scheduler
            tasks.
        permissible_values:
            auto:
                description: >-
                    Vectorize every axis the backend can batch; fan out the rest.
            vectorize:
                description: "Place all otherwise-unassigned axes on the vectorized tier."
            workflow:
                description: "Fan out all otherwise-unassigned axes as scheduler tasks."

    ImagingModality:
        permissible_values:
            BOLD:
                description: "Blood Oxygen Level Dependent signal."
            EEG:
                description: "Electroencephalography."
            MEG:
                description: "Magnetoencephalography."
            SEEG:
                description: "Stereoelectroencephalography."
            IEEG:
                description: "Intracranial Electroencephalography."

    ModelType:
        description: >-
            Coarse classification of a Dynamics model by its mathematical/biological
            origin. Used for filtering and display in list_db().
        permissible_values:
            mean_field:
                description: >-
                    Mathematically derived mean-field models obtained by exact
                    reduction of spiking networks (Ott-Antonsen ansatz, Lorentzian
                    heterogeneity, etc.). Examples: MontbrioPazoRoxin, CoombesByrne,
                    ReducedWongWang, ZerlautAdaptationFirstOrder.
            neural_mass:
                description: >-
                    Phenomenological population-rate / neural-mass models that describe
                    synaptic and firing-rate dynamics without an explicit derivation
                    from single-neuron statistics. Examples: JansenRit, WilsonCowan,
                    LarterBreakspear, TsodyksMarkram.
            phase_oscillator:
                description: >-
                    Phase-reduced or Kuramoto-type oscillator models. Examples:
                    Kuramoto, SupHopf.
            phenomenological:
                description: >-
                    Empirical / phenomenological models that capture macroscopic
                    dynamics without direct biophysical derivation. Examples:
                    Epileptor2D, Epileptor5D.
            spiking:
                description: >-
                    Single-neuron or conductance-based spiking models (HH, AdEx,
                    LIF, Izhikevich, etc.). These can be used as nodes in a network
                    alongside mean-field models.
            generic:
                description: >-
                    Generic / normal-form dynamical systems not specific to neural
                    modelling (e.g. Generic2dOscillator, GenericLinear).
            field:
                description: >-
                    Spatially distributed neural-field models described by integro-
                    differential or PDE formulations.

    SystemType:
        permissible_values:
            continuous:
                description: "Continuous-time dynamics (e.g., ODE/SDE)."
            discrete:
                description: "Discrete-time dynamics (e.g., maps, iterated updates)."
    BoundaryConditionType:
        permissible_values:
            Dirichlet: {}
            Neumann: {}
            Robin: {}
            Periodic: {}
    DomainEnforcement:
        description: >-
            Whether and how a state variable's ``domain`` constrains the
            trajectory during integration. Default ``none`` means the domain is
            descriptive metadata only (expected range, plot limits, initial-
            condition sampling support) and never alters the dynamics — so
            declaring a domain is side-effect free. ``clamp`` and ``wrap``
            opt in to active enforcement using the domain's ``lo``/``hi``.
        permissible_values:
            none:
                description: "Metadata only; the trajectory is never constrained (default)."
            clamp:
                description: "Hard-clip every integration step to [lo, hi]."
            wrap:
                description: >-
                    Periodic wrap into [lo, hi) — e.g. a phase variable on
                    [0, 2π). The recorded timeseries stays within the range
                    while remaining continuous mod (hi - lo)."
    DiscretizationMethod:
        permissible_values:
            FDM: { description: "Finite Difference Method" }
            FEM: { description: "Finite Element Method" }
            FVM: { description: "Finite Volume Method" }
            Spectral: {}
    ElementType:
        permissible_values:
            triangle: {}
            quad: {}
            tetrahedron: {}
            hexahedron: {}
    OperatorType:
        permissible_values:
            gradient: {}
            divergence: {}
            laplacian: {}
            curl: {}
    SamplingAxis:
        description: "Dimension along which a distribution is sampled."
        permissible_values:
            space:
                description: "Sample once per node (heterogeneous parameter or spatially varying IC)."
            time:
                description: "Resample every integration timestep (stochastic time-varying input)."
    NoiseType:
        permissible_values:
            gaussian:
            white:
            brown:
            pink:
    AggregationType:
        description: "How to aggregate time series data"
        permissible_values:
            mean: { description: "Average over time" }
            last: { description: "Last value in window" }
            first: { description: "First value in window" }
            window: { description: "Sliding window aggregation" }
            none: { description: "No aggregation" }
    EventType:
        description: "Type of event triggering mechanism."
        permissible_values:
            continuous:
                description: "Triggered when condition function crosses zero (root-finding). Maps to ContinuousCallback / ContinuousComponentCallback."
            discrete:
                description: "Triggered when condition function returns true (checked at each step). Maps to DiscreteCallback / DiscreteComponentCallback."
            preset_time:
                description: "Triggered at predetermined time points. Maps to PresetTimeCallback / PresetTimeComponentCallback."
            stimulus:
                description: "Continuous time-dependent input signal (e.g., external current). Legacy Stimulus behavior."
            stimulation:
                description: >-
                    Synonym of 'stimulus' — a continuous time-dependent input signal
                    injected into a target state variable across target regions. The
                    codegen treats 'stimulation' and 'stimulus' identically.

    StandardGraphType:
        description: >
            Well-known graph generator families with automatic backend mapping.
            The type field on GraphGenerator is a free string; this enum lists
            common types that get automatic code generation for Julia (Graphs.jl)
            and Python (NetworkX).
        permissible_values:
            BarabasiAlbert: { description: "Barabasi-Albert preferential attachment (params: k)" }
            WattsStrogatz: { description: "Watts-Strogatz small-world (params: k, p)" }
            ErdosRenyi: { description: "Erdos-Renyi random graph (params: p)" }
            Complete: { description: "Complete graph (all-to-all)" }
            Cycle: { description: "Cycle graph (ring)" }
            Star: { description: "Star graph" }
            RandomRegular: { description: "Random regular graph (params: k)" }
            Grid: { description: "Grid/lattice graph (params: dims)" }
            RandomReservoir:
                description: >-
                    Sparse random recurrent adjacency with post-hoc spectral-
                    radius rescaling. Parameters: n, sparsity, spectral_radius,
                    weight_distribution, seed. Canonical Echo State Network
                    substrate (Jaeger 2001) for reservoir computing.
            WeightShuffle:
                description: >-
                    Derived generator: permute the non-zero entries of a source
                    matrix. Parameters: source (IRI to another Network),
                    preserve (binary_mask | degree | weight_distribution), seed.
                    Used for null-model controls (e.g. shuffled SC).
    DimensionType:
        description: "Dimensions along which operations can be applied"
        permissible_values:
            time:
                description: "Temporal dimension"
            state:
                description: "State variable dimension"
            node:
                description: "Network node dimension (general graph term)"
            region:
                description: "Spatial/regional dimension (alias for node in brain networks)"
            mode:
                description: "Mode dimension (e.g., coupling modes)"
            sample:
                description: "Sample/trial/realization dimension"
            batch:
                description: "Batch dimension (for parallel processing)"
            frequency:
                description: "Frequency dimension (spectral analysis)"

    ReductionType:
        description: "Operations for reducing/aggregating values across dimensions"
        permissible_values:
            mean:
                description: "Arithmetic mean"
            sum:
                description: "Sum of values"
            max:
                description: "Maximum value"
            min:
                description: "Minimum value"
            none:
                description: "No reduction (return per-element values)"

    ContinuationAlgorithm:
        description: >-
            Predictor-corrector algorithm for numerical continuation.
        permissible_values:
            PALC:
                description: "Pseudo-arclength continuation (default). Uses weighted dot product constraint."
            MoorePenrose:
                description: "Moore-Penrose continuation."
            Natural:
                description: "Natural parameter continuation. Simple parameter stepping, no arc-length constraint."

    NumericalDiscretizationMethod:
        description: >-
            Numerical discretization method for boundary value problems
            (periodic orbits, connecting orbits, quasi-periodic tori).
        permissible_values:
            collocation:
                description: "Orthogonal collocation at Gauss points."
            trapezoid:
                description: "Trapezoidal rule discretization."
            shooting:
                description: "Standard multiple shooting."
            poincare:
                description: "Poincaré shooting."

    InitialStateMethod:
        description: >-
            Strategy for obtaining the starting equilibrium or periodic orbit.
        permissible_values:
            time_integration:
                description: "Integrate the ODE forward until convergence (robust, default)."
            newton:
                description: "Use Newton's method to find the nearest fixed point."
            given:
                description: "Use the model's default initial values directly."
            from_branch:
                description: "Start from a point on a previously computed branch."

    SparseFormat:
        permissible_values:
            dense:
                description: "Dense N×N array with gzip compression"
            csr:
                description: "Compressed Sparse Row (data, indices, indptr)"
            coo:
                description: "Coordinate list (data, row, col)"

    SweepSeeding:
        description: >-
            How each point of a parameter sweep (Exploration) obtains its initial
            state. Determines whether the sweep points are independent (and
            therefore parallelisable) or whether the trajectory follows a
            solution branch as the swept parameter is changed quasi-statically.
            The latter is forward-time-integration branch following — distinct
            from numerical continuation of equilibria (the Continuation class),
            which tracks branches with a Newton corrector rather than by
            simulation.
        permissible_values:
            independent:
                description: >-
                    Each point is initialised independently from the model's
                    initial values (a cold start), so points are order-independent
                    and may be evaluated in parallel (see parallel_mode). Default;
                    today's behaviour.
            from_previous:
                description: >-
                    Each point is seeded from the final state of the preceding
                    point, so the trajectory follows the solution branch as the
                    swept parameter changes quasi-statically. Forces sequential,
                    order-dependent execution (emitted as a scan, not a vmap).
                    Used to reach a working point by slowly ramping a parameter
                    (e.g. global coupling) and, with sweep_direction, to expose
                    hysteresis / multistability. Sweep-granularity analogue of
                    InitialStateMethod.from_branch.

    SweepDirection:
        description: >-
            Order in which a branch-following sweep (SweepSeeding.from_previous)
            traverses its axis. Ignored for independent seeding, where order is
            irrelevant.
        permissible_values:
            up:
                description: "Increase the parameter monotonically (low to high), once."
            down:
                description: "Decrease the parameter monotonically (high to low), once."
            bidirectional:
                description: >-
                    Increase then decrease over the same values, recording both
                    branches. Where the two branches differ, the sweep traces a
                    hysteresis loop that exposes coexisting stable states
                    (bistability / multistability). The multivalued generalisation
                    of Continuation.bothside.

classes:
    ScalarValue:
        class_uri: linkml:Any
        description: >-
            A scalar value: float, integer, string, or boolean.
            Used for slots that accept literals of any primitive type, such as
            argument values which may be numbers, strings, references, or booleans.

    Range:
        class_uri: tvbo:Range
        description: "Specifies a range for array generation, parameter bounds, or grid exploration."
        attributes:
            enforce:
                range: DomainEnforcement
                ifabsent: "string(none)"
                description: >-
                    For a state-variable ``domain``: whether/how to enforce the
                    range during integration (none/clamp/wrap). Ignored for
                    parameter, distribution and grid ranges. See DomainEnforcement.
            lo:
                range: ScalarValue
                description: "Lower bound or starting value. Can be a number or argument name."
            hi:
                range: ScalarValue
                description: "Upper bound or stopping value. Can be a number or argument name."
            step:
                range: ScalarValue
                description: "Step size. Can be: number, argument name, or expression."
            n:
                range: integer
                description: "Number of points (alternative to step for grid exploration)."
            log_scale:
                range: boolean
                ifabsent: false
                description: "Whether to use logarithmic spacing."
            explored_values:
                multivalued: true
                range: float
                array: {}
                description: >-
                    Explicit explored values for this element. When set on an
                    element_domain entry, overrides the parent parameter's
                    explored_values for this specific element.
            element:
                range: integer
                description: >-
                    Element/node index this range applies to. Used in element_domains
                    to explicitly link a domain to a specific element of a heterogeneous
                    parameter (e.g., element: 0 for node 0). Required when used in
                    element_domains to avoid ambiguous positional indexing.

    Equation:
        class_uri: tvbo:Equation
        slots:
            - label
            - definition
            - parameters
            - description
        attributes:
            lhs:
                range: string
                aliases:
                    - lefthandside
            rhs:
                range: string
                aliases:
                    - righthandside
            conditionals:
                description: Conditional logic for piecewise equations.
                range: ConditionalBlock
                multivalued: true
                inlined: true
                # alias: cases
            engine:
                range: SoftwareRequirement
                description: "Primary engine (must appear in environment.requirements; migration target replacing deprecated 'software')."
                inlined: true
            pycode:
                range: string
                description: Python code for the equation.
            latex:
                range: boolean
                ifabsent: false

    ConditionalBlock:
        class_uri: tvbo:ConditionalBlock
        description: A single condition and its corresponding equation segment.
        attributes:
            condition:
                description: The condition for this block (e.g., t > onset).
                range: string
            expression:
                description: The equation to apply when the condition is met.
                range: string

    Stimulus:
        class_uri: tvbo:Stimulus
        slots:
            - equation
            - parameters
            - description
            - dataLocation
            - duration
            - label
        attributes:
            regions:
                multivalued: true
                range: integer
                array: {}
            weighting:
                multivalued: true
                range: float
                array: {}
            noise:
                range: Noise
                required: false
                inlined: true
                description: >-
                    Optional stochastic contribution to the stimulus. Mirrors
                    state_variables.noise on the Dynamics side. The stimulus
                    value at each integration step is the sum of `equation`'s
                    evaluation (deterministic, if set) and a draw from this
                    Noise process. When only `noise` is set and `equation`
                    is absent, the stimulus IS the noise (pure stochastic
                    source — e.g. iid uniform driver for memory-capacity
                    benchmarks; signal+noise paradigms for psychophysics).

    Event:
        class_uri: tvbo:Event
        description: >-
            A discrete or continuous event that modifies the system during simulation.
            Generalizes Stimulus: can represent external inputs (stimulus type),
            threshold-triggered state changes (continuous/discrete type),
            or time-scheduled interventions (preset_time type).
            Attaches to components (nodes/edges) or to the experiment level.
        slots:
            - name
            - label
            - description
            - parameters
        attributes:
            event_type:
                range: EventType
                ifabsent: "stimulus"
                description: "Type of event trigger mechanism."
            condition:
                range: Equation
                inlined: true
                description: >-
                    Condition function. For continuous events: triggers when
                    expression crosses zero. For discrete events: triggers when
                    expression evaluates to true. Not used for preset_time or
                    stimulus types.
            condition_states:
                multivalued: true
                range: string
                description: >-
                    State variable symbols accessible in the condition function.
                    For edges, can include source/destination vertex outputs.
            condition_parameters:
                multivalued: true
                range: string
                description: "Parameter symbols accessible in the condition function."
            affect:
                range: Equation
                inlined: true
                description: >-
                    Affect function: what happens when the event triggers.
                    Can modify state variables and/or parameters.
                    For stimulus type, this is the stimulus equation.
            affect_states:
                multivalued: true
                range: string
                description: "State variable symbols modifiable in the affect function."
            affect_parameters:
                multivalued: true
                range: string
                description: "Parameter symbols modifiable in the affect function."
            affect_negative:
                range: Equation
                inlined: true
                description: >-
                    Affect on downcrossing (continuous events only).
                    If not specified, uses the same affect for both crossings.
            trigger_times:
                multivalued: true
                range: float
                description: >-
                    Predetermined trigger times for preset_time events.
                    The solver will step exactly to these times.
            target_component:
                range: string
                description: >-
                    Component to attach this event to. Can be a node label,
                    edge label, or 'all_edges'/'all_vertices' for broadcast.
                    If not specified, event is experiment-level.
            equation:
                range: Equation
                inlined: true
                description: >-
                    Stimulus equation for stimulus-type events.
                    Legacy compatibility with Stimulus class.
            nodes:
                aliases:
                    - regions
                multivalued: true
                range: integer
                array: {}
                description: >-
                    Network nodes a stimulus-type event is applied to (node ids /
                    indices). Pairs with `weights`. (Formerly `regions`.)
            weights:
                aliases:
                    - weighting
                multivalued: true
                range: float
                array: {}
                description: >-
                    Per-node stimulus weighting, aligned with `nodes`.
                    (Formerly `weighting`.)
            weight_distribution:
                range: Distribution
                inlined: true
                description: >-
                    Distribution to sample per-region stimulus weights from, as an
                    alternative to the explicit `weighting` array (e.g. Uniform(-1, 1)
                    per node). When set, the codegen samples one weight per target
                    region using the distribution's seed.
            target_variable:
                range: string
                description: >-
                    State variable that a stimulus-type event drives — the variable
                    its signal is injected into (e.g. 'y_0' for Jansen-Rit, or a named
                    'stimulus' input exposed to coupling). If absent, the stimulus adds
                    to the model's default external-input variable.
            target_regions:
                multivalued: true
                range: string
                description: >-
                    Regions a stimulus-type event targets: 'all' (broadcast to every
                    node) or explicit region labels / indices. More expressive than the
                    integer-only `regions` slot; when both are absent the event applies
                    to all regions.
            duration:
                range: float
                description: "Duration of stimulus-type events."
            dataLocation:
                range: string
                description: >-
                    Path to a data file (.npy) holding the stimulus waveform of a
                    *data-driven* stimulus event — the samples are interpolated at
                    simulation time instead of evaluating `equation`. 1-D arrays are a
                    single time-series broadcast to the targeted `nodes`; the event's
                    `name` is still the symbol injected into the dynamics.
            sampling_rate:
                range: float
                ifabsent: float(1.0)
                description: >-
                    Sample rate of the `dataLocation` waveform in samples per
                    millisecond (e.g. 1.0 = 1 kHz). Sample i is placed at time i /
                    sampling_rate ms.
            interpolation:
                range: string
                ifabsent: string(linear)
                description: "Interpolation for a data-driven stimulus: 'linear' or 'cubic'."

    TemporalApplicableEquation:
        class_uri: tvbo:TemporalApplicableEquation
        is_a: Equation
        slots:
            - parameters
        attributes:
            time_dependent:
                range: boolean
                ifabsent: false

    Parcellation:
        class_uri: tvbo:Parcellation
        slots:
            - label
            - iri
        attributes:
            data_source:
                range: string
            atlas:
                range: BrainAtlas
                inlined: true

    Tractogram:
        class_uri: tvbo:Tractogram
        description: "Reference to tractography/diffusion MRI data used to derive structural connectivity"
        slots:
            - name
            - label
            - iri
            - description
        attributes:
            data_source:
                range: string
                description: "Path or URI to the tractography data file"
            number_of_subjects:
                range: integer
                description: "Number of subjects in the tractography dataset"
            acquisition:
                range: string
                description: "Acquisition protocol or scanner information"
            processing_pipeline:
                range: string
                description: "Processing pipeline used to generate the tractography"
            reference:
                range: string
                slot_uri: dcterms:references
                description: "Publication or DOI reference for this tractography dataset"

    Matrix:
        class_uri: tvbo:Matrix
        # implements:
        #   - linkml:TwoDimensionalArray
        #   - linkml:RowOrderedArray
        attributes:
            x:
                # implements:
                #   - linkml:axis0
                range: BrainRegionSeries
            y:
                # implements:
                #   - linkml:axis1
                range: BrainRegionSeries
            values:
                multivalued: true
                range: float
                # implements:
                #   - linkml:elements
            format:
                range: SparseFormat
                description: "Storage format in binary companion (dense, csr, coo)"
            shape:
                multivalued: true
                range: integer
                description: "Matrix dimensions [N, M]"
            dtype:
                range: string
                ifabsent: string(float32)
                description: "Data type for matrix values"
        description: "Adjacency matrix of a network."
        slots:
            - label
            - description
            - dataLocation

    BrainRegionSeries:
        class_uri: tvbo:BrainRegionSeries
        description: A series whose values represent latitude
        # implements:
        #   - linkml:OneDimensionalSeries
        attributes:
            values:
                range: string
                multivalued: true
                # implements:
                #   - linkml:elements

    Provenance:
        class_uri: prov:Entity
        description: >-
            W3C PROV-O aligned provenance. Reusable on any entity
            (Network, TimeSeries, Dynamics, etc.).
        slots:
            - derived_from
            - references
        attributes:
            date_created:
                range: string
                description: "ISO 8601 (prov:generatedAtTime)"
            license:
                range: string
            generated_by:
                range: string
                description: "Software/agent identifier (prov:wasGeneratedBy)"
            experiment_yaml_hash:
                range: string
                description: >-
                    SHA-256 hex digest of the normalised experiment YAML
                    that produced this artifact. Used by the cross-experiment
                    cache (see :class:`SimulationStudy.from_file`) to detect
                    when a cached upstream result has gone stale because the
                    experiment's spec was edited. Computed as
                    ``hashlib.sha256(yaml.safe_dump(normalized_yaml).encode()).hexdigest()``
                    over the fully resolved (post-``!include``) experiment
                    block.
            inputs:
                multivalued: true
                range: ReferenceFingerprint
                inlined_as_list: true
                description: >-
                    Per-input fingerprints for cache invalidation. Each
                    entry records the IRI + dotted-field path of an
                    ``aux_data`` reference plus the (mtime, size, sha256)
                    of the underlying file at the time the artifact was
                    produced. A downstream cache hit requires every
                    fingerprint to match the current file state.

    ReferenceFingerprint:
        class_uri: tvbo:ReferenceFingerprint
        description: >-
            Cache-invalidation fingerprint for one ``aux_data`` reference.
            Captures enough about the upstream artifact that a downstream
            cache can decide cheaply (via mtime + size) whether to trust the
            cached result, falling back to a hash recompute on mismatch.
        attributes:
            iri:
                # uriorcurie (not string) to match the global `iri` slot's range
                # (xsd:anyURI). A local `string` range here conflicts with the
                # global anyURI range on the shared `tvbo:iri` property, making
                # this class unsatisfiable under OWL-DL (a value can't be both
                # xsd:string and xsd:anyURI).
                range: uriorcurie
                required: true
                description: "IRI of the referenced artifact (Network, ExperimentResult, BehavioralData, ...)."
            field:
                range: string
                description: "Dotted-path subkey within the referenced entity (optional)."
            mtime:
                range: float
                description: "File modification time at fingerprinting (POSIX timestamp)."
            size:
                range: integer
                description: "File size in bytes at fingerprinting."
            hash:
                range: string
                description: "SHA-256 hex digest of the file at fingerprinting (recomputed lazily when mtime/size differ)."

    Phenotype:
        class_uri: tvbo:Phenotype
        description: >-
            Per-subject phenotype table (BIDS ``phenotype/`` directory
            convention). Carries cognitive scores, clinical scales,
            demographic variables, behavioral task outputs, physiological
            measures, or any other per-subject numeric measurement bundle
            for a cohort. Sidecar companion to per-subject Network sidecars
            in multi-subject studies that correlate simulated quantities
            with empirical scores (e.g. PMAT24_A, g-factor, CardSort,
            ProcSpeed for Schirner 2023). The yaml carries metadata + the
            measure list; the h5 carries ``measures/<name>`` 1-D float
            arrays of length ``len(subjects)``.

            Aligns with the BIDS phenotype standard
            (https://bids-specification.readthedocs.io/en/stable/modality-agnostic-files/phenotypic-and-assessment-data.html)
            and with NIDM's ``nidm:Phenotype`` concept. Per-measure
            metadata can optionally carry Cognitive Atlas
            (https://www.cognitiveatlas.org/) ``cogat:Task`` and
            ``cogat:Concept`` IRIs via ``measure_specs``.
        slots:
            - label
            - description
        attributes:
            dataset_id:
                range: string
                required: true
                description: "Unique identifier for this phenotype bundle."
                slot_uri: dcterms:identifier
            subjects:
                multivalued: true
                range: string
                required: true
                description: >-
                    Ordered list of subject IDs (e.g. HCP-YA 6-digit IDs).
                    Each ``measures/<name>`` array in the h5 companion is
                    indexed by this order.
            measures:
                multivalued: true
                range: string
                description: >-
                    Names of the measures present in the h5 companion
                    (one ``measures/<name>`` dataset per name). Example:
                    ``[g_factor, PMAT24_A_CR, PMAT24_A_RTCR,
                    CardSort_Unadj, ProcSpeed_Unadj]``.
            measure_specs:
                multivalued: true
                range: MeasureSpec
                inlined_as_list: true
                description: >-
                    Optional per-measure metadata (Cognitive Atlas IRIs,
                    units, description). When present, each entry's ``name``
                    must match an entry in ``measures``.
            category:
                range: string
                ifabsent: string(cognitive)
                description: >-
                    Coarse classification of the phenotype bundle, used
                    for filtering in larger study libraries. Canonical
                    values: ``cognitive`` (intelligence / memory /
                    attention scores), ``clinical`` (UPDRS, MMSE, …),
                    ``behavioral`` (raw task outputs), ``demographic``,
                    ``physiological``, ``derived`` (composite scores
                    like g-factor or brain-age). Free string — extend
                    as needed.
            data_file:
                range: string
                required: true
                description: "Path to the h5 companion (relative to the yaml)."
            cohort:
                range: string
                description: "Cohort label (e.g. 'HCPYA', 'PPMI')."
            provenance:
                range: Provenance
                inlined: true
                description: "W3C PROV-O metadata for the source of these scores."

    MeasureSpec:
        class_uri: tvbo:MeasureSpec
        description: >-
            Metadata for one phenotype measure. Optional per-measure
            entry on ``Phenotype.measure_specs``.
        attributes:
            name:
                range: string
                required: true
                description: "Must match the measure name in ``Phenotype.measures``."
            task_iri:
                range: string
                description: >-
                    Cognitive Atlas (``cogat:``) IRI of the assessment
                    instrument / task that produced this measure
                    (e.g. ``cogat:trm_4a3fd79d09cba`` for PMAT24).
            concept_iri:
                range: string
                description: >-
                    Cognitive Atlas IRI of the cognitive construct measured
                    (e.g. ``cogat:trm_521ef89ce5e84`` for fluid intelligence).
            unit:
                range: string
                description: "Unit annotation (e.g. 'count', 'ms', 'z-score')."
            measure_type:
                range: string
                description: >-
                    Sub-type within the phenotype (e.g. 'raw', 'unadjusted',
                    'age-corrected', 'derived', 'RT', 'accuracy').
            description:
                range: string

    NamedArray:
        class_uri: tvbo:NamedArray
        description: >-
            A named numeric array. Used as a sidecar slot value where a
            schema-typed object (e.g. ``ExperimentResult.parameters``) holds
            multiple arrays addressable by name (``w_LRE``, ``w_FFI``,
            ``J_i``, ...). The actual numeric data lives in the companion
            ``.h5`` at ``parameters/<name>``; the YAML carries only the
            descriptor.
        attributes:
            name:
                range: string
                required: true
                description: "Field name; matches the h5 dataset path under ``parameters/``."
            shape:
                multivalued: true
                range: integer
                description: "Array dimensions."
            dtype:
                range: string
                ifabsent: string(float32)
                description: "Numpy dtype string."
            unit:
                range: string
                description: "Optional unit annotation (e.g. 'nA')."
            description:
                range: string

    BidsEntities:
        class_uri: tvbo:BidsEntities
        description: >-
            BIDS filename entities (BEP017-aligned) for provenance and data
            discovery. Reusable on Network, BrainAtlas, Tractogram, or any
            dataset with BIDS-conformant naming.
        attributes:
            template:
                range: string
                description: "BIDS tpl- entity (e.g., FSLMNI152, MNI152NLin2009cAsym)"
            cohort:
                range: string
                description: "BIDS cohort- entity (e.g., HCPYA, PPMI85)"
            reconstruction:
                range: string
                description: "BIDS rec- entity (e.g., dTOR)"
            segmentation:
                range: string
                description: "BIDS seg- entity (e.g., ordered, ranked, 17Networks)"
            scale:
                range: string
                description: "BIDS scale- entity (BEP017, e.g., 1000)"
            atlas:
                range: string
                description: "BIDS atlas- entity (e.g., Schaefer2018, HCPMMP1)"
            acquisition:
                range: string
                description: "BIDS acq- entity (e.g., EEGstandard1005, MEGBrainstorm)"
            hemi:
                range: string
                description: "BIDS hemi- entity (L or R) for hemisphere-specific surface/volume data"

    Network:
        class_uri: tvbo:Network
        aliases:
            - Network
            - Connectome
            - Graph
            - Connectivity
        description: "Network specification with nodes, edges, and reusable coupling configurations. Supports both explicit node/edge representation and matrix-based connectivity (Connectome compatibility)."
        slots:
            - label
            - description
            - parameters
        attributes:
            # New node/edge-based representation
            nodes:
                multivalued: true
                range: Node
                inlined_as_list: true
                description: "List of nodes with individual dynamics (optional, for heterogeneous networks)"
            edges:
                multivalued: true
                range: Edge
                inlined_as_list: true
                description: "List of directed edges with coupling references (optional, for explicit edge definition)"
            primary_weight:
                range: string
                description: >-
                    Name of the edge group that should serve as the canonical
                    weights matrix when ``weights_matrix`` is queried. Lets a
                    single Network sidecar bundle several connectivity variants
                    (e.g. band-specific NMF reweightings, distance-modulated SC,
                    shuffled controls) under different edge names while still
                    presenting one of them as the active weight to consumers
                    (simulators, observation pipelines). Defaults to ``weight``
                    / ``weights`` / ``sc`` lookup when not set.
            coupling:
                multivalued: true
                range: Coupling
                description: "Reusable coupling configurations referenced by edges (e.g., 'instant', 'delayed', 'inhibitory')"
                inlined: true
            dynamics:
                multivalued: true
                range: Dynamics
                inlined: true
                description: "Dictionary of dynamics models keyed by name. Nodes reference these by name. For heterogeneous networks with per-node dynamics."
            node_template:
                range: Node
                required: false
                inlined: true
                description: >-
                    Default Node attributes applied to every Node in this
                    Network. Explicit entries in `nodes:` override the template
                    field-by-field (shallow replace, same semantics as
                    `dict.update`). Reserved per-Node slots (id, label,
                    position, region) come from the data backbone
                    (Network.iri-loaded parcellation or procedural generator)
                    and are ignored if set on the template. Lets a homogeneous
                    Network declare its per-Node configuration once without
                    enumerating regions.
            edge_template:
                range: Edge
                required: false
                inlined: true
                description: >-
                    Default Edge attributes applied to every Edge in this
                    Network. Explicit entries in `edges:` override the template
                    field-by-field. Reserved per-Edge slots (source, target,
                    weight, delay, distance) come from the data backbone
                    (loaded matrix or procedural generator) and are ignored if
                    set on the template.

            # Network metadata
            number_of_nodes:
                range: integer
                description: "Number of nodes in the network (derived from nodes if not set)"
                aliases:
                    - number_of_nodes
                    - number_of_regions
            coordinate_space:
                range: CommonCoordinateSpace
                inlined: true
                description: "Coordinate space for node positions (e.g., MNI152NLin2009c). Mirrors BrainAtlas.coordinateSpace so network node positions are unambiguous."
            parcellation:
                range: Parcellation
                description: "Brain parcellation/atlas reference"
                inlined: true
            tractogram:
                range: Tractogram
                inlined: true
                description: "Reference to tractography data"
            mesh:
                range: Mesh
                inlined: true
                description: >-
                    Optional triangle mesh geometry. When set, the Network
                    carries triangle faces (and optionally normals,
                    curvature) alongside its node coordinates. Used by
                    surface-based observations (cortical wave detection,
                    Helmholtz-Hodge decomposition, spectrospatial mode
                    analysis). Mesh face data lives in the same h5
                    companion under a ``mesh/`` group.
            transforms:
                range: Function
                multivalued: true
                inlined_as_list: true
                description: >-
                    Ordered list of transforms applied to edge property matrices.
                    Each Function's name identifies the target edge property
                    (e.g. 'weight', 'length'). Supports equation-based (symbolic)
                    or callable-based (software) transforms. Multiple transforms
                    on the same target are applied sequentially.

            # BIDS integration (BEP017)
            data_file:
                range: string
                description: >-
                    Path to companion data file. Supported extensions:
                    .h5 (HDF5), .zarr/ (Zarr), .csv (legacy single-matrix).
                    Null if no companion data needed.
            descriptor:
                range: string
                description: >-
                    Short alphanumeric identifier for the BIDS desc- filename
                    entity (e.g., SC, FC, EC, SCFC). Classifies the connectivity
                    modality of the network's edge measures.
            bids_dir:
                range: string
                description: "Path to BEP017-compliant BIDS directory for loading connectivity matrices"
            bids:
                range: BidsEntities
                inlined: true
                description: "BIDS filename entities for this dataset"
            structural_measures:
                range: string
                multivalued: true
                description: "BEP017 measure names for structural connectivity (e.g., streamlineCount, tractLength)"
            observational_measures:
                range: string
                multivalued: true
                description: "BEP017 measure names for observational targets (e.g., BoldCorrelation)"

            provenance:
                range: Provenance
                inlined: true
                description: "W3C PROV-O aligned provenance"
            parent_network:
                range: string
                description: >-
                    Path/URI to parent (coarser) Network. When set,
                    this network is a refinement where each node maps
                    to exactly one parent node via node_mapping.
            node_mapping:
                range: string
                description: >-
                    HDF5 dataset path for node-to-parent mapping.
                    Int32 array of shape (N,) where entry i is the
                    parent node ID. Required when parent_network is set.

            distance_unit:
                range: UnitEnum
                description: "Unit for distances/lengths in the network"
                ifabsent: string(mm)
            time_unit:
                range: UnitEnum
                description: "Default time unit for the network"
                ifabsent: string(ms)

            edge_matrix_files:
                range: File
                multivalued: true

            graph_generator:
                range: GraphGenerator
                inlined: true
                description: >
                    Graph generator specification.  When set, overrides explicit
                    edges/nodes for graph construction.  The type field is a free
                    string; StandardGraphType lists well-known types that get
                    automatic code generation across backends.

    GraphGenerator:
        class_uri: tvbo:GraphGenerator
        description: >
            Backend-agnostic graph generator specification.  Captures the
            mathematical family and its parameter declarations so that each
            backend can emit the correct constructor call (Graphs.jl, NetworkX,
            etc.) via per-backend ``bindings``; derived generators may also
            carry a symbolic ``procedure``.  The number of nodes is always
            taken from Network.number_of_nodes.
        slots:
            - name
            - description
            - iri
        attributes:
            type:
                range: string
                description: >
                    Optional graph family name.  Use a StandardGraphType value
                    for automatic backend mapping, or any custom string for
                    documentation purposes.  When absent, the backend
                    ``bindings`` determine construction directly.
            seed:
                range: integer
                description: "Random seed for reproducible graph generation."
            directed:
                range: boolean
                ifabsent: boolean(false)
                description: "Whether to generate a directed graph."
            parameters:
                range: Parameter
                multivalued: true
                inlined: true
                description: >
                    Generator parameters keyed by name (e.g. n, k, p, seed).
                    A curated entry *declares* each parameter's interface via
                    the general ``Parameter`` slots — ``datatype`` (its type),
                    ``default`` (fallback when absent) and ``required`` — while
                    a concrete experiment supplies the same key by ``value``.
                    Builder (Callable) generators receive the resolved values as
                    keyword arguments; declarative library generators pass them
                    positionally via the per-backend ``bindings`` map. The number
                    of nodes is always taken from Network.number_of_nodes.
            bindings:
                range: Binding
                multivalued: true
                inlined: true
                description: >
                    Per-backend construction bindings, keyed by backend id
                    (e.g. python, julia, networkx).  Each names the native
                    library, callable and the ordered parameter names to pass.
            procedure:
                range: Procedure
                inlined: true
                description: >
                    Optional symbolic procedure for derived generators
                    (e.g. null-model shuffles): ordered steps and named
                    outputs, each carrying an Equation.
            builder:
                range: Callable
                inlined: true
                description: >
                    Optional Python callable that builds the network at YAML
                    load time. When set, ``Network._resolve`` imports
                    ``<module>.<name>`` and invokes it with the
                    ``parameters`` block as keyword arguments. The callable
                    must return either a ``Network`` instance or a tuple
                    ``(weights, lengths, node_params)``. Use the existing
                    ``Callable`` slots (``name`` is the function name,
                    ``module`` is its dotted module path). Reuses the same
                    idiom as TVB monitor class references; no free
                    ``module:function`` strings.

    Binding:
        class_uri: tvbo:Binding
        description: >-
            Per-backend construction binding for a GraphGenerator: how to build
            the graph in a specific target library.  Keyed by backend id — the
            ``name`` is the backend (e.g. python, julia, networkx).
        slots:
            - name
        attributes:
            library:
                range: string
                description: "Native library/module providing the callable."
            callable:
                range: string
                description: "Name of the constructor function in the library."
            args:
                range: string
                multivalued: true
                description: "Ordered parameter names passed to the callable."

    Procedure:
        class_uri: tvbo:Procedure
        description: >-
            Symbolic procedure: an ordered list of steps producing named
            outputs.  Documents a derived generator's algorithm independently
            of any backend binding.
        attributes:
            steps:
                range: ProcedureStep
                multivalued: true
                inlined_as_list: true
                description: "Ordered intermediate steps."
            output:
                range: ProcedureStep
                multivalued: true
                inlined: true
                description: "Named outputs (keyed by name), e.g. 'weights'."

    ProcedureStep:
        class_uri: tvbo:ProcedureStep
        description: >-
            A single named step (or output) in a Procedure, carrying the
            Equation that defines it.
        slots:
            - name
            - description
        attributes:
            equation:
                range: Equation
                inlined: true
                description: "The equation defining this step/output."

    File:
        class_uri: tvbo:File
        slots:
            - name
            - description
        attributes:
            type:
                range: string
            path:
                range: string
            extension:
                range: string

    Reference:
        class_uri: tvbo:Reference
        description: >-
            A small typed pointer to another TVBO entity (Network, Mesh,
            Observation, …). The ``iri`` identifies the target via the
            registry; the optional ``field`` is a dotted-path subkey
            resolved by attribute walk on the loaded target (e.g.
            ``field: 'weight_alpha'`` picks the ``weight_alpha`` named
            edge matrix on a Network; ``field: 'mesh.faces'`` picks the
            mesh face array). Used uniformly anywhere a TVBO entity
            needs to point at a sub-array of another entity without
            inlining the data.
        attributes:
            iri:
                # uriorcurie (not string) to match the global `iri` slot's range
                # (xsd:anyURI); a local `string` range conflicts with the global
                # anyURI range on the shared `tvbo:iri` property and makes this
                # class unsatisfiable under OWL-DL.
                range: uriorcurie
                required: true
                description: "CURIE or full IRI of the referenced TVBO entity."
            field:
                range: string
                description: >-
                    Optional dotted-path subkey into the referenced entity
                    (e.g. ``weight_alpha`` for a Network's named edge
                    matrix, ``mesh.faces`` for the face array, or
                    ``nodes.ef_alpha`` for a per-node scalar field).
                    Resolved by attribute walk at load time.

    Node:
        class_uri: tvbo:Node
        description: "A node in a network with its own dynamics and properties"
        slots:
            - label
            - description
            - parameters
            - record
        slot_usage:
            record:
                ifabsent: true
        attributes:
            id:
                range: integer
                required: true
                slot_uri: dcterms:identifier
                description: "Unique node identifier"
            dynamics:
                range: Dynamics
                required: false
                description: "Dynamics model governing this node's behavior. Can be a reference (by name) or inline definition. If not provided, uses experiment's dynamics."
                inlined: false
            position:
                range: Coordinate
                description: "Spatial coordinates (x, y, z) of the node"
                inlined: true
            region:
                range: string
                description: "Brain region or anatomical label"
            state:
                multivalued: true
                range: StateValue
                inlined: true
                description: "Per-node initial state variable values, keyed by state variable name."
            events:
                multivalued: true
                range: Event
                inlined: true
                description: "Events attached to this node (e.g., threshold-based state changes)."
            subnetwork:
                range: Network
                required: false
                inlined: true
                description: >-
                    Optional finer-scale Network that "lives inside" this Node
                    (network-of-networks / multi-scale primitive). The
                    subnetwork's nodes map (one-to-many) to this single parent
                    Node. Cross-scale signal flow is declared as ordinary Edges
                    in the subnetwork's `edges` list, using `source_network`
                    / `target_network` with the `parent` sentinel to traverse
                    up the hierarchy. The subnetwork may carry its own
                    `graph_generator` (discrete sub-network — reservoir,
                    spiking population, jaxley compartments) and/or `mesh`
                    (continuous surface field) — one unified slot for
                    reservoirs-per-region, spiking-populations-per-region,
                    cells-per-region, and surface-mesh-patches-per-region.
                    Recursive: a subnetwork's Nodes can themselves carry
                    subnetworks.

    StateValue:
        class_uri: tvbo:StateValue
        description: "A named state variable value for per-node initialization."
        slots:
            - name
            - value

    Edge:
        class_uri: tvbo:Edge
        description: "An edge in a network. Two modes: explicit (source+target set, scalar parameters in YAML) or template (no source/target, N×N matrix measure in HDF5). Both coexist in the same edges list."
        slots:
            - label
            - description
            - parameters
        attributes:
            source:
                range: integer
                required: false
                description: "Source node ID (set for explicit edges, absent for template edges)"
            target:
                range: integer
                required: false
                description: "Target node ID (set for explicit edges, absent for template edges)"
            weight:
                range: float
                description: "Connection weight (explicit edges)"
            delay:
                range: float
                description: "Conduction delay (explicit edges, ms)"
            distance:
                range: float
                description: "Edge length / tract distance (explicit edges, mm)"
            unit:
                range: string
                description: "Unit for matrix values (template edges only)"
            format:
                range: SparseFormat
                description: "Storage format in HDF5 (template edges only)"
            weighted:
                range: boolean
                ifabsent: boolean(true)
                description: "Matrix entries carry weights (not just 0/1)"
            valid_diagonal:
                range: boolean
                ifabsent: boolean(false)
                description: "Self-connections are meaningful"
            non_negative:
                range: boolean
                ifabsent: boolean(true)
                description: "All values >= 0"
            source_var:
                range: string
                description: "Output variable from source node to use (e.g., 'x_out'). If not specified, uses first output variable from source dynamics."
            target_var:
                range: string
                description: "Input variable on target node to connect to (e.g., 'c_in'). If not specified, uses first coupling input from target dynamics."
            coupling:
                range: Coupling
                required: false
                description: "Coupling function for this edge. Can be a reference (by name) to coupling or inline definition. If not provided, uses experiment's default coupling."
                inlined: false
            directed:
                range: boolean
                ifabsent: false
                description: "Whether the edge is directed. If false, represents a symmetric/bidirectional connection."
            source_network:
                range: string
                required: false
                description: >-
                    Path or name of the Network whose nodes define the source
                    endpoints of this Edge. Symmetric counterpart to
                    `target_network`. Together they let an Edge bridge any
                    two Networks: both unset (within-Network edge), one set
                    (this Network ↔ the named one), or both set (peer-to-peer
                    projection between two other Networks). Accepts either an
                    absolute IRI (peer Network) or the relative-path sentinel
                    `parent` / `parent/parent` (cross-scale up/down via the
                    Node.subnetwork hierarchy).
            target_network:
                range: string
                required: false
                description: >-
                    Path or name of the Network whose nodes define the target
                    endpoints (e.g. the columns of a non-square projection
                    matrix such as a gain matrix region → EEG sensors). Also
                    accepts the relative-path sentinel `parent` /
                    `parent/parent` for cross-scale signal flow up the
                    Node.subnetwork hierarchy. One mechanism handles both
                    projection matrices (absolute IRI) and multi-scale
                    boundaries (sentinel).
            dimension_labels:
                multivalued: true
                range: string
                required: false
                description: >-
                    Ordered labels for the matrix columns (dim-1) when the
                    matrix is non-square.  Row labels (dim-0) are the parent
                    Network's node labels.  Stored as HDF5 dimension scales
                    in the companion file.
            dynamics:
                range: Dynamics
                required: false
                inlined: false
                description: >-
                    Dynamics model for this edge. When specified, the edge has
                    its own state variables and ODE (EdgeModel with f in ND.jl).
                    Uses the same Dynamics class as nodes — state_variables define
                    edge states, derived_variables define observables, output defines
                    what is visible for plotting/analysis. The coupling_function on
                    Coupling still defines how vertex outputs map to edge outputs
                    for aggregation at vertices.
            events:
                multivalued: true
                range: Event
                inlined: true
                description: "Events attached to this edge (e.g., threshold-based line tripping)."

    Observation:
        description: >-
            Unified class for all observation/measurement specifications.
            Covers monitors (BOLD, EEG), tuning observables, and derived quantities.
            Pipeline is a sequence of Functions with input -> output flow.
        class_uri: tvbo:Observation
        slots:
            - name
            - acronym
            - label
            - description
            - equation
            - parameters
            - environment
            - time_scale
        attributes:
            # Source specification - what this observation derives from.
            # Each entry is either a state-variable name/ref (raw observation
            # of an integrated trajectory) or another observation's name/ref
            # (derived observation). An observation is "derived" iff any item
            # in source names another observation in the same experiment.
            source:
                multivalued: true
                any_of:
                    - range: StateVariable
                    - range: Observation
                description: >-
                    Ordered list of inputs this observation derives from.
                    Each entry is either a StateVariable reference (raw
                    observation of an integrated trajectory, e.g. ``S_e``)
                    or an Observation reference (derived observation, e.g.
                    ``bold``). Codegen checks each source name against
                    ``experiment.observations``; names matching an existing
                    observation flag the parent as derived.
                inlined: false

            # Auxiliary inputs that are NOT state variables (mesh arrays,
            # empirical reference data, named edge matrices on another
            # Network, …). Each Reference resolves to a concrete array at
            # load time via the registry + lazy h5 store; codegen threads
            # the resolved arrays into pipeline-step argument lists.
            aux_data:
                range: Reference
                multivalued: true
                inlined: true
                inlined_as_list: true
                description: >-
                    Ordered list of auxiliary inputs the observation
                    pipeline consumes. Examples: a Surface mesh's faces
                    array, an empirical FC matrix on a reference Network,
                    or another Observation's output. Resolved load-time
                    eagerly; rendered code is self-contained.

            # Monitor attributes (for BOLD, EEG, etc.)
            period:
                range: float
                description: "Sampling period for monitors (ms). For BOLD: TR in ms."
            downsample_period:
                range: float
                description: "Intermediate downsampling period (ms). For BOLD: typically matches dt."
            voi:
                range: integer
                description: "Variable of interest index (which state variable to monitor). Default: 0."
            imaging_modality:
                range: ImagingModality
                description: "Type of imaging modality (BOLD, EEG, MEG, etc.)"
            warmup_source:
                range: string
                description: "Reference to transient simulation result for history initialization (e.g., 'result_init')."

            # External data loading (makes empirical data an Observation too)
            data_source:
                range: DataSource
                inlined: true
                description: >-
                    Load data from external source (file, database, API).
                    When specified, this observation represents empirical/external data
                    rather than simulated data. Enables unified treatment of all data.

            # Observable/aggregation attributes (for tuning algorithms)
            skip_t:
                range: integer
                description: "Number of samples to skip at the start (transient removal). For FC: typically 10-20 TRs."
            tail_samples:
                range: integer
                description: "Number of samples from the end to use. Takes the last N samples before aggregation. E.g., tail_samples: 500 means use data[-500:]."
            aggregation:
                range: AggregationType
                description: "How to aggregate over time"
            window_size:
                range: integer
                description: "Number of samples for windowed aggregation"

            # Processing pipeline (sequence of Functions with input -> output flow)
            pipeline:
                description: "Ordered sequence of Functions. Each step has a unique `name` (used to key step outputs) and transforms input -> output. List form preserves execution order."
                multivalued: true
                inlined: true
                inlined_as_list: true
                range: FunctionCall

            # Direct class reference (alternative to pipeline)
            class_reference:
                description: >-
                    Direct class reference (alternative to pipeline). Use for external library
                    classes like tvboptim.Bold, custom monitors, or any callable class.
                    The class is instantiated with constructor_args and called with call_args.
                    Example: {name: Bold, module: tvboptim.observations.tvb_monitors.bold,
                    constructor_args: [{name: period, value: 1000.0}]}
                range: ClassReference
                inlined: true
            analysis:
                range: Analysis
                inlined: true
                description: >-
                    Marks this observation as an analysis observable that operates
                    on the solve/loss rather than a result-data pipeline (autodiff
                    gradient, finite-difference gradient, or Lyapunov spectrum).

    Analysis:
        class_uri: tvbo:Analysis
        description: >-
            A general analysis observable: a quantity obtained by ANALYZING the model,
            its solve, or a derived loss, rather than by transforming the recorded
            trajectory. It is deliberately broad — the same concept covers parameter
            sensitivities/gradients (autodiff or finite-difference), stability spectra
            (Lyapunov), bifurcation quantities, identifiability/Fisher-information
            metrics, and future analyses. `type` names the analysis (extensible);
            `target` and `wrt` bind it to what is analyzed and with respect to what;
            `parameters` carries the analysis-specific configuration. Backend-neutral:
            each backend maps `type` to its own machinery, or emits a comment and
            skips when it has no equivalent (it does not raise).
        slots:
            - parameters
        attributes:
            type:
                range: string
                description: >-
                    The analysis kind, e.g. 'gradient', 'finite_difference',
                    'lyapunov', 'bifurcation', 'identifiability', 'sensitivity'.
                    Extensible — backends dispatch on it.
            target:
                range: string
                description: >-
                    What is analyzed: typically an observation or loss name (e.g.
                    'loss' for a gradient). Omitted when the analysis acts on the
                    whole solve (e.g. a Lyapunov spectrum).
            wrt:
                range: string
                multivalued: true
                description: >-
                    Quantity/quantities the analysis is taken with respect to, e.g.
                    a parameter 'c_sigmJR.G' for a gradient/sensitivity. Omitted for
                    analyses that need no explicit differentiation target.

    # ProcessingStep, DataInjection, ArgumentMapping removed
    # Function now handles input -> process -> output flow directly

    Dynamics:
        class_uri: tvbo:Dynamics
        comments:
            - Successor class replacing deprecated NeuralMassModel.
        aliases:
            - NeuralMassModel
        slots:
            - has_reference
            - name
            - label
            - iri
            - parameters
            - description
            - source
            - references
            - dataLocation
        slot_usage:
            name:
                ifabsent: "Dynamics"
            system_type:
                ifabsent: "continuous"
        attributes:
            derived_parameters:
                multivalued: true
                range: DerivedParameter
                inlined: true
            derived_variables:
                multivalued: true
                range: DerivedVariable
                inlined: true
            coupling_terms:
                multivalued: true
                range: Parameter
                inlined: true
            coupling_inputs:
                multivalued: true
                range: CouplingInput
                inlined: true
            state_variables:
                multivalued: true
                range: StateVariable
                inlined: true
            modified:
                range: boolean
            output:
                multivalued: true
                range: string
                description: "Output variable names to include in simulation results. References to state_variables or derived_variables by name."
                deprecated: >-
                    Use 'record: true' on the derived variable (or 'record' on the
                    state variable) instead. The 'output' list is retained for
                    backward compatibility.
            derived_from_model:
                range: Dynamics
            number_of_modes:
                range: integer
                ifabsent: integer(1)
            local_coupling_term:
                range: Parameter
            functions:
                multivalued: true
                range: Function
                inlined: true
            stimulus:
                range: Stimulus
                inlined: true
            modes:
                multivalued: true
                range: Dynamics
                inlined: true
                aliases:
                    - components
            model_type:
                range: ModelType
                description: >-
                    Coarse classification of this model (mean_field, neural_mass,
                    phase_oscillator, phenomenological, spiking, generic, field).
                    Used for filtering in Dynamics.list_db(model_type=...).
            system_type:
                range: SystemType
            autonomous:
                range: boolean
                ifabsent: "true"
                description: "Whether the system is autonomous (equations do not depend explicitly on time t). Non-autonomous systems have explicit time dependence, e.g. f*cos(omega*t)."
            observed:
                multivalued: true
                range: DerivedVariable
                inlined: true
                description: >-
                    Observable functions computed from states, inputs, and parameters
                    after simulation. Unlike derived_variables (which are intermediate
                    algebraic expressions used within the ODE), observed variables
                    are post-hoc quantities recoverable from the solution.
                    Maps to obsf/obssym in ND.jl EdgeModel/VertexModel.
                    Example: absolute force magnitude computed from force components.
            events:
                multivalued: true
                range: Event
                inlined: true
                description: >-
                    Discrete state transitions intrinsic to the dynamical system,
                    such as threshold-triggered resets in spiking neuron models.
                    Unlike experiment-level events (stimulation, perturbation),
                    these define the model's own discontinuous behavior.
            cse:
                range: boolean
                ifabsent: false
                description: >-
                    Code-generation hint (opt-in, backend-independent): eliminate
                    common subexpressions. When true, the generator evaluates each
                    repeated subexpression — including repeated calls to
                    model-defined functions — once and reuses the result instead of
                    re-emitting it at every occurrence. Purely a performance hint:
                    results are numerically identical. A backend whose compiler
                    already performs this elimination may honour it as a no-op. Off
                    by default (expressions are emitted in flat form).
            compile:
                range: boolean
                ifabsent: false
                description: >-
                    Code-generation hint (opt-in, backend-independent): request that
                    the generated dynamics be compiled to machine code rather than
                    interpreted, where the target backend supports it. Purely a
                    performance hint with no effect on results; a backend that is
                    inherently compiled (or cannot compile) honours it as a no-op.
                    Off by default. Independent of, and composable with, ``cse``.

    StateVariable:
        class_uri: tvbo:StateVariable
        slots:
            - name
            - symbol
            - label
            - definition
            - domain
            - description
            - equation
            - unit
            - record
            - grounding
        slot_usage:
            record:
                ifabsent: true
        attributes:
            variable_of_interest:
                range: boolean
                ifabsent: true
                deprecated: >-
                    Use 'record' instead. A state variable is recorded in the
                    output when record=true (the default); set record=false to
                    suppress it. 'variable_of_interest' is retained for backward
                    compatibility and is ignored by the TVB/jax/rateml codegen.
            coupling_variable:
                range: boolean
                ifabsent: false
                description: >-
                    Whether this state variable is transmitted to connected nodes
                    through the coupling function. In TVB terms, this determines
                    the cvar indices (state variables extracted from history and
                    fed into the coupling function). The coupling function may
                    override this via its incoming_states attribute.
            equation_type:
                range: string
                ifabsent: "string(differential)"
                description: >-
                    Type of equation: 'differential' (default) means dx/dt = rhs,
                    'algebraic' means 0 = rhs or x ~ rhs (DAE constraint).
                    Algebraic equations are used by ModelingToolkit.jl backend.
            equation_order:
                range: integer
                ifabsent: int(1)
                description: >-
                    Order of the time derivative on the LHS. Default 1 means
                    dx/dt = rhs (first-order ODE). Order 2 means d²x/dt² = rhs
                    (second-order ODE), etc. Higher-order ODEs are automatically
                    lowered to coupled first-order systems by backends like
                    ModelingToolkit.jl via mtkcompile.
            noise:
                range: Noise
                inlined: true
            stimulation_variable:
                range: boolean
            initial_value:
                range: float
                ifabsent: float(0.1)
            derivative_initial_value:
                range: float
                description: >-
                    Initial value for the first time derivative, used when
                    equation_order > 1. For a second-order ODE d²x/dt² = f,
                    this sets dx/dt(0). Required by ModelingToolkit.jl to
                    fully specify higher-order initial value problems.
            distribution:
                range: Distribution
                inlined: true
                description: "Distribution for sampling initial conditions per node. If present, initial_value is used as fallback/mean."
            history:
                range: TimeSeries
                inlined: true

    Distribution:
        class_uri: tvbo:Distribution
        description: >-
            A probability distribution for sampling parameters or initial conditions.
            Standard distributions (Uniform, Gaussian) are specified by name and domain/parameters.
            Custom distributions use a Function for the PDF/sampling rule.
            Default name is Uniform when only domain is given.
        slots:
            - name
            - parameters
        slot_usage:
            name:
                ifabsent: string(Uniform)
        attributes:
            domain:
                range: Range
                inlined: true
                description: "Support of the distribution (sampling bounds). For Uniform this fully defines the distribution."
            function:
                range: Function
                inlined: true
                description: "Custom distribution function (PDF or sampling callable). Only needed for non-standard distributions."
            seed:
                range: integer
                description: "Random seed for reproducible sampling."
            axis:
                range: SamplingAxis
                ifabsent: "space"
                description: "Dimension along which the distribution is sampled. 'space' = per-node (default), 'time' = per-timestep (stochastic input)."
            correlation:
                range: Matrix
                inlined: true

    Parameter:
        class_uri: tvbo:Parameter
        slots:
            - name
            - label
            - symbol
            - definition
            - value
            - default
            - domain
            - reported_optimum
            - description
            - equation
            - unit
            - dataset_path
            - grounding
        attributes:
            comment:
                range: string
                slot_uri: rdfs:comment
            heterogeneous:
                range: boolean
            distribution:
                range: Distribution
                inlined: true
                description: "Distribution for heterogeneous per-node parameter sampling. Implies heterogeneous=true."
            source:
                range: uriorcurie
                required: false
                description: >-
                    Data source for this parameter's value. When set, the
                    value is loaded from the referenced entity rather than
                    being a YAML literal. The referent is typically a Network
                    with per-node parameters (dscalar pattern) or a flat
                    dataset (HDF5, TSV). Combine with `measure:` when the
                    source exposes multiple named measures. Distinct from
                    the global `iri:` slot, which is reserved for ontology
                    grounding.
            measure:
                range: string
                required: false
                description: >-
                    Selector into the source. When `source` points at a
                    Network with per-node parameters (or a dscalar with
                    multiple maps), picks which named measure to load. Aligns
                    with names listed in Network.structural_measures /
                    Network.observational_measures. Ignored when the source
                    resolves to a scalar/array dataset.
            free:
                range: boolean
            shape:
                range: string
            explored_values:
                multivalued: true
                range: float
                array: {}
            element_domains:
                multivalued: true
                range: Range
                inlined_as_list: true
                description: >-
                    Per-element domain overrides for heterogeneous parameters.
                    When specified, element_domains[i] overrides domain for element i
                    during exploration auto-expansion. Length must match parameter shape
                    (e.g., n_nodes for shape "(n_nodes,)"). If not set, all elements
                    share the same domain.
            datatype:
                range: string
                description: >-
                    Declared value type of this parameter, given as a schema
                    range name — a primitive (``integer``, ``float``,
                    ``string``, ``uriorcurie``) or a class (e.g.
                    ``Distribution``). Documents the expected type when the
                    parameter is a *declaration* carrying no concrete ``value``
                    (e.g. a GraphGenerator's typed argument interface). Distinct
                    from ``domain`` (numeric bounds) and ``unit``.
            required:
                range: boolean
                description: >-
                    Whether a value for this parameter must be supplied.
                    Optional parameters (e.g. a generator's ``seed``) set this
                    to false. Declaration metadata; unset means unconstrained.

    CouplingInput:
        class_uri: tvbo:CouplingInput
        description: "Specification of a coupling input channel for multi-coupling dynamics"
        slots:
            - name
            - description
        attributes:
            source:
                range: string
                description: "Name of the coupling function that feeds this input. When omitted, resolved automatically: (1) same name as a coupling function → direct match, (2) single coupling input and single coupling function → auto-mapped, (3) multiple of each → positional order."
            dimension:
                range: integer
                ifabsent: integer(1)
                description: "Dimensionality of the coupling input (number of coupled values)"
            keys:
                multivalued: true
                range: string
                description: "Named keys for multi-dimensional coupling. When dimension > 1, provides symbolic names for each index (e.g., keys: [lre, ffi] for dimension: 2). Used in equations as variable names."
            local:
                range: boolean
                ifabsent: boolean(false)
                description: >-
                    Marks this as a LOCAL (surface/local-connectivity) coupling term
                    rather than a global long-range coupling. Local terms are never
                    wired to the connectome; they evaluate to 0 unless a local/surface
                    connectivity is supplied (TVB's ``local_coupling``). Global
                    coupling inputs (the default) are driven by ``Network.coupling``.

    Argument:
        class_uri: tvbo:Argument
        description: >-
            A function argument with explicit value specification.
            Value can be: literal (number/string), reference to input (input.key),
            or cross-observation reference (observation_name.output_key).
        slots:
            - name
            - description
        attributes:
            value:
                description: >-
                    Argument value. Can be:
                    - Literal: 1.0, "string", boolean, etc.
                    - Array (nested list): an array-valued constant such as a
                      per-node target vector consumed by the function.
                    - Input reference: "input.frequencies" (from source_observation outputs)
                    - Cross-observation: "target_frequencies.peak_freqs" (from another observation)
                range: ScalarValue
                any_of:
                  - range: ScalarValue
                  - array: {}
            unit:
                range: string

    Function:
        class_uri: tvbo:Function
        description: >-
            A function with explicit input -> transformation -> output flow.
            Can be equation-based (symbolic) or software-based (callable).
            In a pipeline, functions are chained: output of one becomes input of next.
        slots:
            - name
            - acronym
            - label
            - iri
            - equation
            - definition
            - description
            - requirements
        attributes:
            # Input specification (within pipeline context)
            input:
                description: >-
                    Simple input reference: name of previous function's output in pipeline.
                    For multi-argument functions, use arguments with value references instead.
                range: Function
                inlined: false
            # Output specification
            output:
                description: "Name for this function's output (referenced by subsequent functions)"
                range: string
            # Transformation definition (equation OR callable)
            arguments:
                description: >-
                    Variables consumed by the function (referenced in the
                    equation), keyed by argument name. Each value carries the
                    optional metadata (value, description, unit); the key is the
                    name (no redundant `name:` inside).
                multivalued: true
                range: Argument
                inlined: true
            output_equation:
                description: "Output transformation equation (if equation-based)"
                range: Equation
                inlined: true
            source_code:
                range: string
            callable:
                description: "Software implementation reference (if software-based)"
                range: Callable
                inlined: true
            # Pipeline metadata
            apply_on_dimension:
                description: "Which dimension to apply the transformation on"
                range: DimensionType
            aggregate:
                description: >-
                    How to aggregate the result across dimensions.
                    E.g., aggregate.over=node computes per-row (per-node) with keepdims.
                    The type field controls whether to reduce (mean/sum) or keep dimensions (none).
                range: Aggregation
                inlined: true
            time_range:
                description: "Time range for generated TimeSeries (for kernel generators). Equation is evaluated at each time point."
                range: Range
                inlined: true

    Aggregation:
        class_uri: tvbo:Aggregation
        description: >-
            Specifies how to aggregate values across a dimension.
            Used for loss functions to define per-element loss with reduction.
        attributes:
            over:
                description: "Dimension to aggregate over (e.g., node, time, state)"
                range: DimensionType
            type:
                description: "Aggregation operation (mean, sum, max, min, none)"
                range: ReductionType
                ifabsent: string(mean)

    LossFunction:
        class_uri: tvbo:LossFunction
        is_a: Function
        description: >-
            A loss function for optimization with optional aggregation.
            Extends Function with aggregation specification for per-element losses.
        attributes:
            aggregate:
                description: >-
                    How to aggregate the loss across dimensions.
                    Example: aggregate.over=node, aggregate.type=mean
                    computes loss per node, then averages.
                range: Aggregation
                inlined: true
    FunctionCall:
        class_uri: tvbo:FunctionCall
        description: >-
            Invocation of a function in a pipeline. Can reference a defined Function by name,
            OR inline a callable directly for external library functions,
            OR inline an equation, OR use class_call for class instantiation.
            Mirrors Function attributes so pipeline steps can be self-contained.
            The `name` is an optional step label (used in pipelines for keyed access to step outputs);
            it is NOT a global identifier (singleton uses like `loss`, `observable` may omit it).
        slots:
            - acronym
            - label
            - equation
            - description
        attributes:
            name:
                slot_uri: schema:name
                range: string
                description: "Optional step label; used in pipelines to key step outputs."
            function:
                description: "Reference to a defined Function (by name)"
                range: Function
                inlined: false
            callable:
                description: "Direct callable specification (alternative to function reference)"
                range: Callable
                inlined: true
            class_call:
                description: >-
                    Class instantiation and call (alternative to callable/function).
                    Use for external library classes that need __init__ then __call__.
                    Example: Bold monitor from tvboptim.
                range: ClassReference
                inlined: true
            input:
                description: "Reference to previous function's output in pipeline (by name)"
                range: string
            output:
                description: "Name for this step's output (referenced by subsequent functions)"
                range: string
            apply_on_dimension:
                description: "Dimension to apply function over (generates vmap in code). E.g., 'node' applies per-node."
                range: DimensionType
            aggregate:
                description: >-
                    How to aggregate the result across dimensions.
                    Example: aggregate.over=node, aggregate.type=mean
                    applies function per node, then averages. Used in loss functions.
                range: Aggregation
                inlined: true
            arguments:
                description: "Function arguments keyed by name (the key is the argument name)."
                range: Argument
                multivalued: true
                inlined: true
            time_range:
                description: "Time range for generated TimeSeries (for kernel generators)"
                range: Range
                inlined: true
            source_code:
                range: string

    Callable:
        class_uri: tvbo:Callable
        slots:
            - name
            - description
        attributes:
            module:
                range: string
            software:
                range: SoftwareRequirement
                inlined: true

    ClassReference:
        class_uri: tvbo:ClassReference
        description: >-
            Reference to a class that can be instantiated and called.
            Used for external library classes (e.g., tvboptim.Bold, custom monitors).
            The class is instantiated with constructor_args, then called with call_args.
            Generalizable pattern: works for tvboptim, TVB, or any Python class.
        is_a: Callable
        attributes:
            constructor_args:
                description: >-
                    Arguments passed to __init__ when instantiating the class.
                    Example: period=1000.0, downsample_period=4.0 for Bold monitor.
                multivalued: true
                range: Argument
                inlined_as_list: true
            call_args:
                description: >-
                    Arguments passed when calling the instance (__call__).
                    Usually the input data from simulation result.
                    Example: result (simulation output array).
                multivalued: true
                range: Argument
                inlined_as_list: true
            warmup_source:
                description: >-
                    Reference to transient simulation result for history initialization.
                    Some monitors (e.g., Bold) require history from warmup simulation.
                    Value should reference a simulation result name (e.g., 'result_init').
                range: string

    Case:
        class_uri: tvbo:Case
        attributes:
            condition:
                range: string
            equation:
                range: Equation
                inlined: true

    DerivedParameter:
        is_a: Parameter
        class_uri: tvbo:DerivedParameter
        slots:
            - name
            - symbol
            - description
            - equation
            - unit

    DerivedVariable:
        class_uri: tvbo:DerivedVariable
        attributes:
            conditional:
                range: boolean
                ifabsent: false
            cases:
                multivalued: true
                range: Case
                inlined: true
        slots:
            - name
            - label
            - symbol
            - description
            - equation
            - unit
            - record
            - grounding
        slot_usage:
            record:
                ifabsent: false

    Noise:
        class_uri: tvbo:Noise
        slots:
            - parameters
            - equation
        attributes:
            noise_type:
                range: string
                ifabsent: "gaussian"
            correlated:
                range: boolean
                ifabsent: false
            gaussian:
                range: boolean
                description: "Indicates whether the noise is Gaussian"
                ifabsent: false
            additive:
                range: boolean
                description: "Indicates whether the noise is additive"
                ifabsent: true
            seed:
                range: integer
                ifabsent: integer(42)
            random_state:
                range: RandomStream
                inlined: true
            intensity:
                description: "Optional scalar or vector intensity parameter for noise."
                range: Parameter
                inlined: true
            distribution:
                range: Distribution
                required: false
                inlined: true
                description: >-
                    Optional probability distribution from which the noise
                    draws its samples. When set, takes precedence over the
                    `noise_type` / `gaussian` flags — any Distribution
                    family is accepted (Uniform { lo, hi }, Normal
                    { mean, std }, LogNormal { mu, sigma }, Beta, …).
                    Reuses the existing Distribution class also used by
                    Parameter.distribution.
            function:
                description: "Optional functional form of the noise (callable specification)."
                range: Function
                inlined: true
            pycode:
                description: "Inline Python code representation of the noise process."
                range: string
            targets:
                description: "State variables this noise applies to; if omitted, applies globally."
                multivalued: true
                range: StateVariable
                inlined: true

    RandomStream:
        class_uri: tvbo:RandomStream
        slots:
            - label
            - description
            - dataLocation

    DataSource:
        class_uri: tvbo:DataSource
        description: "Specification for loading external/empirical data."
        slots:
            - name
            - label
            - description
        attributes:
            path:
                range: string
                description: "File path or URI to the data"
            loader:
                range: Callable
                inlined: true
                description: "Callable that loads the data (e.g., load_functional_connectivity)"
            format:
                range: string
                description: "Data format: 'npy', 'mat', 'csv', 'nifti', etc."
            key:
                range: string
                description: "Key/variable name within the file (for .mat, .npz, etc.)"
            preprocessing:
                range: Function
                inlined: true
                description: "Optional preprocessing to apply after loading"

    OptimizationStage:
        class_uri: tvbo:OptimizationStage
        description: >-
            A single stage in a multi-stage optimization workflow.
            Stages run sequentially, with each stage potentially using
            different parameters, shapes, learning rates, and algorithms.
        slots:
            - name
            - label
            - description
        attributes:
            free_parameters:
                multivalued: true
                range: FreeParameter
                inlined: true
                inlined_as_list: true
                description: >-
                    Parameters to optimize in this stage. Each entry is a
                    FreeParameter that references an existing Parameter by
                    dotted scope (e.g. "ReducedWongWang.w" or
                    "FastLinearCoupling.G") and supplies optimization-specific
                    metadata (heterogeneous, shape, bounds). No new Parameter
                    is created here.
            algorithm:
                range: string
                ifabsent: string(adam)
                description: "Optimizer for this stage: 'adam', 'adamw', 'sgd', etc."
            learning_rate:
                range: float
                ifabsent: float(0.001)
            max_iterations:
                range: integer
                ifabsent: integer(100)
            hyperparameters:
                multivalued: true
                range: Parameter
                inlined: true
                inlined_as_list: true
                description: "Stage-specific hyperparameters (e.g., b2=0.9999 for adam)"
            freeze_parameters:
                multivalued: true
                range: Parameter
                inlined: false
                description: "Parameters from previous stages to freeze (keep at optimized value but not update)"
            warmup_from:
                range: OptimizationStage
                inlined: false
                description: "Previous stage to initialize from. Final values from that stage become initial values for this stage."

    Optimization:
        class_uri: tvbo:Optimization
        is_a: OptimizationStage
        description: >-
            Configuration for parameter optimization.
            Inherits single-stage fields from OptimizationStage.
            For multi-stage workflows, use 'stages' (ignores inherited single-stage fields).
            Loss equation references observations directly by name.
        attributes:
            execution:
                range: ExecutionConfig
                inlined: true
                description: >-
                    Per-optimization execution configuration (overrides experiment-level defaults).
                    Useful for setting random_seed, precision, or hardware for optimization phase.
            # Integration settings for optimization (overrides experiment-level defaults)
            integration:
                range: Integrator
                inlined: true
                description: >-
                    Integration settings for optimization simulations (overrides experiment defaults).
                    If specified, creates a fresh model_fn and state with prepare() before optimization.
                    Can specify different duration, step_size, method than the experiment.
                    If not specified, uses experiment-level integration settings.
            # Loss specification - FunctionCall that references or inlines the loss function
            loss:
                range: FunctionCall
                inlined: true
                description: >-
                    Loss function call. Uses FunctionCall to either:
                    1. Reference existing function: function: rmse
                    2. Inline callable: callable: {module: ..., name: ...}
                    Arguments specify inputs (simulated_fc, empirical_fc, etc.)

            # Multi-stage optimization (preferred for complex workflows)
            stages:
                multivalued: true
                range: OptimizationStage
                inlined: true
                inlined_as_list: true
                description: >-
                    Ordered list of optimization stages. Stages run sequentially.
                    Stage n+1 starts from optimized values of stage n.
                    When defined, inherited single-stage fields are ignored.

            # Dependency on an upstream task (use its result state as starting point)
            depends_on:
                inlined: false
                any_of:
                    - range: Algorithm
                    - range: Exploration
                description: >-
                    Upstream task whose result seeds this optimization. An
                    `Algorithm` supplies a single tuned state (start from it). An
                    `Exploration` with an adaptive `strategy` (e.g. nsga2) supplies
                    a *front* of N non-dominated solutions: the optimization then
                    runs batched-parallel — one gradient refinement per Pareto seed —
                    reusing `parallel_mode`/`n_parallel`. If absent, optimization
                    starts from the initial simulation state. Forward-compatible with
                    the unified `Search.depends_on` (see dev/unified_search.md).

    # =============================================================================
    # Parameter Exploration
    # =============================================================================

    Exploration:
        class_uri: tvbo:Exploration
        description: "Parameter space exploration (grid search, sweep)."
        slots:
            - name
            - label
            - description
        attributes:
            execution:
                range: ExecutionConfig
                inlined: true
                description: >-
                    Per-exploration execution configuration (overrides experiment-level defaults).
                    Useful for setting random_seed, n_workers for parallel grid search.
            space:
                multivalued: true
                range: ExplorationAxis
                inlined: true
                description: >-
                    Exploration axes spanning the search space, keyed by the
                    dotted parameter reference each axis sweeps (e.g.
                    "ReducedWongWang.w" or "FastLinearCoupling.G"). Insertion
                    order is preserved and defines the grid axis order. Each axis
                    references an existing Parameter and supplies the Range to
                    sweep; no new Parameter is created here.
            parameters:
                multivalued: true
                range: Parameter
                inlined: true
                description: >-
                    Hyper-parameters of the exploration itself (e.g. tolerances,
                    sampler settings, grid-refinement controls), keyed by name.
                    Distinct from `space`, which defines what is being swept.
            algorithms:
                multivalued: true
                range: string
                description: >-
                    Names of the experiment's algorithms (keys in
                    `experiment.algorithms`) to run AT EACH exploration point, in
                    order, BEFORE computing the observable. Explicitly wires
                    algorithms into the exploration so per-point tuning / constraints
                    are applied at every sweep point — e.g. FIC re-tuning J_i at each
                    E/I ratio. With this set, the sweep evaluates the full
                    algorithm→observation pipeline per point (executed sequentially),
                    not a bare simulation. Empty/absent = bare simulation per point.
                    This is the declarative replacement for any Python per-point
                    driver: the composition is derived entirely from YAML metadata.
            mode:
                range: string
                ifabsent: string(product)
                description: "Combination mode: 'product' (full grid), 'zip' (paired)"
            strategy:
                range: string
                ifabsent: string(grid)
                description: >-
                    Search strategy over the decision space (the `space` axes).
                    'grid' (default) exhaustively evaluates the Cartesian/zip grid
                    of axis points — today's behaviour. 'nsga2' runs an adaptive
                    multi-objective genetic search (pymoo NSGA-II) that returns the
                    non-dominated Pareto front over `objectives`; axes then supply
                    only decision-variable bounds (domain lo/hi), and per-strategy
                    hyper-parameters (population_size, num_generations, seed,
                    reference_point) live in `parameters`. Extensible later to
                    'random' / 'sobol' / 'cmaes'. Forward-compatible with the
                    planned unified `Search.strategy` (see dev/unified_search.md).
            objectives:
                multivalued: true
                range: string
                description: >-
                    Names of observations minimised by an adaptive `strategy`
                    (e.g. 'nsga2'). Each entry references an existing observation
                    already framed lower-is-better (e.g. `one_minus_fc`, `psd_mae`).
                    Count sets the semantics: 0 → pure sweep (use `record`), 1 →
                    single-objective, ≥2 → multi-objective / Pareto. Ignored when
                    strategy is 'grid'. Forward-compatible with `Search.objectives`.
            observable:
                range: FunctionCall
                inlined: true
                description: "Observable to compute at each point. Use function: obs_name for simple observation, or function: func_name + arguments for FunctionCall."
            record:
                multivalued: true
                range: string
                description: >-
                    Names of observations to compute and record at EACH grid point,
                    stacked over the sweep into one array per name. Entries may be
                    derived observations (e.g. `loss`) or `analysis` diagnostics
                    (e.g. `ad_gradient`, `fd_gradient`, `lyapunov`) — this is how a
                    sweep of the diagnostics themselves is declared, replacing any
                    per-point Python driver. Complementary to `observable` (a single
                    scalar reduction); when both are absent the full observation Bunch
                    is recorded.
            n_parallel:
                range: integer
                ifabsent: integer(1)
                description: "Parallel evaluations"
            n_trials:
                range: integer
                ifabsent: integer(1)
                description: >-
                    Number of independent trials per grid point.
                    Each trial uses a different noise seed. Used for averaging
                    stochastic simulations (e.g., VEP = average of 20 trials).
            average:
                range: string
                description: >-
                    Averaging mode across trials. 'trials' = average over n_trials
                    independent runs (evoked potential paradigm). None = return all trials.
            parallel_mode:
                range: ParallelMode
                description: >-
                    How trial-axis parallelism is realised at codegen time.
                    ``vmap`` batches all trials in parallel (fast, peak memory
                    ~n_trials × per-trial working set). ``lax_map`` runs them
                    sequentially via ``jax.lax.map`` (slower, peak memory
                    bounded by one trial). ``pmap`` shards across devices for
                    multi-GPU. ``auto`` (default) picks ``vmap`` when the
                    estimated batched memory fits, ``lax_map`` otherwise.
            parallel_batch_size:
                range: integer
                description: >-
                    Chunk size for ``lax_map`` and chunked-``vmap`` modes.
                    ``1`` = strictly sequential (minimum memory). Larger
                    values amortise compile overhead across trials at the
                    cost of memory. Ignored when parallel_mode is ``vmap``
                    (which always uses the full n_trials axis).
            sweep_seeding:
                range: SweepSeeding
                ifabsent: string(independent)
                description: >-
                    How each sweep point's initial state is obtained.
                    'independent' (default) cold-starts every point from the
                    model's initial values, so points are order-independent and
                    may run in parallel (see parallel_mode). 'from_previous' seeds
                    each point from the final state of the preceding point, so the
                    trajectory follows the solution branch as the swept parameter
                    changes quasi-statically; this forces sequential execution (a
                    scan, not a vmap) and, with sweep_direction, exposes hysteresis
                    / multistability. It is forward-integration branch following,
                    not numerical continuation (cf. the Continuation class).
            sweep_direction:
                range: SweepDirection
                ifabsent: string(up)
                description: >-
                    Order in which a branch-following axis (sweep_seeding:
                    from_previous) is traversed: 'up' increases the parameter once,
                    'down' decreases it once, 'bidirectional' increases then
                    decreases over the same values and records both branches — a
                    hysteresis loop where they differ. Ignored when sweep_seeding
                    is 'independent'. Applies to a single swept axis.

    ExplorationAxis:
        class_uri: tvbo:ExplorationAxis
        description: >-
            One axis of a parameter exploration grid. Points to an existing
            Parameter (by dotted reference, e.g. "ReducedWongWang.w" or
            "FastLinearCoupling.G") and supplies the sweep specification
            (domain, explored_values, or per-element overrides).
            No new Parameter is created.
        slots:
            - label
            - description
        attributes:
            parameter:
                range: string
                required: true
                key: true
                # `key: true` drives dict-keying in the generated Python/JSON-Schema
                # loaders. The pydantic loader keys off a `name`/`id` identifier by
                # convention, so it also needs this explicit marker to inject the
                # collection key into `parameter` (LinkML consumes `key`/`identifier`
                # and omits them from the emitted metadata). See utils/pydantic_loader.
                annotations:
                    collection_key: true
                description: >-
                    Dotted reference to the Parameter being swept; also the key
                    of the enclosing `Exploration.space` collection.
                    Format: "<scope>.<param_name>" where <scope> is either a
                    Dynamics class name (e.g. "ReducedWongWang") or a coupling
                    key (e.g. "FastLinearCoupling"). Resolved against the
                    enclosing experiment at runtime.
            domain:
                range: Range
                inlined: true
                description: "Sweep range for this axis (lo, hi, n, step, log_scale)."
            transform:
                range: string
                ifabsent: string(none)
                description: >-
                    Optional decode applied to this axis's value before it is bound
                    to the referenced Parameter: 'none' (default) or 'log10' (the
                    parameter is set to 10 ** value, so an adaptive strategy searches
                    the raw bounds in log10 units — e.g. sigma searched over
                    domain {lo: -2.0, hi: -0.5}). Distinct from a logarithmic grid
                    *spacing*; this is an evaluation-time decode. Forward-compatible
                    with the harmonised `Axis` (see dev/tvboptim_harmonization.md).
            explored_values:
                multivalued: true
                range: float
                array: {}
                description: "Explicit list of values to sweep (overrides domain)."
            element_domains:
                multivalued: true
                range: Range
                inlined_as_list: true
                description: >-
                    Per-element sweep overrides for heterogeneous parameters
                    (e.g. shape "(n_nodes,)"). When set, element_domains[i]
                    replaces the shared domain for element i.
            builder:
                range: FunctionCall
                inlined: true
                description: >-
                    Callable that generates this axis's swept values, as an
                    alternative to domain / explored_values. Use when the points
                    cannot be written as a static list because each is an array
                    or depends on other results — e.g. per-count control-gain
                    vectors g whose entries are chosen from a runtime-computed
                    solitary-node ordering. The callable returns the stacked
                    sweep values (leading axis = sweep points); its `arguments`
                    may reference other observations by name. The value-supplying
                    analogue of graph_generator.builder, keeping computed sweeps
                    declarative rather than requiring a Python driver.
            unit:
                range: string
                description: "Optional axis unit (defaults to the referenced Parameter's unit)."

    FreeParameter:
        class_uri: tvbo:FreeParameter
        description: >-
            One degree of freedom in an OptimizationStage. References an
            existing Parameter by dotted scope (e.g. "ReducedWongWang.w"
            or "FastLinearCoupling.G") and supplies optimization-specific
            metadata (heterogeneous, shape, bounds, initial value).
            No new Parameter is created here.
        slots:
            - label
            - description
        attributes:
            parameter:
                range: Parameter
                inlined: false
                required: true
                description: >-
                    Dotted reference to the Parameter to optimize.
                    Format: "<scope>.<param_name>" where <scope> is either a
                    Dynamics class name or a coupling key.
            heterogeneous:
                range: boolean
                ifabsent: boolean(false)
                description: >-
                    If true, the parameter is optimized per-element
                    (broadcast to `shape`). If false, a single scalar is
                    optimized and broadcast at runtime.
            shape:
                range: string
                description: >-
                    Optimization shape as a Python-tuple-style string
                    (e.g. "(n_nodes,)" or "(n_nodes, n_nodes)").
                    Required when heterogeneous is true.
            initial_value:
                range: ScalarValue
                description: "Optional initial value for the optimizer (overrides the referenced Parameter's value)."
            domain:
                range: Range
                inlined: true
                description: "Optional bounds (lo, hi) for constrained optimization."

    # =============================================================================
    # Bayesian Inference
    # =============================================================================
    Inference:
        class_uri: tvbo:Inference
        description: >-
            Bayesian inference of model parameters from an observation, via MCMC. A
            standalone, first-class concept (NOT an Optimization): it produces a
            POSTERIOR, not a point estimate, using priors + a likelihood + a sampler
            instead of a loss + optimizer. It runs the SAME differentiable forward
            model, wrapped in a probabilistic model (sample priors -> forward ->
            likelihood).
        slots:
            - name
            - label
            - description
        attributes:
            priors:
                multivalued: true
                range: Prior
                inlined: true
                description: >-
                    Priors over the inferred parameters, keyed by each parameter's
                    dotted name (e.g. "Generic2dOscillator.eta" or
                    "PulseInput.amplitude"). The KEYS are the inferred parameters —
                    there is no separate free-parameter list.
            likelihood:
                range: Likelihood
                inlined: true
                required: true
                description: "Observation model p(data | sim(theta))."
            sampler:
                range: string
                ifabsent: string(nuts)
                description: "MCMC sampler ('nuts'). Each backend maps its own way."
            num_samples:
                range: integer
                ifabsent: integer(1000)
                description: "Posterior samples to draw."
            num_warmup:
                range: integer
                ifabsent: integer(1000)
                description: "Warmup/adaptation steps before sampling."
            num_chains:
                range: integer
                ifabsent: integer(1)
                description: "Independent MCMC chains."
            seed:
                range: integer
                ifabsent: integer(0)
                description: "PRNG seed for reproducible sampling."
            execution:
                range: ExecutionConfig
                inlined: true
                description: "Per-inference execution config (overrides experiment defaults)."
            integration:
                range: Integrator
                inlined: true
                description: "Forward-model integration settings (overrides experiment defaults)."
            depends_on:
                range: Algorithm
                inlined: false
                description: "Optional algorithm whose result state seeds the inference."

    Prior:
        class_uri: tvbo:Prior
        description: >-
            Prior belief over one inferred parameter. In `Inference.priors` the
            collection KEY is the parameter's dotted name; the value wraps a
            `Distribution` as the belief (reusing the standard distribution vocabulary
            rather than inventing a new one). Distinct from `Parameter.distribution`,
            which specifies per-node SAMPLING, not a prior.
        slots:
            - name
            - description
        attributes:
            distribution:
                range: Distribution
                inlined: true
                required: true
                description: >-
                    The prior distribution: e.g. {name: Normal, parameters: {mean, std}}
                    or {name: Uniform, domain: {lo, hi}}.

    Likelihood:
        class_uri: tvbo:Likelihood
        description: >-
            Observation model for Bayesian inference: p(data | sim(theta)). Points at
            the observation holding the data and specifies the noise family + scale.
            `name` is the noise family (default Normal); `source` uses the same
            referencing as `Observation.source`, so the observed data can come from
            this experiment's integration, an empirical network measure, or a
            runtime-bound array — one flexible hook, no data-loading path of its own.
        slots:
            - name
            - description
        slot_usage:
            name:
                ifabsent: string(Normal)
        attributes:
            source:
                multivalued: true
                range: string
                required: true
                description: "Observation(s) providing the observed data."
            sigma:
                range: float
                description: >-
                    Observation-noise scale of the likelihood. May deliberately differ
                    from the data's generative noise — it sets how tightly the
                    likelihood constrains the (possibly degenerate) parameter ridge.

    # =============================================================================
    # Iterative Tuning Algorithms (FIC, EIB, etc.)
    # =============================================================================

    UpdateRule:
        class_uri: tvbo:UpdateRule
        description: >-
            Defines how a parameter is updated based on observables.
            Represents iterative learning rules like FIC or EIB updates.
            Functions from experiment.functions are available in the equation.
        slots:
            - name
            - description
        attributes:
            target_parameter:
                range: Parameter
                inlined: true
                required: true
                description: The parameter to update (e.g., J_i, wLRE)
            equation:
                range: Equation
                inlined: true
                required: true
                description: >-
                    Update equation (e.g., 'J_i + eta * delta').
                    Can use functions defined in experiment.functions section.
            bounds:
                range: Range
                inlined: true
                description: Constraints on parameter values after update
            warmup:
                range: boolean
                description: >-
                    Whether to apply learning rate warmup to this update rule.
                    When true, the learning rate (eta) is scaled by (i+1)/n_iterations.
            requires:
                multivalued: true
                range: Observation
                description: Observables required by this update rule

    AlgorithmInclude:
        class_uri: tvbo:AlgorithmInclude
        description: >-
            Reference to an included algorithm with optional argument overrides.
            Allows combining algorithms with different hyperparameter values.
        attributes:
            algorithm:
                range: Algorithm
                inlined: false
                required: true
                description: Reference to the algorithm to include
            arguments:
                multivalued: true
                range: Parameter
                inlined: true
                inlined_as_list: true
                description: >-
                    Override hyperparameter values for the included algorithm.
                    Maps parameter names to new values.
            mode:
                range: AlgorithmCompositionMode
                ifabsent: "string(combined)"
                description: >-
                    How the included algorithm composes with the outer one.
                    'combined' (default) merges its update rules into the outer loop
                    (applied once per outer iteration); 'nested' runs it as a
                    converging inner loop on each outer iteration before the outer
                    update rules. Use 'nested' when the inner algorithm maintains an
                    invariant the outer would perturb (e.g. FIC holding the working
                    point while EIB retunes coupling).
            inner_iterations:
                range: integer
                description: >-
                    For mode=nested only: number of inner-loop iterations to run per
                    outer iteration. Defaults to the included algorithm's own
                    n_iterations. A small value (e.g. 5-10) is usually enough to
                    correct the drift introduced by one outer step.

    AlgorithmStage:
        class_uri: tvbo:AlgorithmStage
        description: >-
            One stage of a multi-stage tuning schedule. The algorithm body is run
            once per stage, in order, carrying the trajectory state, FC window
            buffer, and monitors forward — so the stages form one continuous online
            tuning run. Each stage overrides n_iterations and selected
            hyperparameters (e.g. Schirner 2023's 6 stages: eta halves and the FC
            window doubles per stage, sharpening the per-edge gradient over time).
        slots:
            - label
            - description
        attributes:
            n_iterations:
                range: integer
                required: true
                description: Number of outer iterations to run in this stage.
            arguments:
                multivalued: true
                range: Parameter
                inlined: true
                inlined_as_list: true
                description: >-
                    Hyperparameter overrides for this stage (e.g. eta, window_size).
                    Names not listed fall back to the algorithm's own hyperparameter
                    defaults.

    TuningObjective:
        class_uri: tvbo:TuningObjective
        description: >-
            Defines what the tuning algorithm optimizes for.
            Can be an activity target (FIC) or a connectivity target (EIB).
        slots:
            - label
            - description
        attributes:
            type:
                range: string
                description: "Type of objective: 'activity_target', 'fc_matching', 'custom'"
            target_variable:
                range: StateVariable
                inlined: false
                description: State variable for activity targets (e.g., S_e)
            target_value:
                range: float
                description: Target value for activity objectives
            target_data:
                range: Observation
                inlined: false
                description: Reference to empirical data observation for matching objectives
            metric:
                range: Equation
                inlined: true
                description: "Metric equation for matching (e.g., correlation, rmse)"

    Algorithm:
        class_uri: tvbo:Algorithm
        description: >-
            A complete specification of an iterative parameter tuning algorithm.
            Combines update rules, objectives, observations, and hyperparameters.
        slots:
            - name
            - description
        attributes:
            execution:
                range: ExecutionConfig
                inlined: true
                description: >-
                    Per-algorithm execution configuration (overrides experiment-level defaults).
                    Useful for setting random_seed per algorithm to ensure reproducibility.
            type:
                range: string
                description: "Algorithm type: 'fic', 'eib', 'homeostatic', 'custom'"
            includes:
                multivalued: true
                range: AlgorithmInclude
                inlined: true
                inlined_as_list: true
                description: >-
                    Include update rules from other algorithms with optional argument overrides.
                    Unlike depends_on (sequential), includes means combined execution.
                    Example: includes: [{algorithm: fic, arguments: [{name: eta, value: 0.1}]}]
            stages:
                multivalued: true
                range: AlgorithmStage
                inlined: true
                inlined_as_list: true
                description: >-
                    Optional multi-stage schedule. When present, the algorithm body is
                    run once per stage IN ORDER, carrying trajectory state, FC window
                    buffer, and monitors forward (one continuous online run). Each stage
                    overrides n_iterations + selected hyperparameters. Replaces the
                    top-level n_iterations for execution. Example (Schirner 2023): 6
                    stages with eta halving and window_size doubling per stage.
            objective:
                range: TuningObjective
                inlined: true
                description: What the algorithm optimizes for
            observations:
                multivalued: true
                range: Observation
                inlined: false
                description: >-
                    References to observations defined in the observations section.
                    Includes both simulated observations and external data (via data_source).
            update_rules:
                multivalued: true
                range: UpdateRule
                inlined: true
                inlined_as_list: true
                required: false
                description: >-
                    How parameters are updated each iteration.
                    When using 'includes', update_rules are inherited from included algorithms.
            hyperparameters:
                multivalued: true
                range: Parameter
                inlined: true
                inlined_as_list: true
                description: Additional algorithm-specific parameters
            learning_rate:
                range: float
                description: Learning rate (eta) for the tuning algorithm
            learning_rate_warmup:
                range: boolean
                ifabsent: boolean(false)
                description: >-
                    Linear warmup of learning rate from 0 to learning_rate over n_iterations.
                    eta_effective = eta * (i+1) / n_iterations
            n_iterations:
                range: integer
                description: Number of iterations to run
            learning_rate_schedule:
                range: string
                description: "Learning rate schedule: 'constant', 'linear', 'exponential'"
            simulation_period:
                range: float
                description: Duration of each simulation step (e.g., one BOLD TR)
            apply_every:
                range: integer
                ifabsent: integer(1)
                description: Apply update every N iterations
            functions:
                multivalued: true
                range: FunctionCall
                inlined: true
                inlined_as_list: true
                description: >-
                    Function calls for tracking progress, computing metrics, etc.
                    Each FunctionCall references a function from the experiment's functions section
                    and specifies arguments for that specific algorithm context.
            depends_on:
                multivalued: true
                range: Algorithm
                description: Other algorithms that must run first (e.g., EIB depends on FIC)

    # =============================================================================
    # Continuation & Bifurcation Analysis
    # =============================================================================
    # Abstract metadata — toolkit-agnostic. All attributes must apply to any
    # continuation engine (BifurcationKit, AUTO-07p, MatCont, COCO, …).
    # Toolkit-specific string options go in the `options` slot.
    # =============================================================================

    Option:
        class_uri: tvbo:Option
        description: >-
            A toolkit-specific key-value option (string name + string value).
            Used for backend settings that are not universal numeric parameters
            (e.g., solver name, tangent method, jacobian type).
        slots:
            - name
        slot_usage:
            name:
                required: true
                description: "Option name (key)."
        attributes:
            value:
                range: string
                required: true
                description: "Option value."

    Discretization:
        class_uri: tvbo:Discretization
        description: >-
            Discretization method for boundary value problems in continuation
            (periodic orbits, connecting orbits, quasi-periodic tori).
            Specifies the method; method-specific numerics go in parameters.
        slots:
            - parameters
        attributes:
            method:
                range: NumericalDiscretizationMethod
                ifabsent: string(collocation)
                description: "Discretization method."
            ode_solver:
                range: Solver
                inlined: true
                description: >-
                    ODE solver for flow-based methods (shooting, poincaré).
                    Specifies algorithm (e.g. Vern9, Rodas5) and tolerances.
                    Not needed for collocation or trapezoid.
            linear_solver:
                range: Solver
                inlined: true
                description: >-
                    Linear solver for the Newton bordered system.
                    E.g. COPBLS (collocation), MatrixBLS (shooting/poincaré).
            mesh_intervals:
                range: integer
                ifabsent: int(50)
                description: >-
                    Number of mesh intervals (time slices) for collocation
                    or trapezoid methods. Collocation: N in
                    PeriodicOrbitOCollProblem(N, m). Trapezoid: M in
                    PeriodicOrbitTrapProblem(M=...).
            degree:
                range: integer
                ifabsent: int(4)
                description: >-
                    Polynomial degree per mesh interval for collocation.
                    The m in PeriodicOrbitOCollProblem(N, m).
            n_sections:
                range: integer
                ifabsent: int(3)
                description: >-
                    Number of shooting sections for shooting or Poincaré
                    methods.
            options:
                multivalued: true
                range: Option
                inlined: true
                inlined_as_list: true
                description: "Toolkit-specific string options (jacobian type, etc.)."

    InitialState:
        class_uri: tvbo:InitialState
        description: >-
            How to obtain the starting equilibrium or periodic orbit for
            continuation. Most robust: time-integrate to steady state.
        attributes:
            method:
                range: InitialStateMethod
                ifabsent: string(time_integration)
                description: "Strategy for finding the initial state."
            duration:
                range: float
                ifabsent: float(2000.0)
                description: "Integration duration for time_integration method."
            abs_tol:
                range: float
                ifabsent: float(1e-10)
                description: "Absolute tolerance for ODE integration."
            rel_tol:
                range: float
                ifabsent: float(1e-10)
                description: "Relative tolerance for ODE integration."
            solver:
                range: Solver
                inlined: true
                description: >-
                    ODE solver for time_integration method.
                    Specify method (e.g., Tsit5, Heun, RK4) and tolerances.
            source_branch:
                range: string
                description: >-
                    Name of a previously computed branch (for from_branch method).
            source_point:
                range: string
                description: >-
                    Which point on the source branch: 'endpoint', 'hopf:1',
                    'fold:2', a step number, etc.

    BranchSwitch:
        class_uri: tvbo:BranchSwitch
        description: >-
            Specification for switching from a detected bifurcation point
            to a new branch (periodic orbits from Hopf, fold continuation,
            etc.). Each BranchSwitch says: "from which special point on the
            parent branch, continue what kind of object, with what settings."
            Override parent solver settings via the inline continuation field —
            only explicitly set attributes take effect; everything else is
            inherited from the parent Continuation.
        slots:
            - name
            - description
            - parameters
        attributes:
            # --- What to branch from ---
            source_point:
                range: string
                description: >-
                    Which bifurcation point to start from. Syntax:
                    - 'hopf:-1' = last Hopf (default)
                    - 'hopf:all' = all Hopf points
                    - 'hopf:1' = first Hopf
                    - 'fold:2' = second fold
                    - integer = specific special point index

            # --- Branching perturbation ---
            delta_p:
                range: float
                description: >-
                    Initial parameter offset from the bifurcation point.

            # --- Solver overrides (same type as parent — only set fields override) ---
            continuation:
                range: Continuation
                inlined: true
                description: >-
                    Override solver settings for this branch. Uses the same
                    Continuation type — only explicitly set attributes
                    override the parent's values.

            # --- Discretization (for periodic orbits, connecting orbits, etc.) ---
            discretization:
                range: Discretization
                inlined: true
                description: >-
                    Discretization method for the branch solution. Required
                    for periodic orbit branches (Hopf → PO). Not needed for
                    codim-2 branches (fold/Hopf continuation).

            # --- Direction ---
            bothside:
                range: boolean
                description: "Continue branch in both directions."

            # --- Toolkit-specific options ---
            options:
                multivalued: true
                range: Option
                inlined: true
                description: >-
                    Toolkit-specific string options for this branch
                    (linear solver, etc.).

    Continuation:
        class_uri: tvbo:Continuation
        description: >-
            Complete specification of a numerical continuation / bifurcation
            analysis. All universal solver settings live directly here.
            Toolkit-specific string options go in the options slot.
            When used inside a BranchSwitch, only explicitly set attributes
            override the parent's values.
        slots:
            - name
            - label
            - description
        attributes:
            # --- Dynamics reference ---
            dynamics:
                range: Dynamics
                inlined: false
                description: >-
                    Reference to the dynamical system model (by name).
                    Resolved from the experiment's dynamics dict at runtime.

            # --- What to vary ---
            free_parameters:
                multivalued: true
                range: Parameter
                inlined: true
                inlined_as_list: true
                description: >-
                    Parameters to vary. First parameter is primary (codim-1);
                    second enables codim-2 continuation. Each Parameter has
                    name + domain (Range with lo/hi bounds).

            # --- Step size control ---
            ds:
                range: float
                description: "Initial arc-length step size."
            ds_min:
                range: float
                description: "Minimum adaptive step size."
            ds_max:
                range: float
                description: "Maximum adaptive step size."
            max_steps:
                range: integer
                description: "Maximum continuation steps."

            # --- Newton corrector ---
            newton_tol:
                range: float
                description: "Absolute tolerance for Newton corrector convergence."
            newton_max_iterations:
                range: integer
                description: "Maximum Newton corrector iterations per step."

            # --- Eigenvalue / stability ---
            nev:
                range: integer
                description: >-
                    Number of eigenvalues to compute. Must be >= number of
                    state variables for reliable Hopf detection.
            tol_stability:
                range: float
                description: "Tolerance on real part of eigenvalue for stability boundary."

            # --- Bifurcation detection ---
            detect_bifurcation:
                range: integer
                description: >-
                    Bifurcation detection level.
                    0 = off, 1 = eigenvalues only, 2 = detect, 3 = locate precisely.
            detect_fold:
                range: boolean
                description: "Enable fold (limit point) detection."
            n_inversion:
                range: integer
                description: >-
                    Number of eigenvalue sign inversions to flag a bifurcation.
                    Must be even. Higher = fewer false positives.
            max_bisection_steps:
                range: integer
                description: "Maximum bisection steps for bifurcation point localization."

            # --- Continuation algorithm ---
            algorithm:
                range: ContinuationAlgorithm
                ifabsent: string(PALC)
                description: "Predictor-corrector algorithm."

            # --- Initial state ---
            initial_state:
                range: InitialState
                inlined: true
                description: >-
                    How to obtain the initial equilibrium. Default: time
                    integration to steady state.

            # --- Child branches ---
            branches:
                multivalued: true
                range: BranchSwitch
                inlined: true
                description: >-
                    Child branches to continue from detected bifurcation
                    points (PO from Hopf, fold continuation, etc.).

            # --- Bidirectional ---
            bothside:
                range: boolean
                description: "Continue in both directions from the starting point."

            # --- Execution / backend ---
            execution:
                range: ExecutionConfig
                inlined: true
                description: "Per-analysis execution configuration."
            software:
                range: SoftwareRequirement
                inlined: true
                description: "Backend engine (BifurcationKit, AUTO-07p, MatCont, etc.)."

            # --- Toolkit-specific options ---
            options:
                multivalued: true
                range: Option
                inlined: true
                inlined_as_list: true
                description: >-
                    Toolkit-specific string options (tangent method,
                    solver name, etc.).
    Solver:
        class_uri: tvbo:Solver
        description: >-
            Lightweight specification of a numerical ODE solver / integrator.
            Covers adaptive solvers (Vern9, Rodas5, Tsit5, etc.) used in
            shooting methods, initial-state integration, and other contexts
            where only the algorithm and tolerances matter.
        attributes:
            method:
                range: string
                ifabsent: string(Tsit5)
                description: >-
                    Solver algorithm name (e.g., Vern9, Rodas5, Tsit5,
                    euler, heun, rk4).
            abs_tol:
                range: float
                ifabsent: float(1e-10)
                description: "Absolute tolerance for adaptive solvers."
            rel_tol:
                range: float
                ifabsent: float(1e-10)
                description: "Relative tolerance for adaptive solvers."

    Integrator:
        class_uri: tvbo:Integrator
        is_a: Solver
        description: >-
            Fixed-step or adaptive ODE integrator with TVB-specific extensions
            (noise, transient time, etc.). Inherits abs_tol, rel_tol
            from Solver. Overrides method default to 'euler'.
        slots:
            - time_scale
            - unit
            - parameters
            - duration
            - description
        attributes:
            method:
                range: string
                ifabsent: string(euler)
                description: "Integration method (euler, heun, rk4, etc.)"
            step_size:
                range: float
                ifabsent: float(0.01220703125)
                aliases:
                    - dt
            steps:
                range: integer
            noise:
                range: Noise
                inlined: true
            state_wise_sigma:
                range: float
                multivalued: true
            transient_time:
                range: float
                ifabsent: float(0)
            scipy_ode_base:
                range: boolean
                ifabsent: false
            number_of_stages:
                range: integer
                ifabsent: integer(1)
            intermediate_expressions:
                multivalued: true
                range: DerivedVariable
                inlined: true
            update_expression:
                range: DerivedVariable
                inlined: true
            delayed:
                range: boolean
                ifabsent: true
            differentiation:
                range: Differentiation
                inlined: true
                description: >-
                    Backend-neutral strategy for propagating gradients through the
                    temporal integration (e.g. truncated backprop-through-time).
            coupling_evaluation:
                range: CouplingStageEvaluation
                ifabsent: string(per_step)
                description: >-
                    Backend-neutral numerical treatment of the network coupling
                    term across the stages of a multi-stage integrator (Heun, RK4,
                    ...): re-evaluated at every stage (per_stage — standard ODE
                    accuracy) or computed once per step and held constant across
                    stages (per_step — a TVB-style efficiency shortcut). Single-
                    stage methods (Euler) and always-recompute solvers (diffrax)
                    ignore it. per_stage is required to match reference integrators
                    for stiff / chaotic / multistable systems, where the frozen-
                    coupling error can select a different trajectory or attractor.
                    See CouplingStageEvaluation.

    Differentiation:
        class_uri: tvbo:Differentiation
        description: >-
            Backend-neutral configuration for how gradients are propagated through
            the temporal integration. Expressed in physical/semantic terms; each
            backend maps it to its own mechanism (JAX solver grad_horizon /
            block_size, Julia adjoint sensitivity, ...). Backends without autodiff
            (e.g. MATLAB) emit a comment noting differentiation is unsupported and
            proceed with the plain forward integration -- they do not raise.
        attributes:
            truncation_window:
                range: float
                description: >-
                    Truncated-BPTT window in milliseconds of simulated time:
                    gradients flow back at most this far. Omit for full BPTT.
            checkpoint_interval:
                range: float
                description: >-
                    Gradient-checkpointing interval in milliseconds (backward-pass
                    memory/time trade-off). Omit for no checkpointing.
            mode:
                range: string
                ifabsent: string(reverse)
                description: "Autodiff direction: 'reverse' (default) or 'forward'."

    Coupling:
        class_uri: tvbo:Coupling
        slots:
            - name
            - label
            - iri
            - parameters
            - description
        slot_usage:
            name:
                ifabsent: "Linear"
        attributes:
            # Standard coupling attributes
            coupling_function:
                range: Equation
                description: "Mathematical function defining the coupling"
                inlined: true
            sparse:
                range: boolean
                ifabsent: false
                description: "Whether the coupling uses sparse representations"
            pre_expression:
                range: Equation
                description: "Pre-processing expression applied before coupling"
                inlined: true
            post_expression:
                range: Equation
                description: "Post-processing expression applied after coupling"
                inlined: true
            incoming_states:
                range: StateVariable
                inlined: false
                multivalued: true
                description: >-
                    References to state variables from connected (source) nodes.
                    Auto-populated from state_variables with coupling_variable=true
                    when omitted. Used by name in pre_expression.
            local_states:
                range: StateVariable
                inlined: false
                multivalued: true
                description: >-
                    References to state variables from the local (target) node.
                    Used by name in pre_expression.
            delayed:
                range: boolean
                ifabsent: true
                description: "Whether coupling includes transmission delays"
            interpolate_delays:
                range: boolean
                ifabsent: false
                description: >-
                    For delayed coupling: read delayed states by linear interpolation
                    between the two bracketing history time-steps instead of snapping
                    each delay to the nearest integer step. Removes sub-step
                    quantisation error and makes the coupling differentiable w.r.t.
                    the continuous delay — hence w.r.t. conduction speed v (delay =
                    tract_length / v) — so v can be gradient-optimised. Default false
                    preserves exact nearest-step behaviour (tvboptim roll strategy).
            vectorized:
                range: boolean
                ifabsent: false
                description: >-
                    Opt in to the vectorized matmul fast path for a source-only
                    coupling — one whose pre_expression depends only on source
                    states (e.g. the angle-addition decomposition
                    [sin(theta_j), cos(theta_j)]). The W-reduction then becomes a
                    single ``pre @ weights`` matmul instead of materialising the
                    dense per-edge tensor. ONLY valid for INSTANTANEOUS coupling on
                    a SYMMETRIC connectome (W == Wᵀ): the matmul contracts W while
                    the per-edge path contracts Wᵀ, so the two agree only when W is
                    symmetric. Default false keeps the always-correct per-edge
                    reduction (and delays are inherently per-edge, so this flag is
                    ignored when delayed=true).
            symmetry:
                range: string
                ifabsent: "string(directed)"
                description: >-
                    Edge symmetry type for NetworkDynamics.jl EdgeModel:
                    'directed' (default), 'antisymmetric', or 'symmetric'.
                    AntiSymmetric edges flip sign for the reverse direction.
            outsym:
                multivalued: true
                range: string
                description: >-
                    Output symbol names for the edge model.
                    E.g. ['P'] for a scalar power flow, ['Fx', 'Fy'] for 2D forces.
                    Maps directly to outsym in ND.jl EdgeModel.
                    If not specified, derived from coupling variables of the
                    connected vertex dynamics.
            observed:
                multivalued: true
                range: DerivedVariable
                inlined: true
                description: >-
                    Observable functions computed from edge inputs and parameters
                    after simulation. Maps to obsf/obssym in ND.jl EdgeModel.
                    Example: absolute force magnitude computed from force components.

            # Hierarchical/subspace coupling attributes (optional)
            inner_coupling:
                range: Coupling
                description: "For hierarchical coupling: inner coupling applied at regional level"
                inlined: true
            region_mapping:
                range: RegionMapping
                description: "For hierarchical coupling: vertex-to-region mapping for aggregation"
                inlined: true
            regional_connectivity:
                range: Network
                description: "For hierarchical coupling: region-to-region connectivity with weights and delays"
                inlined: true
            aggregation:
                any_of:
                    - range: string
                    - range: Function
                description: "For hierarchical coupling: aggregation method ('sum', 'mean', 'max') or custom Function"
            distribution:
                any_of:
                    - range: string
                    - range: Function
                description: "For hierarchical coupling: distribution method ('broadcast', 'weighted') or custom Function"

    RegionMapping:
        class_uri: tvbo:RegionMapping
        description: "Maps vertices to parent regions for hierarchical/aggregated coupling"
        slots:
            - label
            - description
            - dataLocation
        attributes:
            vertex_to_region:
                description: "Array mapping each vertex index to its parent region index. Can use dataLocation instead for large arrays."
                multivalued: true
                range: integer
            n_vertices:
                range: integer
                description: "Total number of vertices"
            n_regions:
                range: integer
                description: "Total number of regions"

    Sample:
        class_uri: tvbo:Sample
        attributes:
            groups:
                multivalued: true
                range: string
            size:
                range: integer

    ExecutionConfig:
        class_uri: tvbo:ExecutionConfig
        description: "Configuration for computational execution (parallelization, precision, hardware)."
        attributes:
            n_workers:
                range: integer
                ifabsent: integer(1)
                description: "Number of parallel workers (maps to pmap devices in JAX, processes in multiprocessing)"
            n_threads:
                range: integer
                ifabsent: integer(-1)
                description: "Number of CPU threads per worker (-1 = auto-detect)"
            precision:
                range: string
                ifabsent: string(float64)
                description: "Floating point precision: 'float32' or 'float64'"
            accelerator:
                range: string
                ifabsent: string(cpu)
                description: "Hardware accelerator: 'cpu', 'gpu', 'tpu'"
            batch_size:
                range: integer
                description: "Batch size for vectorized operations (None = auto)"
            random_seed:
                range: integer
                ifabsent: integer(42)
                description: "Base random seed for reproducibility"
            find_fixpoint:
                range: boolean
                ifabsent: false
                description: >-
                    Whether to find a fixed point (steady state) before
                    time integration. Used as initial condition for ODEProblem.
                    Maps to NLsolve.fixpoint! in ND.jl or similar in other backends.

    DistributionConfig:
        class_uri: tvbo:DistributionConfig
        description: >-
            Policy for mapping a parameter sweep's exploration axes onto the two
            parallelism tiers when rendering a distributed workflow. Vectorized
            axes are packed into a single batched backend call (e.g. vmap/pmap);
            workflow axes are fanned out into independent scheduler tasks, one per
            value combination. Backend-independent: the emitter validates that a
            requested vectorized axis is one the chosen backend can actually batch.
        attributes:
            by:
                range: WorkflowDistributeBy
                description: >-
                    Default tier for axes not named in ``vectorize`` or ``workflow``.
                    Unset means ``auto``.
            vectorize:
                multivalued: true
                range: string
                description: >-
                    Axis names or parameters to pack into a single vectorized backend
                    call. It is an error to name an axis the backend cannot batch.
            workflow:
                multivalued: true
                range: string
                description: >-
                    Axis names or parameters to fan out into independent scheduler
                    tasks (one workflow cell per value combination).
            chunk:
                range: integer
                description: >-
                    Sharding granularity. For a fully vectorized sweep, the number of
                    scheduler shards to split the batched cells across (each task runs
                    ``1/chunk`` of the grid). For a fanned sweep, the number of
                    workflow cells packed into one task. Unset means one shard.

    EnvironmentVariable:
        class_uri: tvbo:EnvironmentVariable
        description: >-
            One environment variable assignment exported before executing the
            workflow task command. Use this for reproducible runtime knobs such
            as XLA/OMP settings in emitted workflow artefacts.
        attributes:
            name:
                range: string
                identifier: true
                required: true
                description: "Environment variable name (e.g. XLA_FLAGS)."
            value:
                range: string
                required: true
                description: "Value exported for this variable."

    WorkflowEngineConfig:
        class_uri: tvbo:WorkflowEngineConfig
        description: >-
            Execution directives for one target workflow engine (Slurm, Snakemake,
            Nextflow). Every field is optional; each engine renders the subset it
            understands, so a single shape serves all three. Resource fields are
            engine-agnostic; scheduler fields (partition, account, …) pass through
            verbatim to the target scheduler.
        attributes:
            cpus_per_task:
                range: integer
                description: "CPU cores requested per task."
            mem:
                range: string
                description: "Memory per task in scheduler syntax (e.g. '16G')."
            time:
                range: string
                description: "Wall-clock limit per task (e.g. '24:00:00')."
            gres:
                range: string
                description: "Generic scheduler resources, e.g. 'gpu:1' (Slurm --gres)."
            partition:
                range: string
                description: "Scheduler partition or queue to submit to."
            account:
                range: string
                description: "Accounting allocation to charge the tasks against."
            cores:
                range: integer
                description: "Total cores for local engines (e.g. Snakemake --cores)."
            modules:
                multivalued: true
                range: string
                description: "Environment modules to load before running (module load …)."
            venv:
                range: string
                description: "Path to a virtual environment to activate before running."
            mail_type:
                range: string
                description: "Scheduler notification trigger (e.g. 'END,FAIL')."
            mail_user:
                range: string
                description: "Notification email address."
            array_chunk:
                range: integer
                description: >-
                    Overrides ``distribute.chunk`` for this engine only: the number
                    of array-task shards to split the vectorized sweep across.
            env:
                multivalued: true
                range: EnvironmentVariable
                inlined: true
                description: >-
                    Environment variables exported before task execution
                    (e.g. XLA_PYTHON_CLIENT_PREALLOCATE=false).

    WorkflowConfig:
        class_uri: tvbo:WorkflowConfig
        description: >-
            Declarative orchestration for rendering a parameter sweep into a
            distributed, reproducible workflow (Slurm array, Snakemake, Nextflow).
            Backend- and engine-independent: it names *what* to distribute, *where*
            results go, and the per-engine resources, while each engine emitter
            renders the concrete artefact. Declared on a study as ``workflow`` and
            refined per experiment via ``workflow_overrides``; unset fields fall
            back to the emitter's defaults so an override sets only what it names.
        attributes:
            out_dir:
                range: string
                description: >-
                    Output directory template. ``{study}`` and ``{experiment}`` are
                    substituted with the study and experiment keys at emit time.
                    Unset means ``out/{study}/{experiment}``.
            container:
                range: string
                description: >-
                    Container image wrapping each task (Apptainer/Singularity/Docker
                    reference); tasks run as ``<runtime> exec <image> …``.
            retries:
                range: integer
                description: "Automatic retries per failed task. Unset means none."
            rng:
                range: string
                description: >-
                    Random-seed policy across shards. ``deterministic`` (the default
                    when unset) derives each task's seed from its shard index so the
                    fan-out is reproducible.
            provenance:
                range: boolean
                description: >-
                    Whether to emit provenance sidecars alongside results. Unset
                    means enabled.
            chunk:
                range: integer
                description: >-
                    Default shard count used when ``distribute.chunk`` is unset (see
                    DistributionConfig.chunk).
            distribute:
                range: DistributionConfig
                inlined: true
                description: "How exploration axes map onto the vectorized vs fanned-out tiers."
            requirements:
                multivalued: true
                range: SoftwareRequirement
                inlined: true
                inlined_as_list: true
                description: >-
                    Software requirements for the workflow environment; overrides
                    ``experiment.environment.requirements`` when set.
            slurm:
                range: WorkflowEngineConfig
                inlined: true
                description: "Slurm sbatch directives for array-job execution."
            snakemake:
                range: WorkflowEngineConfig
                inlined: true
                description: "Snakemake execution directives."
            nextflow:
                range: WorkflowEngineConfig
                inlined: true
                description: "Nextflow execution directives."

    SimulationExperiment:
        tree_root: true
        class_uri: tvbo:Simulation
        slots:
            - model
            - references
        attributes:
            id:
                identifier: true
                range: integer
                slot_uri: dcterms:identifier
            description:
                range: string
                slot_uri: dcterms:description
            additional_equations:
                multivalued: true
                range: Equation
            label:
                range: string
                slot_uri: rdfs:label
            dynamics:
                range: Dynamics
                inlined: true
                description: "Default dynamics model for all nodes. For heterogeneous networks with multiple dynamics, use network.dynamics instead."
            integration:
                range: Integrator
                inlined: true
            connectivity:
                range: Network
                inlined: true
                deprecated: "Use 'network' instead. 'connectivity' is kept for backward compatibility only and will be removed in a future version."
            network:
                range: Network
                inlined: true
            coupling:
                range: Coupling
                inlined: true
            observations:
                multivalued: true
                range: Observation
                inlined: true
                description: >-
                    All observations on this experiment, keyed by name. An
                    Observation is considered derived (computed from other
                    observations rather than directly from state variables)
                    when any item in its multivalued ``source`` slot names
                    another observation in this same dict.
            functions:
                multivalued: true
                range: Function
                inlined: true
                description: >-
                    Reusable function definitions. Referenced by name in observation pipelines.
                    Enables DRY: define compute_fc once, use in both simulated and empirical paths.
            stimulation:
                range: Stimulus
                inlined: true
            events:
                multivalued: true
                range: Event
                inlined: true
                description: >-
                    Events that apply at the experiment level.
                    For component-level events, attach them to individual
                    nodes or edges instead.
            field_dynamics:
                range: PDE # Distributed, spatially resolved dynamics (PDE)
                inlined: true
            optimizations:
                multivalued: true
                range: Optimization
                inlined: true
                aliases: [optimization]
                description: "Parameter optimization configurations"
            explorations:
                multivalued: true
                range: Exploration
                inlined: true
                description: "Parameter exploration/grid search specifications"
            inferences:
                multivalued: true
                range: Inference
                inlined: true
                aliases: [inference]
                description: >-
                    Bayesian inference configurations (posterior over parameters given
                    an observation, via MCMC). Keyed by name, like optimizations.
            algorithms:
                multivalued: true
                range: Algorithm
                inlined: true
                description: "Iterative parameter tuning algorithms (FIC, EIB, etc.)"
            continuations:
                multivalued: true
                range: Continuation
                inlined: true
                description: >-
                    Numerical continuation and bifurcation analysis specifications.
                    Each entry defines a continuation experiment (equilibrium branch,
                    codim-2 curve, periodic orbit family, etc.).            # Either reference a full reusable environment (preferred) or, for
            # legacy/simple cases, a single software requirement.
            environment:
                range: SoftwareEnvironment
                description: "Execution environment (collection of requirements)."
                inlined: true
            execution:
                range: ExecutionConfig
                inlined: true
                description: "Computational execution configuration (parallelization, devices)."
            software:
                range: SoftwareRequirement
                description: "(Deprecated) Single software requirement; prefer 'environment' with aggregated requirements."
                inlined: true
            dataset:
                range: Dataset
                inlined: true
                description: >-
                    Multi-subject dataset for workflow rendering. When set,
                    render_workflow() uses dataset.subjects/sessions to generate
                    per-subject parallel jobs.
            workflow:
                range: WorkflowConfig
                inlined: true
                description: >-
                    Orchestration for distributing this experiment's sweep across a
                    workflow engine. Refines the study's ``workflow`` block: only the
                    fields it sets take precedence, the rest are inherited. Use it to
                    give one experiment its own shard count or resources.

    Study:
        class_uri: tvbo:Study
        description: >-
            Bibliographic anchor for a source publication, identified by its
            citation key (``citekey``).  The full bibliographic record lives in
            the project BibTeX library (references.bib) and is resolved by
            citekey; this node carries only identity, display fields and the
            knowledge-graph hooks (the concepts that cite it).  Specialised by
            SimulationStudy, which adds the experiments derived from the source.
        slots:
            - description
        attributes:
            citekey:
                range: string
                description: >-
                    BibTeX citation key; the join key into references.bib for
                    full bibliographic detail. A study is identified by its
                    key/citekey and described by its title — no ``name`` needed.
            type:
                range: string
                description: "Publication type (article, book, inproceedings, …)."
            title:
                range: string
                slot_uri: dcterms:title
            authors:
                range: string
                multivalued: true
                description: "Author display strings (full detail in references.bib)."
            year:
                range: integer
                slot_uri: dcterms:issued
            doi:
                range: string
                slot_uri: bibo:doi

    SimulationStudy:
        class_uri: tvbo:SimulationStudy
        is_a: Study
        # tree_root: true
        slots:
            - label
            - derived_from
            - model
            - references
        attributes:
            key:
                range: string
                description: >-
                    Deprecated alias of the inherited ``citekey``; retained for
                    back-compatibility with existing tooling.
            sample:
                range: Sample
            workflow:
                range: WorkflowConfig
                inlined: true
                description: >-
                    Study-wide default orchestration for rendering its experiments'
                    sweeps into distributed workflows (Slurm/Snakemake/Nextflow).
                    Individual experiments refine it via ``workflow_overrides``.
            simulation_experiments:
                alias: experiments
                multivalued: true
                inlined_as_list: true
                range: SimulationExperiment

    TimeSeries:
        class_uri: tvbo:TimeSeries
        description: >-
            Time series data from simulations or measurements.
            Supports BIDS-compatible export for computational modeling (BEP034).
        slots:
            - label
            - description
            - dataLocation
        attributes:
            data:
                range: Matrix
            time:
                range: Matrix
            sampling_rate:
                range: float
                description: "Sampling rate in Hz."
            sampling_period:
                range: float
                description: "Time between samples (inverse of sampling_rate)."
            sampling_period_unit:
                range: string
                ifabsent: "ms"
                description: "Unit of the sampling period (e.g., 'ms', 's')."
            unit:
                range: string
                slot_uri: qudt:unit
                description: "Physical unit of the time series values."
            labels_ordering:
                range: string
                multivalued: true
                description: "Ordering of dimensions: Time, State Variable, Space, Mode."
            labels_dimensions:
                range: string
                description: "Mapping of dimension names to their labels (JSON-encoded dict)."
            # Provenance fields for BIDS compatibility
            source_experiment:
                range: SimulationExperiment
                description: "Reference to the SimulationExperiment that generated this TimeSeries."
            generated_at:
                range: datetime
                description: "Timestamp when this TimeSeries was generated."
            software_environment:
                range: SoftwareEnvironment
                description: "Software environment used to generate this data."
            # BIDS metadata fields
            task_name:
                range: string
                description: "BIDS task name for the simulation (e.g., 'rest', 'simulation')."
            subject_id:
                range: string
                slot_uri: dcterms:identifier
                description: "BIDS subject identifier."
            session_id:
                range: string
                slot_uri: dcterms:identifier
                description: "BIDS session identifier."
            run_id:
                range: integer
                slot_uri: dcterms:identifier
                description: "BIDS run number."
            modality:
                range: ImagingModality
                description: "Imaging modality or simulation output type."
            model_equation_ref:
                range: string
                description: "BIDS ModelEq reference: path to _eq.xml LEMS file."
            model_param_ref:
                range: string
                description: "BIDS ModelParam reference: path to _param.xml LEMS file."
            connectivity_ref:
                range: string
                description: "Reference to connectivity data (_conndata-network_connectivity.tsv)."
        comments:
            - "Supports BIDS BEP034 computational modeling extension."
            - "Use to_bids() method in Python class to export as BIDS dataset."

    # nD array for field and image data
    NDArray:
        class_uri: tvbo:NDArray
        attributes:
            shape:
                multivalued: true
                range: integer
            dtype:
                range: string
            dataLocation:
                range: string
            unit:
                range: string
        slots:
            - label
            - description

    # Spatial domain and mesh
    SpatialDomain:
        class_uri: tvbo:SpatialDomain
        attributes:
            coordinate_space:
                range: CommonCoordinateSpace
            region:
                description: "Optional named region/ROI in the atlas/parcellation."
                range: string
            geometry:
                description: "Optional file for geometry/ROI mask (e.g., NIfTI, GIfTI)."
                range: string
        slots:
            - label
            - description

    Mesh:
        class_uri: tvbo:Mesh
        description: >-
            Triangle (or higher-order) mesh geometry. May stand alone (via
            ``mesh_file`` pointing at an external GIFTI/VTK/MSH file) OR
            be inlined on a Network as ``Network.mesh``. In the
            inlined-on-Network case, the vertices are the parent
            Network's ``nodes/coordinates`` (so ``coordinates`` here may
            be left empty), the faces live in the same h5 companion
            under a path given by ``elements`` (default ``mesh/faces``),
            and optional per-vertex ``normals`` / ``curvature`` live
            alongside. The optional ``parcel_map_field`` points at the
            parent Network's per-vertex parcel-id array (default
            ``nodes/parent_index`` from the hierarchical-Network
            pattern, see Network.qmd §7.1).
        attributes:
            element_type:
                range: ElementType
            coordinates:
                description: "Node coordinates (x,y,z) in the given coordinate space."
                multivalued: true
                range: Coordinate
            elements:
                description: >-
                    Topology indices: either a file reference, or (when
                    inlined on a Network) a dotted path inside the parent
                    Network's h5 companion to the (M, 3) int triangle
                    face array. Default convention: ``mesh/faces``.
                range: string
            coordinate_space:
                range: CommonCoordinateSpace
            mesh_file:
                description: "Path to external mesh file (GIFTI, VTK, MSH, FreeSurfer, etc.)."
                range: string
            mesh_format:
                description: "Explicit format override (gifti, freesurfer, meshio, vtk, gmsh). Auto-detected from extension if null."
                range: string
            number_of_vertices:
                description: "Number of vertices in the mesh."
                range: integer
            number_of_elements:
                description: "Number of elements (triangles, quads, tetrahedra, etc.)."
                range: integer
            parcellation:
                range: Parcellation
                inlined: true
                description: >-
                    Brain parcellation this mesh's parcel_map indexes
                    into. Inlined to match Network.parcellation's
                    existing pattern. When the mesh is inlined on a
                    Network that already declares ``parcellation``, this
                    slot is optional and defaults to the parent's value.
            normals:
                description: >-
                    Optional path inside the parent Network's h5 (or an
                    external file) to per-vertex normals (N, 3) float.
                    Default convention: ``mesh/normals``.
                range: string
            curvature:
                description: >-
                    Optional path to per-vertex curvature (N,) float.
                    Default convention: ``mesh/curvature``.
                range: string
            vertices_field:
                description: >-
                    When the mesh is inlined on a Network, the dotted
                    path inside the parent's h5 to vertex coordinates.
                    Default: ``nodes/coordinates``.
                range: string
            parcel_map_field:
                description: >-
                    When the mesh is inlined on a Network with a
                    parcellation, the dotted path inside the parent's
                    h5 to the per-vertex parcel id array. Default:
                    ``nodes/parent_index``.
                range: string
        slots:
            - label
            - description
            - dataLocation

    # Spatial field
    SpatialField:
        class_uri: tvbo:SpatialField
        attributes:
            quantity_kind:
                description: "Scalar, vector, or tensor."
                range: string
            unit:
                range: string
            mesh:
                range: Mesh
            values:
                range: NDArray
            time_dependent:
                range: boolean
                ifabsent: false
            initial_value:
                description: "Constant initial value for the field."
                range: float
                ifabsent: float(0.1)
            initial_expression:
                description: "Analytic initial condition for the field."
                range: Equation
        slots:
            - label
            - description

    # Field-like state variable for PDEs (aligns with Dynamics.StateVariable)
    FieldStateVariable:
        class_uri: tvbo:FieldStateVariable
        is_a: StateVariable
        attributes:
            mesh:
                range: Mesh
            boundary_conditions:
                multivalued: true
                range: BoundaryCondition
        slots:
            - label
            - description

    DifferentialOperator:
        class_uri: tvbo:DifferentialOperator
        attributes:
            operator_type:
                range: OperatorType
            coefficient:
                range: Parameter
            tensor_coefficient:
                description: "Optional anisotropic tensor (e.g., diffusion)."
                range: Parameter
            expression:
                description: "Symbolic form (e.g., '-div(D * grad(u))')."
                range: Equation
        slots:
            - label
            - definition
            - equation

    BoundaryCondition:
        class_uri: tvbo:BoundaryCondition
        attributes:
            bc_type:
                range: BoundaryConditionType
            on_region:
                description: "Mesh/atlas subset where BC applies."
                range: string
            value:
                description: "Constant, parameter, or equation."
                range: Equation
            time_dependent:
                range: boolean
                ifabsent: false
        slots:
            - label
            - description

    PDESolver:
        class_uri: tvbo:PDESolver
        attributes:
            discretization:
                range: DiscretizationMethod
            time_integrator:
                description: "e.g., implicit Euler, Crank-Nicolson."
                range: string
            dt:
                description: "Time step (s)."
                range: float
            tolerances:
                description: "Abs/rel tolerances."
                range: string
            preconditioner:
                range: string
        slots:
            - label
            - description
            - requirements
            - environment

    PDE:
        class_uri: tvbo:PDE
        description: "Partial differential equation problem definition."
        attributes:
            domain:
                range: SpatialDomain
            mesh:
                description: "Shared mesh for all field state variables in this PDE."
                range: Mesh
            # Use state_variables for PDEs (FieldStateVariable list). The old
            # single object-valued `field: SpatialField` attribute was removed:
            # it was deprecated and unused, and its name collided with the
            # string-valued `field` of Reference/ReferenceFingerprint, which the
            # OWL generator (keying on the slot name) punned as both an Object-
            # and a Datatype-property — making those classes unsatisfiable under
            # OWL-DL (HermiT). state_variables fully supersedes it.
            state_variables:
                multivalued: true
                inlined_as_list: true
                range: FieldStateVariable
            operators:
                multivalued: true
                range: DifferentialOperator
            sources:
                multivalued: true
                range: Equation
            boundary_conditions:
                multivalued: true
                range: BoundaryCondition
            solver:
                range: PDESolver
            derived_parameters:
                multivalued: true
                range: DerivedParameter
            derived_variables:
                multivalued: true
                range: DerivedVariable
            functions:
                multivalued: true
                range: Function
        slots:
            - label
            - description
            - parameters
