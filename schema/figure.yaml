id: https://w3id.org/tvbo/figure
name: figure
title: TVB-O Figure Spec (DRAFT)
description: "Declarative, backend-independent specification of a publication figure rendered from TVBO result containers. A Figure is a mosaic of Panels; grammar panels (cartesian/heatmap) bind container fields to visual channels via mark + encoding, while custom and image panels are peer escape-hatch kinds. Data binding (Layer.used) is a DataRef — the shared cross-container reference primitive (defined in common, reused here and by Argument.used / Parameter.used) — and doubles as the PROV provenance edge. It reuses shared slots/classes (name, description, label, iri, Provenance, Argument, DataRef); those resolve in the merged schema because this file is generated only as part of tvbo_datamodel.yaml, which imports it (so it does not import tvbo_datamodel back, avoiding a cycle). Design write-up: dev/figure-spec-design.md."

prefixes:
  linkml: https://w3id.org/linkml/
  tvbo: https://w3id.org/tvbo/
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#

default_prefix: tvbo

imports:
  - linkml:types
  - common

# ---------------------------------------------------------------------------- enums

enums:

  PanelKind:
    description: "What a panel draws. cartesian/heatmap are grammar-driven (mark + encoding); image (external file) and custom (registered callable) are peer escape-hatch kinds. New kinds (surface, network) are added when their bsplot leaf exists."
    permissible_values:
      cartesian: {description: "Line/scatter/rule/band marks in a 2-D cartesian frame."}
      heatmap:   {description: "A 2-D array field drawn as pcolormesh/imshow."}
      line3d:    {description: "Line/scatter marks in a 3-D frame (x/y/z channels) — a phase-space orbit or trajectory. Camera via opts (elev, azim); axis via zlabel/zlim."}
      image:     {description: "An external raster/vector file placed in the grid cell."}
      custom:    {description: "A registered callable fn(container, ax, **opts)."}

  MarkType:
    description: "The cartesian primitive a grammar layer draws (heatmap is implied by a heatmap panel, not a mark)."
    permissible_values:
      line:    {description: "Connected line (timeseries, bifurcation branch, trajectory)."}
      scatter: {description: "Points (fixed points, special points, per-node profiles)."}
      rule:    {description: "Reference line / span (threshold, stimulus window, vline)."}
      band:    {description: "Filled band between two series (error/CI)."}
      area:    {description: "Series filled down to the baseline (a density/pdf, a cumulative share). Distinct from `band`, which spans two series, and from `bar`, which asserts the x values are discrete categories."}
      bar:     {description: "Vertical bars, one per x (spectrum, per-category magnitude). Distinct from `line` because a spectrum read as a line implies interpolation between mode numbers that do not exist."}

  Triangle:
    description: "Which half of a square matrix a layer fills, leaving the other half to a sibling layer, so two quantities read as one image. The conventional way to show a model-vs-data (or data-vs-reconstruction) connectivity matrix. Named for the drawn halves: with the matrix convention (row 0 at top, set invert_y) 'upper' is the top-right triangle."
    permissible_values:
      lower: {description: "The triangle below the diagonal."}
      upper: {description: "The triangle above the diagonal."}

  Corner:
    description: "A named corner for placing a panel number inside its axes — the four corners bsplot's add_panel_number anchors to. An enum so a typo is a validation error, not a silent fallback to the default corner."
    permissible_values:
      "upper left":  {description: "Top-left inside the axes (the bsplot default)."}
      "upper right": {description: "Top-right (many journals; Taher Fig 5)."}
      "lower left":  {description: "Bottom-left."}
      "lower right": {description: "Bottom-right."}

# -------------------------------------------------------------------------- classes

classes:

  Figure:
    class_uri: schema:ImageObject
    description: "A publication figure, a mosaic of panels rendered from result containers. Reuses name (identifier) and description (caption)."
    slots:
      - name
      - description
      - provenance
    attributes:
      layout:
        range: string
        description: "bsplot mosaic string; letters = panel keys, slash (or newline) = new row, repeated letters span cells, dot = empty. e.g. aab/ccb."
      style:
        range: string
        multivalued: true
        description: "Passed to bsplot.style.use, style names and/or .mplstyle paths, layered left to right. Owns figure sizing/DPI."
      format:
        range: string
        description: "Output format (pdf/svg/png). Unset defers to the renderer default."
      reference_image:
        range: string
        description: "The published figure this one reproduces, as a path relative to the study root (e.g. original_study/img/fig_04.png). Names the A/B target for `tvbo figure compare`, which measures panel geometry against it; it is never a data source, and never rendered into a panel."
      width:
        range: float
        description: "Figure width in mm (physical print size). Font size is in points and independent of this, so a smaller figure makes text relatively larger."
      height:
        range: float
        description: "Figure height in mm (physical print size)."
      dpi:
        range: integer
        description: "Raster resolution (dots per inch); scales pixel output only, not the physical size or the font size."
      trim_margins:
        range: boolean
        description: "Trim surrounding whitespace from the saved figure (default true). Trimming re-crops to the drawn content, so the saved aspect can differ from width/height; set false to preserve the declared width×height proportions exactly, e.g. to match an original figure. Renders as bbox_inches='tight' on a matplotlib backend."
      font_size:
        range: float
        description: "Base font size in points (physical: 1 pt = 1/72 inch). The real text size, unchanged by figure size or dpi; set it (or the width) so labels are legible at print size."
      auto_format:
        range: boolean
        description: "Apply bsplot's format_fig (tick/label normalisation + panel numbers). Set false to keep full manual control, e.g. when a study's own .mplstyle already defines the look."
      panel_numbers:
        range: boolean
        description: "Draw automatic panel letters (a, b, ...). Independent of auto_format so a study can keep its own tick styling and still get numbered panels."
      panel_number_format:
        range: string
        description: "Python format string applied to each panel letter: '{}' -> 'a', '({})' -> '(a)', '{}.' -> 'a.'. Defaults to '{}'. Match the target journal's convention."
      panel_number_loc:
        range: Corner
        description: "Which corner the panel letter sits in. Unset keeps bsplot's own default placement; many journals (and Taher Fig 5) use 'upper right'."
      panel_number_offset:
        range: float
        multivalued: true
        description: "[dx, dy] shift of every panel letter from its corner, in axes fractions. The default sits it on the axes corner, where a top y-tick label can reach it; a small negative dx clears the tick labels."
      panel_number_size:
        range: float
        description: "Panel-letter size in points. Unset scales it above the body font_size, the convention most journals follow — a letter set at the body size reads as a tick label rather than as the panel's name."
      height_ratios:
        range: float
        multivalued: true
        description: "Relative heights of the mosaic rows, e.g. [1.15, 1, 1, 1] to make the top panel taller. Length = number of rows."
      width_ratios:
        range: float
        multivalued: true
        description: "Relative widths of the mosaic columns."
      spines:
        range: string
        description: "Axes spine style: 'box' (all 4 spines, closed boxes — e.g. Taher) or 'open' (left+bottom only). Unset defers to the active style. Pair 'box' with auto_format: false — bsplot's format_fig otherwise detaches and trims spines (the open 'nature' look)."
      spine_offset:
        range: float
        description: "How far the left and bottom spines sit outside the data area, in axes fractions. 0 makes them meet at the corner; the default detaches them slightly (bsplot's house look). Journals differ on this, so a replication states which one the paper uses."
      workflow_overrides:
        range: WorkflowConfig
        inlined: true
        description: "Per-figure HPC/workflow resource refinement (reuses WorkflowConfig, same pattern as SimulationExperiment.workflow_overrides); lets a heavy render request its own resources when figures are emitted as workflow jobs. The figure's Layer.used edges become the render rule's input dependencies."
      code_modules:
        range: string
        multivalued: true
        description: "Importable module names whose import registers this figure's custom panels / transforms (via bsplot.register_panel / register_transform). The emitted plot.py imports them, so a study ships its bespoke figure code in its code_source instead of in core tvbo. The modules must be importable when the figure renders (loading the study puts its code/ dir on the path)."
      panels:
        range: Panel
        multivalued: true
        inlined: true
        description: "Panels keyed by their mosaic label."

  Panel:
    description: "One cell of the figure. kind selects grammar (cartesian/heatmap) vs escape-hatch (image/custom); every kind shares the label, placeholder, legend and annotation machinery. Reuses label (human title)."
    slots:
      - label
    attributes:
      panel_key:
        key: true
        range: string
        annotations:
          collection_key: true
        description: "Mosaic label this panel binds to (matches a letter in Figure.layout)."
      kind:
        range: PanelKind
        required: true
      number_loc:
        range: Corner
        description: "Per-panel override of the figure's panel_number_loc — e.g. wide top panels upper-right, grid panels upper-left."
      number:
        range: string
        description: "The panel letter to draw, overriding the mosaic key, or the string 'false' to draw none. Needed whenever the paper's panels do not map one-to-one onto mosaic cells: a row of five mode surfaces under a single (a), or a schematic cell that carries no letter of its own. Without it a grouped figure numbers every cell and its letters stop matching the paper's."
      placeholder:
        range: string
        description: "Honest-placeholder text drawn when this panel's data is missing or degenerate (never a source-replot). Setting it wraps the draw so a missing container falls back to this label instead of erroring."
      layers:
        range: Layer
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: "Marks sharing this panel's axes (overlay). Grammar kinds only."
      legend:
        range: boolean
        description: "Show a legend for this panel."
      path:
        range: string
        description: "External image file (image kind)."
      render:
        range: string
        description: "Name of a registered custom-panel callable fn(container, ax, **opts) (custom kind)."
      opts:
        range: Argument
        multivalued: true
        inlined: true
        description: "Keyword options for the custom callable (reuses Argument; typed values)."
      annotations:
        range: Annotation
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: "Positioned text labels drawn on the panel (e.g. 'K≈272') — a declarative alternative to a custom callable."
      insets:
        range: Inset
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: "Sub-axes drawn inside this panel after its own body — the zoom windows, corner thumbnails and small key maps papers place over a plot. Declaring them keeps a panel that needs one from becoming a custom callable, which would take its whole interior out of the grammar."

  Inset:
    description: "A sub-axes inside a panel, positioned in axes fractions. It is a Panel in every respect that draws — same kinds, layers, opts, annotations — minus the things only a mosaic cell has (a panel letter, a placeholder, a position in the layout). A figure states WHERE it sits; everything else it states the same way the host panel does, so the two cannot drift apart in behaviour."
    slots:
      - label
    attributes:
      bounds:
        range: float
        multivalued: true
        required: true
        description: "[x0, y0, width, height] in host-axes fractions, as matplotlib's inset_axes takes them. Values outside 0-1 place the inset beyond the host frame, which is how a thumbnail sits in the margin above a plot."
      kind:
        range: PanelKind
        required: true
      layers:
        range: Layer
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: "Marks sharing the inset's axes. Grammar kinds only."
      render:
        range: string
        description: "Name of a registered custom-panel callable (custom kind) — the same registry the host panel draws from."
      opts:
        range: Argument
        multivalued: true
        inlined: true
        description: "Keyword options for the custom callable, and the axis directives for a grammar inset."
      path:
        range: string
        description: "External image file (image kind)."
      annotations:
        range: Annotation
        multivalued: true
        inlined: true
        inlined_as_list: true
        description: "Positioned text labels drawn on the inset, in ITS axes fractions."

  Layer:
    description: "One mark bound to one data reference, with its encoding."
    attributes:
      used:
        range: DataRef
        inlined: true
        slot_uri: prov:used
        required: true
      transform:
        range: string
        description: "Optional presentation-only reduction. Prefer declaring an Observation upstream; else name a declarative postprocessing (tvbo schema) or a registered callable fn(da)->da."
      mark:
        range: MarkType
        description: "Cartesian mark; omitted for heatmap panels (implied by the panel kind)."
      label:
        range: string
        description: "Legend entry for this layer. Needed whenever a panel's legend distinguishes layers rather than entries along a `color` dim, which supplies its own labels. Without it a layer is drawn but unnamed."
      triangle:
        range: Triangle
        description: "Fill only this triangle of a square matrix, masking the other half so a sibling layer fills it. Two layers then compose one matrix image whose halves are the quantities being compared."
      encoding:
        range: Encoding
        inlined: true
      style:
        range: Style
        inlined: true

  Encoding:
    description: "Map visual channels to container dims/coords/vars, by NAME (keyed, never positional). Common case: {x: time, y: rate}. A channel may later accept a scale object without breaking this string form."
    attributes:
      x: {range: string}
      y: {range: string}
      z: {range: string, description: "Depth channel for a line3d panel (the third phase-space axis); ignored by 2-D kinds."}
      color: {range: string}
      detail: {range: string, description: "Non-visual grouping dim (e.g. the hue/iterate dim)."}

  Annotation:
    description: "A positioned text label on a panel, in axes-fraction coordinates. With a `used:` binding the number in it is READ from a result rather than typed, which is what keeps a panel's printed statistic (an r, a p-value) from drifting away from the run that produced it."
    attributes:
      text:
        range: string
        required: true
        description: "The label. With `used:` it is a Python format string applied to the referenced value, e.g. 'r = {:.2f}'."
      used:
        range: DataRef
        inlined: true
        slot_uri: prov:used
        description: "Bind the annotation to a scalar in a result container (same reference form a Layer uses, and the same PROV edge). The referenced value is formatted through `text` at render time, so a statistic printed on a panel is computed, never transcribed."
      x:
        range: float
        description: "x in axes fraction (0 = left, 1 = right); defaults to 0.5."
      y:
        range: float
        description: "y in axes fraction (0 = bottom, 1 = top); defaults to 0.95."
      loc:
        range: string
        description: "Named corner ('upper right', 'upper left', 'center', ...) as an alternative to x/y."
      arrow:
        range: float
        multivalued: true
        description: "Draw an arrow POINTING AT (x, y), starting (dx, dy) away from it in axes fractions — e.g. [-0.08, 0.06] for one coming from the upper left. The text, when non-empty, sits at the tail. This is how a paper's callout arrowheads are declared instead of drawn in code."
      tail_x:
        range: float
        description: "Start the arrow at this x in DATA coordinates instead of at an axes-fraction offset. Pair with tail_used, which supplies the y: together they anchor the arrow's tail on a point the run computed, so a callout keeps pointing at its data when the data changes. Ignored unless tail_used is also set."
      tail_used:
        range: DataRef
        inlined: true
        slot_uri: prov:used
        description: "The arrow tail's y, read from a result container (same reference form a Layer uses). What lets a panel point AT a computed value — a curve's height at a marked x — without that height being typed into the spec."
      rotation:
        range: float
        description: "Text rotation in degrees counter-clockwise; 90 for a label running up the side of a reference line."
      ha:
        range: string
        description: "Horizontal alignment against (x, y) — left, center, right. Defaults to center."
      va:
        range: string
        description: "Vertical alignment against (x, y) — bottom, center, top, baseline. Defaults to center."
      size:
        range: float
        description: "Text size in points, overriding the figure's font size for this label alone."
      color:
        range: string
        description: "Text colour; defaults to the current text colour."

  Style:
    description: "Layer/panel styling, portable intent plus a namespaced backend passthrough. Reuses Argument for the passthrough (matplotlib implicit in the MVP)."
    attributes:
      color:
        range: string
        description: "Semantic colour or palette name."
      colormap:
        range: string
        description: "Named colormap (routed through the cmap resolver)."
      opacity:
        range: float
      opts:
        range: Argument
        multivalued: true
        inlined: true
        description: "Raw backend passthrough (e.g. linewidth, linestyle); matplotlib implicit until a second backend lands."
