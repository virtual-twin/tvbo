---
id: https://w3id.org/tvbo/units
name: tvbo_units
title: TVB-O Units
description: >-
  Controlled vocabulary of physical units (UnitEnum) used across the TVB-O
  schema. Each is mapped to QUDT, from which its dimension vector and SI
  multiplier are vendored; a tool's own name for a dimension belongs to that
  tool, and is recorded on its SimulationTool entry.

prefixes:
  linkml: https://w3id.org/linkml/
  tvbo_units: https://w3id.org/tvbo/units/
  qudt: http://qudt.org/vocab/unit/
  UO: http://purl.obolibrary.org/obo/UO_

default_prefix: tvbo_units

imports:
  - linkml:types

enums:
    UnitEnum:
        description: >-
            Physical units of measurement for model parameters, state variables,
            and integration settings. Uses conventional abbreviations as values,
            mapped to the QUDT ontology (http://qudt.org/vocab/unit/) with UO
            cross-references where available.
        permissible_values:
            # ── Time ──
            s:
                meaning: qudt:SEC
                exact_mappings:
                    - UO:0000010
                description: "Second"
            ms:
                meaning: qudt:MilliSEC
                exact_mappings:
                    - UO:0000028
                description: "Millisecond"
            us:
                meaning: qudt:MicroSEC
                exact_mappings:
                    - UO:0000029
                description: "Microsecond"
            ns:
                meaning: qudt:NanoSEC
                description: "Nanosecond"
            min:
                meaning: qudt:MIN
                description: "Minute (60 s)"
            h:
                meaning: qudt:HR
                description: "Hour (3600 s)"
            day:
                meaning: qudt:DAY
                description: "Day (86400 s)"
            year:
                meaning: qudt:YR
                description: "Julian year (365.25 d)"
            # ── Rates / inverse time ──
            per_s:
                meaning: qudt:PER-SEC
                description: "Per second (s⁻¹)"
            per_ms:
                meaning: qudt:PER-MilliSEC
                description: "Per millisecond (ms⁻¹)"
            Hz:
                meaning: qudt:HZ
                exact_mappings:
                    - UO:0000106
                description: "Hertz (s⁻¹)"
            kHz:
                meaning: qudt:KiloHZ
                description: "Kilohertz"
            # ── Voltage ──
            V:
                meaning: qudt:V
                exact_mappings:
                    - UO:0000218
                description: "Volt"
            mV:
                meaning: qudt:MilliV
                exact_mappings:
                    - UO:0000247
                description: "Millivolt"
            per_mV:
                description: "Reciprocal millivolt (mV⁻¹)"
            mV_per_ms:
                description: "Millivolt per millisecond"
            mV_per_s:
                description: "Millivolt per second"
            # ── Current ──
            A:
                meaning: qudt:A
                exact_mappings:
                    - UO:0000011
                description: "Ampere"
            nA:
                meaning: qudt:NanoA
                description: "Nanoampere"
            pA:
                meaning: qudt:PicoA
                exact_mappings:
                    - UO:0010054
                description: "Picoampere"
            uA_per_cm2:
                description: "Microampere per square centimetre (current density)"
            # ── Capacitance ──
            pF:
                meaning: qudt:PicoFARAD
                description: "Picofarad"
            nF:
                meaning: qudt:NanoFARAD
                description: "Nanofarad"
            uF_per_cm2:
                description: "Microfarad per square centimetre (specific capacitance)"
            # ── Conductance ──
            nS:
                meaning: qudt:NanoS
                description: "Nanosiemens"
            uS:
                meaning: qudt:MicroS
                description: "Microsiemens"
            pS:
                meaning: qudt:PicoS
                description: "Picosiemens"
            S_per_cm2:
                description: "Siemens per square centimetre (conductance density)"
            mS_per_cm2:
                description: "Millisiemens per square centimetre (conductance density)"
            S_per_m2:
                description: "Siemens per square metre (conductance density, SI)"
            nS_per_mV:
                description: "Nanosiemens per millivolt"
            # ── Charge (inverse) ──
            per_nC:
                description: "Reciprocal nanocoulomb (nC⁻¹)"
            per_pC:
                description: "Reciprocal picocoulomb (pC⁻¹)"
            # ── Concentration ──
            mol_per_m3:
                meaning: qudt:MOL-PER-M3
                description: "Mole per cubic metre (mol/m³)"
            mol_per_cm3:
                description: "Mole per cubic centimetre (mol/cm³)"
            mmol_per_m3:
                meaning: qudt:MilliMOL-PER-M3
                description: "Millimole per cubic metre (mmol/m³ ≈ mM)"
                aliases:
                    - mM
            mol_per_m_per_A_per_s:
                description: "Mole per metre per ampere per second (concentration-current coupling)"
            # ── Volume ──
            um3:
                meaning: qudt:MicroM3
                description: "Cubic micrometre (µm³)"
            # ── Length / distance ──
            m:
                meaning: qudt:M
                exact_mappings:
                    - UO:0000008
                description: "Metre"
            mm:
                meaning: qudt:MilliM
                exact_mappings:
                    - UO:0000016
                description: "Millimetre"
            cm:
                meaning: qudt:CentiM
                exact_mappings:
                    - UO:0000015
                description: "Centimetre"
            km:
                meaning: qudt:KiloM
                description: "Kilometre"
            # ── Reciprocal area (spatial eigenvalues, curvature) ──
            per_mm2:
                description: >-
                    Per square millimetre (mm⁻²). The unit of a Laplace-Beltrami
                    eigenvalue and of Gaussian curvature.
            per_m2:
                meaning: qudt:PER-M2
                description: "Per square metre (m⁻²)"
            # ── Velocity ──
            m_per_s:
                meaning: qudt:M-PER-SEC
                description: "Metre per second"
            mm_per_ms:
                description: "Millimetre per millisecond (= m/s)"
            # ── Gain / compound ──
            Hz_per_nA:
                description: "Hertz per nanoampere (neural gain)"
            # ── Conductivity / permeability ──
            S_per_m:
                meaning: qudt:S-PER-M
                description: "Siemens per metre (conductivity)"
            H_per_m:
                meaning: qudt:H-PER-M
                description: "Henry per metre (permeability)"
            # ── Resistance ──
            ohm:
                meaning: qudt:OHM
                description: "Ohm (Ω)"
            Mohm:
                description: "Megaohm (MΩ)"
            # ── Resistivity ──
            kohm_cm:
                description: "Kilo-ohm centimetre (axial resistivity)"
            # ── Temperature ──
            degC:
                meaning: qudt:DEG_C
                description: "Degree Celsius"
            # ── Angular rate ──
            rad_per_ms:
                description: "Radian per millisecond"
            # ── Dimensionless ──
            dimensionless:
                meaning: qudt:UNITLESS
                exact_mappings:
                    - UO:0000186
                description: "Dimensionless (unitless)"
            percent:
                meaning: qudt:PERCENT
                description: "Percent (%)"
            arbitrary_unit:
                description: "Arbitrary units (a.u.)"
            # ── Mass ──
            kg:
                meaning: qudt:KiloGM
                exact_mappings:
                    - UO:0000009
                description: "Kilogram"
            kg_per_s:
                description: "Kilogram per second"
            kg_m2:
                meaning: qudt:KiloGM-M2
                description: "Kilogram metre squared (moment of inertia)"
            # ── Acceleration ──
            m_per_s2:
                meaning: qudt:M-PER-SEC2
                description: "Metre per second squared (acceleration)"
            # ── Force / stiffness ──
            N_per_m:
                meaning: qudt:N-PER-M
                description: "Newton per metre (spring constant)"
            # ── Angle ──
            rad:
                meaning: qudt:RAD
                exact_mappings:
                    - UO:0000123
                description: "Radian"
            rad_per_s:
                meaning: qudt:RAD-PER-SEC
                description: "Radian per second (angular velocity)"
            # ── Time squared ──
            s2:
                meaning: qudt:SEC2
                description: "Second squared (inertia constant)"
            # ── Power ──
            W:
                meaning: qudt:W
                description: "Watt (power)"
            MW:
                meaning: qudt:MegaW
                description: "Megawatt (10⁶ W); grid real/net power"
            # ── Per-unit (power systems) ──
            per_unit:
                description: "Per-unit (dimensionless power-systems convention)"
