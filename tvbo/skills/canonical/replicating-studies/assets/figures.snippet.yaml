# Paste this `figures:` block into <Study>.yaml (a sibling of `experiments:`), one entry per
# paper figure. `tvbo run <Study>.yaml` renders them after the experiments; iterate one with
# `tvbo figure render <Study>.yaml`. Layout is METADATA here; bespoke panel code (only where the
# grammar can't express a panel) is registered in a flat `code/<study>_figures.py`
# (see figures.py.tmpl) and named per figure in `code_modules:`. That module imports with NO
# config — loading the study puts `code/` on the path. (Only set a study-level `code_source` to
# pull the code from a git repo or a shared dir instead — never a local `code/` subfolder.)
#
# `used.iri` binds a layer to an experiment result: `tvbo:exp/<Study>/exp-<id>` -> that run's
# container (this binding IS the PROV `used` edge). `output` is a recorded state var or an
# `observation__<name>`; `sel` is a label-keyed xarray selector (never positional).

figures:

  # ── A GRAMMAR figure — zero plotting code ────────────────────────────────────────────
  - name: <Study>_Fig2_sweep
    description: "K-sweep: order parameter (heatmap) and the mean branch (line)."
    layout: aab/ccb              # a spans top-left, b is a tall right column, c bottom-left
    style: [code/figures/<study>.mplstyle]
    width: 96.0                  # physical print size in mm; font_size is in points, independent
    height: 76.0
    dpi: 200
    font_size: 8.0
    panel_numbers: true
    panel_number_format: "({})"  # -> (a), (b), … ; match the journal
    height_ratios: [1.2, 1.0]
    panels:
      a:                         # heatmap: mark is implied by the kind; a colorbar is drawn automatically
        kind: heatmap
        label: "order parameter R(K, node)"
        opts:                    # grammar-panel axis directives: xlabel/ylabel/title/xlim/ylim/xticks/yticks/legend
          xlabel: {name: xlabel, value: "coupling K"}
          ylabel: {name: ylabel, value: "node"}
        layers:
          - used: {iri: tvbo:exp/<Study>/exp-2, output: order_param}
            encoding: {x: K, y: node, color: order_param}
      b:                         # cartesian: two overlaid line marks (up/down hysteresis halves)
        kind: cartesian
        label: "mean branch"
        layers:
          - used: {iri: tvbo:exp/<Study>/exp-3, output: delta_omega}
            transform: up_branch            # a registered @bsplot.register_transform
            mark: line
            encoding: {x: KuramotoInertia.K, y: delta_omega}
            style: {color: "#1f77b4", opts: {label: {name: label, value: up-sweep}}}
          - used: {iri: tvbo:exp/<Study>/exp-3, output: delta_omega}
            transform: down_branch
            mark: line
            encoding: {x: KuramotoInertia.K, y: delta_omega}
            style: {color: "#1f77b4", opts: {linestyle: {name: linestyle, value: "--"}}}
        legend: true
      c:                         # a panel whose data isn't ready → honest placeholder (never source-replot)
        kind: cartesian
        label: "per-node control"
        placeholder: "requires exp-30 (not yet run)"

  # ── A figure needing a BESPOKE panel — one custom interior, code in code_modules ─────
  - name: <Study>_Fig5_bespoke
    description: "Bifurcation branch with a twin-axis Lyapunov overlay (grammar can't do twin axes)."
    layout: a
    style: [code/figures/<study>.mplstyle]
    width: 90.0
    height: 70.0
    font_size: 8.0
    code_modules: [<study>_figures]        # the module registering the panel below
    panels:
      a:
        kind: custom
        label: "λ₁ vs K"
        render: lyapunov_vs_k              # a @bsplot.register_panel callable fn(fig, ax, ctx)
        opts:                              # typed keyword options passed as ctx["opts"]
          k_max: {name: k_max, value: 650.0}
          color: {name: color, value: "#ff7f0e"}
          xlabel: {name: xlabel, value: "coupling K"}
        layers:                            # ctx["layers"] — the panel reads these with load_layer
          - used: {iri: tvbo:exp/<Study>/exp-3, output: order_param}   # x axis + sweep reversal
          - used: {iri: tvbo:exp/<Study>/exp-4, output: lyapunov_1, sel: {branch: up}}
            transform: order_by_branch
