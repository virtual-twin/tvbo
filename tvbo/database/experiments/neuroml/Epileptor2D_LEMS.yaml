# TVBO → NeuroML: Epileptor 2D
# ===============================
# Uses the TVBO database Epileptor2D model.
# 2 state variables, 3 conditional derived variables (Piecewise).
# Demonstrates ConditionalDerivedVariable export.

id: 909
label: "TVBO Epileptor2D as LEMS"
description: >
  Export the 2D Epileptor model from the TVBO database as LEMS XML.
  Demonstrates ConditionalDerivedVariable for Piecewise expressions.

model: Epileptor2D

network:
  number_of_nodes: 1

integration:
  method: euler
  step_size: 0.01
  duration: 5000.0
  time_scale: ms
