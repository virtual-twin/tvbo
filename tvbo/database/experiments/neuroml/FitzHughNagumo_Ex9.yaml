# NeuroML2 LEMS Example 9: FitzHugh-Nagumo Cell
# ===============================================
# Reproduces LEMS_NML2_Ex9_FN.xml from the NeuroML2 canonical examples.
# The NeuroML built-in `fitzHughNagumoCell` uses:
#   dV/dt = (V - V^3/3 - W + I) / 1s
#   dW/dt = 0.08*(V + 0.7 - 0.8*W) / 1s
#
# This is a special case of the Generic2dOscillator with specific parameters.
# See: https://www.scholarpedia.org/article/FitzHugh-Nagumo_model

id: 901
label: "NeuroML Ex9: FitzHugh-Nagumo"
description: >
  Reproduces NeuroML2 LEMS canonical example 9 (LEMS_NML2_Ex9_FN.xml).
  Single FitzHugh-Nagumo cell with external input I=0.8,
  simulated for 200s at 0.01s step size.
  Initial conditions V=0, W=0 match the NeuroML2 default (no OnStart block).

dynamics:
  name: FitzHughNagumo
  description: >
    Classic FitzHugh-Nagumo model as defined in the NeuroML2 built-in
    fitzHughNagumoCell ComponentType.
  parameters:
    I:
      value: 0.8
      description: External stimulus current
  state_variables:
    V:
      equation:
        rhs: "V - V**3/3 - W + I"
      initial_value: 0.0
      variable_of_interest: true
    W:
      equation:
        rhs: "0.08*(V + 0.7 - 0.8*W)"
      initial_value: 0.0

network:
  number_of_nodes: 1

integration:
  method: euler
  step_size: 0.01
  duration: 200.0
  time_scale: s
