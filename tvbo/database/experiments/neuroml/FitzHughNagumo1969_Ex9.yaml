# NeuroML2 LEMS: FitzHugh-Nagumo 1969 Cell
# ==========================================
# Matches the fitzHughNagumo1969Cell ComponentType from NeuroML2 Cells.xml.
# Uses parameterised form with explicit a, b, phi, V0, W0.
# Reference: FitzHugh R.[1969], Chapter 1 in Biological Engineering.
#
# Equations (using TS = 1ms as in the original ComponentType):
#   F  = V - V^3/3                       (DerivedVariable in NML2)
#   dV/dt = (F - W + I) / TS
#   dW/dt = phi*(V + a - b*W) / TS
#
# Parameter values from the canonical NeuroML2 example instance:
#   NML2_AbstractCells.nml:
#   <fitzHughNagumo1969Cell id="fn1969" a="0.7" b="0.08" I="1.0"
#                           phi="0.08" V0="0.0" W0="0.0"/>

id: 902
label: "NeuroML: FitzHugh-Nagumo 1969"
description: >
  FitzHugh-Nagumo 1969 model matching NeuroML2 fitzHughNagumo1969Cell.
  Parameters from canonical NML2_AbstractCells.nml example.
  Uses TS=1ms (time_scale: ms) as defined in the ComponentType.

dynamics:
  name: FitzHughNagumo1969
  description: >
    FitzHugh-Nagumo 1969 model (Scholarpedia variant).
    NeuroML2 defines this as fitzHughNagumo1969Cell in Cells.xml.
  parameters:
    a:
      value: 0.7
      description: a parameter
    b:
      value: 0.08
      description: b parameter
    I:
      value: 1.0
      description: External stimulus current
    phi:
      value: 0.08
      description: Time-scale parameter
  state_variables:
    V:
      equation:
        rhs: "V - V**3/3 - W + I"
      initial_value: 0.0
      variable_of_interest: true
    W:
      equation:
        rhs: "phi*(V + a - b*W)"
      initial_value: 0.0

network:
  number_of_nodes: 1

integration:
  method: euler
  step_size: 0.01
  duration: 200.0
  time_scale: ms
