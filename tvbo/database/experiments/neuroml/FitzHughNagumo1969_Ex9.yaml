# NeuroML2 LEMS Example 9: FitzHugh-Nagumo 1969 Cell
# =====================================================
# Reproduces the fitzHughNagumo1969Cell from NeuroML2 Cells.xml.
# The 1969 parameterisation (Scholarpedia variant) adds explicit
# parameters a, b, phi, V0, W0:
#
#   dV/dt = (V - V^3/3 - W + I) / SEC
#   dW/dt = phi*(V + a - b*W) / SEC
#
# Note: FitzHughNagumoCell (non-1969) hard-codes the FHN constants.
# This TVBO version uses the parameterised form.

id: 902
label: "NeuroML Ex9 variant: FitzHugh-Nagumo 1969"
description: >
  Parameterised FitzHugh-Nagumo 1969 model matching NeuroML2
  fitzHughNagumo1969Cell ComponentType.

dynamics:
  name: FitzHughNagumo1969
  description: >
    FitzHugh-Nagumo 1969 model (Scholarpedia variant).
    NeuroML2 defines this as fitzHughNagumo1969Cell in Cells.xml.
  parameters:
    a:
      value: 0.7
      description: a parameter
    b:
      value: 0.8
      description: b parameter
    I:
      value: 0.8
      description: External stimulus current
    phi:
      value: 0.08
      description: Time-scale parameter
  state_variables:
    V:
      equation:
        rhs: "V - V**3/3 - W + I"
      initial_value: -1.0
      variable_of_interest: true
    W:
      equation:
        rhs: "phi*(V + a - b*W)"
      initial_value: -0.5

network:
  number_of_nodes: 1

integration:
  method: euler
  step_size: 0.01
  duration: 200.0
  time_scale: s
