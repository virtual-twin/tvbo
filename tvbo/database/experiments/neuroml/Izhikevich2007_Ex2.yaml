# NeuroML2 LEMS Example 2: Izhikevich Cell
# ==========================================
# Reproduces LEMS_NML2_Ex2_Izh.xml from the NeuroML2 canonical examples.
# Uses the Izhikevich 2007 formulation (izhikevich2007Cell):
#   dv/dt = (k*(v - vr)*(v - vt) + I_ext - u) / C
#   du/dt = a*(b*(v - vr) - u)
#   OnCondition: v > vpeak → v = c, u = u + d
#
# Variant: tonic spiking (from izTonic in the NeuroML example)

id: 904
label: "NeuroML Ex2: Izhikevich (tonic spiking)"
description: >
  Reproduces NeuroML2 LEMS canonical example 2, izhikevich2007Cell.
  Tonic spiking variant simulated for 200ms at 0.005ms step.

dynamics:
  name: Izhikevich2007
  description: >
    Izhikevich 2007 model from NeuroML2 izhikevich2007Cell.
  parameters:
    k:
      value: 0.7
      description: Gain parameter (nS/mV)
    vr:
      value: -60.0
      description: Resting membrane potential (mV)
    vt:
      value: -40.0
      description: Instantaneous threshold potential (mV)
    vpeak:
      value: 35.0
      description: Peak action potential voltage (mV)
    a:
      value: 0.03
      description: Recovery time constant (1/ms)
    b:
      value: -2.0
      description: Recovery sensitivity (nS)
    c:
      value: -50.0
      description: After-spike reset voltage (mV)
    d:
      value: 100.0
      description: After-spike increase to u (pA)
    C:
      value: 100.0
      description: Membrane capacitance (pF)
    I_ext:
      value: 70.0
      description: External input current (pA)
  state_variables:
    v:
      equation:
        rhs: "(k*(v - vr)*(v - vt) + I_ext - u) / C"
      initial_value: -60.0
      variable_of_interest: true
    u:
      equation:
        rhs: "a*(b*(v - vr) - u)"
      initial_value: 0.0
  events:
    spike:
      condition:
        rhs: "v >= vpeak"
      affect:
        rhs: "v = c; u = u + d"

network:
  number_of_nodes: 1

integration:
  method: euler
  step_size: 0.005
  duration: 200.0
  time_scale: ms
