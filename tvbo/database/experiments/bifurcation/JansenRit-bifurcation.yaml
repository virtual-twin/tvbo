# Jansen-Rit bifurcation analysis in the external input p

id: 103
label: "Jansen-Rit — bifurcation in external input p"
description: >-
  Continues the equilibria of the Jansen & Rit (1995) cortical column in its external input p (pulses per second), from the stable equilibrium it settles to at p = 50 across p in [-50, 400] in both directions, continues the periodic orbits born at every Hopf point it detects, and continues its first fold and its first Hopf point in the plane of p and the connectivity constant C.

dynamics:
  name: JansenRit1995
  iri: tvbo:JansenRit1995

continuations:
  eq_in_p:
    name: eq_in_p
    label: "Equilibrium branch in p"
    dynamics: JansenRit1995
    free_parameters:
      - name: p
        value: 50.0
        domain:
          lo: -50
          hi: 400

    ds: 0.5
    ds_min: 1.0e-4
    ds_max: 1.0
    max_steps: 2000
    # The model's rates reach 1e4 per second squared, so a residual cannot fall far below 1e-12.
    newton_tol: 1.0e-9
    nev: 6
    detect_bifurcation: 2
    # BifurcationKit's secant predictor steps across the fold at p = -41.3 onto the low branch.
    options:
      - name: tangent
        value: Bordered

    # The model's rates are per second, so its time unit is the second.
    initial_state:
      method: time_integration
      duration: 10.0

    bothside: true

    branches:
      po_alpha_rhythm:
        description: "Periodic orbits continued from every Hopf point"
        source_point: "hopf:all"
        discretization:
          method: collocation
          parameters:
            mesh_intervals:
              value: 50
            degree:
              value: 4
        continuation:
          name: po_alpha_continuation
          max_steps: 200
          # A collocated orbit's residual stalls above the equilibrium's 1e-9.
          newton_tol: 1.0e-7

      fold_p_C:
        description: "The first fold of eq_in_p continued in p and C, tracing the saddle-node boundary in the (p, C) plane"
        source_point: "fold:1"
        bothside: true
        continuation:
          name: fold_p_C
          free_parameters:
            - name: C
              domain:
                lo: 10
                hi: 500
          ds: 0.5
          ds_max: 5.0
          max_steps: 500

      hopf_p_C:
        description: "The first Hopf point of eq_in_p continued in p and C"
        source_point: "hopf:1"
        bothside: true
        continuation:
          name: hopf_p_C
          free_parameters:
            - name: C
              domain:
                lo: 10
                hi: 500
          ds: 0.5
          ds_max: 5.0
          max_steps: 500
