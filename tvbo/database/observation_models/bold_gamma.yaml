# BOLD (Gamma) - hemodynamic forward model with Gamma HRF

name: BOLD_Gamma
label: BOLD (Gamma HRF)
description: >-
    BOLD fMRI observation model using a Gamma-shaped hemodynamic response
    function. Provides a simpler, unimodal HRF shape.

imaging_modality: BOLD

class_reference:
    name: Bold
    module: tvb.simulator.monitors
    constructor_args:
        - name: hrf_kernel
          value: Gamma
        - name: hrf_length
          value: 20000.0

parameters:
    TR:
        value: 2000.0
        unit: ms

pipeline:
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "window_mean(X, stepsize)"
      arguments:
          - name: stepsize
            value: 1
      apply_on_dimension: time

    - name: hemodynamic_response
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          rhs: "((var / mean**2) * t)**(var / mean) * exp(-(var / mean) * t) / abs(t)"
          parameters:
              mean:
                  value: 3.0
                  unit: s
              var:
                  value: 1.5
      arguments:
          - name: duration
            value: 20
            unit: s
          - name: stock_dt
            value: 0.004
            unit: s

    - name: convolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          - name: in2
            value: hrf_kernel
          - name: mode
            value: same

    - name: subsample_to_period
      input: convolve
      output: Bold
      equation:
          rhs: "subsample(X, stepsize)"
      arguments:
          - name: stepsize
            description: "TR / dt"
      apply_on_dimension: time
