# BOLD (Gamma) - hemodynamic forward model with Gamma HRF

name: BOLD_Gamma
label: BOLD (Gamma HRF)
description: >-
    BOLD fMRI observation model using a Gamma-shaped hemodynamic response
    function. Provides a simpler, unimodal HRF shape.

imaging_modality: BOLD

class_reference:
    name: Bold
    module: tvb.simulator.monitors
    constructor_args:
        - name: hrf_kernel
          value: Gamma
        - name: hrf_length
          value: 20000.0

parameters:
    TR:
        value: 2000.0
        unit: ms

pipeline:
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "window_mean(X, stepsize)"
      arguments:
          stepsize:
              description: >-
                  Interim averaging window in integration steps. Resolved from the
                  integration dt (= stock_dt / dt), not a raw-grid literal.
      apply_on_dimension: time

    - name: hemodynamic_response
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          rhs: "((var / mean**2) * t)**(var / mean) * exp(-(var / mean) * t) / abs(t)"
          parameters:
              mean:
                  value: 3.0
                  unit: s
              var:
                  value: 1.5
      arguments:
          duration:
              value: 20
              unit: s
          stock_dt:
              value: 0.004
              unit: s

    - name: convolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          in2:
              value: hrf_kernel
          mode:
              value: same

    - name: subsample_to_period
      input: convolve
      output: Bold
      equation:
          rhs: "subsample(X, start, stepsize)"
      arguments:
          start:
              description: >-
                  Index of first output sample (resolved to stepsize - 1) so the
                  first sample aligns with TVB's step % istep == 0 emission.
          stepsize:
              description: >-
                  Interim samples per output sample. Resolved from the integration
                  dt (= (TR / dt) / interim_istep), not a raw-grid literal.
      apply_on_dimension: time
