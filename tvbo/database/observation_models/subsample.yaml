# TVB's SubSample and tvboptim's SubSampling are one monitor: both keep the last integration step of each period (TVB records when `step % istep == 0`, tvboptim takes `[istep - 1::istep]`) and stamp it with that step's time.

name: SubSample
label: Temporal Decimation
description: >-
    Temporal decimation of selected state variables. Records the last integration step of every `period`, without any averaging or smoothing, stamped with that step's time. TVB's SubSample and tvboptim's SubSampling.

period: 0.9765625  # ms (~1024 Hz default)

class_reference:
    name: SubSample
    module: tvb.simulator.monitors

pipeline:
    - name: subsample
      output: subsampled
      equation:
          rhs: "subsample(X, step - 1, step)"
          parameters:
              step:
                  equation: {rhs: "iround(period / dt)"}
                  description: "Integration steps between recorded samples, so the decimation tracks the grid the experiment declares rather than the one this file was written on."
      arguments:
          step:
              description: "Decimation factor. Its value is declared on the equation parameter of the same name; a backend that has not yet been migrated to read that still derives it here."
      apply_on_dimension: time

time_stamps:
    rhs: "subsample(t, step - 1, step)"
    parameters:
        step:
            equation: {rhs: "iround(period / dt)"}
            description: "Integration steps between recorded samples, as the pipeline decimates."
