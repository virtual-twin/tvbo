# tvboptim's HRFBold with its GammaHRFKernel. Every equation is written as tvboptim computes it, operation for operation, because floating-point arithmetic is not associative: tests/test_tvboptim_monitor_formalization.py pins the generated monitor to the class bit for bit.

name: HRFBold_Gamma
label: BOLD (HRF convolution, gamma kernel)
iri: tvbo:HRFBold_Gamma
description: >-
    BOLD signal as tvboptim's HRFBold computes it: the source is averaged onto the `downsample_period` grid, joined to its history (the settle, or a warm-start history averaged on its own) or to zeros, convolved ('valid') with a gamma density normalised to its peak and scaled by `a`, tvboptim's GammaHRFKernel, sampled over its support on that grid, scaled by the Volterra coefficients as `k_1 V_0 (x - 1)`, and sampled at the end of each `period`.

imaging_modality: BOLD
period: 1000.0
downsample_period: 4.0
history_join: per_segment
output_variable_name: "BOLD({name})"

parameters:
    k_1:
        value: 5.6
        description: "Signal scaling factor"
    V_0:
        value: 0.02
        description: "Resting blood volume fraction"

functions:
    hrf_gamma:
        description: "A gamma density normalised to its peak and scaled by `a`, tvboptim's GammaHRFKernel, sampled on `ceiling(duration / downsample_period)` points of [0, duration] ms."
        time_range:
            lo: 0.0
            hi: duration
            n: "ceiling(duration / downsample_period)"
        equation:
            rhs: "(((t / 1000.0) / tau) ** (n - 1) * exp(-((t / 1000.0) / tau))) / (tau * factorial(int(n) - 1)) / where(max((((t / 1000.0) / tau) ** (n - 1) * exp(-((t / 1000.0) / tau))) / (tau * factorial(int(n) - 1))) > 0, max((((t / 1000.0) / tau) ** (n - 1) * exp(-((t / 1000.0) / tau))) / (tau * factorial(int(n) - 1))), 1.0) * a"
            parameters:
                tau:
                    value: 1.08
                    unit: s
                    description: "Time constant"
                n:
                    value: 3.0
                    description: "Shape (phase delay)"
                a:
                    value: 0.1
                    description: "Amplitude after peak normalisation"
        arguments:
            duration:
                value: 20000.0
                unit: ms
                description: "Kernel support"
            downsample_period:
                value: 4.0
                unit: ms
                description: "Grid the kernel is sampled on, bound to the observation's own"

pipeline:
    - function: hrf_gamma
    - name: downsample
      input: integration.result
      output: downsampled
      equation:
          rhs: "complete_window_mean(X, window_size)"
          parameters:
              window_size:
                  equation: {rhs: "iround(downsample_period / dt)"}
                  description: "Integration steps per averaging window"
      apply_on_dimension: time
    - name: convolve
      input: downsampled
      output: convolved
      equation:
          rhs: "sampled_convolve(X, kernel, step)"
          parameters:
              step:
                  equation: {rhs: "iround(period / downsample_period)"}
                  description: "Kernel-grid samples per BOLD period; the first sample is taken once one period has completed"
      arguments:
          kernel:
              value: hrf_gamma
      apply_on_dimension: time
    - name: volterra_transform
      input: convolved
      output: bold
      equation:
          rhs: "k_1 * V_0 * (X - 1.0)"

time_stamps:
    rhs: "take(t, 0) - dt + (arange(n) + 1) * period"
