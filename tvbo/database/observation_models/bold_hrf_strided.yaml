# BOLD (First Order Volterra) — strided-convolution variant
#
# The strided counterpart of the HRF+Volterra BOLD pipeline. It is numerically
# equivalent to the FFT-based path but computes the convolution ONLY at the output
# samples that survive TR subsampling, so it never materialises the full-length FFT.
#
# Exact numeric relationship (measured, float, kernel support 5000, TR stride 180):
#   • BYTE-IDENTICAL to a direct full 'valid' convolution followed by [s::s]
#     subsampling — strided_convolve is that same arithmetic with the discarded
#     outputs skipped, not a different algorithm.
#   • Equal to the FFT path (fftconvolve(..., 'valid')[s::s]) to ~1e-12 (float64) /
#     ~1e-6 (float32). FFT and direct convolution are different algorithms, so they
#     agree only to FFT roundoff — NEVER bit-for-bit, at any precision.
#   • ~70x fewer multiply-adds per call and NO FFT buffer (the FFT of the padded
#     signal is otherwise the whole transient-memory peak of the tuning loop).
#
# Use BOLD_TVB (FFT) for a byte-exact TVB reference; use this for the batched
# per-subject cohort fit, where the FFT buffer is the memory blocker and the
# ~1e-6/~1e-12 difference is far below the stochastic tuning noise floor. Convention
# is mode='valid' + subsample [s::s], matching the FIC+EIB fit pipeline (NOT the
# mode='same' centred subsample of BOLD_TVB). When referenced by `iri`, the helper
# functions below merge into the experiment's function table (see
# populate_observation_from_iri).

name: BOLD_HRF_strided
label: BOLD (First Order Volterra, strided convolution)
iri: tvbo:BOLD_HRF_strided
description: >-
    BOLD fMRI observation model identical to BOLD_TVB's HRF+Volterra forward model,
    but with the HRF convolution and TR subsampling fused into a single strided
    convolution (strided_convolve): the convolution is evaluated only at the retained
    [stride::stride] output samples, avoiding the full-length FFT. Byte-identical to a
    direct full 'valid' convolution + subsample; equal to the FFT path to FFT roundoff
    (~1e-12 float64 / ~1e-6 float32); ~70x cheaper with no FFT buffer.

imaging_modality: BOLD

references:
    - Schirner2023

parameters:
    TR:
        value: 720.0
        unit: ms
        description: Repetition time (sampling period)

# Helper functions the pipeline calls by name. Emitted as module-level defs and
# merged into experiment.functions when this model is referenced by `iri`.
functions:
    hrf_kernel:
        description: >-
            Hemodynamic response function kernel (balloon-model impulse response),
            sampled on the integration grid to one kernel support (5000 samples).
        time_range:
            lo: 0
            hi: duration
            n: 5000
        equation:
            rhs: "(1/3)*exp(-0.5*(t/1000)/tau_s)*sin(sqrt(1/tau_f - 1/(4*tau_s**2))*(t/1000))/sqrt(1/tau_f - 1/(4*tau_s**2))"
            description: "h(t) = (1/3)·exp(-t/(2τ_s))·sin(ωt)/ω, ω = sqrt(1/τ_f − 1/(4τ_s²))"
            parameters:
                tau_s:
                    value: 0.8
                    description: "Signal decay time constant (seconds)"
                tau_f:
                    value: 0.4
                    description: "Feedback time constant (seconds)"
        arguments:
            duration:
                value: 20000.0
                description: "HRF kernel duration in ms"

    temporal_average:
        description: >-
            Downsample by averaging over non-overlapping windows of `period_samples`
            samples (centered indices, t0-independent) — reproduces tvboptim
            TemporalAverage exactly.
        source_code: "jax.vmap(lambda _i: jnp.mean(jax.lax.dynamic_slice(data, (_i,) + (0,) * (data.ndim - 1), (period_samples,) + data.shape[1:]), axis=0))((jnp.arange(data.shape[0]) + 1)[::period_samples])[: jnp.arange((period_samples - 2) // 2, data.shape[0], period_samples).shape[0]]"
        arguments:
            data:
                description: "Input time series (time, nodes)"
            period_samples:
                value: 1
                description: "Samples per window = round(downsample_period / dt)"

    prepend_history:
        description: >-
            Fit the (downsampled) transient history to one kernel length and prepend
            it, zero-padding at the front when shorter — matches HRFBold._process_history.
        source_code: "jnp.concatenate([(jnp.vstack([jnp.zeros((kernel_samples - history.shape[0],) + history.shape[1:], history.dtype), history]) if history.shape[0] < kernel_samples else history[-kernel_samples:]), data], axis=0)"
        arguments:
            data:
                description: "Downsampled input time series"
            history:
                description: "Downsampled transient history data"
            kernel_samples:
                value: 5000
                description: "Kernel support = ceil(kernel_duration / downsample_period)"

    strided_hrf:
        description: >-
            Fused HRF convolution + TR subsampling: the 'valid' convolution of the
            prepended signal with the HRF kernel, evaluated ONLY at the [stride::stride]
            output indices via a windowed matmul (strided_convolve array-op). Replaces
            fftconvolve(..., 'valid') + subsample_bold data[stride::stride] with no FFT
            buffer. Byte-identical to a direct full convolution + subsample.
        equation:
            rhs: "strided_convolve(data, kernel, stride)"
        arguments:
            data:
                description: "Prepended neural signal (time, 1, node)"
            kernel:
                description: "HRF kernel"
            stride:
                value: 180
                description: >-
                    Output-sample stride = TR / integration_dt (720 ms / 4 ms = 180),
                    the same factor the FFT pipeline applies as subsample_bold(s=180).
                    Grid-specific like that step (it assumes the neural trace is on the
                    integration grid, period_samples=1); set it to TR/dt for another grid.

pipeline:
    # HRF kernel (precomputed once)
    - function: hrf_kernel

    # Downsample neural activity (and transient history) to the BOLD grid
    - output: downsampled_data
      function: temporal_average
      arguments:
          data:
              value: integration.result
          period_samples:
              value: 1
    - output: downsampled_history
      function: temporal_average
      arguments:
          data:
              value: integration.transient
          period_samples:
              value: 1

    # Prepend transient history (zero-padded to one kernel length)
    - function: prepend_history
      arguments:
          data:
              value: downsampled_data
          history:
              value: downsampled_history
          kernel_samples:
              value: 5000

    # Fused 'valid' HRF convolution + TR subsample — a single windowed matmul, no FFT.
    - output: bold_convolve
      function: strided_hrf
      arguments:
          data:
              value: prepend_history
          kernel:
              value: hrf_kernel

    # Volterra transform: k_1 * V_0 * (bold - 1.0). Pointwise-linear, so applying it to
    # the strided output is exact (it commutes with subsampling).
    - name: volterra_transform
      input: bold_convolve
      output: Bold
      equation:
          rhs: "(X - 1.0) * k_1 * V_0"
          parameters:
              k_1:
                  value: 5.6
                  description: "Intravascular signal contribution"
              V_0:
                  value: 0.02
                  description: "Resting blood volume fraction"
