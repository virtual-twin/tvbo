# BOLD (Double Exponential) - hemodynamic forward model

name: BOLD_DoubleExponential
label: BOLD (Double Exponential HRF)
description: >-
    BOLD fMRI observation model using a Double Exponential hemodynamic
    response function.

imaging_modality: BOLD

class_reference:
    name: Bold
    module: tvb.simulator.monitors
    constructor_args:
        - name: hrf_kernel
          value: DoubleExponential
        - name: hrf_length
          value: 20000.0

parameters:
    TR:
        value: 2000.0
        unit: ms

pipeline:
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "window_mean(X, stepsize)"
      arguments:
          stepsize:
              description: >-
                  Interim averaging window in integration steps. Resolved from the
                  integration dt (= stock_dt / dt), not a raw-grid literal.
      apply_on_dimension: time

    - name: hemodynamic_response
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          rhs: "((amp_1 * exp(-t / tau_1) * sin(2.0 * pi * f_1 * t)) - (amp_2 * exp(-t / tau_2) * sin(2.0 * pi * f_2 * t))) / max((amp_1 * exp(-t / tau_1) * sin(2.0 * pi * f_1 * t)) - (amp_2 * exp(-t / tau_2) * sin(2.0 * pi * f_2 * t))) * a"
          parameters:
              tau_1:
                  value: 7.22
                  unit: s
                  description: "Time constant of the first exponential"
              f_1:
                  value: 0.03
                  unit: Hz
                  description: "Frequency of the first sine"
              amp_1:
                  value: 0.1
                  description: "Amplitude of the first exponential"
              tau_2:
                  value: 7.4
                  unit: s
                  description: "Time constant of the second exponential"
              f_2:
                  value: 0.12
                  unit: Hz
                  description: "Frequency of the second sine"
              amp_2:
                  value: 0.1
                  description: "Amplitude of the second exponential"
              a:
                  value: 0.1
                  description: "Amplitude after peak normalisation"
      arguments:
          duration:
              value: 20
              unit: s
          stock_dt:
              value: 0.004
              unit: s

    - name: convolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          in2:
              value: hrf_kernel
          mode:
              value: same

    - name: subsample_to_period
      input: convolve
      output: Bold
      equation:
          rhs: "subsample(X, start, stepsize)"
      arguments:
          start:
              description: >-
                  Index of first output sample (resolved to stepsize - 1) so the
                  first sample aligns with TVB's step % istep == 0 emission.
          stepsize:
              description: >-
                  Interim samples per output sample. Resolved from the integration
                  dt (= (TR / dt) / interim_istep), not a raw-grid literal.
      apply_on_dimension: time
