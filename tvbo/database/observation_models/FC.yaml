# Functional Connectivity Observation Model
# Computes pairwise correlation matrices from neural time series
#
# References:
# - Friston (1994) "Functional and effective connectivity in neuroimaging"
# - Honey et al. (2009) "Predicting human resting-state functional connectivity"

name: FunctionalConnectivity
description: >-
    Functional Connectivity (FC) observation model that computes pairwise
    Pearson correlation coefficients between regional time series.
    Commonly used to characterize the statistical dependencies between
    brain regions from fMRI or simulated neural activity.

# Source: defined by the study that uses this observation model
# (typically BOLD signal or neural activity time series)

# Default sampling period
period: 720.0  # ms (typical fMRI TR)

# Parameters (can be overridden per study)
parameters:
    TR:
        value: 720.0
        unit: ms
        description: Repetition time
    fisher_z:
        value: true
        description: Apply Fisher z-transformation to correlations

pipeline:
    # Function 1: Bandpass filter the time series
    - name: bandpass_filter
      output: filtered
      callable:
          module: scipy.signal
          name: butter
      equation:
          rhs: "bandpass(X, low_freq, high_freq, fs)"
      arguments:
          low_freq:
              value: 0.01
              unit: Hz
              description: "Low frequency cutoff"
          high_freq:
              value: 0.1
              unit: Hz
              description: "High frequency cutoff"
          order:
              value: 2
              description: "Filter order"
      apply_on_dimension: time

    # Function 2: Z-score normalization per region
    - name: zscore
      input: bandpass_filter
      output: normalized
      callable:
          module: scipy.stats
          name: zscore
      equation:
          rhs: "(X - mean(X)) / std(X)"
      arguments:
          axis:
              value: 0
              description: "Normalize along time axis"
      apply_on_dimension: time

    # Function 3: Compute Pearson correlation matrix
    - name: correlation
      input: zscore
      output: fc_matrix
      callable:
          module: numpy
          name: corrcoef
      equation:
          rhs: "corrcoef(transpose(X))"
      arguments:
          rowvar:
              value: false
              description: "Each column represents a variable (region)"

    # Function 4: Fisher z-transformation (optional)
    - name: fisher_z_transform
      input: correlation
      output: FC
      callable:
          module: numpy
          name: arctanh
      equation:
          rhs: "arctanh(X)"
          parameters:
              clip_value:
                  value: 0.999
                  description: "Clip correlations to avoid infinity at r=±1"
      arguments:
          apply:
              value: true
              description: "Whether to apply Fisher z-transformation"
