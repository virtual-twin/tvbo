# BOLD (First Order Volterra) - hemodynamic forward model

name: BOLD_TVB
label: BOLD (First Order Volterra)
description: >-
    BOLD fMRI observation model using the Balloon-Windkessel hemodynamic model.
    Transforms neural activity into simulated BOLD signal via convolution with
    a hemodynamic response function (First Order Volterra kernel), followed by
    a nonlinear Volterra transformation.

imaging_modality: BOLD

class_reference:
    name: Bold
    module: tvb.simulator.monitors
    constructor_args:
        - name: hrf_kernel
          value: FirstOrderVolterra
        - name: hrf_length
          value: 20000.0

parameters:
    TR:
        value: 720.0
        unit: ms
        description: Repetition time (sampling period)

pipeline:
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "window_mean(X, stepsize)"
      arguments:
          stepsize:
              description: >-
                  Interim averaging window in integration steps. Resolved from the
                  integration dt (= stock_dt / dt), not a raw-grid literal, so every
                  backend downsamples the neural trace onto the same stock grid.
      apply_on_dimension: time

    - name: hemodynamic_response
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          rhs: "1/3 * exp(-0.5*(t / tau_s)) * sin(sqrt(1/tau_f - 1/(4*tau_s**2)) * t) / sqrt(1/tau_f - 1/(4*tau_s**2))"
          parameters:
              tau_f:
                  value: 0.4
                  unit: s
              tau_s:
                  value: 0.8
                  unit: s
      arguments:
          duration:
              value: 20
              unit: s
          stock_dt:
              value: 0.004
              unit: s

    - name: convolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          in2:
              value: hrf_kernel
          mode:
              value: same

    - name: subsample_to_period
      input: convolve
      output: subsampled
      equation:
          rhs: "subsample(X, start, stepsize)"
      arguments:
          start:
              description: >-
                  Index of the first output sample. Resolved to stepsize - 1 so
                  the first sample lands at the same interim step TVB emits at
                  (step % istep == 0, 1-indexed), matching tvboptim/tvb.
          stepsize:
              description: >-
                  Number of interim (stock-grid) samples per output sample. Resolved
                  from the integration dt (= (TR / dt) / interim_istep), not a
                  raw-grid literal, so all backends emit the same number of samples.
      apply_on_dimension: time

    - name: volterra_transform
      input: subsample_to_period
      output: Bold
      equation:
          rhs: "(X - 1.0) * k_1 * V_0"
          parameters:
              k_1:
                  value: 5.6
                  description: "Intravascular signal contribution"
              V_0:
                  value: 0.02
                  description: "Resting blood volume fraction"
