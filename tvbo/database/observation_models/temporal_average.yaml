# Temporal Average - running temporal mean

name: TemporalAverage
label: Temporal Average
description: >-
    Running temporal mean over a sliding window of configurable length.
    Returns one averaged sample per period.

period: 0.9765625  # ms (~1024 Hz default)

class_reference:
    name: TemporalAverage
    module: tvb.simulator.monitors

pipeline:
    - name: temporal_average
      output: averaged
      equation:
          rhs: "window_mean(X, window_size)"
      arguments:
          window_size:
              description: "Number of integration steps per averaging window = period / dt"
      apply_on_dimension: time
