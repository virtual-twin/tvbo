# tvboptim's TemporalAverage, pinned to the class bit for bit by tests/test_tvboptim_monitor_formalization.py: the mean of each complete window, stamped at the window's centre. temporal_average_tvb.yaml is TVB's monitor, with TVB's stamps.

name: TemporalAverage_tvboptim
label: Temporal Average (tvboptim windowing)
iri: tvbo:observation_models/temporal_average_tvboptim
description: >-
    Running temporal mean over non-overlapping windows of `period`, as tvboptim's TemporalAverage computes it: each complete window of `iround(period / dt)` samples, counted from the first, is averaged and stamped at its centre, `dt + (window_size - 1) dt / 2` after the window opens; a trailing partial window is dropped. Use TemporalAverage for TVB's monitor.

period: 0.9765625  # ms (~1024 Hz default)

pipeline:
    - name: temporal_average_tvboptim
      output: averaged
      equation:
          rhs: "complete_window_mean(X, window_size)"
          parameters:
              window_size:
                  equation: {rhs: "iround(period / dt)"}
                  description: "Integration steps per averaging window, so the window tracks the grid the experiment declares rather than the one this file was written on."
      arguments:
          window_size:
              description: "Integration steps per averaging window. Its value is declared on the equation parameter of the same name; a backend that has not yet been migrated to read that still derives it here."
      apply_on_dimension: time

time_stamps:
    rhs: "take(t, 0) - dt + (dt + (window_size - 1) * dt / 2.0) + arange(n) * period"
    parameters:
        window_size:
            equation: {rhs: "iround(period / dt)"}
            description: "Integration steps per averaging window, as the pipeline averages."
