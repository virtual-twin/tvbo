# BOLD (Region ROI) - BOLD with spatial averaging across parcellation

name: BOLD_RegionROI
label: BOLD (Region ROI)
description: >-
    BOLD fMRI observation model that computes the hemodynamic response at
    each source location and spatially averages within brain regions using
    a parcellation mapping. Produces per-region BOLD signals suitable for
    comparison with parcellated empirical data.

imaging_modality: BOLD
period: 2000.0  # ms (0.5 Hz, typical fMRI TR)

class_reference:
    name: BoldRegionROI
    module: tvb.simulator.monitors
    constructor_args:
        - name: hrf_kernel
          value: FirstOrderVolterra
        - name: hrf_length
          value: 20000.0

parameters:
    hrf_length:
        value: 20000.0
        unit: ms

pipeline:
    - name: temporal_average_interim
      output: interim_averaged
      equation:
          rhs: "window_mean(X, window)"
      arguments:
          window:
              description: >-
                  Interim averaging window in integration steps. Resolved from the
                  integration dt (= stock_dt / dt), not a raw-grid literal.
      apply_on_dimension: time

    - name: hemodynamic_response
      acronym: HRF
      output: hrf_kernel
      time_range:
          lo: 0
          hi: duration
          step: stock_dt
      equation:
          rhs: "1/3 * exp(-0.5*(t / tau_s)) * sin(sqrt(1/tau_f - 1/(4*tau_s**2)) * t) / sqrt(1/tau_f - 1/(4*tau_s**2))"
          parameters:
              tau_s:
                  value: 0.8
                  unit: s
              tau_f:
                  value: 0.4
                  unit: s
      arguments:
          duration:
              value: 20
              unit: s
          stock_dt:
              value: 0.004
              unit: s

    - name: convolve
      input: temporal_average_interim
      output: convolved
      callable:
          module: scipy.signal
          name: fftconvolve
      arguments:
          in2:
              value: hrf_kernel
          mode:
              value: same

    - name: subsample_to_period
      input: convolve
      output: subsampled
      equation:
          rhs: "subsample(X, start, step)"
      arguments:
          start:
              description: >-
                  Index of first output sample (resolved to step - 1) so the first
                  sample aligns with TVB's step % istep == 0 emission.
          step:
              description: >-
                  Interim samples per output sample. Resolved from the integration
                  dt (= (period / dt) / interim_istep), not a raw-grid literal.
      apply_on_dimension: time

    - name: volterra_transform
      input: subsample_to_period
      output: bold_source
      equation:
          rhs: "(X - 1.0) * k_1 * V_0"
          parameters:
              k_1:
                  value: 5.6
              V_0:
                  value: 0.02

    - name: region_average
      input: volterra_transform
      output: Bold
      description: >-
          Spatially average the source-level BOLD within each brain region
          using the parcellation mapping.
      equation:
          rhs: "spatial_mean @ X"
      arguments:
          spatial_mean:
              description: "Region averaging matrix (n_regions, n_sources)"
      apply_on_dimension: node
