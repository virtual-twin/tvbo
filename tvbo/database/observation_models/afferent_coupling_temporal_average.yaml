# Afferent Coupling Temporal Average

name: AfferentCouplingTemporalAverage
label: Afferent Coupling Temporal Average
description: >-
    Temporally averaged afferent coupling input at each node. Combines
    coupling input recording with temporal averaging.

source: [coupling]
period: 0.9765625  # ms (~1024 Hz default)

class_reference:
    name: AfferentCouplingTemporalAverage
    module: tvb.simulator.monitors

pipeline:
    - name: temporal_average
      output: averaged_coupling
      equation:
          rhs: "window_mean(X, window_size)"
      arguments:
          window_size:
              description: "Number of integration steps per averaging window = period / dt"
      apply_on_dimension: time
