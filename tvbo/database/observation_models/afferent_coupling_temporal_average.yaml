# Afferent Coupling Temporal Average

name: AfferentCouplingTemporalAverage
label: Afferent Coupling Temporal Average
description: >-
    Temporally averaged afferent coupling input at each node. Combines
    coupling input recording with temporal averaging.

source: [coupling]
period: 0.9765625  # ms (~1024 Hz default)

class_reference:
    name: AfferentCouplingTemporalAverage
    module: tvb.simulator.monitors

pipeline:
    - name: temporal_average
      output: averaged_coupling
      equation:
          rhs: "window_mean(X, window_size)"
          parameters:
              window_size:
                  equation: {rhs: "iround(period / dt)"}
                  description: "Integration steps per averaging window. Inherits TemporalAverage's windowing, so it rounds with TVB's own iround rather than truncating."
      arguments:
          window_size:
              description: "Integration steps per averaging window. Its value is declared on the equation parameter of the same name; a backend that has not yet been migrated to read that still derives it here."
      apply_on_dimension: time
