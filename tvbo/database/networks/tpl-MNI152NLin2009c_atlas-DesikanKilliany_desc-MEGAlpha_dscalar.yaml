tvbo_class: tvbo:Network
schema_version: tvb-datamodel/0.7.0
label: "Desikan-Killiany 68 cortical parcels with MEG alpha amplitudes per region"
description: |
  Per-region MEG alpha-band amplitude values aligned with the 68 cortical parcels
  of the Desikan-Killiany atlas. Sourced from
  tvb-ontology-optim-workshop/notebooks/data/{lh,rh}_megalpha_parc.csv.

  The measure exhibits the canonical cortical-hierarchy gradient:
    - unimodal sensory regions (pericalcarine, cuneus, lateraloccipital,
      transversetemporal) score high  (~0.40)
    - transmodal regions       (rostralanteriorcingulate, frontalpole,
      temporalpole, medialorbitofrontal) score low (~0.15)

  Used as a per-region cortical-gradient signal in experiments that need
  to ground a hierarchy (e.g. reservoir-computing frequency-gradient
  targets, JR-MEG peak-frequency optimisation). The values are
  dimensionless normalised amplitudes; downstream consumers rescale
  to a task-appropriate range (e.g. omega in Hz).

descriptor: MEGAlpha
observational_measures: [megalpha]
structural_measures: []                            # no edges — this is a dscalar carrier
number_of_nodes: 68

parcellation:
  atlas:
    name: DesikanKilliany
    coordinateSpace: MNI152NLin2009c

