tvbo_class: tvbo:Network
schema_version: tvb-datamodel/0.7.0
label: Simple 3-Node Network Example
description: Example network with 3 nodes and two different coupling types (excitatory
  and inhibitory)
number_of_nodes: 3
coupling:
  excitatory:
    label: Excitatory Linear Coupling
    coupling_function:
      rhs: a * x
      parameters:
        a:
          value: 1.0
    delayed: true
  inhibitory:
    label: Inhibitory Sigmoidal Coupling
    coupling_function:
      rhs: -1.0 / (1.0 + exp(-a * (x - theta)))
      parameters:
        a:
          value: 0.5
        theta:
          value: 0.0
    delayed: true
parameters:
  G:
    value: 1.0
  conduction_speed:
    value: 3.0
    unit: mm_per_ms
nodes:
- id: 0
  label: Node_A
  dynamics: Generic2dOscillator
  position:
    x: -10.0
    y: 0.0
    z: 0.0
  region: Left Frontal
  state:
    V:
      value: 0.1
    W:
      value: 0.0
- id: 1
  label: Node_B
  dynamics: Generic2dOscillator
  position:
    x: 0.0
    y: 10.0
    z: 0.0
  region: Parietal
  state:
    V:
      value: -0.1
    W:
      value: 0.0
- id: 2
  label: Node_C
  dynamics: Generic2dOscillator
  position:
    x: 10.0
    y: 0.0
    z: 0.0
  region: Right Frontal
  state:
    V:
      value: 0.0
    W:
      value: 0.1
edges:
- source: 0
  target: 1
  coupling: excitatory
  weight: 0.8
  delay: 2.0
  distance: 14.14
- source: 1
  target: 2
  coupling: excitatory
  weight: 0.9
  delay: 1.8
  distance: 14.14
- source: 2
  target: 0
  coupling: inhibitory
  weight: 0.6
  delay: 2.5
  distance: 20.0
- source: 1
  target: 0
  coupling: inhibitory
  weight: 0.4
  delay: 2.2
  distance: 14.14
