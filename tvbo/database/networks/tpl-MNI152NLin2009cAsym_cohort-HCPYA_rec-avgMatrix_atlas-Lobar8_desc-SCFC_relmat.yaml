label: Lobar8 (avgMatrix)
description: 'The Desikan-Killiany avgMatrix network `tvbo:networks/tpl-MNI152NLin2009cAsym_cohort-HCPYA_rec-avgMatrix_atlas-DesikanKilliany_desc-SCFC_relmat`, and so the HCP Young Adult S900 group average, aggregated to 8 lobes per hemisphere by `compute_lobar_avgmatrix` and `build_lobar8_network` in `scripts/create_lobar_network.py` (commit 25b293c40). Each of a hemisphere''s 42 regions joins one lobe by the script''s `DK_ABBREV_TO_LOBE`: 11 cortical regions Frontal, 5 Parietal, 9 Temporal, 4 Occipital, 4 Cingulate and the insula Insular; the thalamus, caudate, putamen, pallidum, hippocampus, amygdala and accumbens Subcortical; the cerebellar cortex Cerebellum. For each pair of lobes, over every pair of their regions, a region paired with itself included, `weight` is the mean weight, `length` the mean tract length weighted by the weights (the sum of weight times length over the sum of weights) and `fc` the mean correlation; the Desikan-Killiany diagonal is zero in all three.'
