tvbo_class: tvbo:Network
schema_version: tvb-datamodel/0.7.0
label: Schaefer2018_100_7Networks_Hansen2022_SCFC
description: Schaefer2018 100-parcel 7Networks multi-graph network from Hansen et
  al. (2022). Contains structural connectivity (SC) from diffusion MRI tractography
  and functional connectivity (FC) from resting-state fMRI, both derived from the
  HCP Young Adult cohort. SC edge weights are log-transformed streamline counts normalized
  to [0, 1]. FC edge weights are Pearson correlations.
number_of_nodes: 100
descriptor: SCFC
distance_unit: mm
data_file: tpl-FSLMNI152_cohort-HCPYA_rec-Hansen2022_atlas-Schaefer2018_seg-7Networks_scale-100_desc-SCFC_relmat.h5
edges:
- label: sc
  format: dense
  weighted: true
  valid_diagonal: false
  non_negative: true
  directed: false
  description: SC weighted connectivity, log-transformed streamline counts normalized
    to [0, 1]
- label: sc_binary
  format: dense
  weighted: false
  valid_diagonal: false
  non_negative: true
  directed: false
  description: SC group-consensus binary mask (density- and edge-length-preserving)
- label: fc
  format: dense
  weighted: true
  valid_diagonal: false
  non_negative: false
  directed: false
  description: FC group-average Pearson correlation, HCP Young Adult cohort
node_mapping: /nodes/parent_index
bids:
  template: FSLMNI152
  cohort: HCPYA
  reconstruction: Hansen2022
  segmentation: 7Networks
  scale: '100'
  atlas: Schaefer2018
parameters:
  conduction_speed:
    label: v
    value: 3.0
    unit: mm_per_ms
parcellation:
  atlas:
    name: Schaefer2018
    coordinateSpace: {name: FSLMNI152}
tractogram:
  name: Hansen2022
  label: MRtrix3-MSMT-CSD-SIFT2 group-consensus SC
  description: 'Group-consensus structural connectivity from HCP Young Adult cohort.
    DWI pre-processed with MRtrix3 (v3). Fiber orientation distributions using multi-shell
    multi-tissue constrained spherical deconvolution (MSMT-CSD). Probabilistic streamline
    tractography on the generated FODs. Streamline weights optimized with SIFT2 (cross-section
    multiplier). Group-consensus binary network constructed preserving density and
    edge-length distributions of individual connectomes. Edge weights: mean log-transformed
    streamline count of non-zero edges across participants, normalized to [0, 1].'
  processing_pipeline: MRtrix3-MSMT-CSD-SIFT2
  reference: Hansen JY, Shafiei G, Markello RD, Smart K, Cox SML, Wu Y, Diez I, Schirner
    M, Wirsich J, Bhatt DL, Misic B. (2022). Mapping neurotransmitter systems to the
    structural and functional organization of the human neocortex. Nature Neuroscience,
    25, 1569-1581. https://doi.org/10.1038/s41593-022-01186-3
provenance:
  date_created: '2026-03-17'
  derived_from: https://github.com/netneurolab/hansen_receptors/tree/main/data/schaefer
  generated_by: tvbo scripts/create_hansen2022_schaefer_networks.py
  references:
  - Hansen JY, Shafiei G, Markello RD, Smart K, Cox SML, Wu Y, Diez I, Schirner M,
    Wirsich J, Bhatt DL, Misic B. (2022). Mapping neurotransmitter systems to the
    structural and functional organization of the human neocortex. Nature Neuroscience,
    25, 1569-1581. https://doi.org/10.1038/s41593-022-01186-3
  - Schaefer A, Kong R, Gordon EM, Laumann TO, Zuo XN, Holmes AJ, Eickhoff SB, Yeo
    BTT. (2018). Local-Global Parcellation of the Human Cerebral Cortex from Intrinsic
    Functional Connectivity MRI. Cerebral Cortex, 29(3), 3095-3114. https://doi.org/10.1093/cercor/bhx179
  - 'Van Essen DC, Smith SM, Barch DM, Behrens TEJ, Yacoub E, Ugurbil K; WU-Minn HCP
    Consortium. (2013). The WU-Minn Human Connectome Project: an overview. NeuroImage,
    80, 62-79. https://doi.org/10.1016/j.neuroimage.2013.05.041'
