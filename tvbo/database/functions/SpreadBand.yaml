name: SpreadBand
label: Centre and spread band along a dimension
description: The centre of values along one dimension and a band around it, the pair a band or errorbar layer draws. mean_sd is the mean with the band from one standard deviation below it to one above, the squared deviations divided by n - ddof for the n values counted, so ddof 0 is the population form numpy computes by default and 1 the sample form of pandas and seaborn. median_iqr is the median with the band from the 25th to the 75th percentile, each read at rank p (n - 1) of the sorted values and interpolated linearly between its two neighbours, numpy's default method. NaN entries are left out, as numpy's nanmean, nanstd, nanmedian and nanpercentile leave them out, and a slice with no other entry gives NaN. Every other dimension is kept with its labels. It returns center on the other dimensions, and band on them and a last dimension, bound, labelled lower and upper in the order the band and errorbar marks read the two edges.
arguments:
  values: {description: 'The values, a labelled array running along `dim` with any further dimensions, or a bare 1-D array along it.'}
  dim: {description: 'Name of the dimension the centre and the spread are taken over, such as `trial`.'}
  statistic: {description: '`mean_sd` for the mean and one standard deviation either side, or `median_iqr` for the median and the 25th and 75th percentiles.'}
  ddof: {description: 'Delta degrees of freedom of the standard deviation, which `mean_sd` requires, 0 for the population form and 1 for the sample form; `median_iqr` refuses it.'}
callable: {name: spread_band, module: tvbo.analysis.statistics}
