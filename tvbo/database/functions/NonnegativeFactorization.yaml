name: NonnegativeFactorization
label: Subnetworks of a cohort's connectomes by nonnegative matrix factorization
description: "Each subject's weights on the region pairs a mask keeps form one column of a data matrix of pairs by subjects, which is approximated by nonnegative factors w (pairs by components) and h (components by subjects), each component's column of w and row of h summing to one and its scale held in d, as RcppML's nmf fits it (DeBruine et al. 2021, doi:10.1101/2021.09.01.458620; version 0.5.6): alternating least squares, each factor's nonnegative least-squares problem solved by sequential coordinate descent (Franc et al. 2005, doi:10.1007/11556121_50) and rescaled to unit sums, until one minus the correlation of w with its value an iteration earlier falls below tol or after max_iter iterations, and of n_starts random starts the one with the least squared error kept. Koller et al. (2024, doi:10.1038/s41467-024-47860-x) factorized 776 subjects' weights on the pairs of their consistency-thresholded group connectome at rank 5 from 100 starts. Pairs and subjects are taken by their sorted labels, so the order of neither input's axes changes the result. It returns subnetwork on component and the two node axes, each component's mean over subjects on the kept pairs and their mirror as Koller et al. rebuild it; w on pair, with each pair's two region labels, and component; h on component and subject; d on component; rmse and explained_variance of the reconstruction over all pairs and subjects; and iterations, the updates the kept start ran."
arguments:
  weight: {description: 'One symmetric connectome per subject, stacked on a `subject` axis beside two node axes and labelled on all three, as a cohort read returns them; every weight on a kept pair is finite and nonnegative.'}
  mask: {description: 'A symmetric connectome on the same two node axes and labels, whose nonzero pairs off the diagonal are factorized, each pair once; Koller et al. (2024) used their consistency-thresholded group connectome.'}
  rank: {description: 'The number of components, a whole number of at least 1; Koller et al. (2024) chose 5 by cross-validation.'}
  seed: {description: 'A whole number of at least 0 that fixes the random starts.'}
  n_starts: {value: 1, description: 'The number of random starts, a whole number of at least 1; the fit with the least squared error is kept. Koller et al. (2024) used 100.'}
  tol: {value: 1.0e-4, description: 'The updates stop once one minus the Pearson correlation of w with its value an iteration earlier is below this, RcppML''s default.'}
  max_iter: {value: 100, description: 'The most alternating updates a start runs, RcppML''s default.'}
callable: {name: nonnegative_factorization, module: tvbo.analysis.connectome}
