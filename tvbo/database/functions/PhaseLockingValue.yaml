name: PhaseLockingValue
label: Phase locking value
description: The phase locking value of every two nodes, the modulus of the mean over the samples of exp(i (phase_j - phase_k)), for a phase in radians (Lachaux et al. 1999). It is 1 for two nodes whose phase difference stays constant and near 0 for one spread evenly over the circle, and 1 on the diagonal. It returns the node-by-node matrix on the phase's node dimension and the same name with _j appended, labelled as the phase is. A grid streams the same quantity through the reducer recipe phase_locking_value, which replaces this function in an observation marked reduce streaming.
arguments:
  phase: {description: 'The phase in radians, along `dim` and one node dimension; a bare array is read with `dim` first.'}
  dim: {value: time, description: 'Name of the dimension the samples run along.'}
callable: {name: phase_locking_value, module: tvbo.analysis.statistics}
