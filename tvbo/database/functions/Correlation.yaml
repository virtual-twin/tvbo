name: Correlation
label: Correlation along a dimension
description: Pearson's or Spearman's correlation coefficient of two variables over the units of one dimension, one coefficient per element of every other dimension. Spearman's is Pearson's over the ranks, tied values given the mean of the ranks they span, as scipy's rankdata and spearmanr rank them. A unit enters where both variables are finite, so a NaN on either side drops that pair only, and the ranks are taken over the pairs that enter. Labelled inputs are paired on the labels of the dimension, which occur once each and which both carry. A coefficient is NaN with fewer than three pairs or a constant side. It returns r and n, the number of pairs it was computed from.
arguments:
  x: {description: 'One value per unit, along `dim`; it may carry further dimensions.'}
  y: {description: 'The values x is correlated with, one per unit along `dim`; it may carry further dimensions.'}
  dim: {description: 'Name of the dimension the units run along.'}
  method: {description: '`pearson` for the correlation of the values, or `spearman` for the correlation of their ranks.'}
callable: {name: correlation, module: tvbo.analysis.statistics}
