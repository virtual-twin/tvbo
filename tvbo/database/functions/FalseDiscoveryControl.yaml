name: FalseDiscoveryControl
label: False discovery rate control
description: The p-values of a family of tests adjusted to control the false discovery rate, by the Benjamini-Hochberg step-up procedure or the Benjamini-Yekutieli one, as scipy.stats.false_discovery_control adjusts them, and the tests kept at a given rate. The entries of a family that are not NaN are its tests. A NaN is no test; it stays NaN, is never selected and is not counted, where scipy refuses it. Any other entry outside 0 to 1 is refused, as scipy refuses it. It returns p_adjusted, shaped and labelled as p, and n_tests; with a rate q also selected, true for every test up to the largest p-value at or below q times its rank over the number of tests, and n_selected.
arguments:
  p: {description: 'The p-values, of any shape, each between 0 and 1 or NaN for a test that was not made.'}
  q: {description: 'False discovery rate at which tests are selected, one number above 0 and below 1; without it only the adjusted p-values are returned. Both ends are refused with every value beyond them: at 1 the bound holds for any selection, so nothing is controlled and Benjamini-Hochberg keeps every test, and at 0 only a p-value of exactly 0 could be kept.'}
  method: {value: bh, description: '`bh` for Benjamini-Hochberg, valid for independent or positively dependent tests, or `by` for Benjamini-Yekutieli, valid under any dependence.'}
  dim: {description: 'Name of the dimension a family runs along, one family per element of the others; without it all of p is one family.'}
callable: {name: false_discovery_control, module: tvbo.analysis.statistics}
