name: AtOptimum
label: Value at the optimum of a score
description: The entry of a value array at the cell where a score is largest or smallest, the score there and the cell's coordinates, as when a quantity a parameter grid records is read at the parameters that fit data best. The optimum is searched over every dimension of score; value carries each of them with the same labels, in any order, and keeps its other dimensions, and a dimension without labels is labelled by position. NaN scores are ignored, and a score that is NaN in every cell is refused. Of several cells with the optimal score the one with the smallest coordinates is taken, compared dimension by dimension in the sorted order of the dimensions' names, so neither the order of the dimensions nor that of the labels along them changes the cell. It returns value at the optimum on its other dimensions, score, and one output per dimension of score, named by the dimension and holding its coordinate at the optimum.
arguments:
  score: {description: 'The score of every cell, a labelled array over the dimensions the optimum is searched along.'}
  value: {description: 'The array read at the optimum, carrying every dimension of score with the same labels and any further ones.'}
  direction: {description: '`max` for the cell with the largest score, `min` for the cell with the smallest.'}
callable: {name: at_optimum, module: tvbo.analysis.statistics}
