name: GenericLinear
iri: tvbo:GenericLinear
model_type: generic
parameters:
  gamma:
    definition: 'Slope parameter of the state-variable ''x_GL'', representing the inverse of the relaxation time.


      Note: The ‘minus’ sign for the self-connections, scaled by ''gamma_GL'', guarantees that the nodes have a stable equilibrium point (ref).'
    value: -10.0
    domain:
      lo: -100.0
      hi: 0.0
      step: 1.0
    description: Slope parameter of the state-variable 'x_GL', representing the inverse of the relaxation time
description: The Generic Linear (GL) is a phenomenological, linear one-dimensional  (i.e., one state-variable ('x')) neural mass model (Galán, 2008).
references:
- Galan2008
coupling_inputs:
  c_glob: {}
  local_coupling: {local: true}
state_variables:
  x:
    domain:
      lo: -1.0
      hi: 1.0
    description: State-variable of the Generic Linear model
    equation:
      lhs: Derivative(x, t)
      rhs: c_glob + gamma*x + local_coupling*x
      latex: false
    coupling_variable: true
    initial_value: 0.1
number_of_modes: 1
