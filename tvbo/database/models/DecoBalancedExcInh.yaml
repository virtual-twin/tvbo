description: Deco Balanced Exc-Inh model. It extends the Reduced Wong-Wang Exc-Inh (RWW_EI) dynamic mean-field model with an effective regional gain parameter M_i that scales both the excitatory and inhibitory input currents, capturing the dynamical consequences of regional heterogeneity in the brain's transcriptional landscape (Deco et al., 2021).
references:
- Deco2021
derived_variables:
  J_N_S_e:
    equation:
      lhs: J_N_S_e
      rhs: J_N*S_e
      latex: false
    conditional: false
  coupling:
    equation:
      lhs: coupling
      rhs: G*J_N*(S_e*local_coupling + c_pop0)
      latex: false
    conditional: false
  I_e:
    description: Input current to the excitatory population (Deco et al., 2021).
    equation:
      lhs: I_e
      rhs: I_ext + I_o*W_e + J_N_S_e*w_p - J_i*S_i + coupling
      latex: false
    conditional: false
    grounding:
    - GO:0098815
  I_i:
    description: Input current to the inhibitory population (Deco et al., 2021).
    equation:
      lhs: I_i
      rhs: I_o*W_i + J_N_S_e - S_i + coupling*lamda
      latex: false
    conditional: false
    grounding:
    - GO:0060080
  x_e:
    description: Gain-scaled input current to the excitatory population (Deco et al., 2021).
    equation:
      lhs: x_e
      rhs: M_i*(a_e*I_e - b_e)
      latex: false
    conditional: false
    grounding:
    - GO:0098815
  x_i:
    description: Gain-scaled input current to the inhibitory population (Deco et al., 2021).
    equation:
      lhs: x_i
      rhs: M_i*(a_i*I_i - b_i)
      latex: false
    conditional: false
    grounding:
    - GO:0060080
  H_e:
    description: Sigmoid function that computes the averaged firing rate of the excitatory neuron population (Deco et al., 2021).
    equation:
      lhs: H_e
      rhs: x_e/(1 - exp(-d_e*x_e))
      latex: false
    conditional: false
    grounding:
    - GO:0060079
    - GO:0099605
  H_i:
    description: Sigmoid function that computes the averaged firing rate of the inhibitory neuron population (Deco et al., 2021).
    equation:
      lhs: H_i
      rhs: x_i/(1 - exp(-d_i*x_i))
      latex: false
    conditional: false
    grounding:
    - GO:0060080
    - GO:0099605
coupling_inputs:
  c_pop0: {}
  local_coupling: {}
state_variables:
  S_e:
    domain:
      lo: 0.0
      hi: 1.0
      enforce: clamp
    description: Excitatory population synaptic gating state-variable of the Deco Balanced Exc-Inh model (Deco et al., 2021).
    equation:
      lhs: Derivative(S_e, t)
      rhs: H_e*gamma_e*(1 - S_e) - S_e/tau_e
      latex: false
    variable_of_interest: true
    coupling_variable: true
    initial_value: 0.1
    grounding:
    - GO:0060079
    - GO:0099536
  S_i:
    domain:
      lo: 0.0
      hi: 1.0
      enforce: clamp
    description: Inhibitory population synaptic gating state-variable of the Deco Balanced Exc-Inh model (Deco et al., 2021).
    equation:
      lhs: Derivative(S_i, t)
      rhs: H_i*gamma_i - S_i/tau_i
      latex: false
    variable_of_interest: true
    coupling_variable: false
    initial_value: 0.1
    grounding:
    - GO:0060080
    - GO:0099536
number_of_modes: 1
