name: GastSchmidtKnosche_SF
iri: tvbo:GastSchmidtKnosche_SF
model_type: neural_mass
parameters:
  Delta:
    definition: Half-width of heterogeneous noise distribution
    value: 2.0
    domain:
      lo: 0.0
      hi: 10.0
      step: 0.01
    description: Half-width of heterogeneous noise distribution
  I:
    definition: External homogeneous current
    value: 0.0
    domain:
      lo: -10.0
      hi: 10.0
      step: 0.01
    description: External homogeneous current
  J:
    definition: Synaptic weight
    value: 21.2132
    domain:
      lo: -25.0
      hi: 25.0
      step: 0.01
    description: Synaptic weight
    grounding:
    - GO:0099536
  alpha:
    definition: adaptation rate
    value: 10.0
    domain:
      lo: 0.0
      hi: 1.0
      step: 0.1
    description: adaptation rate
    grounding:
    - GO:0042391
  cr:
    definition: It is the weight on Coupling through variable r.
    value: 1.0
    domain:
      lo: 0.0
      hi: 1.0
      step: 0.1
    description: It is the weight on Coupling through variable r
  cv:
    definition: It is the weight on Coupling through variable V.
    value: 0.0
    domain:
      lo: 0.0
      hi: 1.0
      step: 0.1
    description: It is the weight on Coupling through variable V
  eta:
    definition: Mean of heterogeneous noise distribution
    value: 1.0
    domain:
      lo: -10.0
      hi: 10.0
      step: 0.0001
    description: Mean of heterogeneous noise distribution
  tau_A:
    definition: Adaptation time scale
    value: 10.0
    domain:
      lo: 0.0
      hi: 15.0
      step: 0.01
    description: Adaptation time scale
  tau:
    definition: Characteristic time
    value: 1.0
    domain:
      lo: 0.0
      hi: 15.0
      step: 0.01
    description: Characteristic time
description: ''
references:
- Gast2020
coupling_inputs:
  c_glob0: {}
  c_glob1: {}
state_variables:
  A:
    domain:
      lo: -1.0
      hi: 1.0
    equation:
      lhs: Derivative(A, t)
      rhs: B/tau_A
      latex: false
    coupling_variable: true
    initial_value: 0.1
  B:
    domain:
      lo: -1.0
      hi: 1.0
    equation:
      lhs: Derivative(B, t)
      rhs: (-A - 2*B + alpha*r)/tau_A
      latex: false
    coupling_variable: true
    initial_value: 0.1
  V:
    domain:
      lo: -2.0
      hi: 1.5
    equation:
      lhs: Derivative(V, t)
      rhs: (-A + I + J*r*tau + V**2 + c_glob0*cr + c_glob1*cv + eta - pi**2*r**2*tau**2)/tau
      latex: false
    coupling_variable: true
    initial_value: 0.1
  r:
    domain:
      lo: 0.0
      hi: .inf
      enforce: clamp
    equation:
      lhs: Derivative(r, t)
      rhs: (Delta/(pi*tau) + 2*V*r)/tau
      latex: false
    coupling_variable: true
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        lo: 0.0
        hi: 2.0
number_of_modes: 1
