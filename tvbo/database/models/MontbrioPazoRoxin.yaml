name: MontbrioPazoRoxin
iri: tvbo:MontbrioPazoRoxin
model_type: mean_field
parameters:
  Delta:
    definition: Mean heterogeneous noise
    value: 1.0
    domain:
      lo: 0.0
      hi: 10.0
      step: 0.01
    description: Mean heterogeneous noise
    grounding:
    - GO:0061669
  I:
    definition: External Current
    value: 0.0
    domain:
      lo: -10.0
      hi: 10.0
      step: 0.01
    description: External Current
  J:
    definition: Mean Synaptic weight.
    value: 15.0
    domain:
      lo: -25.0
      hi: 25.0
      step: 0.0001
    description: Mean Synaptic weight
    grounding:
    - GO:0042391
    - GO:0099536
  cr:
    definition: It is the weight on Coupling through variable r.
    value: 1.0
    domain:
      lo: 0.0
      hi: 1.0
      step: 0.1
    description: It is the weight on Coupling through variable r
  cv:
    definition: It is the weight on Coupling through variable V.
    value: 0.0
    domain:
      lo: 0.0
      hi: 1.0
      step: 0.1
    description: It is the weight on Coupling through variable V
  eta:
    definition: Constant parameter to scale the rate of feedback from the firing rate variable to itself
    value: -5.0
    domain:
      lo: -10.0
      hi: 10.0
      step: 0.0001
    description: Constant parameter to scale the rate of feedback from the firing rate variable to itself
    grounding:
    - GO:0099605
  tau:
    definition: Membrane time constant
    value: 1.0
    domain:
      lo: 0.001
      hi: 15.0
      step: 0.01
    description: Membrane time constant
description: ''
references:
- Montbrio2015
coupling_inputs:
  c_pop0: {}
  c_pop1: {}
state_variables:
  V:
    domain:
      lo: -2.0
      hi: 1.5
    equation:
      lhs: Derivative(V, t)
      rhs: (I + J*r*tau + V**2 + c_pop0*cr*tau + c_pop1*cv + eta - pi**2*r**2*tau**2)/tau
      latex: false
    coupling_variable: true
    initial_value: 0.1
  r:
    domain:
      lo: 0.0
      hi: .inf
      enforce: clamp
    distribution:
      name: Uniform
      domain:
        lo: 0.0
        hi: 2.0
    equation:
      lhs: Derivative(r, t)
      rhs: (Delta/(pi*tau) + 2*V*r)/tau
      latex: false
    coupling_variable: true
    initial_value: 0.1
number_of_modes: 1
