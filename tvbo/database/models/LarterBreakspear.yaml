    value: 0.25
    domain:
      lo: 0.2
      hi: 0.3
      step: 0.05
    description: Ratio of NMDA to AMPA receptors
    grounding:
    - GO:0004971
  t_scale:
    definition: Time scale factor
    value: 1.0
    domain:
      lo: 0.1
      hi: 1.0
      step: 0.001
    description: Time scale factor
  tau_K:
    definition: Time constant for K relaxation time (ms)
    value: 1.0
    domain:
      lo: 1.0
      hi: 10.0
      step: 1.0
    description: Time constant for K relaxation time (ms)
    grounding:
    - GO:0005267
description: "The Larter-Breakspear is an extension (Breakspear et al., 2003a, 2003b) of the biophysical-inspired neural mass model of a cortical column (or area) from Larter et al. (1999), initially developed to simulate firing rate activity from focal region involved in partial seizure. It is determined by voltage- and ligand-gated ions channels and feedback between intensively interconnected excitatory and inhibitory neurons.\n\nThe Larter-Breakspear is a 3D model describing the local average states of two interconnected neural populations: pyramidal cells (PCs) and inhibitory interneurons (IINs), with an additional variable representing the potassium channels in the population of PCs.\n\nThe membrane potential of the pyramidal cells is the focus of the model and is governed by sodium, \npotassium, calcium and “leaky” ion channels, of which the voltage-gated potassium channels are modelled in more detail. \n\nThe excitatory to excitatory connections are modelled in more detail as glutamatergic connections with AMPA and NMDA receptors. \n\nNote:\n- Equations and default parameters are taken from (Breakspear et al., 2003b), \n- All equations and parameters are non-dimensional and normalized to neural capacitance C = 1."
references:
- Breakspear2003
- Larter1999
- Breakspear2003a
derived_variables:
  Q_V:
    description: Average firing rate of the population of PCs, V.
    equation:
      lhs: Q_V
      rhs: 0.5*Q_Vmax*(tanh((V - V_T)/delta_V) + 1)
      latex: false
    grounding:
    - GO:0099605
  Q_Z:
    description: Average firing rate of the population of IINs, Z.
    equation:
      lhs: Q_Z
      rhs: 0.5*Q_Zmax*(tanh((Z - Z_T)/delta_Z) + 1)
      latex: false
    grounding:
    - GO:0099605
  m_Ca:
    description: "Fraction of open calcium channels (Breakspear et al., 2003b). \n\nDescribes relationship between membrane voltage and channel conductance."
    equation:
      lhs: m_Ca
      rhs: 0.5*tanh((-T_Ca + V)/delta_Ca) + 0.5
      latex: false
    grounding:
    - GO:0005262
  m_K:
    description: "Fraction of open potassium channels (Breakspear et al., 2003b). \n\nDescribes relationship between membrane voltage and channel conductance."
    equation:
      lhs: m_K
      rhs: 0.5*tanh((-T_K + V)/delta_K) + 0.5
      latex: false
    grounding:
    - GO:0005267
  m_Na:
    description: "Fraction of open sodium channels (Breakspear et al., 2003b). \n\nDescribes relationship between membrane voltage and channel conductance."
    equation:
      lhs: m_Na
      rhs: 0.5*tanh((-T_Na + V)/delta_Na) + 0.5
      latex: false
    grounding:
    - GO:0005272
  lc_0:
    equation:
      lhs: lc_0
      rhs: Q_V*local_coupling
      latex: false
coupling_inputs:
  c_glob: {}
  local_coupling: {local: true}
state_variables:
  V:
    domain:
      lo: -1.5
      hi: 1.5
    description: First state-variable of the Larter-Breakspear (Breakspear et al
    equation:
      lhs: Derivative(V, t)
      rhs: t_scale*(I_ext*a_ne - Q_Z*Z*a_ie - W*g_K*(V - V_K) - g_L*(V - V_L) + m_Ca*(V - V_Ca)*(-C*a_ee*c_glob*r_NMDA - a_ee*r_NMDA*(1.0 - C)*(Q_V + lc_0) - g_Ca) - (V - V_Na)*(C*a_ee*c_glob + a_ee*(1.0 - C)*(Q_V + lc_0) + g_Na*m_Na))
      latex: false
    coupling_variable: true
    initial_value: 0.1
    grounding:
    - GO:0042391
  W:
    domain:
      lo: -1.5
      hi: 1.5
    description: Second state-variable of the Larter-Breakspear (Breakspear et al
    equation:
      lhs: Derivative(W, t)
      rhs: phi*t_scale*(-W + m_K)/tau_K
      latex: false
    coupling_variable: false
    initial_value: 0.1
    grounding:
    - GO:0005267
  Z:
    domain:
      lo: -1.5
      hi: 1.5
    description: Third state-variable of the Larter-Breakspear (Breakspear et al
    equation:
      lhs: Derivative(Z, t)
      rhs: b*t_scale*(I_ext*a_ni + Q_V*V*a_ei)
      latex: false
    coupling_variable: false
    initial_value: 0.1
    grounding:
    - CL:0000099
    - GO:0060080
number_of_modes: 1
