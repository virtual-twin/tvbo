name: StefanescuJirsa2D
iri: tvbo:StefanescuJirsa2D
model_type: neural_mass
description: >-
  Reduced set of FitzHugh-Nagumo oscillators (Stefanescu & Jirsa 2008). A
  low-dimensional description of globally coupled heterogeneous excitatory and
  inhibitory FitzHugh-Nagumo populations. The reduction projects an infinite
  population onto `number_of_modes` modes and yields per-mode scalar state
  variables (xi, eta) for the excitatory and (alpha, beta) for the inhibitory
  subnetwork. The mode-coupling matrices Aik, Bik, Cik and the per-mode
  inputs IE_i, II_i, m_i, n_i, e_i, f_i are derived offline by Gaussian
  quadrature over the heterogeneity distribution N(mu, sigma^2); see TVB
  reference implementation `tvb.simulator.models.stefanescu_jirsa.ReducedSetFitzHughNagumo`.
references:
- StefanescuJirsa2008
number_of_modes: 3
parameters:
  tau:
    definition: Timescale separation between fast (xi, alpha) and slow (eta, beta) variables.
    value: 3.0
    domain: {lo: 1.5, hi: 4.5, step: 0.01}
    description: Timescale separation
  a:
    definition: Heterogeneity scale parameter entering the m_i, n_i offsets.
    value: 0.45
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
  b:
    definition: FitzHugh-Nagumo recovery decay rate.
    value: 0.9
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
  K11:
    definition: Internal coupling, excitatory to excitatory.
    value: 0.5
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
    grounding: [GO:0060079]
  K12:
    definition: Internal coupling, inhibitory to excitatory.
    value: 0.15
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
    grounding: [GO:0060079]
  K21:
    definition: Internal coupling, excitatory to inhibitory.
    value: 0.15
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
    grounding: [GO:0060080]
  sigma:
    definition: Standard deviation of the Gaussian heterogeneity distribution.
    value: 0.35
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
    grounding: [GO:0060079]
  mu:
    definition: Mean of the Gaussian heterogeneity distribution.
    value: 0.0
    domain: {lo: 0.0, hi: 1.0, step: 0.01}
    grounding: [GO:0060079]
derived_variables:
  Aik:
    description: >-
      Excitatory-to-excitatory mode-coupling matrix derived from Gaussian quadrature
      over N(mu, sigma); computed offline at `update_derived_parameters`.
    grounding: [GO:0060079]
    equation: {lhs: Aik, rhs: '0.5', latex: false}
    conditional: false
  Bik:
    description: Inhibitory-to-excitatory mode-coupling matrix.
    grounding: [GO:0060079]
    equation: {lhs: Bik, rhs: '0.5', latex: false}
    conditional: false
  Cik:
    description: Excitatory-to-inhibitory mode-coupling matrix.
    grounding: [GO:0060080]
    equation: {lhs: Cik, rhs: '0.5', latex: false}
    conditional: false
  e_i:
    description: Per-mode cubic-coefficient projection for the excitatory subnetwork.
    equation: {lhs: e_i, rhs: '1.0', latex: false}
    conditional: false
  f_i:
    description: Per-mode cubic-coefficient projection for the inhibitory subnetwork.
    equation: {lhs: f_i, rhs: '1.0', latex: false}
    conditional: false
  IE_i:
    description: Per-mode constant excitatory input from the heterogeneity distribution.
    grounding: [GO:0042391]
    equation: {lhs: IE_i, rhs: '0.0', latex: false}
    conditional: false
  II_i:
    description: Per-mode constant inhibitory input from the heterogeneity distribution.
    grounding: [GO:0042391]
    equation: {lhs: II_i, rhs: '0.0', latex: false}
    conditional: false
  m_i:
    description: Per-mode offset entering the eta dynamics.
    equation: {lhs: m_i, rhs: 'a', latex: false}
    conditional: false
  n_i:
    description: Per-mode offset entering the beta dynamics.
    equation: {lhs: n_i, rhs: 'a', latex: false}
    conditional: false
coupling_inputs:
  c_pop0: {}
  local_coupling: {local: true}
state_variables:
  xi:
    domain: {lo: -4.0, hi: 4.0}
    description: Excitatory fast variable (per mode).
    grounding: [GO:0060079]
    equation:
      lhs: Derivative(xi, t)
      rhs: tau*(xi - e_i*xi**3/3 - eta) + K11*(Aik*xi - xi) - K12*(Bik*alpha - xi) + tau*(IE_i + c_pop0 + local_coupling*xi)
      latex: false
    coupling_variable: true
    initial_value: 0.1
  eta:
    domain: {lo: -3.0, hi: 3.0}
    description: Excitatory slow recovery variable (per mode).
    grounding: [GO:0060079]
    equation:
      lhs: Derivative(eta, t)
      rhs: (xi - b*eta + m_i)/tau
      latex: false
    coupling_variable: false
    initial_value: 0.1
    record: false
  alpha:
    domain: {lo: -4.0, hi: 4.0}
    description: Inhibitory fast variable (per mode).
    grounding: [GO:0060080]
    equation:
      lhs: Derivative(alpha, t)
      rhs: tau*(alpha - f_i*alpha**3/3 - beta) + K21*(Cik*xi - alpha) + tau*(II_i + c_pop0 + local_coupling*xi)
      latex: false
    coupling_variable: true
    initial_value: 0.1
  beta:
    domain: {lo: -3.0, hi: 3.0}
    description: Inhibitory slow recovery variable (per mode).
    grounding: [GO:0060080]
    equation:
      lhs: Derivative(beta, t)
      rhs: (alpha - b*beta + n_i)/tau
      latex: false
    coupling_variable: false
    initial_value: 0.1
    record: false
