name: Dynamics
description: |
  A mass $m$ on a spring with stiffness $k$ — a simple linear dynamical system.
  Two state variables $(x, v)$, two parameters $(k, m)$, perpetual oscillation at $\omega = \sqrt{k/m}$.

parameters:
  k:
    value: 0.0001
    description: Spring stiffness constant
    unit: N_per_m
  m:
    value: 1.0
    description: Mass of the oscillating body
    unit: kg

derived_parameters:
  omega:
    description: Natural frequency of oscillation
    equation:
      lhs: omega
      rhs: sqrt(k/m)
    unit: rad_per_s

state_variables:
  x:
    description: Displacement from equilibrium
    equation:
      lhs: Derivative(x, t)
      rhs: v
    unit: m
    equation_type: differential
    equation_order: 1
    initial_value: 2.0
  v:
    description: Velocity
    equation:
      lhs: Derivative(v, t)
      rhs: -omega**2 * x
    unit: m_per_s
    equation_type: differential
    equation_order: 1
    initial_value: 0.0
autonomous: true
