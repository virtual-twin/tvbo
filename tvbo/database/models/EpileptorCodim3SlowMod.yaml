name: EpileptorCodim3SlowMod
iri: tvbo:EpileptorCodim3SlowMod
model_type: neural_mass
description: >-
  The Epileptor Codim 3 model with ultra-slow modulation of bursting classes
  (Saggio et al., 2017). It is a neural mass model containing a fast subsystem
  (x, y) built from the unfolding of a degenerate Takens-Bogdanov bifurcation
  of codimension 3 and a slow subsystem (z) that steers the fast one back and
  forth along a path in parameter space, producing bursting. Two additional
  ultra-slow state variables (uA, uB) modulate the offset (A) and onset (B)
  points of the burster along great arcs on a sphere of radius R, allowing the
  model to switch between different classes of bursters (Hysteresis-Loop
  bursters c0, c0', c2s, c3s, c4s, c10s, c11s, c2b, c4b, c8b, c14b, c16b as
  classified in Saggio et al. 2017 Table 2). The bifurcation parameters
  (mu1, mu2, nu) at the offset (A) and onset (B) points are obtained by
  parametrising great arcs between the points Ain/Aend and Bin/Bend on the
  sphere. This capture uses the default branch of the resting state (N = 1)
  and the default stabilising modification (modification = True).
references:
- Saggio2017
parameters:
  mu1_Ain:
    value: 0.05494
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu1 at the initial point at bursting offset.
  mu2_Ain:
    value: 0.2731
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu2 at the initial point at bursting offset.
  nu_Ain:
    value: 0.287
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter nu at the initial point at bursting offset.
  mu1_Bin:
    value: -0.0461
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu1 at the initial point at bursting onset.
  mu2_Bin:
    value: 0.243
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu2 at the initial point at bursting onset.
  nu_Bin:
    value: 0.3144
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter nu at the initial point at bursting onset.
  mu1_Aend:
    value: 0.06485
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu1 at the final point at bursting offset.
  mu2_Aend:
    value: 0.07337
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu2 at the final point at bursting offset.
  nu_Aend:
    value: -0.3878
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter nu at the final point at bursting offset.
  mu1_Bend:
    value: 0.03676
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu1 at the final point at bursting onset.
  mu2_Bend:
    value: -0.02792
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter mu2 at the final point at bursting onset.
  nu_Bend:
    value: -0.3973
    domain:
      lo: -1.0
      hi: 1.0
    description: The bifurcation parameter nu at the final point at bursting onset.
  b:
    value: 1.0
    description: Unfolding type of the degenerate Takens-Bogdanov bifurcation, default is a focus type.
  R:
    value: 0.4
    domain:
      lo: 0.0
      hi: 2.5
    description: Radius in unfolding.
  c:
    value: 0.002
    domain:
      lo: 0.0
      hi: 0.01
    description: Speed of the slow variable.
  cA:
    value: 0.0001
    domain:
      lo: 0.0
      hi: 0.001
    description: Speed of the ultra-slow transition of the initial point.
  cB:
    value: 0.00012
    domain:
      lo: 0.0
      hi: 0.001
    description: Speed of the ultra-slow transition of the final point.
  dstar:
    value: 0.3
    domain:
      lo: -0.1
      hi: 0.5
    description: Threshold for the inversion of the slow variable.
  Ks:
    value: 0.0
    description: Slow permittivity coupling strength, the default is no coupling.
derived_parameters:
  G0:
    description: First component of the unit vector G = Ain/||Ain|| (offset great-arc base point).
    equation:
      lhs: G0
      rhs: mu2_Ain/sqrt(mu2_Ain**2 + mu1_Ain**2 + nu_Ain**2)
      latex: false
  G1:
    description: Second component of the unit vector G = Ain/||Ain||.
    equation:
      lhs: G1
      rhs: -mu1_Ain/sqrt(mu2_Ain**2 + mu1_Ain**2 + nu_Ain**2)
      latex: false
  G2:
    description: Third component of the unit vector G = Ain/||Ain||.
    equation:
      lhs: G2
      rhs: nu_Ain/sqrt(mu2_Ain**2 + mu1_Ain**2 + nu_Ain**2)
      latex: false
  H0:
    description: First component of the unit vector H = ((Ain x Aend) x Ain)/||...|| along the offset great arc.
    equation:
      lhs: H0
      rhs: (mu1_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) + nu_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))/sqrt((mu1_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) + nu_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (-mu1_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend) - mu2_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (mu2_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) - nu_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend))**2)
      latex: false
  H1:
    description: Second component of the unit vector H along the offset great arc.
    equation:
      lhs: H1
      rhs: (mu2_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) - nu_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend))/sqrt((mu1_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) + nu_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (-mu1_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend) - mu2_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (mu2_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) - nu_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend))**2)
      latex: false
  H2:
    description: Third component of the unit vector H along the offset great arc.
    equation:
      lhs: H2
      rhs: (-mu1_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend) - mu2_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))/sqrt((mu1_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) + nu_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (-mu1_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend) - mu2_Ain*(mu2_Aend*nu_Ain - mu2_Ain*nu_Aend))**2 + (mu2_Ain*(-mu1_Aend*mu2_Ain + mu1_Ain*mu2_Aend) - nu_Ain*(mu1_Aend*nu_Ain - mu1_Ain*nu_Aend))**2)
      latex: false
  L0:
    description: First component of the unit vector L = Bin/||Bin|| (onset great-arc base point).
    equation:
      lhs: L0
      rhs: mu2_Bin/sqrt(mu2_Bin**2 + mu1_Bin**2 + nu_Bin**2)
      latex: false
  L1:
    description: Second component of the unit vector L = Bin/||Bin||.
    equation:
      lhs: L1
      rhs: -mu1_Bin/sqrt(mu2_Bin**2 + mu1_Bin**2 + nu_Bin**2)
      latex: false
  L2:
    description: Third component of the unit vector L = Bin/||Bin||.
    equation:
      lhs: L2
      rhs: nu_Bin/sqrt(mu2_Bin**2 + mu1_Bin**2 + nu_Bin**2)
      latex: false
  M0:
    description: First component of the unit vector M = ((Bin x Bend) x Bin)/||...|| along the onset great arc.
    equation:
      lhs: M0
      rhs: (mu1_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) + nu_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))/sqrt((mu1_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) + nu_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (-mu1_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend) - mu2_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (mu2_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) - nu_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend))**2)
      latex: false
  M1:
    description: Second component of the unit vector M along the onset great arc.
    equation:
      lhs: M1
      rhs: (mu2_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) - nu_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend))/sqrt((mu1_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) + nu_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (-mu1_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend) - mu2_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (mu2_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) - nu_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend))**2)
      latex: false
  M2:
    description: Third component of the unit vector M along the onset great arc.
    equation:
      lhs: M2
      rhs: (-mu1_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend) - mu2_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))/sqrt((mu1_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) + nu_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (-mu1_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend) - mu2_Bin*(mu2_Bend*nu_Bin - mu2_Bin*nu_Bend))**2 + (mu2_Bin*(-mu1_Bend*mu2_Bin + mu1_Bin*mu2_Bend) - nu_Bin*(mu1_Bend*nu_Bin - mu1_Bin*nu_Bend))**2)
      latex: false
coupling_inputs:
  c_pop0: {}
derived_variables:
  A0:
    equation:
      lhs: A0
      rhs: R*(G0*cos(uA) + H0*sin(uA))
      latex: false
    conditional: false
  A1:
    equation:
      lhs: A1
      rhs: R*(G1*cos(uA) + H1*sin(uA))
      latex: false
    conditional: false
  A2:
    equation:
      lhs: A2
      rhs: R*(G2*cos(uA) + H2*sin(uA))
      latex: false
    conditional: false
  B0:
    equation:
      lhs: B0
      rhs: R*(L0*cos(uB) + M0*sin(uB))
      latex: false
    conditional: false
  B1:
    equation:
      lhs: B1
      rhs: R*(L1*cos(uB) + M1*sin(uB))
      latex: false
    conditional: false
  B2:
    equation:
      lhs: B2
      rhs: R*(L2*cos(uB) + M2*sin(uB))
      latex: false
    conditional: false
  normA:
    equation:
      lhs: normA
      rhs: sqrt(A0**2 + A1**2 + A2**2)
      latex: false
    conditional: false
  E0:
    equation:
      lhs: E0
      rhs: A0/normA
      latex: false
    conditional: false
  E1:
    equation:
      lhs: E1
      rhs: A1/normA
      latex: false
    conditional: false
  E2:
    equation:
      lhs: E2
      rhs: A2/normA
      latex: false
    conditional: false
  C0:
    equation:
      lhs: C0
      rhs: A1*B2 - A2*B1
      latex: false
    conditional: false
  C1:
    equation:
      lhs: C1
      rhs: A2*B0 - A0*B2
      latex: false
    conditional: false
  C2:
    equation:
      lhs: C2
      rhs: A0*B1 - A1*B0
      latex: false
    conditional: false
  Fx0:
    equation:
      lhs: Fx0
      rhs: C1*A2 - C2*A1
      latex: false
    conditional: false
  Fx1:
    equation:
      lhs: Fx1
      rhs: C2*A0 - C0*A2
      latex: false
    conditional: false
  Fx2:
    equation:
      lhs: Fx2
      rhs: C0*A1 - C1*A0
      latex: false
    conditional: false
  normF:
    equation:
      lhs: normF
      rhs: sqrt(Fx0**2 + Fx1**2 + Fx2**2)
      latex: false
    conditional: false
  F0:
    equation:
      lhs: F0
      rhs: Fx0/normF
      latex: false
    conditional: false
  F1:
    equation:
      lhs: F1
      rhs: Fx1/normF
      latex: false
    conditional: false
  F2:
    equation:
      lhs: F2
      rhs: Fx2/normF
      latex: false
    conditional: false
  mu2:
    description: Bifurcation parameter mu2 along the great arc (E, F, R) at slow variable z.
    equation:
      lhs: mu2
      rhs: R*(E0*cos(z) + F0*sin(z))
      latex: false
    conditional: false
  mu1:
    description: Bifurcation parameter mu1 along the great arc (E, F, R) at slow variable z.
    equation:
      lhs: mu1
      rhs: -R*(E1*cos(z) + F1*sin(z))
      latex: false
    conditional: false
  nu:
    description: Bifurcation parameter nu along the great arc (E, F, R) at slow variable z.
    equation:
      lhs: nu
      rhs: R*(E2*cos(z) + F2*sin(z))
      latex: false
    conditional: false
  disc:
    description: Discriminant mu1^2/4 - mu2^3/27 of the depressed cubic for the resting-state x-coordinate.
    equation:
      lhs: disc
      rhs: mu1**2/4 - mu2**3/27
      latex: false
    conditional: false
  sqdisc:
    description: Square root of the absolute discriminant.
    equation:
      lhs: sqdisc
      rhs: sqrt(Abs(disc))
      latex: false
    conditional: false
  xs:
    description: >-
      Real x-coordinate of the resting state, the branch (N = 1) real solution
      of x_s^3 - mu2 x_s - mu1 = 0 via Cardano's formula, taking the real part
      of the principal complex cube roots in both the one-real-root (disc >= 0)
      and three-real-roots (disc < 0) regimes.
    equation:
      lhs: xs
      rhs: >-
        Piecewise((Abs(mu1/2 + sqdisc)**(1/3)*cos(atan2(0, mu1/2 + sqdisc)/3)
        + Abs(mu1/2 - sqdisc)**(1/3)*cos(atan2(0, mu1/2 - sqdisc)/3), disc >= 0),
        (sqrt((mu1/2)**2 + sqdisc**2)**(1/3)*cos(atan2(sqdisc, mu1/2)/3)
        + sqrt((mu1/2)**2 + sqdisc**2)**(1/3)*cos(atan2(-sqdisc, mu1/2)/3), True))
      latex: false
    conditional: true
    cases:
    - condition: disc >= 0
      equation:
        lhs: xs
        rhs: Abs(mu1/2 + sqdisc)**(1/3)*cos(atan2(0, mu1/2 + sqdisc)/3) + Abs(mu1/2 - sqdisc)**(1/3)*cos(atan2(0, mu1/2 - sqdisc)/3)
        latex: false
    - condition: 'True'
      equation:
        lhs: xs
        rhs: sqrt((mu1/2)**2 + sqdisc**2)**(1/3)*cos(atan2(sqdisc, mu1/2)/3) + sqrt((mu1/2)**2 + sqdisc**2)**(1/3)*cos(atan2(-sqdisc, mu1/2)/3)
        latex: false
state_variables:
  x:
    domain:
      lo: 0.4
      hi: 0.6
    description: Fast-subsystem state variable x (membrane-potential-like).
    equation:
      lhs: Derivative(x, t)
      rhs: -y
      latex: false
    coupling_variable: true
    initial_value: 0.5
  y:
    domain:
      lo: -0.1
      hi: 0.1
    description: Fast-subsystem state variable y.
    equation:
      lhs: Derivative(y, t)
      rhs: x**3 - mu2*x - mu1 - y*(nu + b*x + x**2)
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  z:
    domain:
      lo: 0.0
      hi: 0.1
    description: Slow-subsystem permittivity variable z.
    equation:
      lhs: Derivative(z, t)
      rhs: -c*(sqrt((x - xs)**2 + y**2) - dstar + (z - 1/2)**7/10 + Ks*c_pop0)
      latex: false
    coupling_variable: false
    initial_value: 0.05
  uA:
    domain:
      lo: 0.0
      hi: 0.0
    description: Ultra-slow modulation of the offset point A along the offset great arc.
    equation:
      lhs: Derivative(uA, t)
      rhs: cA + 0*uA
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  uB:
    domain:
      lo: 0.0
      hi: 0.0
    description: Ultra-slow modulation of the onset point B along the onset great arc.
    equation:
      lhs: Derivative(uB, t)
      rhs: cB + 0*uB
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
number_of_modes: 1
