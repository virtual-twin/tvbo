functions:
  muV:
    definition: >-
      Mean membrane potential of the fluctuation regime (Eqn 7 in di Volo 2018),
      given pre-synaptic excitatory/inhibitory rates (fe, fi), external drives
      (fe_ext, fi_ext), adaptation W and leak reversal E_leak.
    arguments:
      fe: {}
      fi: {}
      fe_ext: {}
      fi_ext: {}
      W: {}
      E_leak: {}
    equation:
      lhs: muV
      rhs: >-
        (Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e)*E_e
        + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)*E_i
        + g_L*E_leak - W)
        / (g_L
        + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e)
        + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i))
      latex: false
  sigmaV:
    definition: >-
      Standard deviation of the membrane-potential fluctuations (Eqn 8 in
      di Volo 2018).
    arguments:
      fe: {}
      fi: {}
      fe_ext: {}
      fi_ext: {}
      W: {}
      E_leak: {}
    equation:
      lhs: sigmaV
      rhs: >-
        sqrt(
        ((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e)
        * (Q_e/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i))
        * (E_e - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_e)**2
        / (2.0*(tau_e + C_m/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i))))
        + ((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)
        * (Q_i/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i))
        * (E_i - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_i)**2
        / (2.0*(tau_i + C_m/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i))))
        )
      latex: false
  T_V:
    definition: >-
      Autocorrelation time of the membrane-potential fluctuations (Eqn 9 in
      di Volo 2018).
    arguments:
      fe: {}
      fi: {}
      fe_ext: {}
      fi_ext: {}
      W: {}
      E_leak: {}
    equation:
      lhs: T_V
      rhs: >-
        (
        ((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) * (Q_e/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)) * (E_e - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_e)**2
        + ((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i) * (Q_i/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)) * (E_i - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_i)**2
        )
        / (
        ((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) * (Q_e/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)) * (E_e - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_e)**2 / (tau_e + C_m/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)))
        + ((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i) * (Q_i/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)) * (E_i - muV(fe, fi, fe_ext, fi_ext, W, E_leak)) * tau_i)**2 / (tau_i + C_m/(g_L + Q_e*tau_e*((fe + 1.0e-6)*(1.0 - g)*p_connect_e*N_tot + fe_ext*K_ext_e) + Q_i*tau_i*((fi + 1.0e-6)*g*p_connect_i*N_tot + fi_ext*K_ext_i)))
        )
      latex: false
  TF_e:
    definition: >-
      Excitatory population transfer function (Eqns 10-11 in di Volo 2018):
      semi-analytic firing-rate output given the fluctuation regime and the
      excitatory phenomenological voltage threshold.
    arguments:
      fe: {}
      fi: {}
      fe_ext: {}
      fi_ext: {}
      W: {}
    equation:
      lhs: TF_e
      rhs: >-
        erfc(
        ((P_e0
        + P_e1*((muV(fe, fi, fe_ext, fi_ext, W, E_L_e) + 60.0)/10.0)
        + P_e2*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_e) - 4.0)/6.0)
        + P_e3*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_e)*g_L/C_m - 0.5)/1.0)
        + P_e4*((muV(fe, fi, fe_ext, fi_ext, W, E_L_e) + 60.0)/10.0)**2
        + P_e5*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_e) - 4.0)/6.0)**2
        + P_e6*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_e)*g_L/C_m - 0.5)/1.0)**2
        + P_e7*((muV(fe, fi, fe_ext, fi_ext, W, E_L_e) + 60.0)/10.0)*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_e) - 4.0)/6.0)
        + P_e8*((muV(fe, fi, fe_ext, fi_ext, W, E_L_e) + 60.0)/10.0)*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_e)*g_L/C_m - 0.5)/1.0)
        + P_e9*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_e) - 4.0)/6.0)*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_e)*g_L/C_m - 0.5)/1.0)
        )*1000.0 - muV(fe, fi, fe_ext, fi_ext, W, E_L_e))
        / (sqrt(2.0)*sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_e))
        ) / (2.0*T_V(fe, fi, fe_ext, fi_ext, W, E_L_e))
      latex: false
  TF_i:
    definition: >-
      Inhibitory population transfer function (Eqns 10-11 in di Volo 2018):
      semi-analytic firing-rate output given the fluctuation regime and the
      inhibitory phenomenological voltage threshold.
    arguments:
      fe: {}
      fi: {}
      fe_ext: {}
      fi_ext: {}
      W: {}
    equation:
      lhs: TF_i
      rhs: >-
        erfc(
        ((P_i0
        + P_i1*((muV(fe, fi, fe_ext, fi_ext, W, E_L_i) + 60.0)/10.0)
        + P_i2*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_i) - 4.0)/6.0)
        + P_i3*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_i)*g_L/C_m - 0.5)/1.0)
        + P_i4*((muV(fe, fi, fe_ext, fi_ext, W, E_L_i) + 60.0)/10.0)**2
        + P_i5*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_i) - 4.0)/6.0)**2
        + P_i6*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_i)*g_L/C_m - 0.5)/1.0)**2
        + P_i7*((muV(fe, fi, fe_ext, fi_ext, W, E_L_i) + 60.0)/10.0)*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_i) - 4.0)/6.0)
        + P_i8*((muV(fe, fi, fe_ext, fi_ext, W, E_L_i) + 60.0)/10.0)*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_i)*g_L/C_m - 0.5)/1.0)
        + P_i9*((sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_i) - 4.0)/6.0)*((T_V(fe, fi, fe_ext, fi_ext, W, E_L_i)*g_L/C_m - 0.5)/1.0)
        )*1000.0 - muV(fe, fi, fe_ext, fi_ext, W, E_L_i))
        / (sqrt(2.0)*sigmaV(fe, fi, fe_ext, fi_ext, W, E_L_i))
        ) / (2.0*T_V(fe, fi, fe_ext, fi_ext, W, E_L_i))
      latex: false
coupling_inputs:
  c_glob: {}
  local_coupling: {local: true}
derived_variables:
  E_input_excitatory:
    description: External excitatory input onto the excitatory population (clamped to be non-negative).
    equation:
      lhs: E_input_excitatory
      rhs: Piecewise((0.0, c_glob + local_coupling*E + external_input_ex_ex + weight_noise*ou_drift < 0), (c_glob + local_coupling*E + external_input_ex_ex + weight_noise*ou_drift, True))
      latex: false
  E_input_inhibitory:
    description: External excitatory input onto the inhibitory population (clamped to be non-negative).
    equation:
      lhs: E_input_inhibitory
      rhs: Piecewise((0.0, S_i*c_glob + local_coupling*E + external_input_in_ex + weight_noise*ou_drift < 0), (S_i*c_glob + local_coupling*E + external_input_in_ex + weight_noise*ou_drift, True))
      latex: false
  I_input_excitatory:
    description: External inhibitory input onto the excitatory population.
    equation:
      lhs: I_input_excitatory
      rhs: local_coupling*I + external_input_ex_in
      latex: false
  I_input_inhibitory:
    description: External inhibitory input onto the inhibitory population.
    equation:
      lhs: I_input_inhibitory
      rhs: local_coupling*I + external_input_in_in
      latex: false
  TFe:
    description: Excitatory transfer-function output evaluated at the current state.
    equation:
      lhs: TFe
      rhs: TF_e(E, I, E_input_excitatory, I_input_excitatory, W_e)
      latex: false
  TFi:
    description: Inhibitory transfer-function output evaluated at the current state.
    equation:
      lhs: TFi
      rhs: TF_i(E, I, E_input_inhibitory, I_input_inhibitory, W_i)
      latex: false
  dfe_TFe:
    description: Central finite-difference derivative of TF_e w.r.t. excitatory rate (df=1e-7).
    equation:
      lhs: dfe_TFe
      rhs: (TF_e(E + 1.0e-7, I, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E - 1.0e-7, I, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0)
      latex: false
  dfi_TFe:
    description: Central finite-difference derivative of TF_e w.r.t. inhibitory rate (df=1e-7).
    equation:
      lhs: dfi_TFe
      rhs: (TF_e(E, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0)
      latex: false
  dfe_TFi:
    description: Central finite-difference derivative of TF_i w.r.t. excitatory rate (df=1e-7).
    equation:
      lhs: dfe_TFi
      rhs: (TF_i(E + 1.0e-7, I, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E - 1.0e-7, I, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0)
      latex: false
  dfi_TFi:
    description: Central finite-difference derivative of TF_i w.r.t. inhibitory rate (df=1e-7).
    equation:
      lhs: dfi_TFi
      rhs: (TF_i(E, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0)
      latex: false
  d2_fefe_e:
    description: Second central difference of TF_e w.r.t. excitatory rate.
    equation:
      lhs: d2_fefe_e
      rhs: (TF_e(E + 1.0e-7, I, E_input_excitatory, I_input_excitatory, W_e) - 2*TFe + TF_e(E - 1.0e-7, I, E_input_excitatory, I_input_excitatory, W_e))/((1.0e-7*1000.0)**2)
      latex: false
  d2_fifi_e:
    description: Second central difference of TF_e w.r.t. inhibitory rate.
    equation:
      lhs: d2_fifi_e
      rhs: (TF_e(E, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - 2*TFe + TF_e(E, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/((1.0e-7*1000.0)**2)
      latex: false
  d2_fefe_i:
    description: Second central difference of TF_i w.r.t. excitatory rate.
    equation:
      lhs: d2_fefe_i
      rhs: (TF_i(E + 1.0e-7, I, E_input_inhibitory, I_input_inhibitory, W_i) - 2*TFi + TF_i(E - 1.0e-7, I, E_input_inhibitory, I_input_inhibitory, W_i))/((1.0e-7*1000.0)**2)
      latex: false
  d2_fifi_i:
    description: Second central difference of TF_i w.r.t. inhibitory rate.
    equation:
      lhs: d2_fifi_i
      rhs: (TF_i(E, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - 2*TFi + TF_i(E, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/((1.0e-7*1000.0)**2)
      latex: false
  d2_fefi_e:
    description: Mixed second central difference of TF_e (d/dfi of d/dfe).
    equation:
      lhs: d2_fefi_e
      rhs: ((TF_e(E + 1.0e-7, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E - 1.0e-7, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0) - (TF_e(E + 1.0e-7, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E - 1.0e-7, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0))/(2*1.0e-7*1000.0)
      latex: false
  d2_fife_e:
    description: Mixed second central difference of TF_e (d/dfe of d/dfi).
    equation:
      lhs: d2_fife_e
      rhs: ((TF_e(E + 1.0e-7, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E + 1.0e-7, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0) - (TF_e(E - 1.0e-7, I + 1.0e-7, E_input_excitatory, I_input_excitatory, W_e) - TF_e(E - 1.0e-7, I - 1.0e-7, E_input_excitatory, I_input_excitatory, W_e))/(2*1.0e-7*1000.0))/(2*1.0e-7*1000.0)
      latex: false
  d2_fefi_i:
    description: Mixed second central difference of TF_i (d/dfi of d/dfe).
    equation:
      lhs: d2_fefi_i
      rhs: ((TF_i(E + 1.0e-7, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E - 1.0e-7, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0) - (TF_i(E + 1.0e-7, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E - 1.0e-7, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0))/(2*1.0e-7*1000.0)
      latex: false
  d2_fife_i:
    description: Mixed second central difference of TF_i (d/dfe of d/dfi).
    equation:
      lhs: d2_fife_i
      rhs: ((TF_i(E + 1.0e-7, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E + 1.0e-7, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0) - (TF_i(E - 1.0e-7, I + 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i) - TF_i(E - 1.0e-7, I - 1.0e-7, E_input_inhibitory, I_input_inhibitory, W_i))/(2*1.0e-7*1000.0))/(2*1.0e-7*1000.0)
      latex: false
  muV_e:
    description: Mean membrane potential of the excitatory population (used for adaptation).
    equation:
      lhs: muV_e
      rhs: muV(E, I, E_input_excitatory, I_input_excitatory, W_e, E_L_e)
      latex: false
  muV_i:
    description: Mean membrane potential of the inhibitory population (used for adaptation).
    equation:
      lhs: muV_i
      rhs: muV(E, I, E_input_inhibitory, I_input_inhibitory, W_i, E_L_i)
      latex: false
state_variables:
  E:
    domain:
      lo: 0.0
      hi: .inf
      enforce: clamp
    distribution:
      name: Uniform
      domain:
        lo: 0.001
        hi: 0.25
    description: Firing rate of the excitatory population [kHz].
    equation:
      lhs: Derivative(E, t)
      rhs: >-
        (TFe - E
        + 0.5*C_ee*d2_fefe_e
        + 0.5*C_ei*d2_fefi_e
        + 0.5*C_ei*d2_fife_e
        + 0.5*C_ii*d2_fifi_e)/T
      latex: false
    coupling_variable: true
    initial_value: 0.0
  I:
    domain:
      lo: 0.0
      hi: .inf
      enforce: clamp
    distribution:
      name: Uniform
      domain:
        lo: 0.001
        hi: 0.25
    description: Firing rate of the inhibitory population [kHz].
    equation:
      lhs: Derivative(I, t)
      rhs: >-
        (TFi - I
        + 0.5*C_ee*d2_fefe_i
        + 0.5*C_ei*d2_fefi_i
        + 0.5*C_ei*d2_fife_i
        + 0.5*C_ii*d2_fifi_i)/T
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  C_ee:
    domain:
      lo: 0.0
      hi: 0.0005
    description: Variance of the excitatory population activity.
    equation:
      lhs: Derivative(C_ee, t)
      rhs: >-
        (TFe*(1.0/T - TFe)/(N_tot*(1.0 - g))
        + (TFe - E)**2
        + 2.0*C_ee*dfe_TFe
        + 2.0*C_ei*dfi_TFe
        - 2.0*C_ee)/T
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  C_ei:
    domain:
      lo: -0.0005
      hi: 0.0005
    description: Covariance between the excitatory and inhibitory population activities.
    equation:
      lhs: Derivative(C_ei, t)
      rhs: >-
        ((TFe - E)*(TFi - I)
        + C_ee*dfe_TFe
        + C_ei*dfe_TFi
        + C_ei*dfi_TFe
        + C_ii*dfi_TFi
        - 2.0*C_ei)/T
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  C_ii:
    domain:
      lo: 0.0
      hi: 0.0005
    description: Variance of the inhibitory population activity.
    equation:
      lhs: Derivative(C_ii, t)
      rhs: >-
        (TFi*(1.0/T - TFi)/(N_tot*g)
        + (TFi - I)**2
        + 2.0*C_ii*dfi_TFi
        + 2.0*C_ei*dfe_TFi
        - 2.0*C_ii)/T
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  W_e:
    domain:
      lo: 0.0
      hi: 200.0
    description: Adaptation current of the excitatory population [pA].
    equation:
      lhs: Derivative(W_e, t)
      rhs: -W_e/tau_w_e + b_e*E + a_e*(muV_e - E_L_e)/tau_w_e
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  W_i:
    domain:
      lo: 0.0
      hi: 0.0
    description: Adaptation current of the inhibitory population [pA].
    equation:
      lhs: Derivative(W_i, t)
      rhs: -W_i/tau_w_i + b_i*I + a_i*(muV_i - E_L_i)/tau_w_i
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
  ou_drift:
    domain:
      lo: 0.0
      hi: 0.0
    description: Ornstein-Uhlenbeck noise drift.
    equation:
      lhs: Derivative(ou_drift, t)
      rhs: -ou_drift/tau_OU
      latex: false
    coupling_variable: false
    initial_value: 0.0
    record: false
number_of_modes: 1
