name: ZerlautAdaptationSecondOrder
iri: tvbo:ZerlautAdaptationSecondOrder
model_type: mean_field
# The transfer function references the fluctuation moments (mu_V, sigma_V, T_V)
# many times, and its 2nd-order dfun evaluates it ~34x via finite differences.
# On the interpreted TVB/numpy backend that recomputes each moment repeatedly
# (jax/XLA already fold these). cse=true hoists them so each is computed once,
# recovering ~native-TVB dfun cost (numerically identical).
cse: true
description: >-
  Second-order mean-field model of a conductance-based network of adaptive
  exponential integrate-and-fire (AdEx) excitatory and inhibitory neurons
  (di Volo et al. 2018, Zerlaut et al. 2018). It tracks the mean firing rates
  of the excitatory (E) and inhibitory (I) populations, their second-order
  statistics (the covariance matrix C_ee, C_ei, C_ii), the adaptation currents
  (W_e, W_i) and an Ornstein-Uhlenbeck noise drift (ou_drift). The population
  firing rate is given by a semi-analytic transfer function (TF) whose argument
  is the membrane-potential fluctuation regime (mu_V, sigma_V, T_V) and a
  phenomenological voltage threshold fitted by a second-order polynomial. The
  first and second derivatives of the transfer function with respect to the
  pre-synaptic rates are evaluated with the SAME central finite-difference
  stencil (df = 1e-7) used in the original TVB implementation, so the drift is
  reproduced bit-for-bit.
references:
  - Zerlaut2018
  - DiVolo2018
parameters:
  g_L:
    definition: Leak conductance.
    value: 10.0
    domain:
      lo: 0.1
      hi: 100.0
      step: 0.1
    description: leak conductance [nS]
    unit: nS
  E_L_e:
