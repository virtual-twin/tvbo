name: hhcell_1
model_type: spiking
source: 'NeuroML2 example: Ex3_Net'
parameters:
  C:
    value: 10.0
    unit: pF
  g_Na:
    value: 1200.0
    unit: nS
  g_K:
    value: 360.0
    unit: nS
  g_L:
    value: 3.0
    unit: nS
  E_Na:
    value: 50.0
    unit: mV
  E_K:
    value: -77.0
    unit: mV
  E_L:
    value: -54.3
    unit: mV
  thresh:
    value: 20.0
    unit: mV
  rate_am:
    value: 1.0
    unit: per_ms
  midpoint_am:
    value: -40.0
    unit: mV
  scale_am:
    value: 10.0
    unit: mV
  rate_bm:
    value: 4.0
    unit: per_ms
  midpoint_bm:
    value: -65.0
    unit: mV
  scale_bm:
    value: -18.0
    unit: mV
  rate_ah:
    value: 0.07
    unit: per_ms
  midpoint_ah:
    value: -65.0
    unit: mV
  scale_ah:
    value: -20.0
    unit: mV
  rate_bh:
    value: 1.0
    unit: per_ms
  midpoint_bh:
    value: -35.0
    unit: mV
  scale_bh:
    value: 10.0
    unit: mV
  rate_an:
    value: 0.1
    unit: per_ms
  midpoint_an:
    value: -55.0
    unit: mV
  scale_an:
    value: 10.0
    unit: mV
  rate_bn:
    value: 0.125
    unit: per_ms
  midpoint_bn:
    value: -65.0
    unit: mV
  scale_bn:
    value: -80.0
    unit: mV
derived_variables:
  alpha_m:
    equation:
      rhs: rate_am * (v - midpoint_am) / scale_am / (1 - exp(-(v - midpoint_am) / scale_am))
    unit: per_ms
  beta_m:
    equation:
      rhs: rate_bm * exp((v - midpoint_bm) / scale_bm)
    unit: per_ms
  alpha_h:
    equation:
      rhs: rate_ah * exp((v - midpoint_ah) / scale_ah)
    unit: per_ms
  beta_h:
    equation:
      rhs: rate_bh / (1 + exp(-(v - midpoint_bh) / scale_bh))
    unit: per_ms
  alpha_n:
    equation:
      rhs: rate_an * (v - midpoint_an) / scale_an / (1 - exp(-(v - midpoint_an) / scale_an))
    unit: per_ms
  beta_n:
    equation:
      rhs: rate_bn * exp((v - midpoint_bn) / scale_bn)
    unit: per_ms
state_variables:
  v:
    equation:
      rhs: (-g_Na * m**3 * h * (v - E_Na) - g_K * n**4 * (v - E_K) - g_L * (v - E_L) + I_syn) / C
    coupling_variable: true
    initial_value: -65.0
    unit: mV
  m:
    equation:
      rhs: alpha_m * (1 - m) - beta_m * m
    initial_value: 0.05
  h:
    equation:
      rhs: alpha_h * (1 - h) - beta_h * h
    initial_value: 0.6
  n:
    equation:
      rhs: alpha_n * (1 - n) - beta_n * n
    initial_value: 0.32
coupling_inputs:
- I_syn
events:
  spike:
    condition:
      rhs: v .gt. thresh
