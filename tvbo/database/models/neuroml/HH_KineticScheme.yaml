name: HH_KineticScheme
model_type: spiking
source: 'NeuroML2 example: Ex4_KS'
iri: neuroml:pointCellCondBased
description: 'Cell with HH Na channel and kinetic-scheme K channel, matching NeuroML2 Ex4.

  '
parameters:
  C:
    value: 1
    description: nml:1pF
  v0:
    value: -65
    description: nml:-65mV
  thresh:
    value: -20
    description: nml:-20mV
  pulse_delay:
    value: 100
    description: nml:100ms
  pulse_duration:
    value: 100
    description: nml:100ms
  I_amp:
    value: 0.005
    description: nml:0.005 nA
components:
  na:
    name: na
    iri: neuroml:ionChannelHH
    parameters:
      conductance:
        value: 20
        description: nml:20pS
      number:
        value: 6000
      erev:
        value: 50
        description: nml:50mV
    components:
      m:
        name: m
        iri: neuroml:gateHHrates
        parameters:
          instances:
            value: 3
        components:
          forwardRate:
            name: forwardRate
            iri: neuroml:HHExpLinearRate
            parameters:
              rate:
                value: 1
                description: nml:1per_ms
              midpoint:
                value: -40
                description: nml:-40mV
              scale:
                value: 10
                description: nml:10mV
          reverseRate:
            name: reverseRate
            iri: neuroml:HHExpRate
            parameters:
              rate:
                value: 4
                description: nml:4per_ms
              midpoint:
                value: -65
                description: nml:-65mV
              scale:
                value: -18
                description: nml:-18mV
      h:
        name: h
        iri: neuroml:gateHHrates
        parameters:
          instances:
            value: 1
        components:
          forwardRate:
            name: forwardRate
            iri: neuroml:HHExpRate
            parameters:
              rate:
                value: 0.07
                description: nml:0.07per_ms
              midpoint:
                value: -65
                description: nml:-65mV
              scale:
                value: -20
                description: nml:-20mV
          reverseRate:
            name: reverseRate
            iri: neuroml:HHSigmoidRate
            parameters:
              rate:
                value: 1
                description: nml:1per_ms
              midpoint:
                value: -35
                description: nml:-35mV
              scale:
                value: 10
                description: nml:10mV
  k_vh:
    name: k_vh
    iri: neuroml:ionChannelKS
    parameters:
      conductance:
        value: 8
        description: nml:8pS
      number:
        value: 1800
      erev:
        value: -77
        description: nml:-77mV
    components:
      n:
        name: n
        iri: neuroml:gateKS
        parameters:
          instances:
            value: 1
        components:
          c1:
            name: c1
            iri: neuroml:closedState
          o1:
            name: o1
            iri: neuroml:openState
          vh1:
            name: vh1
            iri: neuroml:vHalfTransition
            parameters:
              from:
                value: 0
                description: nml:c1
              to:
                value: 0
                description: nml:o1
              vHalf:
                value: 0
                description: nml:0mV
              z:
                value: 1.5
              gamma:
                value: 0.75
              tau:
                value: 3.2
                description: nml:3.2ms
              tauMin:
                value: 0.3
                description: nml:0.3ms
