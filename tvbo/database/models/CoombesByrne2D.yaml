name: CoombesByrne2D
iri: tvbo:CoombesByrne2D
model_type: mean_field
parameters:
  Delta:
    definition: Half-width of heterogeneous noise distribution
    value: 1.0
    domain:
      lo: 0.0
      hi: 10.0
      step: 0.01
    description: Half-width of heterogeneous noise distribution
  eta:
    definition: "Constant parameter to scale the rate of feedback from the\n            firing rate variable to itself"
    value: 2.0
    domain:
      lo: -10.0
      hi: 10.0
      step: 0.0001
    description: Constant parameter to scale the rate of feedback from the             firing rate variable to itself
    grounding:
    - GO:0099605
  k:
    definition: Local coupling strength
    value: 1.0
    domain:
      lo: 0.0
      hi: 5.0
      step: 0.01
    description: Local coupling strength
  v_syn:
    definition: QIF membrane reversal potential
    value: -4.0
    domain:
      lo: -20.0
      hi: 0.0
      step: 0.01
    description: QIF membrane reversal potential
    grounding:
    - GO:0042391
description: ''
references:
- Byrne2020
coupling_inputs:
  c_glob: {}
state_variables:
  V:
    domain:
      lo: -2.0
      hi: 1.5
    equation:
      lhs: Derivative(V, t)
      rhs: V**2 + c_glob + eta + pi*k*r*(-V + v_syn) - pi**2*r**2
      latex: false
    coupling_variable: true
    initial_value: 0.1
  r:
    domain:
      lo: 0.0
      hi: .inf
      enforce: clamp
    equation:
      lhs: Derivative(r, t)
      rhs: Delta/pi + 2*V*r - pi*k*r**2
      latex: false
    coupling_variable: true
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        lo: 0.0
        hi: 2.0
number_of_modes: 1
