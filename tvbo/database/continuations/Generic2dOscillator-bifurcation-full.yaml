# Every setting a continuation declares, on the Generic2dOscillator; Generic2dOscillator-bifurcation.yaml is the minimal version.

name: eq_in_a_full
label: "Equilibrium branch in a (full settings)"
description: >-
  Comprehensive bifurcation analysis of the Generic2dOscillator. Continues the equilibrium branch as parameter a is varied, detects fold and Hopf bifurcations, then branches to periodic orbits from both Hopf points with fine-tuned solver settings.

dynamics: Generic2dOscillator

# The first free parameter is the primary one; its domain is the diagram's range.
free_parameters:
  - name: a
    domain:
      lo: -20
      hi: 20

# Predictor-corrector: PALC | MoorePenrose | Natural
algorithm: PALC

# Step-size control
ds: 0.01             # Initial step size (sign = direction)
ds_min: 1.0e-4       # Minimum adaptive step size
ds_max: 0.1          # Maximum adaptive step size
max_steps: 400       # Maximum continuation steps

# Newton corrector
newton_tol: 1.0e-12            # Convergence tolerance for Newton iterations
newton_max_iterations: 25      # Maximum Newton iterations per step

# Bifurcation detection
detect_bifurcation: 3    # Detection level: 0=off, 1=basic, 2=locate, 3=locate+normal-form
detect_fold: true         # Detect fold (saddle-node) bifurcations
nev: 3                    # Number of eigenvalues to compute for stability
tol_stability: 1.0e-10   # Tolerance: |Re(λ)| < tol → marginally stable
n_inversion: 2            # Number of sign inversions to trigger bisection
max_bisection_steps: 25   # Maximum bisection steps to locate bifurcation

bothside: true            # Continue in both directions from initial point

# The starting equilibrium: time_integration, given, or newton.
initial_state:
  method: time_integration
  duration: 2000.0         # Integration time (longer = more robust)
  abs_tol: 1.0e-10         # Absolute tolerance for ODE solver
  rel_tol: 1.0e-10         # Relative tolerance for ODE solver
  solver:
    method: Tsit5          # ODE solver (any DifferentialEquations.jl solver)

# BifurcationKit settings with no universal slot, as name/value pairs.
options:
  - name: tangent
    value: Secant          # Tangent predictor: Secant | Bordered

# Each branch switches from special points of the equilibrium curve to a new family.
branches:
  po_from_hopf:
    description: >-
      Continue periodic orbits emanating from all detected Hopf bifurcation points. Uses orthogonal collocation on a mesh of 20 intervals with degree-4 polynomials.
    # "hopf:all" (the default) branches from every Hopf point, "hopf:1" from the first, "hopf:-1" from the last.
    source_point: "hopf:all"
    delta_p: 0.01          # Step in parameter from the Hopf point that seeds the orbit
    bothside: true         # true → closed orbit envelope (bubble); false → one side only

    # Only the fields set here override the parent continuation's.
    continuation:
      name: po_continuation
      ds: 1.0e-4
      ds_min: 1.0e-6
      ds_max: 0.02
      max_steps: 400
      newton_tol: 1.0e-10
      newton_max_iterations: 20
      tol_stability: 1.0e-6
      detect_bifurcation: 3
      n_inversion: 8
      nev: 3
      algorithm: PALC
      options:
        - name: tangent
          value: Bordered          # Bordered tangent is more robust for periodic orbits

    # Periodic-orbit discretization: collocation | trapezoid | shooting | poincare
    discretization:
      method: collocation
      parameters:
        mesh_intervals:
          value: 20                 # Number of mesh intervals
        degree:
          value: 4                  # Polynomial degree per interval
        mesh_adaptation:
          value: false              # Adaptive mesh refinement
      options:
        - name: jacobian
          value: DenseAnalyticalInplace   # DenseAnalytical | DenseAnalyticalInplace | AutoDiffDense | AutoDiffDenseAnalytical

    parameters:
      max_norm_bound:
        value: 1.0e+4        # cbMaxNorm callback: discard if ||x|| > this

    options:
      linear_solver:
        value: COPBLS         # Linear solver for periodic orbits: COPBLS | DefaultLS

# The toolkit this continuation was written for.
software:
  name: BifurcationKit
  version_spec: ">=0.4"
  url: https://github.com/bifurcationkit/BifurcationKit.jl
  license: MIT

execution:
  precision: float64
  random_seed: 42
