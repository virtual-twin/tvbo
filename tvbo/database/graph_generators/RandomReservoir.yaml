name: RandomReservoir
description: >-
  Sparse random recurrent adjacency with post-hoc spectral-radius rescaling —
  the canonical Echo State Network substrate (Jaeger 2001). The recurrent
  reservoir of an ESN is fully described by four numbers: size, sparsity,
  target spectral radius, and the weight distribution of the non-zero entries.
iri: tvbo:RandomReservoir

# Neither size nor seed is declared here: `n_nodes` always comes from Network.number_of_nodes and the PRNG seed from the generator's own `seed:` slot, so a parameter for either would be a second source of truth that can disagree with the one that actually takes effect.
parameters:
  sparsity:           { datatype: float,   description: "Fraction of non-zero weights in [0, 1]" }
  spectral_radius:    { datatype: float,   description: "Target spectral radius (post-rescaling)" }
  weight_distribution:
    datatype: Distribution
    description: >-
      Distribution the non-zero weights are drawn from. Overrides the standard
      Normal that the `raw` step declares as its default.

# Typed DAG: each step is a named intermediate carrying its options as schema fields, which is what lets it lower straight onto a backend-native primitive — the resolver in tvbo/graph_generators/procedural.py builds the SymPy tree and the printer tables in tvbo/codegen/code.py render it per backend, so eager numpy construction and emitted JAX are the same expressions rendered twice.
procedure:
  steps:
    raw:
      description: "n_nodes x n_nodes matrix drawn from the weight distribution"
      type: sample
      of: weight_distribution
      seed_offset: 0
      distribution:
        name: Normal
        parameters:
          mean: { value: 0.0 }
          std:  { value: 1.0 }
    mask:
      description: "Bernoulli sparsity mask — an edge survives with probability `sparsity`"
      type: stochastic_mask
      of: sparsity
      comparison: gt
      seed_offset: 1
      distribution:
        name: Uniform
        parameters:
          lo: { value: 0.0 }
          hi: { value: 1.0 }
    masked:
      equation: { rhs: "raw * mask" }
    rho:
      description: "Current spectral radius (largest absolute eigenvalue)"
      equation: { rhs: "max(abs(eigvals(masked)))" }
    scale:
      description: "Rescaling factor onto the target spectral radius"
      # A step of its own rather than a parenthesised sub-expression inside the output, which is load-bearing: SymPy canonicalises `masked * (spectral_radius / rho)` into `masked*spectral_radius/rho`, float multiplication is not associative, so a minority of entries would round differently. Each step is evaluated separately, so the DAG can carry an association expression syntax cannot.
      equation: { rhs: "spectral_radius / rho" }
  output:
    weights:
      description: "Masked draw rescaled to the target spectral radius"
      equation: { rhs: "masked * scale" }

# A degenerate draw (every sampled edge masked out, so rho is 0) divides by zero here, which the non-finite output check in `procedural.materialize` catches rather than a guard step, so every generator is covered rather than this one construction.
