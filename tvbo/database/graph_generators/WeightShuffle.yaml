name: WeightShuffle
description: >-
  Derived generator: load a reference adjacency by IRI and permute its
  non-zero entries, holding one structural property fixed. Used for null-model
  controls (e.g. a shuffled SC matrix that keeps the source's density and
  weight multiset while randomising which edge carries which weight).
iri: tvbo:WeightShuffle

parameters:
  source:
    datatype: uriorcurie
    description: "IRI of the reference Network whose weights matrix is shuffled."
  preserve:
    datatype: string
    description: >-
      Which structural property to hold fixed under permutation. Only
      `binary_mask` is implemented: keep the {0, nonzero} pattern and permute the
      weight values among their existing positions, so density and topology stay
      fixed while the weight-to-edge assignment is randomised. Any other value is
      rejected — a null model that silently controlled a different property than
      the one asked for would invalidate the comparison it exists to support.
    default: "binary_mask"

# `seed` is not a parameter: it is the generator's own `seed:` slot, and declaring it twice would give the same quantity two sources that can disagree.

# The documented Callable exception to the typed-DAG rule: a masked extract, a permutation and a scatter are not expressible in the backend-independent primitive set, and `M[M != 0]` cannot survive expression parsing at all because the comparison evaluates to a plain Python `True` before a tree is built. Rather than bend the printer vocabulary around one generator, the algorithm stays ordinary Python reached through the standard python binding.
bindings:
  python:
    library: tvbo.graph_generators
    callable: weight_shuffle
