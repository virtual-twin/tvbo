# TVB-O's own look, and the document every other theme starts from: a project names it as `theme: {iri: tvbo:theme/default}` and states only what it changes. It is the authority for both kinds of colour — `base` is what a mark is drawn in when its colour carries no meaning, `highlight` is the one colour that means "this is the point" and is kept out of the cycler so it is never handed to a panel by accident, `palette` is reached into only where a panel separates conditions, and the cycler is `[base] + palette`. It ships in the wheel, so the documentation site and the manuscript's figures read these hexes instead of keeping copies that drift. It is almost all colour: of the geometry a theme can state it fixes only the legend frame, and a look TVB-O has no field for still belongs in a style sheet.
tvbo_class: tvbo:Theme

ink: "#183231"
base: "#3f5457"
muted: "#c3cbcb"
highlight: "#c0504d"
background: "#ffffff"

# Chosen so the worst confusable pair stays apart in normal vision and in all three dichromacies: the previous set put two blue-purples 7.7 dE00 apart and collapsed amber onto the highlight at 1.8 for a deuteranope, where this one holds 8.8 everywhere. Teal stays put because the figures call it excitatory; the amber is lighter than it was, which is the only thing that separates it from a red highlight for a deuteranope.
palette:
  - "#1f7d78"
  - "#d9922f"
  - "#4a7fbf"
  - "#7a5a8e"
  - "#bf869c"

# A key is drawn unboxed: at the size a journal prints these panels the frame costs more room than it saves, and its edge reads as another spine. Stated here rather than hardcoded in the renderer, so a project that wants boxed keys can have them.
legend_frame: false

# Continuous scales live here too, so a figure never names a colormap of its own. Anything ordinal or continuous draws from one of these; anything categorical draws from `palette` above. A project adds keys of its own for the scales it distinguishes; these two are the ones the renderer reaches for unasked.
colormaps:
  sequential: viridis
  diverging: RdBu_r
