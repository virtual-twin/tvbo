# TVB-O's look on a dark page: the six hues of tvbo:themes/default in the same order, lightened to read on near-black, with dark roles; every slot it does not state comes from the default.
tvbo_class: tvbo:Theme

ink: "#e9efee"
base: "#a7b4b3"
muted: "#2c3b3c"
highlight: "#73acce"
background: "#0b1314"
surface: "#121d1e"

palette:
  - "#3cb5ad"
  - "#e8a94f"
  - "#7fb0e6"
  - "#b095c9"
  - "#9ccc7a"
  - "#d9a3b8"
