name: TVB-O
description: The Virtual Brain Ontology — a Python library for knowledge representation,
  code generation, and simulation of large-scale brain network models. Integrates
  a LinkML-based ontology with JAX-accelerated numerical backends and interoperates
  with TVB, PyRates, NEURON, NEST, NeuroML, and NetworkDynamics.jl.
