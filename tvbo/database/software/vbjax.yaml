name: vbjax
description: JAX-based virtual brain library. Provides stochastic Heun integrators
  for ODE/SDE/DDE/SDDE, canonical neural-mass models (Jansen-Rit, Montbrio-Pazo-Roxin,
  BVEP, bilinear DCM, Dopa), BOLD/EEG monitors, delay-coupling helpers, a spherical-harmonic
  neural-field operator, and JAX-native parameter sweeps with gradient-based fitting
  and MCMC.
