    grounding:
    - GO:0099605
  W_e:
    name: W_e
    definition: Excitatory population external input scaling weight
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 2.0
      step: 0.01
      log_scale: false
    description: Excitatory population external input scaling weight
    grounding:
    - GO:0090394
    - GO:2000463
  W_i:
    name: W_i
