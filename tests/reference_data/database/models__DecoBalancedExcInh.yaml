    value: 100.0
    domain:
      enforce: none
      lo: 50.0
      hi: 150.0
      step: 1.0
      log_scale: false
    description: Kinetic parameter  that represents the decay times for NMDA synapses
      (Deco et al
    unit: ms
  tau_i:
    name: tau_i
    definition: Kinetic parameter that represents the decay times for inhibitory GABA
      synapses (Deco et al., 2014).
    value: 10.0
    domain:
      enforce: none
      lo: 5.0
      hi: 100.0
      step: 1.0
      log_scale: false
    description: Kinetic parameter that represents the decay times for inhibitory
      GABA synapses (Deco et al
    unit: ms
    grounding:
    - GO:0016917
  w_p:
    name: w_p
    definition: Excitatory population recurrence weight
    value: 1.4
    domain:
      enforce: none
      lo: 0.0
      hi: 2.0
      step: 0.01
      log_scale: false
    description: Excitatory population recurrence weight
    grounding:
    - GO:0060079
description: Deco Balanced Exc-Inh model. It extends the Reduced Wong-Wang Exc-Inh
  (RWW_EI) dynamic mean-field model with an effective regional gain parameter M_i
  that scales both the excitatory and inhibitory input currents, capturing the dynamical
  consequences of regional heterogeneity in the brain's transcriptional landscape
  (Deco et al., 2021).
references:
- Deco2021
derived_variables:
  J_N_S_e:
    name: J_N_S_e
    equation:
      lhs: J_N_S_e
      rhs: J_N*S_e
      latex: false
    record: false
    conditional: false
  coupling:
    name: coupling
    equation:
      lhs: coupling
      rhs: G*J_N*(S_e*local_coupling + c_glob)
      latex: false
    record: false
    conditional: false
  I_e:
    name: I_e
    description: Input current to the excitatory population (Deco et al., 2021).
    equation:
      lhs: I_e
      rhs: I_ext + I_o*W_e + J_N_S_e*w_p - J_i*S_i + coupling
      latex: false
    record: false
    grounding:
    - GO:0098815
    conditional: false
  I_i:
    name: I_i
    description: Input current to the inhibitory population (Deco et al., 2021).
    equation:
      lhs: I_i
      rhs: I_o*W_i + J_N_S_e - S_i + coupling*lamda
      latex: false
    record: false
    grounding:
    - GO:0060080
    conditional: false
  x_e:
    name: x_e
    description: Gain-scaled input current to the excitatory population (Deco et al.,
      2021).
    equation:
      lhs: x_e
      rhs: M_i*(a_e*I_e - b_e)
      latex: false
    record: false
    grounding:
    - GO:0098815
    conditional: false
  x_i:
    name: x_i
    description: Gain-scaled input current to the inhibitory population (Deco et al.,
      2021).
    equation:
      lhs: x_i
      rhs: M_i*(a_i*I_i - b_i)
      latex: false
    record: false
    grounding:
    - GO:0060080
    conditional: false
  H_e:
    name: H_e
    description: Sigmoid function that computes the averaged firing rate of the excitatory
      neuron population (Deco et al., 2021).
    equation:
      lhs: H_e
      rhs: x_e/(1 - exp(-d_e*x_e))
      latex: false
    record: false
    grounding:
    - GO:0060079
    - GO:0099605
    conditional: false
  H_i:
    name: H_i
    description: Sigmoid function that computes the averaged firing rate of the inhibitory
      neuron population (Deco et al., 2021).
    equation:
      lhs: H_i
      rhs: x_i/(1 - exp(-d_i*x_i))
      latex: false
    record: false
    grounding:
    - GO:0060080
    - GO:0099605
    conditional: false
coupling_inputs:
  c_glob:
    name: c_glob
    dimension: 1
    local: false
  local_coupling:
    name: local_coupling
    dimension: 1
    local: true
state_variables:
  S_e:
    name: S_e
    domain:
      enforce: clamp
      lo: 0.0
      hi: 1.0
      log_scale: false
    description: Excitatory population synaptic gating state-variable of the Deco
      Balanced Exc-Inh model (Deco et al., 2021).
    equation:
      lhs: Derivative(S_e, t)
      rhs: H_e*gamma_e*(1 - S_e) - S_e/tau_e
      latex: false
    record: true
    grounding:
    - GO:0060079
    - GO:0099536
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  S_i:
    name: S_i
    domain:
      enforce: clamp
      lo: 0.0
      hi: 1.0
      log_scale: false
    description: Inhibitory population synaptic gating state-variable of the Deco
      Balanced Exc-Inh model (Deco et al., 2021).
    equation:
      lhs: Derivative(S_i, t)
      rhs: H_i*gamma_i - S_i/tau_i
      latex: false
    record: true
    grounding:
    - GO:0060080
    - GO:0099536
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
number_of_modes: 1
model_type: mean_field
autonomous: true
cse: false
compile: false
