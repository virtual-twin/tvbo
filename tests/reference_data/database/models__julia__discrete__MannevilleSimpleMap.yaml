name: MannevilleSimpleMap
parameters:
  epsilon:
    name: epsilon
    value: 0.1
    description: Intermittency control ε.
description: 'Simple intermittency map x_{n+1} = [(1+ε)x_n + (1-ε)x_n^2] mod 1, used
  to illustrate

  bursts separated by quiescent phases.'
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/discrete_famous_systems.jl
references:
- Manneville1980
state_variables:
  x:
    name: x
    equation:
      lhs: x_next
      rhs: ((1 + epsilon)*x + (1 - epsilon)*x**2) % 1
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.4
number_of_modes: 1
model_type: generic
system_type: discrete
autonomous: true
cse: false
compile: false
