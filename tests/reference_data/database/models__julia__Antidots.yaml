name: Antidots
parameters:
  d0:
    name: d0
    value: 0.5
    description: Effective antidot diameter.
  c:
    name: c
    value: 0.2
    description: Smoothing factor c.
  B:
    name: B
    value: 1.0
    description: Magnetic field strength (normalized).
description: 'Hamiltonian antidot lattice (periodic Sinai-like billiard) with smooth
  circular

  repulsive potentials and perpendicular magnetic field. Models guiding center

  dynamics and magnetotransport phenomena in mesoscopic systems. Smooth radial

  repulsion implemented as a quartic polynomial potential inside radius (d0/2 + c)

  matching the original implementation (Datseris 2019); outside region force is zero.'
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/continuous_famous_systems.jl
references:
- Datseris2019
derived_variables:
  xt:
    name: xt
    equation:
      lhs: xt
      rhs: (x % 1.0) - 0.5
      latex: false
    record: false
  yt:
    name: yt
    equation:
      lhs: yt
      rhs: (y % 1.0) - 0.5
      latex: false
    record: false
  rho:
    name: rho
    equation:
      lhs: rho
      rhs: sqrt(xt**2 + yt**2)
      latex: false
    record: false
  Ux:
    name: Ux
    equation:
      lhs: Ux
      conditionals:
      - condition: rho < (0.5*d0 + c)
        expression: -(4*(0.5*d0 + c - rho)**3)/(c**4*(rho + 1e-12))*xt
      - condition: 'True'
        expression: '0'
      latex: false
    record: false
  Uy:
    name: Uy
    equation:
      lhs: Uy
      conditionals:
      - condition: rho < (0.5*d0 + c)
        expression: -(4*(0.5*d0 + c - rho)**3)/(c**4*(rho + 1e-12))*yt
      - condition: 'True'
        expression: '0'
      latex: false
    record: false
state_variables:
  x:
    name: x
    equation:
      lhs: Derivative(x, t)
      rhs: vx
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.5
  y:
    name: y
    equation:
      lhs: Derivative(y, t)
      rhs: vy
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.5
  vx:
    name: vx
    equation:
      lhs: Derivative(vx, t)
      rhs: 2*sqrt(2)*B*vy - Ux
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.25
  vy:
    name: vy
    equation:
      lhs: Derivative(vy, t)
      rhs: -2*sqrt(2)*B*vx - Uy
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.25
number_of_modes: 1
model_type: generic
autonomous: true
cse: false
compile: false
