name: TVB-Optim
description: Differentiable whole-brain simulation and optimization framework using
  JAX. Supports gradient-based fitting of neural mass models to empirical neuroimaging
  data.
homepage: https://virtual-twin.github.io/tvboptim/
license: EUPL-1.2
repository: https://github.com/virtual-twin/tvboptim
