name: FastLinearCoupling
label: Fast Linear Coupling
parameters:
  G:
    name: G
    value: 0.1
    domain:
      enforce: none
      lo: 0.0
      hi: 10.0
      log_scale: false
    description: Global coupling strength scaling long-range connections
  b:
    name: b
    value: 0.0
    description: Offset/bias added to coupling signal
description: Instantaneous linear coupling using vectorized matrix multiplication.
  Applies global coupling strength G to the weighted sum of source states. Faster
  than element-wise LinearCoupling for dense all-to-all connectivity.
sparse: false
pre_expression:
  rhs: local_states
  latex: false
post_expression:
  rhs: G * gx + b
  latex: false
local_states:
- S
delayed: false
interpolate_delays: false
vectorized: false
symmetry: directed
