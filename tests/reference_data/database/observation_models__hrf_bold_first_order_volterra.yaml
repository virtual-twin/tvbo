name: HRFBold_FirstOrderVolterra
label: BOLD (HRF convolution, first-order Volterra kernel)
description: 'BOLD signal as tvboptim''s HRFBold computes it: the source is averaged
  onto the `downsample_period` grid, joined to its history (the settle, or a warm-start
  history averaged on its own) or to zeros, convolved (''valid'') with the first-order
  Volterra kernel of the Balloon model, tvboptim''s FirstOrderVolterraHRFKernel and
  HRFBold''s default, sampled over its support on that grid, scaled by the Volterra
  coefficients as `k_1 V_0 (x - 1)`, and sampled at the end of each `period`.'
iri: tvbo:HRFBold_FirstOrderVolterra
parameters:
  k_1:
    name: k_1
    value: 5.6
    description: Signal scaling factor
  V_0:
    name: V_0
    value: 0.02
    description: Resting blood volume fraction
functions:
  hrf_first_order_volterra:
    name: hrf_first_order_volterra
    equation:
      parameters:
        tau_s:
          name: tau_s
          value: 0.8
          description: Signal decay time constant
          unit: s
        tau_f:
          name: tau_f
          value: 0.4
          description: Autoregulatory feedback time constant
          unit: s
        scaling:
          name: scaling
          value: 0.3333333333333333
          description: Kernel scaling, one third
      rhs: scaling * exp(-0.5 * ((t / 1000.0) / tau_s)) * sin(sqrt(1.0 / tau_f - 1.0
        / (4.0 * tau_s**2)) * (t / 1000.0)) / sqrt(1.0 / tau_f - 1.0 / (4.0 * tau_s**2))
      latex: false
    description: The first-order Volterra kernel of the Balloon model, tvboptim's
      FirstOrderVolterraHRFKernel and HRFBold's default, sampled on `ceiling(duration
      / downsample_period)` points of [0, duration] ms.
    arguments:
      duration:
        name: duration
        description: Kernel support
        value: 20000.0
        unit: ms
      downsample_period:
        name: downsample_period
        description: Grid the kernel is sampled on, bound to the observation's own
        value: 4.0
        unit: ms
    time_range:
      enforce: none
      lo: 0.0
      hi: duration
      n: ceiling(duration / downsample_period)
      log_scale: false
period: 1000.0
downsample_period: 4.0
history_join: per_segment
output_variable_name: BOLD({name})
time_stamps:
  rhs: take(t, 0) - dt + (arange(n) + 1) * period
  latex: false
imaging_modality: BOLD
reconcile: by_label
pipeline:
- function: hrf_first_order_volterra
- name: downsample
  equation:
    parameters:
      window_size:
        name: window_size
        description: Integration steps per averaging window
        equation:
          rhs: iround(downsample_period / dt)
          latex: false
    rhs: complete_window_mean(X, window_size)
    latex: false
  input: integration.result
  output: downsampled
  apply_on_dimension: time
- name: convolve
  equation:
    parameters:
      step:
        name: step
        description: Kernel-grid samples per BOLD period; the first sample is taken
          once one period has completed
        equation:
          rhs: iround(period / downsample_period)
          latex: false
    rhs: sampled_convolve(X, kernel, step)
    latex: false
  input: downsampled
  output: convolved
  apply_on_dimension: time
  arguments:
    kernel:
      name: kernel
      value: hrf_first_order_volterra
- name: volterra_transform
  equation:
    rhs: k_1 * V_0 * (X - 1.0)
    latex: false
  input: convolved
  output: bold
