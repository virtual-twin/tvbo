name: Sakarya
parameters:
  a:
    name: a
    value: 1.0
    description: Linear growth coefficient a.
  b:
    name: b
    value: 1.0
    description: Constant drive term b.
  m:
    name: m
    value: 1.0
    description: Nonlinear coupling coefficient m.
description: 'Four-wing strange attractor born via merging of bistable attractors;
  exhibits

  robust chaos and symmetry-related lobe structure transitions under parameter variation.'
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/continuous_famous_systems.jl
references:
- Li2015
state_variables:
  x:
    name: x
    equation:
      lhs: Derivative(x, t)
      rhs: a*x + y + y*z
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: -2.8976045
  y:
    name: y
    equation:
      lhs: Derivative(y, t)
      rhs: -x*z + y*z
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 3.8877978
  z:
    name: z
    equation:
      lhs: Derivative(z, t)
      rhs: -z - m*x*y + b
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 3.07465
number_of_modes: 1
model_type: generic
autonomous: true
cse: false
compile: false
