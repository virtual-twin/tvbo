name: phase_locking_value
state:
- count
- re
- im
emit: sqrt(re**2 + im**2) / count
description: The phase locking value of every two nodes, the modulus of the mean of
  exp(i (v_j - v_k)) over the run for a node-wise phase v in radians (Lachaux et al.
  1999), folded one sample at a time from cos(v) and sin(v) so that no trajectory
  is held; 1 on the diagonal. Streams the curated function PhaseLockingValue.
replaces:
- tvbo.analysis.statistics.phase_locking_value
backends:
- tvboptim
emit_kind: run
add:
- target: c
  expression: cos(v)
- target: s
  expression: sin(v)
- target: count
  expression: count + 1
- target: re
  expression: re + outer(c, c) + outer(s, s)
- target: im
  expression: im + outer(s, c) - outer(c, s)
