name: TemporalAverage
label: Temporal Average
description: 'Running temporal mean over non-overlapping windows of `period`, windowed
  exactly as TVB''s TemporalAverage monitor windows: the first window covers integration
  steps 0..istep-1, and `istep` is TVB''s own `iround(period / dt)`. Verified against
  TVB''s own monitor driven through its `sample()` loop.'
period: 0.9765625
reconcile: by_label
pipeline:
- equation:
    parameters:
      window_size:
        name: window_size
        description: Integration steps per averaging window, so the window tracks
          the grid the experiment declares rather than the one this file was written
          on.
        equation:
          rhs: iround(period / dt)
          latex: false
    rhs: window_mean(X, window_size)
    latex: false
  name: temporal_average
  output: averaged
  apply_on_dimension: time
  arguments:
    window_size:
      name: window_size
      description: Integration steps per averaging window. Its value is declared on
        the equation parameter of the same name; a backend that has not yet been migrated
        to read that still derives it here.
class_reference:
  name: TemporalAverage
  module: tvb.simulator.monitors
