name: BOLD_DoubleExponential
label: BOLD (Double Exponential HRF)
description: BOLD fMRI observation model using a Double Exponential hemodynamic response
  function.
parameters:
  TR:
    name: TR
    value: 2000.0
    unit: ms
time_scale: ms
imaging_modality: BOLD
reconcile: by_label
pipeline:
- equation:
    rhs: window_mean(X, stepsize)
    latex: false
  name: temporal_average_interim
  output: interim_averaged
  apply_on_dimension: time
  arguments:
    stepsize:
      name: stepsize
      description: Interim averaging window in integration steps. Resolved from the
        integration dt (= stock_dt / dt), not a raw-grid literal.
- acronym: HRF
  equation:
    parameters:
      A1:
        name: A1
        value: 3.87
      tau_1:
        name: tau_1
        value: 0.9
        unit: s
      A2:
        name: A2
        value: 0.18
      tau_2:
        name: tau_2
        value: 9.5
        unit: s
    rhs: A1 * exp(-t / tau_1) + A2 * exp(-t / tau_2)
    latex: false
  name: hemodynamic_response
  output: hrf_kernel
  arguments:
    duration:
      name: duration
      value: 20
      unit: s
    stock_dt:
      name: stock_dt
      value: 0.004
      unit: s
  time_range:
    enforce: none
    lo: 0
    hi: duration
    step: stock_dt
    log_scale: false
- name: convolve
  callable:
    name: fftconvolve
    module: scipy.signal
  input: temporal_average_interim
  output: convolved
  arguments:
    in2:
      name: in2
      value: hrf_kernel
    mode:
      name: mode
      value: same
- equation:
    rhs: subsample(X, start, stepsize)
    latex: false
  name: subsample_to_period
  input: convolve
  output: Bold
  apply_on_dimension: time
  arguments:
    start:
      name: start
      description: Index of first output sample (resolved to stepsize - 1) so the
        first sample aligns with TVB's step % istep == 0 emission.
    stepsize:
      name: stepsize
      description: Interim samples per output sample. Resolved from the integration
        dt (= (TR / dt) / interim_istep), not a raw-grid literal.
class_reference:
  name: Bold
  module: tvb.simulator.monitors
  constructor_args:
  - name: hrf_kernel
    value: DoubleExponential
  - name: hrf_length
    value: 20000.0
