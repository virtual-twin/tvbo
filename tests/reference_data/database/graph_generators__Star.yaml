name: Star
description: Star graph — one central hub connected to n-1 peripheral nodes.
iri: tvbo:Star
directed: false
parameters:
  n:
    name: n
    description: Number of nodes (1 hub + n-1 leaves)
    datatype: integer
bindings:
  julia:
    name: julia
    library: Graphs
    callable: star_graph
    args:
    - n
  networkx:
    name: networkx
    library: networkx
    callable: star_graph
    args:
    - n
