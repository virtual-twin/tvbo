name: Nengo
description: A Python library for building and simulating large-scale brain models
  using the Neural Engineering Framework (NEF). Supports spiking and rate-based neurons
  with backends including NumPy, TensorFlow (NengoDL), and neuromorphic hardware (NengoLoihi).
