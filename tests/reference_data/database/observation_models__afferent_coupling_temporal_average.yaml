name: AfferentCouplingTemporalAverage
label: Afferent Coupling Temporal Average
description: Temporally averaged afferent coupling input at each node. Combines coupling
  input recording with temporal averaging.
source:
- coupling
period: 0.9765625
reconcile: by_label
pipeline:
- equation:
    parameters:
      window_size:
        name: window_size
        description: Integration steps per averaging window. Inherits TemporalAverage's
          windowing, so it rounds with TVB's own iround rather than truncating.
        equation:
          rhs: iround(period / dt)
          latex: false
    rhs: window_mean(X, window_size)
    latex: false
  name: temporal_average
  output: averaged_coupling
  apply_on_dimension: time
  arguments:
    window_size:
      name: window_size
      description: Integration steps per averaging window. Its value is declared on
        the equation parameter of the same name; a backend that has not yet been migrated
        to read that still derives it here.
class_reference:
  name: AfferentCouplingTemporalAverage
  module: tvb.simulator.monitors
