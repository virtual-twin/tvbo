name: HH_Tissue_Q10
parameters:
  C:
    name: C
    value: 10.0
  g_Na:
    name: g_Na
    value: 1200.0
  g_K:
    name: g_K
    value: 360.0
  g_L:
    name: g_L
    value: 3.0
  E_Na:
    name: E_Na
    value: 50.0
  E_K:
    name: E_K
    value: -77.0
  E_L:
    name: E_L
    value: -54.3
  I_amp:
    name: I_amp
    value: 0.08
  Q10_early:
    name: Q10_early
    value: 0.333333
    description: 'Q10 at 22C: 3^(-1)'
  Q10_late:
    name: Q10_late
    value: 0.172414
    description: 'Q10 at 16C: 3^(-1.6)'
  switch_time:
    name: switch_time
    value: 500.0
    description: Temperature switch at 500ms
    unit: ms
source: 'NeuroML2 example: Ex17_Tissue'
derived_variables:
  Q10:
    name: Q10
    description: 'Q10 factor: switches from 22C to 16C at 500ms'
    equation:
      rhs: Piecewise((Q10_early, t < switch_time), (Q10_late, True))
      latex: false
    record: false
  I_ext:
    name: I_ext
    description: Constant current 0.08 nA
    equation:
      rhs: I_amp
      latex: false
    record: false
  alpha_m:
    name: alpha_m
    equation:
      rhs: Piecewise((1.0, Eq(v, -40.0)), (0.1*(v + 40.0)/(1.0 - exp(-(v + 40.0)/10.0)),
        True))
      latex: false
    record: false
  beta_m:
    name: beta_m
    equation:
      rhs: 4.0*exp(-(v + 65.0)/18.0)
      latex: false
    record: false
  alpha_h:
    name: alpha_h
    equation:
      rhs: 0.07*exp(-(v + 65.0)/20.0)
      latex: false
    record: false
  beta_h:
    name: beta_h
    equation:
      rhs: 1.0/(1.0 + exp(-(v + 35.0)/10.0))
      latex: false
    record: false
  alpha_n:
    name: alpha_n
    equation:
      rhs: Piecewise((0.1, Eq(v, -55.0)), (0.01*(v + 55.0)/(1.0 - exp(-(v + 55.0)/10.0)),
        True))
      latex: false
    record: false
  beta_n:
    name: beta_n
    equation:
      rhs: 0.125*exp(-(v + 65.0)/80.0)
      latex: false
    record: false
state_variables:
  v:
    name: v
    equation:
      rhs: (-g_Na*m**3*h*(v - E_Na) - g_K*n**4*(v - E_K) - g_L*(v - E_L) + I_ext*1000)
        / C
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: -65.0
  m:
    name: m
    equation:
      rhs: Q10*(alpha_m*(1 - m) - beta_m*m)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.052932
  h:
    name: h
    equation:
      rhs: Q10*(alpha_h*(1 - h) - beta_h*h)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.596121
  n:
    name: n
    equation:
      rhs: Q10*(alpha_n*(1 - n) - beta_n*n)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.317677
number_of_modes: 1
model_type: spiking
autonomous: false
cse: false
compile: false
