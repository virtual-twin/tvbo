name: GlobalAverage
label: Global Spatial Average
description: Spatial mean across all network nodes at each sampling period. Reduces
  spatial dimension to a single global signal per state variable.
period: 0.9765625
reconcile: by_label
pipeline:
- equation:
    rhs: global_mean(X)
    latex: false
  name: global_mean
  output: global_averaged
  apply_on_dimension: node
  aggregate:
    over: node
    type: mean
class_reference:
  name: GlobalAverage
  module: tvb.simulator.monitors
