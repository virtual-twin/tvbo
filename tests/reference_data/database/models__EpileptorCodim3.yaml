name: EpileptorCodim3
iri: tvbo:EpileptorCodim3
parameters:
  mu1_start:
    name: mu1_start
    definition: The bifurcation parameter mu1 at the offset point for the given class.
    value: -0.02285
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter mu1 at the offset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  mu2_start:
    name: mu2_start
    definition: The bifurcation parameter mu2 at the offset point for the given class.
    value: 0.3448
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter mu2 at the offset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  nu_start:
    name: nu_start
    definition: The bifurcation parameter nu at the offset point for the given class.
    value: 0.2014
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter nu at the offset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  mu1_stop:
    name: mu1_stop
    definition: The bifurcation parameter mu1 at the onset point for the given class.
    value: -0.07465
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter mu1 at the onset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  mu2_stop:
    name: mu2_stop
    definition: The bifurcation parameter mu2 at the onset point for the given class.
    value: 0.3351
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter mu2 at the onset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  nu_stop:
    name: nu_stop
    definition: The bifurcation parameter nu at the onset point for the given class.
    value: 0.2053
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    description: The bifurcation parameter nu at the onset point for the given class,
      default for class c2s (Saddle-Node at onset and Saddle-Homoclinic at offset).
  b:
    name: b
    definition: Unfolding type of the degenerate Takens-Bogdanov bifurcation.
    value: 1.0
    description: Unfolding type of the degenerate Takens-Bogdanov bifurcation, default
      is a focus type.
  R:
    name: R
    definition: Radius in unfolding.
    value: 0.4
    domain:
      enforce: none
      lo: 0.0
      hi: 2.5
      log_scale: false
    description: Radius in the unfolding sphere on which the great arc connecting
      onset and offset points lies.
  c:
    name: c
    definition: Speed of the slow variable.
    value: 0.001
    domain:
      enforce: none
      lo: 0.0
      hi: 0.01
      log_scale: false
    description: Speed of the slow variable z.
  dstar:
    name: dstar
    definition: Threshold for the inversion of the slow variable.
    value: 0.3
    domain:
      enforce: none
      lo: -0.1
      hi: 0.5
      log_scale: false
    description: Threshold for the inversion of the slow variable z.
  Ks:
    name: Ks
    definition: Slow permittivity coupling strength.
    value: 0.0
    description: Slow permittivity coupling strength, the default of zero is no coupling.
  modification:
    name: modification
    value: 1.0
    description: 'Toggle the +0.1*(z-0.5)^7 stabilising term in z_dot: >0 (True, default)
      includes it, 0 (False) omits it.'
description: The Epileptor codim 3 model is a neural mass model containing two subsystems
  acting at different timescales. The fast subsystem (x, y) uses the unfolding of
  a degenerate Takens-Bogdanov bifurcation of codimension 3; the slow subsystem (z)
  steers the fast one back and forth along a great arc of a sphere, producing bursting
  behavior. It reproduces almost all classes of bursting predicted for systems with
  a planar fast subsystem. The default parameters correspond to Hysteresis-Loop burster
  class c2s (Saddle-Node at onset, Saddle-Homoclinic at offset, branch N=1, with the
  stabilising modification for negative dstar).
references:
- Saggio2017
derived_variables:
  E0:
    name: E0
    description: First component of the unit vector E parametrising the great arc
      (A/||A|| with A = [mu2_start, -mu1_start, nu_start]).
    equation:
      lhs: E0
      rhs: mu2_start/sqrt(mu1_start**2 + mu2_start**2 + nu_start**2)
      latex: false
    record: false
    conditional: false
  E1:
    name: E1
    description: Second component of the unit vector E parametrising the great arc.
    equation:
      lhs: E1
      rhs: -mu1_start/sqrt(mu1_start**2 + mu2_start**2 + nu_start**2)
      latex: false
    record: false
    conditional: false
  E2:
    name: E2
    description: Third component of the unit vector E parametrising the great arc.
    equation:
      lhs: E2
      rhs: nu_start/sqrt(mu1_start**2 + mu2_start**2 + nu_start**2)
      latex: false
    record: false
    conditional: false
  F0:
    name: F0
    description: First component of the unit vector F parametrising the great arc
      (normalised ((A x B) x A) with B = [mu2_stop, -mu1_stop, nu_stop]).
    equation:
      lhs: F0
      rhs: (mu1_start*(mu1_start*mu2_stop - mu1_stop*mu2_start) + nu_start*(-mu2_start*nu_stop
        + mu2_stop*nu_start))/sqrt((mu1_start*(mu1_start*mu2_stop - mu1_stop*mu2_start)
        + nu_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2 + (-mu1_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start) - mu2_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2
        + (mu2_start*(mu1_start*mu2_stop - mu1_stop*mu2_start) - nu_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start))**2)
      latex: false
    record: false
    conditional: false
  F1:
    name: F1
    description: Second component of the unit vector F parametrising the great arc.
    equation:
      lhs: F1
      rhs: (mu2_start*(mu1_start*mu2_stop - mu1_stop*mu2_start) - nu_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start))/sqrt((mu1_start*(mu1_start*mu2_stop - mu1_stop*mu2_start)
        + nu_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2 + (-mu1_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start) - mu2_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2
        + (mu2_start*(mu1_start*mu2_stop - mu1_stop*mu2_start) - nu_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start))**2)
      latex: false
    record: false
    conditional: false
  F2:
    name: F2
    description: Third component of the unit vector F parametrising the great arc.
    equation:
      lhs: F2
      rhs: (-mu1_start*(-mu1_start*nu_stop + mu1_stop*nu_start) - mu2_start*(-mu2_start*nu_stop
        + mu2_stop*nu_start))/sqrt((mu1_start*(mu1_start*mu2_stop - mu1_stop*mu2_start)
        + nu_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2 + (-mu1_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start) - mu2_start*(-mu2_start*nu_stop + mu2_stop*nu_start))**2
        + (mu2_start*(mu1_start*mu2_stop - mu1_stop*mu2_start) - nu_start*(-mu1_start*nu_stop
        + mu1_stop*nu_start))**2)
      latex: false
    record: false
    conditional: false
  mu2:
    name: mu2
    description: Bifurcation parameter mu2 along the great arc as a function of the
      slow variable z.
    equation:
      lhs: mu2
      rhs: R*(E0*cos(z) + F0*sin(z))
      latex: false
    record: false
    conditional: false
  mu1:
    name: mu1
    description: Bifurcation parameter mu1 along the great arc as a function of the
      slow variable z.
    equation:
      lhs: mu1
      rhs: -R*(E1*cos(z) + F1*sin(z))
      latex: false
    record: false
    conditional: false
  nu:
    name: nu
    description: Bifurcation parameter nu along the great arc as a function of the
      slow variable z.
    equation:
      lhs: nu
      rhs: R*(E2*cos(z) + F2*sin(z))
      latex: false
    record: false
    conditional: false
  cardano_a:
    name: cardano_a
    description: Half of mu1 (the Cardano coefficient mu1/2 for the depressed cubic
      xs**3 - mu2*xs - mu1 = 0).
    equation:
      lhs: cardano_a
      rhs: mu1/2
      latex: false
    record: false
    conditional: false
  cardano_d:
    name: cardano_d
    description: Cardano discriminant mu1**2/4 - mu2**3/27 for the cubic xs**3 - mu2*xs
      - mu1 = 0.
    equation:
      lhs: cardano_d
      rhs: mu1**2/4 - mu2**3/27
      latex: false
    record: false
    conditional: false
  xs:
    name: xs
    description: The x-coordinate of the resting state (branch N=1), the real part
      of the Cardano root of xs**3 - mu2*xs - mu1 = 0, reproducing TVB's principal-branch
      complex cube root. For negative discriminant (three real roots) the trigonometric
      form is used; for non-negative discriminant the principal-branch real cube root
      sum is used (a real cube root for non-negative argument, half the real cube
      root of the magnitude for negative argument).
    equation:
      lhs: xs
      rhs: Piecewise((2*(cardano_a**2 - cardano_d)**(1/6)*cos(atan2(sqrt(-cardano_d),
        cardano_a)/3), cardano_d < 0), (Piecewise(((cardano_a + sqrt(cardano_d))**(1/3),
        (cardano_a + sqrt(cardano_d)) >= 0), (Abs(cardano_a + sqrt(cardano_d))**(1/3)/2,
        True)) + Piecewise(((cardano_a - sqrt(cardano_d))**(1/3), (cardano_a - sqrt(cardano_d))
        >= 0), (Abs(cardano_a - sqrt(cardano_d))**(1/3)/2, True)), True))
      latex: false
    record: false
    conditional: false
coupling_inputs:
  c_glob:
    name: c_glob
    dimension: 1
    local: false
state_variables:
  x:
    name: x
    domain:
      enforce: none
      lo: 0.4
      hi: 0.6
      log_scale: false
    description: Fast subsystem variable x.
    equation:
      lhs: Derivative(x, t)
      rhs: -y
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.5
  y:
    name: y
    domain:
      enforce: none
      lo: -0.1
      hi: 0.1
      log_scale: false
    description: Fast subsystem variable y.
    equation:
      lhs: Derivative(y, t)
      rhs: x**3 - mu2*x - mu1 - y*(nu + b*x + x**2)
      latex: false
    record: false
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.0
  z:
    name: z
    domain:
      enforce: none
      lo: 0.0
      hi: 0.15
      log_scale: false
    description: Slow subsystem variable z steering the fast subsystem along the great
      arc.
    equation:
      lhs: Derivative(z, t)
      rhs: -c*(sqrt((x - xs)**2 + y**2) - dstar + Piecewise(((z - 1/2)**7/10, modification
        > 0), (0, True)) + Ks*c_glob)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.05
number_of_modes: 1
model_type: neural_mass
autonomous: true
cse: false
compile: false
