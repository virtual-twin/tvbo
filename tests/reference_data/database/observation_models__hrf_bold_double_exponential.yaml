name: HRFBold_DoubleExponential
label: BOLD (HRF convolution, double-exponential kernel)
description: 'BOLD signal as tvboptim''s HRFBold computes it: the source is averaged
  onto the `downsample_period` grid, joined to its history (the settle, or a warm-start
  history averaged on its own) or to zeros, convolved (''valid'') with the difference
  of two damped oscillations normalised to its peak and scaled by `a`, tvboptim''s
  DoubleExponentialHRFKernel, sampled over its support on that grid, scaled by the
  Volterra coefficients as `k_1 V_0 (x - 1)`, and sampled at the end of each `period`.'
iri: tvbo:HRFBold_DoubleExponential
parameters:
  k_1:
    name: k_1
    value: 5.6
    description: Signal scaling factor
  V_0:
    name: V_0
    value: 0.02
    description: Resting blood volume fraction
functions:
  hrf_double_exponential:
    name: hrf_double_exponential
    equation:
      parameters:
        tau_1:
          name: tau_1
          value: 7.22
          description: Decay time of the first oscillation
          unit: s
        tau_2:
          name: tau_2
          value: 7.4
          description: Decay time of the second oscillation
          unit: s
        f_1:
          name: f_1
          value: 0.03
          description: Frequency of the first oscillation
          unit: Hz
        f_2:
          name: f_2
          value: 0.12
          description: Frequency of the second oscillation
          unit: Hz
        amp_1:
          name: amp_1
          value: 0.1
          description: Amplitude of the first oscillation
        amp_2:
          name: amp_2
          value: 0.1
          description: Amplitude of the second oscillation
        a:
          name: a
          value: 0.1
          description: Amplitude after peak normalisation
      rhs: ((amp_1 * exp(-(t / 1000.0) / tau_1) * sin(2 * pi * f_1 * (t / 1000.0)))
        - (amp_2 * exp(-(t / 1000.0) / tau_2) * sin(2 * pi * f_2 * (t / 1000.0))))
        / where(max(((amp_1 * exp(-(t / 1000.0) / tau_1) * sin(2 * pi * f_1 * (t /
        1000.0))) - (amp_2 * exp(-(t / 1000.0) / tau_2) * sin(2 * pi * f_2 * (t /
        1000.0))))) > 0, max(((amp_1 * exp(-(t / 1000.0) / tau_1) * sin(2 * pi * f_1
        * (t / 1000.0))) - (amp_2 * exp(-(t / 1000.0) / tau_2) * sin(2 * pi * f_2
        * (t / 1000.0))))), 1.0) * a
      latex: false
    description: The difference of two damped oscillations normalised to its peak
      and scaled by `a`, tvboptim's DoubleExponentialHRFKernel, sampled on `ceiling(duration
      / downsample_period)` points of [0, duration] ms.
    arguments:
      duration:
        name: duration
        description: Kernel support
        value: 40000.0
        unit: ms
      downsample_period:
        name: downsample_period
        description: Grid the kernel is sampled on, bound to the observation's own
        value: 4.0
        unit: ms
    time_range:
      enforce: none
      lo: 0.0
      hi: duration
      n: ceiling(duration / downsample_period)
      log_scale: false
period: 1000.0
downsample_period: 4.0
history_join: per_segment
output_variable_name: BOLD({name})
time_stamps:
  rhs: take(t, 0) - dt + (arange(n) + 1) * period
  latex: false
imaging_modality: BOLD
reconcile: by_label
pipeline:
- function: hrf_double_exponential
- name: downsample
  equation:
    parameters:
      window_size:
        name: window_size
        description: Integration steps per averaging window
        equation:
          rhs: iround(downsample_period / dt)
          latex: false
    rhs: complete_window_mean(X, window_size)
    latex: false
  input: integration.result
  output: downsampled
  apply_on_dimension: time
- name: convolve
  equation:
    parameters:
      step:
        name: step
        description: Kernel-grid samples per BOLD period; the first sample is taken
          once one period has completed
        equation:
          rhs: iround(period / downsample_period)
          latex: false
    rhs: sampled_convolve(X, kernel, step)
    latex: false
  input: downsampled
  output: convolved
  apply_on_dimension: time
  arguments:
    kernel:
      name: kernel
      value: hrf_double_exponential
- name: volterra_transform
  equation:
    rhs: k_1 * V_0 * (X - 1.0)
    latex: false
  input: convolved
  output: bold
