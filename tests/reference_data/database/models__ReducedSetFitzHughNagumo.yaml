    value: 0.15
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
      log_scale: false
  mu:
    name: mu
    value: 0.0
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
      log_scale: false
  sigma:
    name: sigma
    value: 0.35
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
