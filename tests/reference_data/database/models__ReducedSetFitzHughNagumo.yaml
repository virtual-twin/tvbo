    - 1.3877787807814457e-17
    - 3.033148827134998
    description: Fixed SJ_2008 quadrature constant (iZU).
description: Reduced set of FitzHugh-Nagumo oscillators (Stefanescu & Jirsa 2008);
  3 modes coupled via mode-mixing matrices with Gaussian-quadrature coefficients recomputed
  from mu/sigma.
references:
- StefanescuJirsa2008
derived_parameters:
  e_i:
    name: e_i
    equation:
      lhs: e_i
      rhs: iV4/sigma
      latex: false
  f_i:
    name: f_i
    equation:
      lhs: f_i
      rhs: iU4/sigma
      latex: false
  IE_i:
    name: IE_i
    equation:
      lhs: IE_i
      rhs: sqrt(sigma)*(mu*iV0 + sigma*iZV)
      latex: false
  II_i:
    name: II_i
    equation:
      lhs: II_i
      rhs: sqrt(sigma)*(mu*iU0 + sigma*iZU)
      latex: false
  m_i:
    name: m_i
    equation:
      lhs: m_i
      rhs: a*sqrt(sigma)*iV0
      latex: false
  n_i:
    name: n_i
    equation:
      lhs: n_i
      rhs: a*sqrt(sigma)*iU0
      latex: false
coupling_inputs:
  c_glob0:
    name: c_glob0
    dimension: 1
    local: false
  c_glob1:
    name: c_glob1
    dimension: 1
    local: false
  local_coupling:
    name: local_coupling
    dimension: 1
    local: true
state_variables:
  xi:
    name: xi
    domain:
      enforce: none
      lo: -4.0
      hi: 4.0
      log_scale: false
    equation:
      lhs: Derivative(xi, t)
      rhs: tau*(xi - e_i*xi**3/3 - eta) + K11*(mode_dot(xi, Aik) - xi) - K12*(mode_dot(alpha,
        Bik) - xi) + tau*(IE_i + mode_sum(c_glob0) + local_coupling*xi)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  eta:
    name: eta
    domain:
      enforce: none
      lo: -3.0
      hi: 3.0
      log_scale: false
    equation:
      lhs: Derivative(eta, t)
      rhs: (xi - b*eta + m_i)/tau
      latex: false
    record: false
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  alpha:
    name: alpha
    domain:
      enforce: none
      lo: -4.0
      hi: 4.0
      log_scale: false
    equation:
      lhs: Derivative(alpha, t)
      rhs: tau*(alpha - f_i*alpha**3/3 - beta) + K21*(mode_dot(xi, Cik) - alpha) +
        tau*(II_i + mode_sum(c_glob0) + local_coupling*xi)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  beta:
    name: beta
    domain:
      enforce: none
      lo: -3.0
      hi: 3.0
      log_scale: false
    equation:
      lhs: Derivative(beta, t)
      rhs: (alpha - b*beta + n_i)/tau
      latex: false
    record: false
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
number_of_modes: 3
model_type: neural_mass
autonomous: true
cse: false
compile: false
