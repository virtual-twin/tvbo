name: Complete
description: Complete graph K_n — every node connected to every other node.
iri: tvbo:Complete
directed: false
parameters:
  n:
    name: n
    description: Number of nodes
    datatype: integer
bindings:
  julia:
    name: julia
    library: Graphs
    callable: complete_graph
    args:
    - n
  networkx:
    name: networkx
    library: networkx
    callable: complete_graph
    args:
    - n
