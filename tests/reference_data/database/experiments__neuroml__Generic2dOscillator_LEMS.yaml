id: 906
description: 'Export the full Generic2dOscillator model from the TVBO database as
  LEMS XML. This model generalises FitzHugh-Nagumo. All 13 parameters, coupling inputs,
  and 2 state variables (V, W) are exported.

  '
label: TVBO Generic2dOscillator as LEMS
dynamics:
  name: Generic2dOscillator
  iri: tvbo:Generic2dOscillator
  number_of_modes: 1
  autonomous: true
  cse: false
  compile: false
integration:
  method: euler
  abs_tol: 1.0e-10
  rel_tol: 1.0e-10
  step_size: 0.01
  time_scale: ms
  duration: 100.0
  transient_time: 0.0
  scipy_ode_base: false
  number_of_stages: 1
  delayed: true
  coupling_evaluation: per_step
network:
  graph_representation: auto
  number_of_nodes: 1
  distance_unit: mm
  time_unit: ms
