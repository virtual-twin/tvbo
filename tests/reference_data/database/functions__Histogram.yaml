name: Histogram
label: Histogram over equal-width bins
description: The number of values in each of n_bins bins of equal width from lower
  to upper, each bin closed below and open above and the last closed on both sides,
  as numpy.histogram cuts them. Every finite value is counted, whatever its dimensions,
  a value outside the range is not, and a mask restricts the count to the entries
  it marks. It returns count and center on `bin`, edge on `bin_edge`, the bins' width,
  and n, the number of values counted.
arguments:
  values:
    name: values
    description: The values to count, of any shape.
  n_bins:
    name: n_bins
    description: Number of bins, an integer of at least 1.
  lower:
    name: lower
    description: Lower edge of the first bin.
  upper:
    name: upper
    description: Upper edge of the last bin.
  where:
    name: where
    description: A mask over the entries of values; only entries where it is true
      or non-zero are counted. When both are labelled they are paired by label, in
      any order, and carry the same labels along every dimension both label; it may
      lack a dimension of values, and then marks every entry along it. Otherwise they
      are paired by position.
callable:
  name: histogram
  module: tvbo.analysis.statistics
