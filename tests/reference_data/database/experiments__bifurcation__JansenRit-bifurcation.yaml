id: 103
part: main
description: Reproduce the bifurcation diagram from Jansen & Rit (1995) Figure 3.
  The external firing rate p (representing thalamic input) is the continuation parameter.
  Two fold bifurcations and a Hopf bifurcation delimit the oscillatory regime.
label: Jansen-Rit — bifurcation in external input p
dynamics:
  name: JansenRit
  iri: tvbo:JansenRit
  number_of_modes: 1
  autonomous: true
  cse: false
  compile: false
continuations:
  eq_in_p:
    name: eq_in_p
    label: Equilibrium branch in p
    dynamics: JansenRit
    free_parameters:
    - name: p
      domain:
        enforce: none
        lo: 0
        hi: 0.5
        log_scale: false
    ds: 0.001
    ds_min: 1.0e-06
    ds_max: 0.02
    max_steps: 2000
    detect_bifurcation: 2
    algorithm: PALC
    initial_state:
      method: time_integration
      duration: 4000.0
      abs_tol: 1.0e-10
      rel_tol: 1.0e-10
    branches:
      po_alpha_rhythm:
        name: po_alpha_rhythm
        description: Alpha-rhythm periodic orbit branch from Hopf point
        source_point: hopf:all
        continuation:
          name: po_alpha_continuation
          max_steps: 200
          algorithm: PALC
        discretization:
          parameters:
            mesh_intervals:
              name: mesh_intervals
              value: 50
            degree:
              name: degree
              value: 4
          method: collocation
          mesh_intervals: 50
          degree: 4
          n_sections: 3
    bothside: true
  fold_p_C:
    name: fold_p_C
    label: Fold curve in (p, C) plane
    description: Two-parameter continuation of the fold bifurcation detected in eq_in_p.
      Traces the saddle-node boundary in the (p, C) plane.
    free_parameters:
    - name: p
      domain:
        enforce: none
        lo: 0
        hi: 0.5
        log_scale: false
    - name: C
      domain:
        enforce: none
        lo: 10
        hi: 500
        log_scale: false
    ds: 0.01
    max_steps: 500
    algorithm: PALC
    initial_state:
      method: from_branch
      duration: 2000.0
      abs_tol: 1.0e-10
      rel_tol: 1.0e-10
      source_branch: eq_in_p
      source_point: fold:1
  hopf_p_C:
    name: hopf_p_C
    label: Hopf curve in (p, C) plane
    free_parameters:
    - name: p
      domain:
        enforce: none
        lo: 0
        hi: 0.5
        log_scale: false
    - name: C
      domain:
        enforce: none
        lo: 10
        hi: 500
        log_scale: false
    ds: 0.01
    max_steps: 500
    algorithm: PALC
    initial_state:
      method: from_branch
      duration: 2000.0
      abs_tol: 1.0e-10
      rel_tol: 1.0e-10
      source_branch: eq_in_p
      source_point: hopf:1
