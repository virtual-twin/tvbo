name: TemporalAverage_tvboptim
label: Temporal Average (tvboptim windowing)
description: 'Running temporal mean over non-overlapping windows of `period`, as tvboptim''s
  TemporalAverage computes it: each complete window of `iround(period / dt)` samples,
  counted from the first, is averaged and stamped at its centre, `dt + (window_size
  - 1) dt / 2` after the window opens; a trailing partial window is dropped. Use TemporalAverage
  for TVB''s monitor.'
iri: tvbo:observation_models/temporal_average_tvboptim
period: 0.9765625
history_join: per_segment
time_stamps:
  parameters:
    window_size:
      name: window_size
      description: Integration steps per averaging window, as the pipeline averages.
      equation:
        rhs: iround(period / dt)
        latex: false
  rhs: take(t, 0) - dt + (dt + (window_size - 1) * dt / 2.0) + arange(n) * period
  latex: false
reconcile: by_label
pipeline:
- name: temporal_average_tvboptim
  equation:
    parameters:
      window_size:
        name: window_size
        description: Integration steps per averaging window, so the window tracks
          the grid the experiment declares rather than the one this file was written
          on.
        equation:
          rhs: iround(period / dt)
          latex: false
    rhs: complete_window_mean(X, window_size)
    latex: false
  output: averaged
  apply_on_dimension: time
  arguments:
    window_size:
      name: window_size
      description: Integration steps per averaging window. Its value is declared on
        the equation parameter of the same name; a backend that has not yet been migrated
        to read that still derives it here.
