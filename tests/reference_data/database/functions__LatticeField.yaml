name: LatticeField
label: Node values on their lattice
description: The values of a sheet's nodes placed at their positions on a regular,
  axis-aligned lattice, as an image whose rows run along y and columns along x, both
  ascending, so neither the order of the nodes nor that of their positions changes
  it. Positions are in mm, one row of x, y and optionally z per node as a network's
  node positions are, with the same z for every node. Coordinates closer than a millionth
  of the lattice's larger extent are one lattice line, and the lines along each axis
  are evenly spaced to the same tolerance. Positions off a regular lattice, two nodes
  on one lattice point and a lattice point without a node are refused. Labelled inputs
  are paired on the labels of the node dimension, and every other dimension of the
  values is kept with its labels. It returns field on the other dimensions followed
  by y and x, whose coordinates are the lattice lines in mm.
arguments:
  values:
    name: values
    description: One value per node, along `dim`; it may carry further dimensions,
      each element of which is placed on its own.
  positions:
    name: positions
    description: The position of each node in mm, one row of x, y and optionally z
      per node along `dim`, as a network gives its node positions; a bare array is
      in the node order of values.
  dim:
    name: dim
    description: Name of the dimension the nodes run along.
callable:
  name: lattice_field
  module: tvbo.analysis.lattice
