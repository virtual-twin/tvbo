    source_code: jnp.corrcoef(data, jnp.asarray(target))[0, 1]
  select_voi:
    name: select_voi
    description: Select the variable-of-interest slice (keepdim) from (time, vars,
      nodes).
    arguments:
      data:
        name: data
      voi:
        name: voi
        value: 0
    source_code: data[:, voi:voi + 1, :]
  temporal_average:
    name: temporal_average
    description: Downsample by mean over non-overlapping windows (tvboptim TemporalAverage).
    arguments:
      data:
        name: data
      period_samples:
        name: period_samples
        value: 1
    source_code: 'jax.vmap(lambda _i: jnp.mean(jax.lax.dynamic_slice(data, (_i,) +
      (0,) * (data.ndim - 1), (period_samples,) + data.shape[1:]), axis=0))((jnp.arange(data.shape[0])
      + 1)[::period_samples])[: jnp.arange((period_samples - 2) // 2, data.shape[0],
      period_samples).shape[0]]'
  hrf_kernel:
    name: hrf_kernel
    equation:
      parameters:
        tau_s:
          name: tau_s
          value: 0.8
        tau_f:
          name: tau_f
          value: 0.4
      rhs: (1/3)*exp(-0.5*(t/1000)/tau_s)*sin(sqrt(1/tau_f - 1/(4*tau_s**2))*(t/1000))/sqrt(1/tau_f
        - 1/(4*tau_s**2))
      latex: false
    description: Hemodynamic response kernel (First-Order Volterra), 1 ms resolution.
    arguments:
      duration:
        name: duration
        value: 20000.0
    time_range:
      enforce: none
      lo: 0
      hi: duration
      n: 20000
      log_scale: false
  prepend_history:
    name: prepend_history
    description: Fit downsampled transient to one kernel length and prepend (valid
      conv).
    arguments:
      data:
        name: data
      history:
        name: history
      kernel_samples:
        name: kernel_samples
        value: 20000
    source_code: jnp.concatenate([(jnp.vstack([jnp.zeros((kernel_samples - history.shape[0],)
      + history.shape[1:], history.dtype), history]) if history.shape[0] < kernel_samples
      else history[-kernel_samples:]), data], axis=0)
  volterra_transform:
    name: volterra_transform
    equation:
      parameters:
        k_1:
          name: k_1
          value: 5.6
        V_0:
          name: V_0
          value: 0.02
      rhs: k_1 * V_0 * (data - 1.0)
      latex: false
    description: Volterra nonlinear BOLD transformation.
    arguments:
      data:
        name: data
  subsample_bold:
    name: subsample_bold
    description: Sample convolved signal at each BOLD TR (step = round(TR/downsample_period)).
    arguments:
      data:
        name: data
      step:
        name: step
        value: 1000
    source_code: data[step::step]
  fc_corr_fn:
    name: fc_corr_fn
    description: Upper-triangle Pearson correlation between two FC matrices.
    callable:
      name: fc_corr
      module: tvboptim.observations.observation
  one_minus_fc_fn:
    name: one_minus_fc_fn
    description: 1 - FC correlation (lower-is-better FC objective; fc_corr = upper-tri
      corrcoef).
    arguments:
      fc:
        name: fc
      empirical_fc:
        name: empirical_fc
    source_code: 1.0 - jnp.corrcoef(fc.flatten(), empirical_fc.flatten())[0, 1]
  combined_loss_fn:
    name: combined_loss_fn
    description: 'Competing-objective loss: -rho_FC - rho_freq-grad (lower is better).'
    arguments:
      fc_corr_val:
        name: fc_corr_val
      freq_grad_corr:
        name: freq_grad_corr
    source_code: -fc_corr_val - freq_grad_corr
optimizations:
  refine:
    name: refine
    label: Parallel gradient refinement from every Pareto seed
    free_parameters:
    - parameter: LinCoupling.G
      heterogeneous: false
    - parameter: SupHopf.a
      heterogeneous: true
      shape: (n_nodes,)
    - parameter: SupHopf.omega
      heterogeneous: true
      shape: (n_nodes,)
      domain:
        enforce: none
        lo: 0.0
        hi: .inf
        log_scale: false
    algorithm: adam
    learning_rate: 0.001
    max_iterations: 200
    loss:
      function: combined_loss_fn
      arguments:
        fc_corr_val:
          name: fc_corr_val
          value: observations.fc_corr_val.data
        freq_grad_corr:
          name: freq_grad_corr
          value: observations.freq_grad_corr.data
    depends_on: ga_presearch
explorations:
  ga_presearch:
    name: ga_presearch
    label: NSGA-II pre-search over (G, a, log10 sigma)
    space:
      LinCoupling.G:
        parameter: LinCoupling.G
        domain:
          enforce: none
          lo: 0.001
          hi: 0.15
          log_scale: false
        transform: none
      SupHopf.a:
        parameter: SupHopf.a
        domain:
          enforce: none
          lo: -0.1
          hi: 0.01
          log_scale: false
        transform: none
      noise.sigma:
        parameter: noise.sigma
        domain:
          enforce: none
          lo: -2.0
          hi: -0.5
          log_scale: false
        transform: log10
    parameters:
      population_size:
        name: population_size
        value: 8
      num_generations:
        name: num_generations
        value: 40
      seed:
        name: seed
        value: 42
      reference_point:
        name: reference_point
        value:
        - 13.5
        - 1.5
    mode: product
    strategy: nsga2
    objectives:
    - psd_mae
    - one_minus_fc
    n_parallel: '8'
    n_trials: 1
    sweep_seeding: independent
    sweep_direction: up
execution:
  n_workers: 2
  n_threads: -1
  precision: float64
  accelerator: auto
  random_seed: 0
  find_fixpoint: false
