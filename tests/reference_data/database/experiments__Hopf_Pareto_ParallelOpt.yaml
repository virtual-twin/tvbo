  derived_variables:
    r_squared:
      name: r_squared
      equation:
        rhs: x**2 + y**2
        latex: false
      record: false
      conditional: false
    amplitude_term:
      name: amplitude_term
      equation:
        rhs: a - r_squared
        latex: false
      record: false
      conditional: false
  coupling_inputs:
    LinCoupling:
      name: LinCoupling
      dimension: 1
      local: false
  state_variables:
    x:
      name: x
      equation:
        rhs: amplitude_term*x - omega*y + LinCoupling
        latex: false
      record: true
      variable_of_interest: true
      coupling_variable: true
      equation_type: differential
      equation_order: 1
      noise:
        parameters:
          sigma:
            name: sigma
            value: 0.01
        noise_type: gaussian
        gaussian: false
        additive: true
        seed: 42
      initial_value: 0.1
    y:
      name: y
      equation:
        rhs: amplitude_term*y + omega*x
        latex: false
      record: true
      variable_of_interest: true
      coupling_variable: false
      equation_type: differential
      equation_order: 1
      noise:
        parameters:
          sigma:
            name: sigma
            value: 0.01
        noise_type: gaussian
        gaussian: false
        additive: true
        seed: 42
      initial_value: 0.0
  number_of_modes: 1
  autonomous: true
  cse: false
  compile: false
integration:
  method: Heun
  abs_tol: 1.0e-10
  rel_tol: 1.0e-10
  step_size: 1.0
  time_scale: ms
  duration: 60000.0
  transient_time: 60000.0
  scipy_ode_base: false
  number_of_stages: 1
  delayed: true
  coupling_evaluation: per_step
network:
  label: Desikan-Killiany (dk_average)
  coupling:
    LinCoupling:
      name: LinCoupling
      parameters:
        G:
          name: G
          value: 0.025
      sparse: false
      pre_expression:
        rhs: local_states
        latex: false
      post_expression:
        rhs: G * gx
        latex: false
      local_states:
      - x
      delayed: false
      interpolate_delays: false
      vectorized: false
      symmetry: directed
  graph_representation: auto
  transforms:
  - name: weight
    callable:
      name: normalized_graph_laplacian
      module: tvbo.classes.network
  bids_dir: ../networks/bids/dk_average
  structural_measures:
  - streamlineCount
  - tractLength
  observational_measures:
  - BoldCorrelation
  distance_unit: mm
  time_unit: ms
observations:
  psd:
    name: psd
    label: Welch PSD (per node)
    time_scale: ms
    source:
    - x
    reconcile: by_label
    pipeline:
    - function: welch_psd
      output: psd
      arguments:
        data:
          name: data
          value: integration.result
  fitted_peaks:
    name: fitted_peaks
    label: Soft-argmax peak frequency (per node)
    time_scale: ms
    source:
    - x
    reconcile: by_label
    pipeline:
    - function: welch_psd
      output: psd_step
      arguments:
        data:
          name: data
          value: integration.result
    - function: soft_peak_freqs
      output: fitted_peaks
      arguments:
        data:
          name: data
          value: psd_step
  empirical_fc:
    name: empirical_fc
    label: Empirical FC (dk_average BOLD correlation)
    time_scale: ms
    source:
    - network.observations.BoldCorrelation
    reconcile: by_label
  bold:
    name: bold
    label: Simulated BOLD (x, First-Order Volterra HRF)
    time_scale: ms
    source:
    - x
    period: 1000.0
    reconcile: by_label
    pipeline:
    - function: hrf_kernel
    - function: select_voi
      output: _voi_data
      arguments:
        data:
          name: data
          value: integration.result
        voi:
          name: voi
          value: 0
    - function: select_voi
      output: _voi_hist
      arguments:
        data:
          name: data
          value: integration.transient
        voi:
          name: voi
          value: 0
    - function: temporal_average
      output: downsampled_data
      arguments:
        data:
          name: data
          value: _voi_data
        period_samples:
          name: period_samples
          value: 1
    - function: temporal_average
      output: downsampled_history
      arguments:
        data:
          name: data
          value: _voi_hist
        period_samples:
          name: period_samples
          value: 1
    - function: prepend_history
      arguments:
        data:
          name: data
          value: downsampled_data
        history:
          name: history
          value: downsampled_history
        kernel_samples:
          name: kernel_samples
          value: 20000
    - callable:
        name: fftconvolve
        module: jax.scipy.signal
      output: bold_convolve
      apply_on_dimension: node
      arguments:
        in1:
          name: in1
          value: prepend_history
        in2:
          name: in2
          value: hrf_kernel
        mode:
          name: mode
          value: valid
    - function: volterra_transform
      arguments:
        data:
          name: data
          value: bold_convolve
    - function: subsample_bold
      arguments:
        data:
          name: data
          value: volterra_transform
        step:
          name: step
          value: 1000
  fc:
    name: fc
    label: Simulated FC
    time_scale: ms
    source:
    - bold
    reconcile: by_label
    pipeline:
    - callable:
        name: compute_fc
        module: tvboptim.observations.observation
      arguments:
        timeseries:
          name: timeseries
          value: bold
        skip_t:
          name: skip_t
          value: 20
  fc_corr_val:
    name: fc_corr_val
    label: FC correlation (simulated vs empirical)
    time_scale: ms
    source:
    - fc
    reconcile: by_label
    pipeline:
    - callable:
        name: fc_corr
        module: tvboptim.observations.observation
      output: fc_corr_val
      arguments:
        fc1:
          name: fc1
          value: fc
        fc2:
          name: fc2
          value: empirical_fc
  one_minus_fc:
    name: one_minus_fc
    label: 1 - FC correlation (GA objective, lower is better)
    time_scale: ms
    source:
    - fc
    reconcile: by_label
    pipeline:
    - function: one_minus_fc_fn
      output: one_minus_fc
      arguments:
        fc:
          name: fc
          value: fc
        empirical_fc:
          name: empirical_fc
          value: empirical_fc
  psd_mae:
    name: psd_mae
    label: PSD MAE to uniform 9 Hz
    time_scale: ms
    source:
    - x
    reconcile: by_label
    pipeline:
    - function: welch_psd
      output: _psd
      arguments:
        data:
          name: data
          value: integration.result
    - function: soft_peak_freqs
      output: _peaks
      arguments:
        data:
          name: data
          value: _psd
    - function: psd_mae_fn
      output: psd_mae
      arguments:
        data:
          name: data
          value: _peaks
  freq_grad_corr:
    name: freq_grad_corr
    label: Correlation of fitted peaks to target frequency gradient
    time_scale: ms
    source:
    - x
    reconcile: by_label
    pipeline:
    - function: welch_psd
      output: _psd
      arguments:
        data:
          name: data
          value: integration.result
    - function: soft_peak_freqs
      output: _peaks
      arguments:
        data:
          name: data
          value: _psd
    - function: freq_grad_corr_fn
      output: freq_grad_corr
      arguments:
        data:
          name: data
          value: _peaks
functions:
  welch_psd:
    name: welch_psd
    description: Per-node Welch PSD of the subsampled x trajectory (returns Pxx only).
    arguments:
      data:
        name: data
        description: Raw trajectory (time, states, nodes).
      subsample:
        name: subsample
        value: 10
      fs_obs:
        name: fs_obs
        value: 100.0
    source_code: jax.scipy.signal.welch(data[::subsample, 0, :].T, fs=fs_obs, nperseg=512,
      nfft=2048)[1]
  soft_peak_freqs:
    name: soft_peak_freqs
    description: Soft-argmax peak frequency per node over the Welch PSD (transient=3,
      beta=150).
    arguments:
      data:
        name: data
        description: Per-node Welch PSD (nodes, freqs).
      transient:
        name: transient
        value: 3
      beta:
        name: beta
        value: 150.0
      fs_obs:
        name: fs_obs
        value: 100.0
    source_code: jnp.sum(jax.nn.softmax(beta * (data[:, transient:] / (jnp.max(data[:,
      transient:], axis=1, keepdims=True) + 1e-12)), axis=1) * jnp.linspace(0.0, fs_obs
      / 2.0, data.shape[1])[transient:][None, :], axis=1)
  psd_mae_fn:
    name: psd_mae_fn
    description: Mean absolute error of per-node peak frequencies to a uniform 9 Hz
      target.
    arguments:
      data:
        name: data
      target:
        name: target
        value: 9.0
    source_code: jnp.mean(jnp.abs(data - target))
  freq_grad_corr_fn:
    name: freq_grad_corr_fn
    description: Pearson correlation of fitted peak frequencies to the spatial target
      gradient.
    arguments:
      data:
        name: data
      target:
        name: target
