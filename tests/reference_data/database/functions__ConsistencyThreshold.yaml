name: ConsistencyThreshold
label: Group connectome by consistency-based thresholding
description: The mean of each region pair's weight over a cohort's subjects, kept
  for the share density of all region pairs whose weights vary least across subjects
  (Roberts et al. 2017, doi:10.1016/j.neuroimage.2016.09.053). A pair's variation
  is its coefficient of variation across subjects, the sample standard deviation over
  the mean, and only pairs with a nonzero mean compete; the least varying pairs of
  the upper triangle are kept and mirrored, so the kept entries are density of all
  region pairs. A subject without a connection counts as zero. Lengths, when given,
  are averaged the same way and kept on the same pairs. It returns weight, and length
  when lengths are given, on the two node axes.
arguments:
  weight:
    name: weight
    description: One symmetric connectome per subject, stacked on a `subject` axis
      beside two node axes, as a cohort read returns them.
  density:
    name: density
    description: The share of all region pairs kept, in (0, 1]; Koller et al. (2024)
      kept 0.15.
  length:
    name: length
    description: 'Optional: the subjects'' mean streamline lengths, stacked like weight
      and paired with it by subject and node labels.'
callable:
  name: consistency_threshold
  module: tvbo.analysis.connectome
