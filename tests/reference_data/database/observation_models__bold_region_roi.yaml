name: BOLD_RegionROI
label: BOLD (Region ROI)
description: BOLD fMRI observation model that computes the hemodynamic response at
  each source location and spatially averages within brain regions using a parcellation
  mapping. Produces per-region BOLD signals suitable for comparison with parcellated
  empirical data.
parameters:
  hrf_length:
    name: hrf_length
    value: 20000.0
    unit: ms
period: 2000.0
imaging_modality: BOLD
reconcile: by_label
pipeline:
- equation:
    rhs: window_mean(X, window)
    latex: false
  name: temporal_average_interim
  output: interim_averaged
  apply_on_dimension: time
  arguments:
    window:
      name: window
      description: Interim averaging window in integration steps. Resolved from the
        integration dt (= stock_dt / dt), not a raw-grid literal.
- acronym: HRF
  equation:
    parameters:
      tau_s:
        name: tau_s
        value: 0.8
        unit: s
      tau_f:
        name: tau_f
        value: 0.4
        unit: s
    rhs: 1/3 * exp(-0.5*(t / tau_s)) * sin(sqrt(1/tau_f - 1/(4*tau_s**2)) * t) / sqrt(1/tau_f
      - 1/(4*tau_s**2))
    latex: false
  name: hemodynamic_response
  output: hrf_kernel
  arguments:
    duration:
      name: duration
      value: 20
      unit: s
    stock_dt:
      name: stock_dt
      value: 0.004
      unit: s
  time_range:
    enforce: none
    lo: 0
    hi: duration
    step: stock_dt
    log_scale: false
- name: convolve
  callable:
    name: fftconvolve
    module: scipy.signal
  input: temporal_average_interim
  output: convolved
  arguments:
    in2:
      name: in2
      value: hrf_kernel
    mode:
      name: mode
      value: same
- equation:
    rhs: subsample(X, start, step)
    latex: false
  name: subsample_to_period
  input: convolve
  output: subsampled
  apply_on_dimension: time
  arguments:
    start:
      name: start
      description: Index of first output sample (resolved to step - 1) so the first
        sample aligns with TVB's step % istep == 0 emission.
    step:
      name: step
      description: Interim samples per output sample. Resolved from the integration
        dt (= (period / dt) / interim_istep), not a raw-grid literal.
- equation:
    parameters:
      k_1:
        name: k_1
        value: 5.6
      V_0:
        name: V_0
        value: 0.02
    rhs: (X - 1.0) * k_1 * V_0
    latex: false
  name: volterra_transform
  input: subsample_to_period
  output: bold_source
- equation:
    rhs: spatial_mean @ X
    latex: false
  description: Spatially average the source-level BOLD within each brain region using
    the parcellation mapping.
  name: region_average
  input: volterra_transform
  output: Bold
  apply_on_dimension: node
  arguments:
    spatial_mean:
      name: spatial_mean
      description: Region averaging matrix (n_regions, n_sources)
class_reference:
  name: BoldRegionROI
  module: tvb.simulator.monitors
  constructor_args:
  - name: hrf_kernel
    value: FirstOrderVolterra
  - name: hrf_length
    value: 20000.0
