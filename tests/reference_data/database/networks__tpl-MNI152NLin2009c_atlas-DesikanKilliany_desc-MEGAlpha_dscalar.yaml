label: Desikan-Killiany 68 cortical parcels with MEG alpha amplitudes per region
description: "Per-region MEG alpha-band amplitude values aligned with the 68 cortical\
  \ parcels\nof the Desikan-Killiany atlas. Sourced from\ntvb-ontology-optim-workshop/notebooks/data/{lh,rh}_megalpha_parc.csv.\n\
  \nThe measure exhibits the canonical cortical-hierarchy gradient:\n  - unimodal\
  \ sensory regions (pericalcarine, cuneus, lateraloccipital,\n    transversetemporal)\
  \ score high  (~0.40)\n  - transmodal regions       (rostralanteriorcingulate, frontalpole,\n\
  \    temporalpole, medialorbitofrontal) score low (~0.15)\n\nUsed as a per-region\
  \ cortical-gradient signal in experiments that need\nto ground a hierarchy (e.g.\
  \ reservoir-computing frequency-gradient\ntargets, JR-MEG peak-frequency optimisation).\
  \ The values are\ndimensionless normalised amplitudes; downstream consumers rescale\n\
  to a task-appropriate range (e.g. omega in Hz).\n"
time_unit: ms
