method: Heun
abs_tol: 1.0e-10
rel_tol: 1.0e-10
step_size: 0.01220703125
duration: 1000.0
transient_time: 0.0
scipy_ode_base: false
number_of_stages: 1
intermediate_expressions:
  X1:
    name: X1
    equation:
      lhs: X1
      rhs: X + dX0 * dt + noise + stimulus * dt
      latex: false
    record: false
update_expression:
  name: dX
  equation:
    lhs: X_{t+1}
    rhs: (dX0 + dX1) * (dt / 2)
    latex: false
  record: false
delayed: true
coupling_evaluation: per_step
