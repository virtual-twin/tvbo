name: vbi
description: Virtual Brain Inference. Probabilistic inference toolkit for whole-brain
  models — multi-backend simulators (Numba, C++, CuPy, JAX, PyTorch, TVB kernels),
  a 40+ time-series feature library (statistical, spectral, FC/FCD, complexity, event-detection),
  and two parallel inference paths (SBI via sbi-toolkit SNPE/SNLE/SNRE with MAF/NSF,
  and a built-in autograd-based CDE with MDN/MAF estimators). Targets the inverse
  problem of mapping observed neuroimaging (EEG/MEG/fMRI) onto brain-model parameters.
