name: BOLD_MixtureOfGammas
label: BOLD (Mixture of Gammas HRF)
description: BOLD fMRI observation model using the canonical double-gamma hemodynamic
  response function (Glover 1999). Standard HRF used in most fMRI analysis packages
  (SPM, FSL, AFNI).
parameters:
  TR:
    name: TR
    value: 2000.0
    unit: ms
time_scale: ms
imaging_modality: BOLD
reconcile: by_label
pipeline:
- equation:
    rhs: window_mean(X, stepsize)
    latex: false
  name: temporal_average_interim
  output: interim_averaged
  apply_on_dimension: time
  arguments:
    stepsize:
      name: stepsize
      description: Interim averaging window in integration steps. Resolved from the
        integration dt (= stock_dt / dt), not a raw-grid literal.
- acronym: HRF
  equation:
    parameters:
      a1:
        name: a1
        value: 6.0
      b1:
        name: b1
        value: 1.0
      d1:
        name: d1
        value: 6.0
      c:
        name: c
        value: 0.35
        description: Ratio of undershoot to positive response
      a2:
        name: a2
        value: 1.0
      b2:
        name: b2
        value: 1.0
      d2:
        name: d2
        value: 16.0
    rhs: a1 * t**(d1 - 1) * exp(-b1 * t) / gamma(d1) - c * a2 * t**(d2 - 1) * exp(-b2
      * t) / gamma(d2)
    latex: false
  name: hemodynamic_response
  output: hrf_kernel
  arguments:
    duration:
      name: duration
      value: 20
      unit: s
    stock_dt:
      name: stock_dt
      value: 0.004
      unit: s
  time_range:
    enforce: none
    lo: 0
    hi: duration
    step: stock_dt
    log_scale: false
- name: convolve
  callable:
    name: fftconvolve
    module: scipy.signal
  input: temporal_average_interim
  output: convolved
  arguments:
    in2:
      name: in2
      value: hrf_kernel
    mode:
      name: mode
      value: same
- equation:
    rhs: subsample(X, start, stepsize)
    latex: false
  name: subsample_to_period
  input: convolve
  output: Bold
  apply_on_dimension: time
  arguments:
    start:
      name: start
      description: Index of first output sample (resolved to stepsize - 1) so the
        first sample aligns with TVB's step % istep == 0 emission.
    stepsize:
      name: stepsize
      description: Interim samples per output sample. Resolved from the integration
        dt (= (TR / dt) / interim_istep), not a raw-grid literal.
class_reference:
  name: Bold
  module: tvb.simulator.monitors
  constructor_args:
  - name: hrf_kernel
    value: MixtureOfGammas
  - name: hrf_length
    value: 20000.0
