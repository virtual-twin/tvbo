name: BOLD_MixtureOfGammas
label: BOLD (Mixture of Gammas HRF)
description: BOLD fMRI observation model using the canonical double-gamma hemodynamic
  response function (Glover 1999). Standard HRF used in most fMRI analysis packages
  (SPM, FSL, AFNI).
parameters:
  TR:
    name: TR
    value: 2000.0
    unit: ms
history_join: per_segment
imaging_modality: BOLD
reconcile: by_label
pipeline:
- name: temporal_average_interim
  equation:
    rhs: window_mean(X, stepsize)
    latex: false
  output: interim_averaged
  apply_on_dimension: time
  arguments:
    stepsize:
      name: stepsize
      description: Interim averaging window in integration steps. Resolved from the
        integration dt (= stock_dt / dt), not a raw-grid literal.
- name: hemodynamic_response
  acronym: HRF
  equation:
    parameters:
      a_1:
        name: a_1
        value: 6.0
        description: Shape of the response
      a_2:
        name: a_2
        value: 13.0
        description: Shape of the undershoot
      l:
        name: l
        value: 1.0
        description: Rate
        unit: per_s
      c:
        name: c
        value: 0.4
        description: Undershoot ratio
    rhs: (l * t) ** (a_1 - 1) * exp(-l * t) / gamma(a_1) - c * (l * t) ** (a_2 - 1)
      * exp(-l * t) / gamma(a_2)
    latex: false
  output: hrf_kernel
  arguments:
    duration:
      name: duration
      value: 20
      unit: s
    stock_dt:
      name: stock_dt
      value: 0.004
      unit: s
  time_range:
    enforce: none
    lo: 0
    hi: duration
    step: stock_dt
    log_scale: false
- name: convolve
  callable:
    name: fftconvolve
    module: scipy.signal
  input: temporal_average_interim
  output: convolved
  arguments:
    in2:
      name: in2
      value: hrf_kernel
    mode:
      name: mode
      value: same
- name: subsample_to_period
  equation:
    rhs: subsample(X, start, stepsize)
    latex: false
  input: convolve
  output: Bold
  apply_on_dimension: time
  arguments:
    start:
      name: start
      description: Index of first output sample (resolved to stepsize - 1) so the
        first sample aligns with TVB's step % istep == 0 emission.
    stepsize:
      name: stepsize
      description: Interim samples per output sample. Resolved from the integration
        dt (= (TR / dt) / interim_istep), not a raw-grid literal.
class_reference:
  name: Bold
  module: tvb.simulator.monitors
  constructor_args:
  - name: hrf_kernel
    value: MixtureOfGammas
  - name: hrf_length
    value: 20000.0
