name: LotkaVolterraPredPrey
parameters:
  alpha:
    name: alpha
    value: 1.5
    description: Prey intrinsic growth rate α.
  beta:
    name: beta
    value: 1.0
    description: Predation interaction coefficient β.
  delta:
    name: delta
    value: 1.0
    description: Predator growth efficiency δ.
  gamma:
    name: gamma
    value: 3.0
    description: Predator mortality rate γ.
description: 'The famous Lotka-Volterra model is a simple ecological model describing
  the interaction

  between a predator and a prey species (or also parasite and host species). It has
  been

  used independently in epidemics, ecology, and economics. The prey (x) grows

  exponentially in absence of predators; predation converts prey into predator growth;

  predator (y) declines without prey. Default parameters produce sustained oscillations.'
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/continuous_famous_systems.jl
references:
- Hoppensteadt2006
state_variables:
  x:
    name: x
    description: Prey population size.
    equation:
      lhs: Derivative(x, t)
      rhs: alpha*x - beta*x*y
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 10.0
  y:
    name: y
    description: Predator population size.
    equation:
      lhs: Derivative(y, t)
      rhs: delta*x*y - gamma*y
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 5.0
number_of_modes: 1
model_type: generic
autonomous: true
cse: false
compile: false
