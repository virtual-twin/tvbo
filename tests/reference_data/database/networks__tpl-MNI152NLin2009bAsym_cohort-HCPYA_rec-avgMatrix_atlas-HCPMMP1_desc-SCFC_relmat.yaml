label: HCPMMP1 (avgMatrix SC+FC)
description: Group-average HCP connectome on the Glasser HCP-MMP1 atlas (360 cortical
  + 19 subcortical = 379 nodes). SC = average structural connectivity (streamline
  weights); FC = HCP1200 average resting-state functional connectivity. Node order
  is canonical L-cortical, R-cortical, L-subcortical, R-subcortical, Brainstem (identical
  to the rec-dTOR HCPMMP1 network). Node coordinates are fsLR den-32k midthickness
  parcel centroids (templateflow) for cortex and MNI152 2mm voxel centroids (Glasser
  dlabel Atlas_ROIs) for subcortex. Per-node HCP-MMP colours stored as the 'color'
  parameter.
parameters:
  conduction_speed:
    name: conduction_speed
    label: v
    value: 3.0
    unit: mm_per_ms
