name: TowelMap
parameters:
  b:
    name: b
    value: 0.2
    description: Coupling coefficient b in z-update.
description: 'Folded-towel hyperchaotic map with two positive Lyapunov exponents,
  introduced by

  Rössler. Named for the towel-like appearance of its attractor projections.'
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/discrete_famous_systems.jl
references:
- Roessler1979
state_variables:
  x:
    name: x
    equation:
      lhs: x_next
      rhs: 3.8*x*(1 - x) - 0.05*(y + 0.35)*(1 - 2*z)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.085
  y:
    name: y
    equation:
      lhs: y_next
      rhs: 0.1*((y + 0.35)*(1 - 2*z) - 1)*(1 - 1.9*x)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: -0.121
  z:
    name: z
    equation:
      lhs: z_next
      rhs: 3.78*z*(1 - z) + b*y
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.075
number_of_modes: 1
model_type: generic
system_type: discrete
autonomous: true
cse: false
compile: false
