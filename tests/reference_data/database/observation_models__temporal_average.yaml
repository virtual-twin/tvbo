name: TemporalAverage
label: Temporal Average
description: Running temporal mean over a sliding window of configurable length. Returns
  one averaged sample per period.
time_scale: ms
period: 0.9765625
reconcile: by_label
pipeline:
- equation:
    rhs: window_mean(X, window_size)
    latex: false
  name: temporal_average
  output: averaged
  apply_on_dimension: time
  arguments:
    window_size:
      name: window_size
      description: Number of integration steps per averaging window = period / dt
class_reference:
  name: TemporalAverage
  module: tvb.simulator.monitors
