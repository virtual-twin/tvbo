name: NonnegativeFactorizationCrossValidation
label: Held-out error of nonnegative matrix factorizations over a range of ranks
description: The rank of a nonnegative factorization chosen by how well it imputes
  entries held out of the fit, as RcppML's crossValidate computes it (DeBruine et
  al. 2021, doi:10.1101/2021.09.01.458620; version 0.5.6). In each of reps repetitions
  a share held_out of the entries of the data matrix, each subject's weights on the
  region pairs a mask keeps as NonnegativeFactorization builds it, is drawn uniformly
  without replacement and left out of the fit; each rank is fitted to the rest from
  one random start, the same in every repetition, and the root mean squared error
  of its prediction of the held-out entries is recorded. Koller et al. (2024, doi:10.1038/s41467-024-47860-x)
  ran 100 repetitions over ranks 2 to 10 and took the rank with the least mean error.
  It returns rmse on repetition and rank.
arguments:
  weight:
    name: weight
    description: One symmetric connectome per subject, stacked on a `subject` axis
      beside two node axes and labelled on all three, as a cohort read returns them;
      every weight on a kept pair is finite and nonnegative.
  mask:
    name: mask
    description: A symmetric connectome on the same two node axes and labels, whose
      nonzero pairs off the diagonal are factorized, each pair once.
  ranks:
    name: ranks
    description: The ranks compared, whole numbers of at least 1, each once and in
      any order.
  seed:
    name: seed
    description: A whole number of at least 0 that fixes the held-out entries and
      the start.
  reps:
    name: reps
    description: The number of repetitions, each with its own held-out entries, a
      whole number of at least 1; RcppML's default. Koller et al. (2024) used 100.
    value: 3
  held_out:
    name: held_out
    description: The share of all entries held out in each repetition, in (0, 1);
      RcppML's default.
    value: 0.05
  tol:
    name: tol
    description: The updates of a fit stop once one minus the Pearson correlation
      of w with its value an iteration earlier is below this, RcppML's default.
    value: 0.0001
  max_iter:
    name: max_iter
    description: The most alternating updates a fit runs, RcppML's default.
    value: 100
callable:
  name: nonnegative_factorization_cross_validation
  module: tvbo.analysis.connectome
