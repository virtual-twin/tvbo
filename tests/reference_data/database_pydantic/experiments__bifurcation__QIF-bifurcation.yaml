id: 104
part: main
description: Quadratic integrate-and-fire population model. Continuation of equilibria
  in the mean neural excitability η̄, reproducing the fold bifurcation diagram from
  Montbrió et al. (2015).
label: QIF neural mass — bifurcation in η̄
dynamics:
  name: QIF
  parameters:
    tau:
      name: tau
      value: 1.0
    eta_bar:
      name: eta_bar
      value: -5.0
    Delta:
      name: Delta
      value: 1.0
    J:
      name: J
      value: 15.0
  state_variables:
    r:
      name: r
      equation:
        rhs: (Delta/(pi*tau) + 2*r*v) / tau
        latex: false
      record: true
      variable_of_interest: true
      coupling_variable: false
      equation_type: differential
      equation_order: 1
      initial_value: 0.01
    v:
      name: v
      equation:
        rhs: (v**2 + eta_bar + J*r*tau - (pi*r*tau)**2) / tau
        latex: false
      record: true
      variable_of_interest: true
      coupling_variable: false
      equation_type: differential
      equation_order: 1
      initial_value: -2.0
  number_of_modes: 1
  system_type: continuous
  autonomous: true
  cse: false
  compile: false
continuations:
  eq_eta:
    name: eq_eta
    label: Equilibrium branch in η̄
    dynamics: QIF
    free_parameters:
    - name: eta_bar
      domain:
        enforce: none
        lo: -20
        hi: 20
        log_scale: false
    ds: 0.0001
    ds_min: 1.0e-08
    ds_max: 0.05
    max_steps: 2000
    detect_bifurcation: 2
    detect_fold: true
    algorithm: PALC
    initial_state:
      method: time_integration
      duration: 4000.0
      abs_tol: 1.0e-10
      rel_tol: 1.0e-10
    bothside: true
