name: GastSchmidtKnosche_SF
iri: tvbo:GastSchmidtKnosche_SF
parameters:
  Delta:
    name: Delta
    definition: Half-width of heterogeneous noise distribution
    value: 2.0
    domain:
      enforce: none
      lo: 0.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: Half-width of heterogeneous noise distribution
  I:
    name: I
    definition: External homogeneous current
    value: 0.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: External homogeneous current
  J:
    name: J
    definition: Synaptic weight
    value: 21.2132
    domain:
      enforce: none
      lo: -25.0
      hi: 25.0
      step: 0.01
      log_scale: false
    description: Synaptic weight
    grounding:
    - GO:0099536
  alpha:
    name: alpha
    definition: adaptation rate
    value: 10.0
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
      step: 0.1
      log_scale: false
    description: adaptation rate
    grounding:
    - GO:0042391
  cr:
    name: cr
    definition: It is the weight on Coupling through variable r.
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
      step: 0.1
      log_scale: false
    description: It is the weight on Coupling through variable r
  cv:
    name: cv
    definition: It is the weight on Coupling through variable V.
    value: 0.0
    domain:
      enforce: none
      lo: 0.0
      hi: 1.0
      step: 0.1
      log_scale: false
    description: It is the weight on Coupling through variable V
  eta:
    name: eta
    definition: Mean of heterogeneous noise distribution
    value: 1.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.0001
      log_scale: false
    description: Mean of heterogeneous noise distribution
  tau_A:
    name: tau_A
    definition: Adaptation time scale
    value: 10.0
    domain:
      enforce: none
      lo: 0.0
      hi: 15.0
      step: 0.01
      log_scale: false
    description: Adaptation time scale
  tau:
    name: tau
    definition: Characteristic time
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 15.0
      step: 0.01
      log_scale: false
    description: Characteristic time
description: ''
references:
- Gast2020
coupling_inputs:
  c_glob0:
    name: c_glob0
    dimension: 1
    local: false
  c_glob1:
    name: c_glob1
    dimension: 1
    local: false
state_variables:
  A:
    name: A
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(A, t)
      rhs: B/tau_A
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  B:
    name: B
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(B, t)
      rhs: (-A - 2*B + alpha*r)/tau_A
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  V:
    name: V
    domain:
      enforce: none
      lo: -2.0
      hi: 1.5
      log_scale: false
    equation:
      lhs: Derivative(V, t)
      rhs: (-A + I + J*r*tau + V**2 + c_glob0*cr + c_glob1*cv + eta - pi**2*r**2*tau**2)/tau
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  r:
    name: r
    domain:
      enforce: clamp
      lo: 0.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(r, t)
      rhs: (Delta/(pi*tau) + 2*V*r)/tau
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: 0.0
        hi: 2.0
        log_scale: false
      axis: space
number_of_modes: 1
model_type: neural_mass
system_type: continuous
autonomous: true
cse: false
compile: false
