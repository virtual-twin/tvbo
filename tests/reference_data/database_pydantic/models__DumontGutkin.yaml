name: DumontGutkin
iri: tvbo:DumontGutkin
parameters:
  Delta_e:
    name: Delta_e
    definition: Half-width of heterogeneous noise distribution over excitatory population
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: Half-width of heterogeneous noise distribution over excitatory population
    grounding:
    - GO:0060079
    - GO:0098815
  Delta_i:
    name: Delta_i
    definition: Half-width of heterogeneous noise distribution over inhibitory population
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: Half-width of heterogeneous noise distribution over inhibitory population
    grounding:
    - GO:0032228
    - GO:0060080
    - GO:0098828
  Gamma:
    name: Gamma
    definition: Ratio of excitatory VS inhibitory global couplings G_ie/G_ee .
    value: 5.0
    domain:
      enforce: none
      lo: 0.0
      hi: 10.0
      step: 0.1
      log_scale: false
    description: 'Ratio of excitatory VS inhibitory global couplings G_ie/G_ee '
    grounding:
    - GO:0060079
    - GO:0060080
  I_e:
    name: I_e
    definition: External homogeneous current on excitatory population
    value: 0.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: External homogeneous current on excitatory population
    grounding:
    - GO:0060079
  I_i:
    name: I_i
    definition: External current on inhibitory population
    value: 0.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.01
      log_scale: false
    description: External current on inhibitory population
    grounding:
    - GO:0060080
    - GO:0098828
  J_ee:
    name: J_ee
    definition: Synaptic weight e-->e
    value: 0.0
    domain:
      enforce: none
      lo: -25.0
      hi: 25.0
      step: 0.0001
      log_scale: false
    description: Synaptic weight e-->e
    grounding:
    - GO:0060076
    - GO:0097060
    - GO:0099536
  J_ei:
    name: J_ei
    definition: Synaptic weight i-->e
    value: 10.0
    domain:
      enforce: none
      lo: -25.0
      hi: 25.0
      step: 0.0001
      log_scale: false
    description: Synaptic weight i-->e
    grounding:
    - GO:0042391
    - GO:0097060
  J_ie:
    name: J_ie
    definition: Synaptic weight e-->i
    value: 0.0
    domain:
      enforce: none
      lo: -25.0
      hi: 25.0
      step: 0.0001
      log_scale: false
    description: Synaptic weight e-->i
    grounding:
    - GO:0097060
    - GO:0099536
  J_ii:
    name: J_ii
    definition: Synaptic weight i-->i
    value: 15.0
    domain:
      enforce: none
      lo: -25.0
      hi: 25.0
      step: 0.0001
      log_scale: false
    description: Synaptic weight i-->i
    grounding:
    - GO:0060077
    - GO:0097060
  eta_e:
    name: eta_e
    definition: Mean heterogeneous current on excitatory population
    value: -5.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.0001
      log_scale: false
    description: Mean heterogeneous current on excitatory population
    grounding:
    - GO:0098815
  eta_i:
    name: eta_i
    definition: Mean heterogeneous current on inhibitory population
    value: -5.0
    domain:
      enforce: none
      lo: -10.0
      hi: 10.0
      step: 0.0001
      log_scale: false
    description: Mean heterogeneous current on inhibitory population
    grounding:
    - GO:0060080
  tau_e:
    name: tau_e
    definition: Characteristic time of excitatory population
    value: 10.0
    domain:
      enforce: none
      lo: 0.0
      hi: 15.0
      step: 0.01
      log_scale: false
    description: Characteristic time of excitatory population
    grounding:
    - GO:0043179
    - GO:0060079
  tau_i:
    name: tau_i
    definition: Characteristic time of inhibitory population
    value: 10.0
    domain:
      enforce: none
      lo: 0.0
      hi: 15.0
      step: 0.01
      log_scale: false
    description: Characteristic time of inhibitory population
    grounding:
    - GO:0043180
    - GO:0060080
  tau_s:
    name: tau_s
    definition: Synaptic time constant
    value: 1.0
    domain:
      enforce: none
      lo: 0.0
      hi: 15.0
      step: 0.01
      log_scale: false
    description: Synaptic time constant
    grounding:
    - GO:0099536
description: ''
references:
- Dumont2019
coupling_inputs:
  c_glob:
    name: c_glob
    dimension: 1
    local: false
state_variables:
  V_e:
    name: V_e
    domain:
      enforce: none
      lo: -2.0
      hi: 1.5
      log_scale: false
    equation:
      lhs: Derivative(V_e, t)
      rhs: (I_e + V_e**2 + eta_e - pi**2*r_e**2*tau_e**2 + s_ee*tau_e - s_ei*tau_e)/tau_e
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  V_i:
    name: V_i
    domain:
      enforce: none
      lo: -2.0
      hi: 1.5
      log_scale: false
    equation:
      lhs: Derivative(V_i, t)
      rhs: (I_i + V_i**2 + eta_i - pi**2*r_i**2*tau_i**2 + s_ie*tau_i - s_ii*tau_i)/tau_i
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  r_e:
    name: r_e
    domain:
      enforce: clamp
      lo: 0.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(r_e, t)
      rhs: (Delta_e/(pi*tau_e) + 2*V_e*r_e)/tau_e
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: 0.0
        hi: 2.0
        log_scale: false
      axis: space
  r_i:
    name: r_i
    domain:
      enforce: clamp
      lo: 0.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(r_i, t)
      rhs: (Delta_i/(pi*tau_i) + 2*V_i*r_i)/tau_i
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: 0.0
        hi: 2.0
        log_scale: false
      axis: space
  s_ee:
    name: s_ee
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(s_ee, t)
      rhs: (J_ee*r_e + c_glob - s_ee)/tau_s
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  s_ei:
    name: s_ei
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(s_ei, t)
      rhs: (J_ei*r_i - s_ei)/tau_s
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  s_ie:
    name: s_ie
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(s_ie, t)
      rhs: (Gamma*c_glob + J_ie*r_e - s_ie)/tau_s
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
  s_ii:
    name: s_ii
    domain:
      enforce: none
      lo: -1.0
      hi: 1.0
      log_scale: false
    equation:
      lhs: Derivative(s_ii, t)
      rhs: (J_ii*r_i - s_ii)/tau_s
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
number_of_modes: 1
model_type: mean_field
system_type: continuous
autonomous: true
cse: false
compile: false
