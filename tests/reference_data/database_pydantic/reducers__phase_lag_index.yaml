name: phase_lag_index
description: The phase lag index of every two nodes, the modulus of the mean of sign(sin(v_j
  - v_k)) over the run for a node-wise phase v in radians (Stam et al. 2007), folded
  one sample at a time so that no trajectory is held. The sign compares sin(v_j) cos(v_k)
  with cos(v_j) sin(v_k) instead of subtracting them, so a fused multiply-add cannot
  leave a rounding residual where the two are equal, and a zero lag and the diagonal
  count 0. Streams the curated function PhaseLagIndex.
replaces:
- tvbo.analysis.statistics.phase_lag_index
backends:
- tvboptim
emit_kind: run
state:
- count
- acc
add:
- target: c
  expression: cos(v)
- target: s
  expression: sin(v)
- target: count
  expression: count + 1
- target: acc
  expression: acc + Piecewise((1, outer(s, c) > outer(c, s)), (-1, outer(s, c) < outer(c,
    s)), (0, True))
emit: abs(acc) / count
