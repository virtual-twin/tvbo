name: GroupedCorrelation
label: Correlation over group means
description: The units of one dimension are cut into groups by a score, each group
  is reduced to the mean of its members' x and y, and x is correlated with y over
  the group means; the same correlation over single units is returned beside it. Groups
  are bins of equal width over the grouping variable's range (a bin no unit falls
  in stays empty) or runs of equal size along its order, and the grouping variable
  is x unless another is named. A unit enters where x, y and the grouping variable
  are all finite, labelled inputs are paired on the labels of the dimension, each
  of which occurs once, and every other dimension an input carries is kept, with one
  result per element of it. Per group on `group` it returns x_mean, y_mean, y_sd,
  y_se and size; over the group means the least-squares slope and intercept, Pearson
  r and two-sided p, and the line at the smallest and largest x_mean as fit_x and
  fit_y on `end`; over units r_unit and p_unit; and the counts n_nonempty_groups,
  n_units and n_units_total. A correlation is NaN with fewer than three points or
  a constant side. With more groups than units, runs of equal size give each unit
  a group of its own and leave the last groups empty.
arguments:
  x:
    name: x
    description: One value per unit, along `dim`; it may carry further dimensions.
  y:
    name: y
    description: One value per unit, along `dim`; it may carry further dimensions,
      each element of which is grouped and correlated on its own.
  n_groups:
    name: n_groups
    description: 'Number of groups, an integer of at least 1. It may exceed the number
      of units: groups without members are then empty, the last ones under `equal_count`.'
  dim:
    name: dim
    description: Name of the dimension the units run along.
  by:
    name: by
    description: The variable the groups are formed over when that is not x, along
      `dim`; where it carries a further dimension, each element is grouped by its
      own slice.
  grouping:
    name: grouping
    description: '`equal_width` for bins of equal width from the smallest to the largest
      value of the grouping variable, or `equal_count` for consecutive runs of its
      order whose sizes differ by at most one.'
    value: equal_width
callable:
  name: grouped_correlation
  module: tvbo.analysis.statistics
