id: 103
part: main
description: Continues the equilibria of the Jansen & Rit (1995) cortical column in
  its external input p (pulses per second), from the stable equilibrium it settles
  to at p = 50 across p in [-50, 400] in both directions, continues the periodic orbits
  born at every Hopf point it detects, and continues its first fold and its first
  Hopf point in the plane of p and the connectivity constant C.
label: Jansen-Rit — bifurcation in external input p
dynamics:
  name: JansenRit1995
  iri: tvbo:JansenRit1995
  number_of_modes: 1
  system_type: continuous
  autonomous: true
  cse: false
  compile: false
continuations:
  eq_in_p:
    name: eq_in_p
    label: Equilibrium branch in p
    dynamics: JansenRit1995
    free_parameters:
    - name: p
      value: 50.0
      domain:
        enforce: none
        lo: -50
        hi: 400
        log_scale: false
    ds: 0.5
    ds_min: 0.0001
    ds_max: 1.0
    max_steps: 2000
    newton_tol: 1.0e-09
    nev: 6
    detect_bifurcation: 2
    algorithm: PALC
    initial_state:
      method: time_integration
      duration: 10.0
      abs_tol: 1.0e-10
      rel_tol: 1.0e-10
    branches:
      po_alpha_rhythm:
        name: po_alpha_rhythm
        description: Periodic orbits continued from every Hopf point
        source_point: hopf:all
        continuation:
          name: po_alpha_continuation
          max_steps: 200
          newton_tol: 1.0e-07
          algorithm: PALC
        discretization:
          parameters:
            mesh_intervals:
              name: mesh_intervals
              value: 50
            degree:
              name: degree
              value: 4
          method: collocation
          mesh_intervals: 50
          degree: 4
          n_sections: 3
      fold_p_C:
        name: fold_p_C
        description: The first fold of eq_in_p continued in p and C, tracing the saddle-node
          boundary in the (p, C) plane
        source_point: fold:1
        continuation:
          name: fold_p_C
          free_parameters:
          - name: C
            domain:
              enforce: none
              lo: 10
              hi: 500
              log_scale: false
          ds: 0.5
          ds_max: 5.0
          max_steps: 500
          algorithm: PALC
        bothside: true
      hopf_p_C:
        name: hopf_p_C
        description: The first Hopf point of eq_in_p continued in p and C
        source_point: hopf:1
        continuation:
          name: hopf_p_C
          free_parameters:
          - name: C
            domain:
              enforce: none
              lo: 10
              hi: 500
              log_scale: false
          ds: 0.5
          ds_max: 5.0
          max_steps: 500
          algorithm: PALC
        bothside: true
    bothside: true
    options:
    - name: tangent
      value: Bordered
