name: ConcordanceCorrelation
label: Concordance correlation
description: Lin's concordance correlation coefficient of two variables over the units
  of one dimension, 2 cov(x, y) / (var(x) + var(y) + (mean(x) - mean(y))**2) with
  population moments, numpy's default (Lin 1989). It is the Pearson correlation scaled
  down by how far the two differ in mean and spread, so it measures agreement and
  not only covariation, as of a simulated map with an empirical one; it is 1 only
  where y equals x unit for unit and -1 where y is x reflected about their common
  mean. Labelled inputs are paired on the labels of the dimension, which occur once
  each and which both carry, and every other dimension an input carries is kept, with
  one coefficient per element of it. A NaN unit makes the coefficient NaN, as it makes
  numpy's moments NaN. It returns one array, which an analysis stores under its own
  name.
arguments:
  x:
    name: x
    description: One value per unit, along `dim`; it may carry further dimensions.
  y:
    name: y
    description: The values x is compared with, one per unit along `dim`; it may carry
      further dimensions.
  dim:
    name: dim
    description: Name of the dimension the units run along.
callable:
  name: concordance_correlation
  module: tvbo.analysis.statistics
