name: ErdosRenyi
description: Erdos-Renyi random graph G(n, p). Each of the n*(n-1)/2 possible undirected
  edges is independently included with probability p.
iri: tvbo:ErdosRenyi
directed: false
parameters:
  n:
    name: n
    description: Number of nodes
    datatype: integer
  p:
    name: p
    description: Edge probability in [0, 1]
    datatype: float
  seed:
    name: seed
    datatype: integer
    required: false
  density_from:
    name: density_from
    description: Optional. When set, the value of p is computed at load time as the
      density of the referenced source matrix (a Network IRI), so that the generated
      null model matches the source's connection density.
    datatype: uriorcurie
    required: false
bindings:
  julia:
    name: julia
    library: Graphs
    callable: erdos_renyi
    args:
    - n
    - p
  networkx:
    name: networkx
    library: networkx
    callable: erdos_renyi_graph
    args:
    - n
    - p
