name: Izhikevich2007Cell
parameters:
  C:
    name: C
    value: 100.0
    description: Capacitance (pF)
  k:
    name: k
    value: 0.7
    description: nS/mV
  vr:
    name: vr
    value: -60.0
    description: Resting potential (mV)
  vt:
    name: vt
    value: -40.0
    description: Threshold potential (mV)
  vpeak:
    name: vpeak
    value: 35.0
    description: Peak voltage (mV)
  a:
    name: a
    value: 0.03
    description: Recovery rate (1/ms)
  b:
    name: b
    value: -2.0
    description: Recovery sensitivity (nS)
  c:
    name: c
    value: -50.0
    description: Reset voltage (mV)
  d:
    name: d
    value: 100.0
    description: Recovery increment (pA)
source: 'NeuroML2 example: Ex16_Inputs'
derived_variables:
  I_ext:
    name: I_ext
    description: 'pulseGen0: delay=50ms, duration=200ms, amplitude=1nA=1000pA (times
      in SI seconds)'
    equation:
      rhs: Piecewise((1000.0, (t >= 0.05) & (t < 0.25)), (0.0, True))
      latex: false
    record: false
state_variables:
  v:
    name: v
    equation:
      rhs: (k*(v - vr)*(v - vt) + I_ext - u) / C
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: -60.0
  u:
    name: u
    equation:
      rhs: a*(b*(v - vr) - u)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.0
number_of_modes: 1
model_type: spiking
system_type: continuous
autonomous: false
events:
  spike:
    name: spike
    event_type: stimulus
    condition:
      rhs: v > vpeak
      latex: false
    affect:
      rhs: v = c; u = u + d
      latex: false
    sampling_rate: 1.0
    interpolation: linear
cse: false
compile: false
