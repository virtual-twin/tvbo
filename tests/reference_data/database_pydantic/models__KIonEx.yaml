description: "It describes the mean-field activity of a population of Hodgkin-Huxley-type\
  \ neurons (Depannemaker et al 2022) linking the slow fluctuations of intra- and\
  \ extra-cellular potassium ion concentrations to the mean membrane potential, and\
  \ the synaptic input to the population firing rate. \nThe model is derived as the\
  \ mathematical limit of an infinite number of all-to-all coupled neurons, resulting\
  \ in 5 state variables:\n    :math:`x` represents a phenomenological variable connected\
  \ to the firing rate, \n    :math:`V` represent the average membrane potential,\n\
  \    :math:`n` represents the gating variable for potassium K, \n    :math:`\\Delta\
  \ K_{int}` represent the intracellular potassium concentration,\n    :math:`K_g`\
  \ represents the extracellular potassium buffering by the external bath\n    \"\"\
  \""
references:
- Rabuffo2024
- Depannemaecker2023
derived_variables:
  DNa_i:
    name: DNa_i
    equation:
      lhs: DNa_i
      rhs: -DKi
      latex: false
    record: false
  I_Cl:
    name: I_Cl
    equation:
      lhs: I_Cl
      rhs: g_Cl*(V + 26.64*log(Cl_o0/Cl_i0))
      latex: false
    record: false
  K_i:
    name: K_i
    equation:
      lhs: K_i
      rhs: DKi + K_i0
      latex: false
    record: false
  beta:
    name: beta
    equation:
      lhs: beta
      rhs: w_i/w_o
      latex: false
    record: false
  h:
    name: h
    equation:
      lhs: h
      rhs: 1.1 - 1.0/(1.0 + 24.5325301971094*exp(-8.0*n))
      latex: false
    record: false
  minf:
    name: minf
    equation:
      lhs: minf
      rhs: 1.0/(exp((Cmna - V)/DCmna) + 1.0)
      latex: false
    record: false
  ninf:
    name: ninf
    equation:
      lhs: ninf
      rhs: 1.0/(exp((Cnk - V)/DCnk) + 1.0)
      latex: false
    record: false
  r:
    name: r
    equation:
      lhs: r
      rhs: R_minus*x/pi
      latex: false
    record: false
  DK_o:
    name: DK_o
    equation:
      lhs: DK_o
      rhs: -DKi*beta
      latex: false
    record: false
  DNa_o:
    name: DNa_o
    equation:
      lhs: DNa_o
      rhs: -DNa_i*beta
      latex: false
    record: false
  Na_i:
    name: Na_i
    equation:
      lhs: Na_i
      rhs: DNa_i + Na_i0
      latex: false
    record: false
  xcond:
    name: xcond
    symbol: xcond
    equation:
      lhs: xcond
      rhs: Piecewise((Delta - J*r*x + 2*R_minus*x*(V - c_minus), V <= Vstar), (Delta
        - J*r*x + 2*R_plus*x*(V - c_plus), True))
      conditionals:
      - condition: V <= Vstar
        expression: Delta - J*r*x + 2*R_minus*x*(V - c_minus)
      - condition: 'True'
        expression: Delta - J*r*x + 2*R_plus*x*(V - c_plus)
      latex: false
    record: false
  K_o:
    name: K_o
    equation:
      lhs: K_o
      rhs: DK_o + K_o0 + Kg
      latex: false
    record: false
  Na_o:
    name: Na_o
    equation:
      lhs: Na_o
      rhs: DNa_o + Na_o0
      latex: false
    record: false
  I_K:
    name: I_K
    equation:
      lhs: I_K
      rhs: (V - 26.64*log(K_o/K_i))*(g_K*n + g_Kl)
      latex: false
    record: false
  I_Na:
    name: I_Na
    equation:
      lhs: I_Na
      rhs: (V - 26.64*log(Na_o/Na_i))*(g_Na*h*minf + g_Nal)
      latex: false
    record: false
  I_pump:
    name: I_pump
    equation:
      lhs: I_pump
      rhs: 1.0*rho/((exp((Ckp - K_o)/DCkp) + 1.0)*(exp((Cnap - Na_i)/DCnap) + 1.0))
      latex: false
    record: false
  V_temp:
    name: V_temp
    equation:
      lhs: V_temp
      rhs: -1.0*(I_Cl + I_K + I_Na + I_pump)/Cm
      latex: false
    record: false
  Vcond:
    name: Vcond
    symbol: Vcond
    equation:
      lhs: Vcond
      rhs: Piecewise((R_minus*c_glob*(-V + E)/pi - R_minus*x**2 + V_temp + eta, V
        <= Vstar), (R_minus*c_glob*(-V + E)/pi - R_plus*x**2 + V_temp + eta, True))
      conditionals:
      - condition: V <= Vstar
        expression: R_minus*c_glob*(-V + E)/pi - R_minus*x**2 + V_temp + eta
      - condition: 'True'
        expression: R_minus*c_glob*(-V + E)/pi - R_plus*x**2 + V_temp + eta
      latex: false
    record: false
coupling_inputs:
  c_glob:
    name: c_glob
    dimension: 1
    local: false
state_variables:
  DKi:
    name: DKi
    domain:
      enforce: clamp
      lo: -100.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(DKi, t)
      rhs: -gamma*(I_K - 2.0*I_pump)/w_i
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: -10.0
        hi: 0.0
        log_scale: false
      axis: space
  Kg:
    name: Kg
    domain:
      enforce: clamp
      lo: -100.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(Kg, t)
      rhs: epsilon*(K_bath - K_o)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: -20.0
        hi: -5.0
        log_scale: false
      axis: space
  V:
    name: V
    domain:
      enforce: clamp
      lo: -500.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(V, t)
      rhs: Vcond
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: -90.0
        hi: 10.0
        log_scale: false
      axis: space
  n:
    name: n
    domain:
      enforce: clamp
      lo: 0.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(n, t)
      rhs: (-n + ninf)/tau_n
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: 0.0
        hi: 1.0
        log_scale: false
      axis: space
  x:
    name: x
    domain:
      enforce: clamp
      lo: 0.0
      hi: .inf
      log_scale: false
    equation:
      lhs: Derivative(x, t)
      rhs: xcond
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: true
    equation_type: differential
    equation_order: 1
    initial_value: 0.1
    distribution:
      name: Uniform
      domain:
        enforce: none
        lo: 0.0
        hi: 1.0
        log_scale: false
      axis: space
number_of_modes: 1
model_type: mean_field
system_type: continuous
autonomous: true
cse: false
compile: false
