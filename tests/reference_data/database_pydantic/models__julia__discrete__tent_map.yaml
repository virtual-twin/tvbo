name: TentMap
parameters:
  mu:
    name: mu
    value: 2.0
    description: Slope parameter μ ∈ [0,2].
description: Piecewise-linear tent map on [0,1]. At μ=2 it is conjugate to the logistic
  map with r=4.
source: https://github.com/JuliaDynamics/PredefinedDynamicalSystems.jl/blob/main/src/discrete_famous_systems.jl
references:
- Ott2002
state_variables:
  x:
    name: x
    equation:
      lhs: x_next
      conditionals:
      - condition: x < 0.5
        expression: mu*x
      - condition: x >= 0.5
        expression: mu*(1 - x)
      latex: false
    record: true
    variable_of_interest: true
    coupling_variable: false
    equation_type: differential
    equation_order: 1
    initial_value: 0.25
number_of_modes: 1
model_type: generic
system_type: discrete
autonomous: true
cse: false
compile: false
