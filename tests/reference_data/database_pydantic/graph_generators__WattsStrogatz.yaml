name: WattsStrogatz
description: Watts-Strogatz small-world graph. Starts as a regular ring lattice where
  each node connects to k nearest neighbours, then rewires each edge with probability
  p to a uniformly random target.
iri: tvbo:WattsStrogatz
directed: false
parameters:
  n:
    name: n
    description: Number of nodes
    datatype: integer
  k:
    name: k
    description: Initial ring degree (even)
    datatype: integer
  p:
    name: p
    description: Rewiring probability in [0, 1]
    datatype: float
  seed:
    name: seed
    datatype: integer
    required: false
bindings:
  julia:
    name: julia
    library: Graphs
    callable: watts_strogatz
    args:
    - n
    - k
    - p
  networkx:
    name: networkx
    library: networkx
    callable: watts_strogatz_graph
    args:
    - n
    - k
    - p
